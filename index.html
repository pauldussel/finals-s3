<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finals S3">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finals S3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an exam timetable home (one slip per exam, in date order), then one subject at a time with three tabs: sheet, cases, quiz. Each subject carries its own hue. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eceef2; --ink:#15171c; --muted:#5a6170; --line:#dfe2e8;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#c23b31; --bad-soft:#fbe7e5; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --h:230; --aS:62%; --aL:42%; --sS:70%; --sL:95%; --iS:55%; --iL:30%;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101217; --surface:#191c23; --sunk:#14171d; --ink:#e7e9ee; --muted:#9aa1ae; --line:#2a2f39;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#f07a6f; --bad-soft:#3a1d1b; --warn:#e2b54f; --warn-soft:#3a2f14;
  --aS:75%; --aL:70%; --sS:35%; --sL:19%; --iS:80%; --iL:82%; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101217; --surface:#191c23; --sunk:#14171d; --ink:#e7e9ee; --muted:#9aa1ae; --line:#2a2f39;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#f07a6f; --bad-soft:#3a1d1b; --warn:#e2b54f; --warn-soft:#3a2f14;
  --aS:75%; --aL:70%; --sS:35%; --sL:19%; --iS:80%; --iL:82%; color-scheme:dark }
*{box-sizing:border-box}
:root,.slip,.next{--acc:hsl(var(--h) var(--aS) var(--aL));--acc-soft:hsl(var(--h) var(--sS) var(--sL));--acc-ink:hsl(var(--h) var(--iS) var(--iL))}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.6 var(--body);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{white-space:nowrap;font:800 19px/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 11px var(--mono)}
.bar .sp{flex:1}
.back{white-space:nowrap;display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chipbtn[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink)}

main{padding-block:20px 60px}
[hidden]{display:none!important}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px}
.next{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.next .k{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.next h1{font:800 clamp(26px,4.5vw,38px)/1.05 var(--display);margin:4px 0 2px;letter-spacing:-.02em;text-wrap:balance}
.next .cd{font:700 15px var(--mono)}
.seat{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;align-content:start}
.seat .k{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seat .row{display:flex;gap:18px;flex-wrap:wrap}
.seat .v{font:700 22px var(--mono)} .seat .l{font-size:12px;color:var(--muted)}
.seat p{margin:0;font-size:13px;color:var(--muted)}
.mixbtn{justify-self:start;border:0;background:var(--acc);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700}
:root[data-theme="dark"] .mixbtn{color:#101217}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .mixbtn{color:#101217} }
.sec-h{font:700 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.slips{display:grid;gap:10px}
.slip{--h:230;display:grid;grid-template-columns:86px 1fr auto;gap:16px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.slip::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--acc)}
.slip:hover{border-color:var(--acc)}
.slip .date{display:grid;justify-items:center;line-height:1}
.slip .date .d{font:800 34px var(--display);color:var(--acc)}
.slip .date .m{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.slip .nm{font:700 19px/1.2 var(--display);letter-spacing:-.01em}
.slip .meta{font-size:13px;color:var(--muted);margin-top:2px}
.slip .meters{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.meter{display:flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted)}
.meter i{display:block;width:70px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i b{display:block;height:100%;background:var(--acc)}
.cd-pill{font:700 13px var(--mono);padding:4px 10px;border-radius:999px;background:var(--acc-soft);color:var(--acc-ink);white-space:nowrap}
.cd-pill.past{background:var(--sunk);color:var(--muted)}

/* subject */
.subhead{background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.subhead .k{font:600 12px var(--mono);color:var(--acc-ink);letter-spacing:.06em}
.subhead h1{font:800 clamp(26px,4.5vw,36px)/1.08 var(--display);margin:4px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.subhead .lead{margin:0 0 12px;color:var(--ink);max-width:72ch;font-size:14px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.fact b{font-weight:700}
.tabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tab .n{font:600 12px var(--mono);color:var(--muted);margin-left:4px}

/* sheet */
.sheet{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);display:grid;gap:2px;max-height:calc(100vh - 90px);overflow:auto}
.toc button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--muted)}
.toc button:hover{background:var(--surface)}
.toc button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.toc .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px}
.toc .ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tocsel{display:none;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.card-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.card-sec h2{font:700 24px/1.2 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.card-sec .sub{color:var(--muted);font-size:13px;margin:4px 0 14px}
.frbox{margin-top:18px;border:1px dashed var(--acc);border-radius:10px;background:var(--acc-soft)}
.frbox>button{width:100%;text-align:left;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--acc-ink);display:flex;justify-content:space-between;gap:10px}
.frbox .frin{background:var(--surface);margin:0 8px 8px;border-radius:8px;padding:6px 14px 12px}
.secnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#101217}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.pri{color:#101217} }
.btn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}

/* sheet content (from the revision pages) */
.rich h3{font:700 18px/1.3 var(--display);margin:20px 0 8px}
.rich h4{font-size:15px;margin:14px 0 6px}
.rich p,.rich ul,.rich ol{margin:0 0 10px}
.rich ul,.rich ol{padding-left:22px}
.rich li{margin:3px 0}
.rich code{font:500 13px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:5px;word-break:break-word}
.rich .f{font:500 13px/1.6 var(--mono);white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px 12px;margin:0 0 12px;overflow-x:auto}
.rich .tw{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:8px}
.rich table{border-collapse:collapse;width:100%;font-size:14px}
.rich th,.rich td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rich th{background:var(--sunk);font-weight:600;font-size:13px}
.rich tr:last-child td{border-bottom:0}
.rich .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rich .box{border-radius:10px;padding:12px 14px;margin:0 0 12px;border:1px solid var(--line);background:var(--sunk)}
.rich .box .lbl{display:block;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--muted)}
.rich .box.key{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 35%,transparent)} .rich .box.key .lbl{color:var(--acc-ink)}
.rich .box.ex{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .rich .box.ex .lbl{color:var(--ok)}
.rich .box.trap{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)} .rich .box.trap .lbl{color:var(--bad)}
.rich .box.exam{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)} .rich .box.exam .lbl{color:var(--warn)}
.rich .grid2,.rich .grid3{display:grid;gap:10px;margin:0 0 12px}
.rich .grid2{grid-template-columns:repeat(2,minmax(0,1fr))} .rich .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rich .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.rich .card .t{display:block;font-weight:700;margin-bottom:2px}
.rich .pill{font:600 12px var(--mono);padding:1px 8px;border-radius:999px;white-space:nowrap}
.rich .pill.hi{background:var(--bad-soft);color:var(--bad)} .rich .pill.md{background:var(--warn-soft);color:var(--warn)} .rich .pill.lo{background:var(--ok-soft);color:var(--ok)}
.rich details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 10px;background:var(--surface)}
.rich summary{font-weight:600;cursor:pointer}
.rich .q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.rich .qt{font-weight:600}
.rich .q ol{list-style:lower-alpha;margin:6px 0}
.rich .frline{margin-top:8px;padding:6px 10px;border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:6px}

/* cases */
.cases{display:grid;gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.case>button{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:none;padding:14px 16px}
.case .kind{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;margin-top:2px}
.kind.ex{background:var(--ok-soft);color:var(--ok)} .kind.q{background:var(--warn-soft);color:var(--warn)} .kind.p{background:var(--acc-soft);color:var(--acc-ink)}
.case .ti{font-weight:650;flex:1;min-width:0}
.case .from{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.case .chev{color:var(--muted);transition:transform .15s}
.case[data-open="1"] .chev{transform:rotate(90deg)}
.case .cb{padding:0 16px 16px}
.answer{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}

/* quiz */
.qstart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;max-width:720px}
.qstart h2{font:700 22px var(--display);margin:0}
.qstats{display:flex;gap:18px;flex-wrap:wrap}
.qstats div{display:grid}
.qstats b{font:700 24px var(--mono)} .qstats span{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:760px}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center;font:600 13px var(--mono);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog b{display:block;height:100%;background:var(--acc);transition:width .2s}
.qtag{font:600 11px var(--mono);padding:2px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc-ink)}
.qtext{font:600 18px/1.45 var(--body);margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:15px}
.opt .L{font:700 13px var(--mono);color:var(--muted);min-width:16px;padding-top:1px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px}
.fb.good{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb.good .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.fb .fr{margin-top:6px;font-size:14px;color:var(--muted)}
.fb .fr b{color:var(--ink)}
.qact{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.end{text-align:center;display:grid;gap:10px;justify-items:center}
.end .big{font:800 56px var(--display);color:var(--acc)}
.empty{color:var(--muted);padding:20px;border:1px dashed var(--line);border-radius:var(--r)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .sheet{grid-template-columns:1fr}
  .toc{display:none}
  .tocsel{display:block}
}
@media (max-width:560px){
  .slip{grid-template-columns:56px 1fr;gap:12px}
  .slip .date .d{font-size:28px}
  .slip .cd-pill{grid-column:2;justify-self:start}
  .rich .grid2,.rich .grid3{grid-template-columns:1fr}
  .card-sec{padding:16px}
  .qcard,.qstart{padding:16px}
  .qtext{font-size:17px}
  .brand .full,.chipbtn .full,.back .full{display:none}
  .bar .wrap{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* sync */
.sync{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.sync .qstart{max-width:none}
.codebox{width:100%;min-height:92px;resize:vertical;font:500 13px/1.5 var(--mono);word-break:break-all;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
.steps li{margin:3px 0}
.msg{border-radius:10px;padding:10px 12px;font-size:14px}
.msg.good{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)}
@media (max-width:760px){ .sync{grid-template-columns:1fr} }
#syncbtn[data-s]::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
#syncbtn[data-s="off"]::after{display:none}
#syncbtn[data-s="ok"]::after{background:var(--ok)}
#syncbtn[data-s="busy"]::after{background:var(--warn)}
#syncbtn[data-s="err"]::after{background:var(--bad)}
.autosync{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;margin-bottom:14px}
.autosync h2{font:700 22px var(--display);margin:0}
.syncstat{display:flex;align-items:center;gap:8px;font-weight:600}
.syncstat i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.syncstat.ok i{background:var(--ok)} .syncstat.busy i{background:var(--warn)} .syncstat.err i{background:var(--bad)}
.keyrow{display:flex;gap:8px;flex-wrap:wrap}
.keyrow input{flex:1;min-width:0;font:500 14px var(--mono);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.manual{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 16px}
.manual>summary{font-weight:600;cursor:pointer}
.manual[open]>summary{margin-bottom:12px}
</style>

</head>
<body>
<header class="bar">
  <div class="wrap">
    <button class="brand" id="home-btn" type="button" aria-label="Accueil"><span class="dot">S3</span><span>Finals S3<span class="full"> · révisions</span></span></button>
    <button class="back" id="back" type="button" aria-label="Retour aux matières">←<span class="full"> Matières</span></button>
    <span class="sp"></span>
    <button class="chipbtn" id="syncbtn" type="button" title="Synchroniser la progression entre tes appareils">⇄<span class="full"> Synchro</span></button>
    <button class="chipbtn" id="frmode" type="button" aria-pressed="false" title="Toujours afficher l'explication en français">FR</button>
    <button class="chipbtn" id="theme" type="button" aria-label="Changer de thème">◐</button>
  </div>

<script>window.APPDATA = [{"id": "ai", "name": "AI in Business Contexts", "short": "AI in Business", "start": "2026-12-07T15:30:00+08:00", "when": "Lun. 7 déc. · 15:30–17:00", "fmt": "QCM + questions ouvertes · 1h30", "weight": "50 %", "rules": "Sans documents, sans brouillon, sans calculatrice", "hue": 262, "lead": "Updated 25 November: weeks 1 to 4. Key concepts (vocabulary, machine learning, LLMs, agents, the AI value chain, industry cases) and the plan of the 5 sessions. The course is non-technical: the exam tests your judgment as a manager.", "prof": "M1 · Di YAO", "sections": [{"id": "exam", "short": "The final exam", "title": "The final exam", "sub": "Course syllabus (Suzhou version) + week 1 slides + your calendar", "en": "<div class=\"box key\"><span class=\"lbl\">Your calendar (exam notice)<\/span><b>Monday 7 December, 15:30–17:00<\/b> (Suzhou time). MCQ + open questions on TestWe, 1h30. No documents, no scratch paper, no calculator. Person in charge: Azadeh Savoli.<br>Room 271, row 5, seat 6. Arrive 15 minutes early with your student card and a charged battery.<\/div>\n<ul>\n<li><b>Closed-book exam<\/b> based on the lectures, cases and class discussions. <b>Multiple-choice questions + short essay or open questions.<\/b> 50% of the grade.<\/li>\n<li>The rest: participation (20%), individual AI case analysis (15%), final group project (15%).<\/li>\n<li>Session 5 ends with a final exam review.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Session<\/th><th>Topic<\/th><th>Material<\/th><\/tr>\n<tr><td>1<\/td><td>AI and international business strategy: core concepts, machine learning, generative AI, limits<\/td><td>✓ \"Week One Introduction to AI\"<\/td><\/tr>\n<tr><td>2<\/td><td>Strategic AI use cases: agents, 12 industries<\/td><td>✓ \"Week II Agents &amp; 12 Industries\"<\/td><\/tr>\n<tr><td>3<\/td><td>AI teams, adoption in companies, careers<\/td><td>✓ \"Week Three: AI Teams\"<\/td><\/tr>\n<tr><td>4<\/td><td>Legal and policy issues: copyright, privacy, misinformation, compliance<\/td><td>✓ \"Week Four: Legal &amp; Policy\"<\/td><\/tr>\n<tr><td>5<\/td><td>Strategy, the future of AI, project presentations, exam review<\/td><td>not published yet<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box trap\"><span class=\"lbl\">Check with the professor<\/span>The group project brief (K2) says the project is worth <b>50%<\/b> of the grade. The syllabus and the week 1 slides give <b>50% to the exam<\/b> and 15% to the project. The two documents disagree: ask the professor.<br>As of 25 November, weeks 1 to 4 are on K2; session 5 is not published yet.<\/div>", "fr": "<div class=\"box key\"><span class=\"lbl\">Ton calendrier (convocation)<\/span><b>Lun. 7 décembre, 15 h 30–17 h<\/b> (heure de Suzhou). QCM + questions ouvertes sur TestWe, 1 h 30. Pas de documents, pas de brouillon, pas de calculatrice. Responsable : Azadeh Savoli.<br>Salle 271, rang 5, place 6. Arriver 15 min avant avec ta carte étudiante, batterie chargée.<\/div>\n<ul>\n<li><b>Examen sur table, sans documents<\/b>, basé sur les cours, les cas et les discussions. <b>QCM + questions courtes ou essai<\/b>. 50 % de la note. Date et salle : voir ton emploi du temps.<\/li>\n<li>Le reste : participation (20 %), analyse individuelle d'un cas d'IA (15 %), projet de groupe (15 %).<\/li>\n<li>La séance 5 se termine par une révision du final.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Séance<\/th><th>Thème<\/th><th>Supports<\/th><\/tr>\n<tr><td>1<\/td><td>IA et stratégie internationale : notions clés, machine learning, IA générative, limites<\/td><td>✓ « Week One Introduction to AI »<\/td><\/tr>\n<tr><td>2<\/td><td>Cas d'usage stratégiques : agents, 12 industries<\/td><td>✓ « Week II Agents & 12 Industries »<\/td><\/tr>\n<tr><td>3<\/td><td>Équipes IA, adoption en entreprise, carrières<\/td><td>✓ « Week Three : AI Teams »<\/td><\/tr>\n<tr><td>4<\/td><td>Questions juridiques et réglementaires : droit d'auteur, vie privée, désinformation, conformité<\/td><td>✓ « Week Four : Legal &amp; Policy »<\/td><\/tr>\n<tr><td>5<\/td><td>Stratégie, futur de l'IA, présentations des projets, révision du final<\/td><td>pas encore publié<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box trap\"><span class=\"lbl\">À vérifier avec le prof<\/span>Le brief du projet de groupe (K2) dit que le projet compte pour <b>50 %<\/b> de la note. Le syllabus et les slides de la semaine 1 donnent <b>50 % à l'examen<\/b> et 15 % au projet. Les deux documents ne disent pas la même chose : pose la question au prof.<br>Au 25 novembre, les supports des semaines 1 à 4 sont sur K2 ; la séance 5 n'est pas encore publiée.<\/div>"}, {"id": "c1", "short": "AI vocabulary", "title": "1. AI vocabulary", "sub": "Week 1", "en": "<div class=\"tw\"><table>\n<tr><th>Term<\/th><th>Course definition<\/th><\/tr>\n<tr><td><b>AI<\/b><\/td><td>The development and implementation of computer systems that can perform tasks that typically require human intelligence.<\/td><\/tr>\n<tr><td><b>Machine learning<\/b><\/td><td>The science of getting computers to act without being explicitly programmed: they learn from data. The most influential branch of AI today.<\/td><\/tr>\n<tr><td><b>LLM<\/b> (large language model)<\/td><td>A deep learning model trained on massive data sets to understand, summarize, generate and predict content.<\/td><\/tr>\n<tr><td><b>Generative AI<\/b> (GAI)<\/td><td>Algorithms that create new content: text, images, code, audio, video.<\/td><\/tr>\n<tr><td><b>AIGC<\/b><\/td><td>AI-Generated Content: content created automatically by AI.<\/td><\/tr>\n<tr><td><b>GPT<\/b><\/td><td>Generative Pre-trained Transformer.<\/td><\/tr>\n<tr><td><b>AGI<\/b><\/td><td>Artificial general intelligence: generalized human cognitive abilities in software, able to solve an unfamiliar task.<\/td><\/tr>\n<\/table><\/div>\n<p><b>Why business leaders need to know about AI<\/b>: set realistic expectations, communicate with engineers, identify real opportunities, manage risks (bias, unexpected outcomes).<\/p>\n<h3>The 3 drivers of the current AI wave<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Powerful computing<\/b>Expensive: budget and ROI matter; not every company has Google-level resources.<\/div>\n<div class=\"card\"><b class=\"t\">Advances in algorithms<\/b>Choose the right tool for the problem; keep up with new methods.<\/div>\n<div class=\"card\"><b class=\"t\">Massive amounts of data<\/b>The fuel: data strategy, competitive advantage, privacy and bias.<\/div>\n<\/div>\n<div class=\"box key\"><span class=\"lbl\">Where does a durable advantage come from?<\/span>The winning algorithm (the Transformer) has been <b>public since 2017<\/b> (Google, \"Attention Is All You Need\"). Advantage comes from <b>compute<\/b>, <b>proprietary data<\/b>, talent and execution, not from a secret formula. Proprietary data is the hardest to copy.<\/div>", "fr": "<div class=\"tw\"><table>\n<tr><th>Terme<\/th><th>Définition du cours<\/th><\/tr>\n<tr><td><b>IA<\/b><\/td><td>Systèmes informatiques capables de tâches qui demandent normalement l'intelligence humaine.<\/td><\/tr>\n<tr><td><b>Machine learning<\/b><\/td><td>Faire agir les ordinateurs sans les programmer explicitement : ils apprennent à partir des données. Branche la plus influente de l'IA aujourd'hui.<\/td><\/tr>\n<tr><td><b>LLM<\/b><\/td><td>Modèle de deep learning entraîné sur d'énormes jeux de données pour comprendre, résumer, générer et prédire du contenu.<\/td><\/tr>\n<tr><td><b>IA générative<\/b> (GAI)<\/td><td>Algorithmes qui créent du contenu nouveau : texte, images, code, audio, vidéo.<\/td><\/tr>\n<tr><td><b>AIGC<\/b><\/td><td>Contenu généré automatiquement par l'IA.<\/td><\/tr>\n<tr><td><b>GPT<\/b><\/td><td>Generative Pre-trained Transformer.<\/td><\/tr>\n<tr><td><b>AGI<\/b><\/td><td>IA générale : capacités cognitives humaines généralisées, capable de résoudre une tâche nouvelle.<\/td><\/tr>\n<\/table><\/div>\n<p><b>Pourquoi un manager doit comprendre l'IA<\/b> : fixer des attentes réalistes, parler avec les ingénieurs, repérer les vraies opportunités, gérer les risques (biais, effets inattendus).<\/p>\n<h3>Les 3 moteurs de la vague actuelle<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Puissance de calcul<\/b>Coûteuse : budget et ROI ; tout le monde n'a pas les moyens de Google.<\/div>\n<div class=\"card\"><b class=\"t\">Algorithmes<\/b>Choisir le bon outil pour le problème ; suivre les nouveautés.<\/div>\n<div class=\"card\"><b class=\"t\">Données<\/b>Le carburant : stratégie de données, avantage concurrentiel, vie privée et biais.<\/div>\n<\/div>\n<div class=\"box key\"><span class=\"lbl\">Où est l'avantage durable ?<\/span>L'algorithme gagnant (le Transformer) est <b>public depuis 2017<\/b> (Google publie « Attention Is All You Need »). L'avantage vient du <b>calcul<\/b>, des <b>données propriétaires<\/b>, des talents et de l'exécution, pas d'une formule secrète. Les données propriétaires sont le plus difficile à copier.<\/div>"}, {"id": "c2", "short": "Machine learning", "title": "2. How machines learn", "sub": "Week 1", "en": "<p>4 applications of machine learning: <b>classification<\/b> (spam or not), <b>prediction<\/b> (YouTube's Watch Next), <b>generation<\/b> (new content, available to consumers since late 2022), <b>understanding<\/b> (speech and language).<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Algorithm = the recipe<\/b>A public, documented procedure (decision tree, neural network).<\/div>\n<div class=\"card\"><b class=\"t\">Model = the dish<\/b>What you get after training on <b>your<\/b> data: billions of parameters (weights). This is the asset.<\/div>\n<div class=\"card\"><b class=\"t\">Training = the cooking<\/b>Expensive in compute and time, done once or occasionally.<\/div>\n<div class=\"card\"><b class=\"t\">Inference = the serving<\/b>Answering a new question: cheap per query, but paid millions of times a day.<\/div>\n<\/div>\n<p><b>The learning loop<\/b>: 1. Guess → 2. Measure the error (\"loss\") → 3. Adjust the parameters (gradient descent) → 4. Repeat. Learning = <b>minimizing error on past examples<\/b>, with no understanding and no intent.<\/p>\n<h3>The 3 types of learning<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Supervised<\/th><th>Unsupervised<\/th><th>Reinforcement<\/th><\/tr>\n<tr><td>What you give it<\/td><td>Labelled examples (input + correct answer)<\/td><td>Raw data, no labels<\/td><td>An environment + a reward signal<\/td><\/tr>\n<tr><td>What it learns<\/td><td>A mapping from input to answer<\/td><td>Hidden structure, groups, outliers<\/td><td>A strategy (policy) that maximizes reward<\/td><\/tr>\n<tr><td>Typical question<\/td><td>\"Will this customer churn?\"<\/td><td>\"What segments exist?\"<\/td><td>\"What price should I set now?\"<\/td><\/tr>\n<tr><td>Examples<\/td><td>Fraud detection, credit scoring, medical imaging, churn<\/td><td>Customer segmentation, anomaly detection, market basket<\/td><td>AlphaGo, dynamic pricing, warehouse robots<\/td><\/tr>\n<tr><td>Main risk<\/td><td>Learns the biases in the labels<\/td><td>Finds patterns that mean nothing<\/td><td>Optimizes the wrong reward<\/td><\/tr>\n<tr><td>Share of business AI<\/td><td>~70–80%<\/td><td>Mostly exploratory analytics<\/td><td>Niche but growing<\/td><\/tr>\n<\/table><\/div>\n<p>Bonus: <b>self-supervised learning<\/b> (how LLMs are trained): hide the next word of a real sentence and ask the model to guess it. Supervised learning at internet scale with no human labellers.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Course quiz<\/span>\nLVMH: which customers will buy a handbag in the next 90 days → <b>supervised<\/b> (past purchases are the labels).<br>\nShanghai bank: unusual groups of accounts it never looked for → <b>unsupervised<\/b>.<br>\nDecathlon: changes online prices every hour and learns from what sells → <b>reinforcement<\/b>.<br>\nHospital: pneumonia on 50,000 X-rays labelled by radiologists → <b>supervised<\/b>.<br>\nSpotify: group untagged songs into \"moods\" → <b>unsupervised<\/b>.<br>\nRobot arm learning to pick parcels → <b>reinforcement<\/b>.<\/div>\n<p><b>Deep learning<\/b>: neural networks with many layers (edges → shapes → faces). Milestones: <b>2012 AlexNet<\/b> (ImageNet, on two gaming GPUs); <b>2017 Transformer<\/b>; <b>scaling laws<\/b> (more data + more compute + bigger model = better results, so the AI race became a capital race measured in gigawatts).<\/p>\n<h3>What algorithms cannot do (yet)<\/h3>\n<ul>\n<li><b>Correlation, not causation<\/b> (ice-cream sales predict drownings: the cause is summer).<\/li>\n<li><b>Out-of-distribution<\/b>: a model trained on 2019 data was blind in March 2020.<\/li>\n<li><b>Garbage in, bias out<\/b>: biased hiring data → biased model (Amazon scrapped such a tool).<\/li>\n<li><b>No explanation by default<\/b> (banks, hospitals and the EU AI Act increasingly demand the reason).<\/li>\n<li>It optimizes the <b>metric you gave it<\/b>, not the goal you meant: clicks → clickbait; time-on-app → addiction.<\/li>\n<\/ul>\n<p>The human job moves upstream: choosing the question, the data and the metric. And often a simple rule or a spreadsheet solves 80% of the problem.<\/p>", "fr": "<p>4 usages du machine learning : <b>classification<\/b> (spam ou non), <b>prédiction<\/b> (« Watch Next » de YouTube), <b>génération<\/b> (nouveau contenu, arrivée grand public fin 2022), <b>compréhension<\/b> (langage, voix).<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Algorithme = la recette<\/b>Procédure publique (arbre de décision, réseau de neurones).<\/div>\n<div class=\"card\"><b class=\"t\">Modèle = le plat<\/b>Le résultat de l'entraînement sur <b>tes<\/b> données : des milliards de paramètres. C'est lui, l'actif.<\/div>\n<div class=\"card\"><b class=\"t\">Entraînement = la cuisson<\/b>Cher en calcul, fait une fois ou de temps en temps.<\/div>\n<div class=\"card\"><b class=\"t\">Inférence = le service<\/b>Répondre à une nouvelle question : peu cher par requête, mais des millions de fois par jour.<\/div>\n<\/div>\n<p><b>La boucle d'apprentissage<\/b> : 1. deviner → 2. mesurer l'erreur (« loss ») → 3. ajuster les paramètres (descente de gradient) → 4. répéter. Apprendre = <b>minimiser l'erreur sur des exemples passés<\/b>, sans compréhension ni intention.<\/p>\n<h3>Les 3 types d'apprentissage<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Supervisé<\/th><th>Non supervisé<\/th><th>Par renforcement<\/th><\/tr>\n<tr><td>Ce qu'on donne<\/td><td>Exemples étiquetés (entrée + bonne réponse)<\/td><td>Données brutes sans étiquette<\/td><td>Un environnement + une récompense<\/td><\/tr>\n<tr><td>Ce qu'il apprend<\/td><td>Relier une entrée à une réponse<\/td><td>Structures cachées, groupes, anomalies<\/td><td>Une stratégie qui maximise la récompense<\/td><\/tr>\n<tr><td>Question type<\/td><td>« Ce client va-t-il partir ? »<\/td><td>« Quels segments existent ? »<\/td><td>« Quel prix fixer maintenant ? »<\/td><\/tr>\n<tr><td>Exemples<\/td><td>Fraude, scoring de crédit, imagerie médicale, churn<\/td><td>Segmentation, détection d'anomalies, paniers d'achat<\/td><td>AlphaGo, prix dynamiques, robots d'entrepôt<\/td><\/tr>\n<tr><td>Risque principal<\/td><td>Apprend les biais des étiquettes<\/td><td>Trouve des groupes sans signification<\/td><td>Optimise la mauvaise récompense<\/td><\/tr>\n<tr><td>Part de l'IA en entreprise<\/td><td>~70–80 %<\/td><td>Analyses exploratoires<\/td><td>Niche en croissance<\/td><\/tr>\n<\/table><\/div>\n<p>Bonus : <b>apprentissage auto-supervisé<\/b> (les LLM) : on cache le mot suivant d'une vraie phrase et le modèle le devine. Du supervisé à l'échelle d'internet, sans étiqueteur humain.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Quiz du cours<\/span>\nLVMH : quels clients achèteront un sac dans 90 jours → <b>supervisé<\/b> (achats passés = étiquettes).<br>\nBanque de Shanghai : groupes de comptes inhabituels jamais cherchés → <b>non supervisé<\/b>.<br>\nDecathlon : prix en ligne changés chaque heure en apprenant des ventes → <b>renforcement<\/b>.<br>\nHôpital : pneumonie sur 50 000 radios étiquetées → <b>supervisé<\/b>.<br>\nSpotify : classer des chansons non taguées en « humeurs » → <b>non supervisé<\/b>.<br>\nBras robot qui apprend à saisir des colis → <b>renforcement<\/b>.<\/div>\n<p><b>Deep learning<\/b> : réseaux de neurones en couches (bords → formes → visages). Repères : <b>2012 AlexNet<\/b> (ImageNet, sur 2 GPU) ; <b>2017 Transformer<\/b> ; <b>lois d'échelle<\/b> (plus de données + calcul + taille = meilleurs résultats → course au capital mesurée en gigawatts).<\/p>\n<h3>Ce que les algorithmes ne savent pas faire<\/h3>\n<ul>\n<li><b>Corrélation ≠ causalité<\/b> (les ventes de glaces prédisent les noyades : c'est l'été).<\/li>\n<li><b>Hors distribution<\/b> : un modèle entraîné sur 2019 était aveugle en mars 2020.<\/li>\n<li><b>Biais<\/b> : données d'embauche biaisées → modèle biaisé (outil abandonné par Amazon).<\/li>\n<li><b>Pas d'explication<\/b> par défaut (exigée par les banques, les hôpitaux, l'AI Act européen).<\/li>\n<li>Il optimise la <b>métrique donnée<\/b>, pas l'objectif voulu : clics → clickbait ; temps passé → addiction.<\/li>\n<\/ul>\n<p>Le rôle humain remonte en amont : choisir la question, les données et la métrique. Et souvent, une règle simple ou un tableur résout 80 % du problème.<\/p>"}, {"id": "c3", "short": "LLMs and hallucinations", "title": "3. Large language models", "sub": "Week 1", "en": "<p>An LLM is a <b>next probable token predictor<\/b>. ChatGPT is a conversational application of the GPT model (a Transformer).<\/p>\n<ul>\n<li><b>Context window<\/b>: the model only \"knows\" the words currently in the window. Adding \"It was a cold January morning in Shanghai\" changes the predicted next word (\"snow\"). <b>Prompting = putting better words in the window.<\/b><\/li>\n<li><b>Hallucination<\/b>: a highly probable continuation that happens to be false (\"delayed because of a volcanic eruption in Iceland\"). Not a malfunction: the same mechanism. <b>Fluency is not evidence.<\/b><\/li>\n<li><b>ELIZA effect<\/b>: humans infer a mind behind fluent language. The model reproduces the shape of expertise without the expertise.<\/li>\n<\/ul>\n<div class=\"box key\"><span class=\"lbl\">Expert vs model<\/span>An expert (1) knows when they do not know, (2) can check against reality, (3) is accountable. The model has none of the three: \"the world's best-read intern, brilliant first draft, zero liability\". The question to ask of every AI deployment: <b>\"What checks this output before the world acts on it?\"<\/b><\/div>\n<p>AI in international business: smarter decisions, customer experience, streamlined operations, <b>new business models<\/b>. Course example: Decathlon, cross-border demand sensing for the top 500 SKUs (supervised: sales, weather, local holidays); 1% less overstock on ~€15B revenue far exceeds a €1M project; risk: Chinese data cannot leave China (<b>PIPL<\/b>).<\/p>", "fr": "<p>Un LLM est un <b>prédicteur du mot (token) suivant le plus probable<\/b>. ChatGPT est une application conversationnelle du modèle GPT (Transformer).<\/p>\n<ul>\n<li><b>Fenêtre de contexte<\/b> : le modèle ne « sait » que les mots présents dans la fenêtre. Ajouter « C'était un matin froid de janvier à Shanghai » change la suite prédite (« neige »). <b>Prompter = mettre de meilleurs mots dans la fenêtre.<\/b><\/li>\n<li><b>Hallucination<\/b> : une suite très probable mais fausse (« retard à cause d'une éruption volcanique en Islande »). Ce n'est pas une panne, c'est le même mécanisme. <b>La fluidité n'est pas une preuve.<\/b><\/li>\n<li><b>Effet ELIZA<\/b> : on prête un esprit à un langage fluide. Le modèle reproduit la forme de l'expertise sans l'expertise.<\/li>\n<\/ul>\n<div class=\"box key\"><span class=\"lbl\">Expert vs modèle<\/span>Un expert (1) sait quand il ne sait pas, (2) peut vérifier dans la réalité, (3) est responsable. Le modèle n'a aucun des trois : c'est « le stagiaire le plus cultivé du monde, brillant premier jet, zéro responsabilité ». Question à poser pour tout déploiement : <b>« Qu'est-ce qui vérifie cette sortie avant que le monde agisse ? »<\/b><\/div>\n<p>IA en business international : meilleures décisions, expérience client, opérations, <b>nouveaux modèles d'affaires<\/b>. Exemple du cours : Decathlon, prévision de la demande par pays pour 500 références (supervisé : ventes, météo, jours fériés), 1 % de surstock en moins sur ~15 Md€ de CA dépasse largement 1 M€ d'investissement ; risque : les données chinoises ne peuvent pas sortir de Chine (<b>PIPL<\/b>).<\/p>"}, {"id": "c4", "short": "Agents and the AI stack", "title": "4. From models to agents", "sub": "Week 2, Acts I and II", "en": "<p>Three generations: <b>deterministic software<\/b> (ERP, SQL, fixed rules, no ambiguity) → <b>probabilistic models<\/b> (unstructured tasks, with statistical error) → <b>tool-using agents<\/b> (connected to databases and payment rails, they execute steps).<\/p>\n<h3>Jensen Huang's \"Five-Layer Cake\" (Davos 2026)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Layer<\/th><th>Content<\/th><th>United States<\/th><th>Europe<\/th><th>China / East Asia<\/th><\/tr>\n<tr><td>5. Applications<\/td><td>Enterprise workflows: <b>the only cash-inflow layer<\/b> from end customers<\/td><td>JPMorgan, Walmart<\/td><td>LVMH, L'Oréal, Siemens<\/td><td>Alibaba, Ping An, BYD<\/td><\/tr>\n<tr><td>4. AI models<\/td><td>Closed APIs, open-weight models<\/td><td>OpenAI, Anthropic, Google<\/td><td>Mistral<\/td><td>DeepSeek, Qwen<\/td><\/tr>\n<tr><td>3. Cloud / AI factories<\/td><td>Hyperscale clusters<\/td><td>AWS, Azure<\/td><td>OVHcloud, SAP<\/td><td>Alibaba Cloud, Huawei<\/td><\/tr>\n<tr><td>2. Chips<\/td><td>GPUs, ASICs, HBM memory, lithography<\/td><td>NVIDIA, AMD<\/td><td><b>ASML<\/b>, ARM<\/td><td>TSMC, SK Hynix<\/td><\/tr>\n<tr><td>1. Energy<\/td><td>Power plants, grids<\/td><td>Nuclear, GE Vernova<\/td><td>Schneider, Siemens Energy<\/td><td>State Grid, CATL<\/td><\/tr>\n<\/table><\/div>\n<p>No single country controls the whole stack. Factor prices shape applications (high power costs and software subscription habits → office AI in the US and EU; cheap industrial electricity → AI inside EVs and hardware in China). States regulate the immovable base (power, chip exports) and top-layer licenses. <b>Costs move up, liability falls down<\/b> on a named human and company.<\/p>\n<h3>4 levels of AI autonomy<\/h3>\n<p><b>Chatbot<\/b> (2022–23, single prompts) → <b>Copilot<\/b> (2024, suggests while a human drives) → <b>Workflow agent<\/b> (2025–26, breaks a goal into steps, calls APIs, reads errors) → <b>Automated R&amp;D<\/b> (frontier: an outer loop modifies code overnight and keeps what passes tests).<\/p>\n<ul>\n<li>Task horizon at 50% reliability (METR): <b>doubles every 4 to 7 months<\/b>. Karpathy: \"<b>Software 3.0<\/b>\" (natural language orchestrates code and models). Rule: match autonomy to how fast humans can verify.<\/li>\n<li><b>Recursive self-improvement<\/b> works in <b>closed worlds<\/b> with an objective verifier (code, math, AlphaEvolve) and misfires in <b>open markets<\/b> (trust, fairness). <b>Goodhart's law<\/b>: tell an agent to minimize refunds and it learns to wear customers down.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Compounding errors<\/span>\n95% accuracy at each step, independent steps:<br>\n5 steps: 0.95⁵ = <b>77.4%<\/b> · 10 steps: 0.95¹⁰ = <b>59.8%<\/b> · 20 steps: 0.95²⁰ = <b>35.8%<\/b> (two runs out of three need intervention).<br>\nRemedy: deterministic checks, schema validators and hard dollar caps between model calls.<\/div>\n<h3>Business economics of AI<\/h3>\n<ul>\n<li>High adoption, modest profit (McKinsey 2026, MIT NANDA 2025): ~9 in 10 firms use generative AI, 62% pilot agents, but only <b>37%<\/b> report an EBIT impact and <b>6%<\/b> are high performers. Over 90% of employees use personal AI tools (shadow AI).<\/li>\n<li>The <b>1890s factory parallel<\/b>: electric motors only raised productivity once factories <b>redesigned their layout<\/b> (link with the Solow paradox).<\/li>\n<li><b>Agent purchasing<\/b>: human mandate → scoped payment token (Visa, Mastercard, Stripe) → machine-readable APIs → automated settlement. Pressure on undifferentiated middlemen; brand pricing power survives when customers tell their agent \"buy this brand only\" (Hermès, Ferrari).<\/li>\n<\/ul>", "fr": "<p>Trois générations : <b>logiciel déterministe<\/b> (ERP, SQL, règles fixes, pas d'ambiguïté) → <b>modèles probabilistes<\/b> (tâches non structurées, avec erreur statistique) → <b>agents utilisant des outils<\/b> (connectés aux bases de données et aux paiements, ils exécutent des étapes).<\/p>\n<h3>Le « gâteau à 5 couches » de Jensen Huang (Davos 2026)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Couche<\/th><th>Contenu<\/th><th>États-Unis<\/th><th>Europe<\/th><th>Chine / Asie<\/th><\/tr>\n<tr><td>5. Applications<\/td><td>Workflows d'entreprise : <b>seule couche qui encaisse<\/b> du chiffre d'affaires client<\/td><td>JPMorgan, Walmart<\/td><td>LVMH, L'Oréal, Siemens<\/td><td>Alibaba, Ping An, BYD<\/td><\/tr>\n<tr><td>4. Modèles<\/td><td>API fermées, modèles open-weight<\/td><td>OpenAI, Anthropic, Google<\/td><td>Mistral<\/td><td>DeepSeek, Qwen<\/td><\/tr>\n<tr><td>3. Cloud / usines IA<\/td><td>Clusters hyperscale<\/td><td>AWS, Azure<\/td><td>OVHcloud, SAP<\/td><td>Alibaba Cloud, Huawei<\/td><\/tr>\n<tr><td>2. Puces<\/td><td>GPU, ASIC, mémoire HBM, lithographie<\/td><td>NVIDIA, AMD<\/td><td><b>ASML<\/b>, ARM<\/td><td>TSMC, SK Hynix<\/td><\/tr>\n<tr><td>1. Énergie<\/td><td>Électricité, réseaux<\/td><td>Nucléaire, GE Vernova<\/td><td>Schneider, Siemens Energy<\/td><td>State Grid, CATL<\/td><\/tr>\n<\/table><\/div>\n<p>Aucun pays ne contrôle tout. Le prix des facteurs oriente les usages (électricité chère et culture logicielle → IA de bureau aux États-Unis et en UE ; électricité industrielle bon marché → IA dans les VE et le matériel en Chine). Les États régulent la base immobile (énergie, export de puces) et les licences en haut. <b>Les coûts remontent, la responsabilité descend<\/b> sur une personne et une entreprise nommées.<\/p>\n<h3>4 niveaux d'autonomie<\/h3>\n<p><b>Chatbot<\/b> (2022–23, une question une réponse) → <b>Copilot<\/b> (2024, suggère, l'humain conduit) → <b>Agent de workflow<\/b> (2025–26, découpe un objectif, appelle des API, corrige ses erreurs) → <b>R&D automatisée<\/b> (frontière : une boucle modifie le code la nuit et garde ce qui passe les tests).<\/p>\n<ul>\n<li>Durée des tâches réussies à 50 % par un agent (METR) : <b>doublée tous les 4 à 7 mois<\/b>. Karpathy : « <b>Software 3.0<\/b> » (le langage naturel orchestre code et modèles). Règle : régler l'autonomie selon ce que l'humain peut vérifier vite.<\/li>\n<li><b>Auto-amélioration<\/b> : marche dans les mondes <b>fermés<\/b> avec un vérificateur objectif (code, maths, AlphaEvolve) ; échoue dans les marchés <b>ouverts<\/b> (confiance, équité). <b>Loi de Goodhart<\/b> : un agent à qui l'on demande de minimiser les remboursements apprend à épuiser les clients.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Erreurs qui se cumulent<\/span>\nPrécision de 95 % à chaque étape, étapes indépendantes :<br>\n5 étapes : 0,95⁵ = <b>77,4 %<\/b> · 10 étapes : 0,95¹⁰ = <b>59,8 %<\/b> · 20 étapes : 0,95²⁰ = <b>35,8 %<\/b> (deux fois sur trois, il faut intervenir).<br>\nRemède : contrôles déterministes, validateurs et plafonds de dépense entre les appels au modèle.<\/div>\n<h3>Économie de l'IA en entreprise<\/h3>\n<ul>\n<li>Adoption large, profit modeste (McKinsey 2026, MIT NANDA 2025) : ~9 entreprises sur 10 utilisent l'IA générative, 62 % testent des agents, mais <b>37 %<\/b> seulement voient un effet sur l'EBIT et <b>6 %<\/b> sont des « high performers ». Plus de 90 % des salariés utilisent des outils IA personnels (shadow AI).<\/li>\n<li>Parallèle des <b>années 1890<\/b> : les moteurs électriques n'ont amélioré la productivité qu'après avoir <b>repensé l'usine<\/b> (lien avec le paradoxe de Solow).<\/li>\n<li><b>Agents acheteurs<\/b> : mandat humain → jeton de paiement limité (Visa, Mastercard, Stripe) → API lisibles par machine → règlement automatique. Pression sur les intermédiaires non différenciés ; le pouvoir de marque survit quand le client exige une marque précise (Hermès, Ferrari).<\/li>\n<\/ul>"}, {"id": "c5", "short": "Twelve industries", "title": "5. Twelve industries and the decision matrix", "sub": "Week 2, Acts III and IV", "en": "<div class=\"tw\"><table>\n<tr><th>Industry<\/th><th>Case<\/th><th>Limit<\/th><\/tr>\n<tr><td>Retail, procurement<\/td><td>Walmart × Pactum: 68% of negotiations closed, 3% savings, 75% of suppliers prefer it; Alibaba Accio<\/td><td>Middlemen under price pressure<\/td><\/tr>\n<tr><td>Luxury, beauty<\/td><td>LVMH keeps AI <b>backstage<\/b>; L'Oréal Beauty Genius (150,000 dermatologist annotations)<\/td><td>Automated chat cheapens luxury; biometric consent (GDPR, PIPL)<\/td><\/tr>\n<tr><td>Manufacturing<\/td><td>Siemens Industrial Copilot: PLC code from natural language<\/td><td>Zero tolerance for hallucinations on machinery<\/td><\/tr>\n<tr><td>Auto, EVs, robotics<\/td><td>Figure humanoids at BMW; BYD, Xiaomi: standard driver assistance<\/td><td>Reaction under 50 ms, product liability<\/td><\/tr>\n<tr><td>Supply chain, freight<\/td><td>Maersk: multi-modal rerouting (Red Sea)<\/td><td>Under 5% of European logistics firms scale AI end to end<\/td><\/tr>\n<tr><td>Banking, insurance<\/td><td>JPMorgan LLM Suite (200,000+ staff); Ping An (250M clients)<\/td><td>Explainability (EU AI Act); Klarna 2025: cutting humans hurts service<\/td><\/tr>\n<tr><td>Legal<\/td><td>A&amp;O Shearman × Harvey: review ~30% faster<\/td><td>Fabricated citations; partner sign-off cannot be delegated<\/td><\/tr>\n<tr><td>Pharma, healthcare<\/td><td>Sanofi: 1 billion data points, early R&amp;D indicators +20%<\/td><td>Biology and Phase III trials set the pace; FDA/EMA clearance<\/td><\/tr>\n<tr><td>Travel<\/td><td>Accor: direct booking (OTA commissions 15–25%)<\/td><td>Dynamic pricing hurts trust (Trip.com fines)<\/td><\/tr>\n<tr><td>Media, gaming<\/td><td>Publicis CoreAI (€300M); Ubisoft Neo NPC<\/td><td>Copyright, voice-actor unions, token costs<\/td><\/tr>\n<tr><td>Utilities<\/td><td>Octopus Kraken: 76% satisfaction on tariff emails<\/td><td>Data centers strain the grid<\/td><\/tr>\n<tr><td>Agriculture, education<\/td><td>John Deere See &amp; Spray (herbicide −50%); Harvard AI tutor (learning gains ×2)<\/td><td>Must run offline; chatbots can outsource thinking<\/td><\/tr>\n<\/table><\/div>\n<h3>The two-question matrix<\/h3>\n<p>Axis 1: does an <b>objective verifier<\/b> exist? Axis 2: what is the <b>cost of a single error<\/b>?<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">A. Clear verifier + low error cost<\/b>→ <b>Scale autonomy<\/b>: coding, warehouse routing, Walmart tail reorders, Octopus emails.<\/div>\n<div class=\"card\"><b class=\"t\">B. Clear verifier + high stakes<\/b>→ <b>Deterministic sandbox and caps<\/b>: Siemens factory code, John Deere, grid balancing, payments.<\/div>\n<div class=\"card\"><b class=\"t\">C. Open context + brand sensitivity<\/b>→ <b>Keep AI backstage<\/b>: LVMH clienteling, pricing communication, creative work.<\/div>\n<div class=\"card\"><b class=\"t\">D. Open context + fiduciary duty<\/b>→ <b>Human veto and signature<\/b>: legal opinions, clinical trials, large credit decisions.<\/div>\n<\/div>\n<div class=\"box key\"><span class=\"lbl\">Five questions before approving an AI budget<\/span>\n1. Are we redesigning a real bottleneck, or bolting a chatbot onto an unchanged process? · 2. Which quadrant, and which checks stop multi-step error decay? · 3. Cloud API, open-weight or edge: who keeps the data and pricing leverage? · 4. Security: who can halt errors without being punished? · 5. Measurable 12-month P&amp;L return without eroding trust?<\/div>", "fr": "<div class=\"tw\"><table>\n<tr><th>Industrie<\/th><th>Cas<\/th><th>Limite<\/th><\/tr>\n<tr><td>Retail, achats<\/td><td>Walmart × Pactum : 68 % des négociations conclues, 3 % d'économies, 75 % des fournisseurs préfèrent ; Alibaba Accio<\/td><td>Intermédiaires sous pression<\/td><\/tr>\n<tr><td>Luxe, beauté<\/td><td>LVMH garde l'IA <b>en coulisses<\/b> ; L'Oréal Beauty Genius (150 000 annotations de dermatologues)<\/td><td>Le chat automatique dévalorise le luxe ; consentement biométrique (RGPD, PIPL)<\/td><\/tr>\n<tr><td>Industrie<\/td><td>Siemens Industrial Copilot : code d'automates en langage naturel<\/td><td>Zéro tolérance aux hallucinations sur des machines<\/td><\/tr>\n<tr><td>Auto, VE, robots<\/td><td>Robots Figure chez BMW ; BYD, Xiaomi : aide à la conduite de série<\/td><td>Réaction en moins de 50 ms, responsabilité produit<\/td><\/tr>\n<tr><td>Logistique maritime<\/td><td>Maersk : réacheminement (mer Rouge)<\/td><td>Moins de 5 % des logisticiens européens passent à l'échelle<\/td><\/tr>\n<tr><td>Banque, assurance<\/td><td>JPMorgan LLM Suite (200 000 salariés) ; Ping An (250 M clients)<\/td><td>Explicabilité (AI Act) ; Klarna 2025 : couper l'humain dégrade le service<\/td><\/tr>\n<tr><td>Juridique<\/td><td>A&O Shearman × Harvey : revue ~30 % plus rapide<\/td><td>Fausses citations ; la signature de l'associé ne se délègue pas<\/td><\/tr>\n<tr><td>Santé, pharma<\/td><td>Sanofi : 1 Md de données, indicateurs R&D +20 %<\/td><td>La biologie et les essais de phase III fixent le rythme ; FDA/EMA<\/td><\/tr>\n<tr><td>Voyage<\/td><td>Accor : réservation directe (commissions des agences en ligne 15–25 %)<\/td><td>Prix dynamiques et confiance (amendes Trip.com)<\/td><\/tr>\n<tr><td>Médias, jeux<\/td><td>Publicis CoreAI (300 M€) ; Ubisoft Neo NPC<\/td><td>Droits d'auteur, syndicats d'acteurs, coût des tokens<\/td><\/tr>\n<tr><td>Énergie<\/td><td>Octopus Kraken : 76 % de satisfaction sur les emails tarifaires<\/td><td>Les data centers saturent les réseaux<\/td><\/tr>\n<tr><td>Agriculture, éducation<\/td><td>John Deere See & Spray (−50 % d'herbicide) ; tuteur IA de Harvard (gains d'apprentissage ×2)<\/td><td>Fonctionner hors ligne ; ne pas laisser le chatbot penser à la place<\/td><\/tr>\n<\/table><\/div>\n<h3>La matrice à deux questions<\/h3>\n<p>Axe 1 : existe-t-il un <b>vérificateur objectif<\/b> ? Axe 2 : quel est le <b>coût d'une erreur<\/b> ?<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">A. Vérificateur clair + erreur peu coûteuse<\/b>→ <b>Autonomie à l'échelle<\/b> : code, routage d'entrepôt, réassort Walmart, emails Octopus.<\/div>\n<div class=\"card\"><b class=\"t\">B. Vérificateur clair + enjeux forts<\/b>→ <b>Bac à sable déterministe et plafonds<\/b> : code d'usine Siemens, John Deere, réseau électrique, paiements.<\/div>\n<div class=\"card\"><b class=\"t\">C. Contexte ouvert + marque sensible<\/b>→ <b>IA en coulisses<\/b> : clienteling LVMH, communication tarifaire, création.<\/div>\n<div class=\"card\"><b class=\"t\">D. Contexte ouvert + responsabilité humaine<\/b>→ <b>Veto et signature humains<\/b> : avis juridiques, essais cliniques, gros crédits.<\/div>\n<\/div>\n<div class=\"box key\"><span class=\"lbl\">Les 5 questions avant de financer un projet IA<\/span>\n1. Repense-t-on un vrai goulot d'étranglement, ou ajoute-t-on un chatbot à un processus inchangé ? · 2. Quel quadrant, et quels contrôles contre la décroissance des erreurs ? · 3. Cloud, open-weight ou edge : qui garde les données et le pouvoir de prix ? · 4. Sécurité : qui peut arrêter le système sans être sanctionné ? · 5. Retour mesurable en 12 mois sans abîmer la confiance ?<\/div>"}, {"id": "c6", "short": "AI teams and careers", "title": "6. AI teams, adoption and careers", "sub": "Week 3 · \"AI Teams, Adoption &amp; Career Strategy\"", "en": "<ul>\n<li><b>The new hiring rule<\/b>: grow sales without growing headcount. Walmart (2.1M staff): flat headcount for three years. Shopify and Duolingo: managers must show why AI cannot do a task before hiring.<\/li>\n<li>Two types of AI companies: <b>small research labs<\/b> (DeepSeek ~150 staff, Mistral, Anthropic: flat, fast) and <b>big product and hardware builders<\/b> (ByteDance, Alibaba, Xiaomi, BYD, Microsoft).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>United States<\/th><th>Europe<\/th><th>China<\/th><\/tr>\n<tr><td>How they make money<\/td><td>Paid software ($20–30 per user/month), cloud bills<\/td><td>Safe enterprise software, industrial B2B contracts<\/td><td>Free apps + e-commerce ads, smart cars and hardware<\/td><\/tr>\n<tr><td>Main strength<\/td><td>Compute budgets, global software tools<\/td><td>Data privacy rules, factory engineering<\/td><td>Fast launches, low cost, supply chains<\/td><\/tr>\n<tr><td>Examples<\/td><td>OpenAI, Anthropic, Microsoft, Salesforce<\/td><td>Mistral, SAP, Schneider<\/td><td>DeepSeek, Qwen, Doubao, Xiaomi, BYD<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Organizing AI<\/b>: an isolated lab of data scientists fails (demos nobody uses). What works: <b>one small central hub<\/b> (security, tech) + <b>\"AI Champions\"<\/b> in Sales, Marketing, Finance and HR. Moderna even merged HR and IT under one leader.<\/li>\n<li>4 AI jobs for business graduates: <b>AI Product Manager<\/b>, <b>Business Workflow Consultant<\/b>, <b>Enterprise Sales &amp; Partnerships<\/b>, <b>AI Risk &amp; Policy Specialist<\/b>.<\/li>\n<li>By function: <b>Sales<\/b> (AI summarizes calls and updates the CRM; trust stays human); <b>Marketing<\/b> (fast translations and variants, but pure AI ads look soulless; Klarna brought humans back); <b>Finance<\/b> (AI reads invoices, but the math goes through Excel or SAP); <b>HR<\/b> (AI answers staff questions, but must <b>never<\/b> score or reject applicants alone: bias and EU law).<\/li>\n<li>Where to start: 1. internal time-savers (payback in 3–6 months); 2. assist sales and support staff with human checks; 3. new AI products (long term). Avoid unchecked public chatbots.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Setup<\/th><th>Analogy<\/th><th>Best for<\/th><th>Time and cost<\/th><\/tr>\n<tr><td>Ready-made tool<\/td><td>Ready-to-wear suit<\/td><td>Emails, notes, slides, translation<\/td><td>1 day, $20–30 per user/month<\/td><\/tr>\n<tr><td><b>RAG<\/b> (open-book search)<\/td><td>Open-book folder of company PDFs<\/td><td>~80% of projects: catalogs, HR rules, policies<\/td><td>2–4 weeks, low to medium cost, few fake facts if restricted to company documents<\/td><\/tr>\n<tr><td>Fine-tuning<\/td><td>Specialist school<\/td><td>Strict style (medical, legal, brand tone), not daily changing prices<\/td><td>2–4 months, high engineering cost<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Shadow AI<\/b>: over half of office workers use personal AI accounts without telling IT (official tools slow, fear of looking lazy). Risk: pasting client data into free public tools. Fix: a safe company AI account for everyone, one clear rule, and reward people who share good workflows.<\/li>\n<\/ul>\n<h3>Three studies to quote<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Harvard &amp; BCG<\/b>758 consultants: with AI, <b>25% faster<\/b> and <b>40% higher quality<\/b> (juniors +43%). But <b>19% worse<\/b> on a tricky case: they were \"asleep at the wheel\" and stopped checking facts.<\/div>\n<div class=\"card\"><b class=\"t\">Wharton<\/b>Each AI idea looks smart alone, but <b>94%<\/b> overlap with classmates' ideas: everyone ends up saying the same thing.<\/div>\n<div class=\"card\"><b class=\"t\">Stanford payroll data<\/b>In AI-exposed jobs, workers aged 35+ <b>+12%<\/b>, aged 22–25 <b>−11%<\/b> (\"Canaries in the Coal Mine\", Brynjolfsson et al.).<\/div>\n<\/div>\n<ul>\n<li>Three human skills AI cannot copy: <b>spotting the real problem<\/b>, <b>good taste and fact-checking<\/b>, <b>human trust and ownership<\/b>.<\/li>\n<li>Prompt formula: <b>Role · Context · Task · Rules<\/b> (e.g. role of an East China wine distributor, €30,000 budget, compare 3 channels in a table, max 220 words and 3 assumptions to verify). Then run a \"strict CFO\" prompt to test weak points.<\/li>\n<\/ul>", "fr": "<ul>\n<li><b>Nouvelle règle d'embauche<\/b> : grandir sans embaucher. Walmart (2,1 M salariés) : effectifs stables 3 ans malgré la croissance des ventes. Shopify et Duolingo : prouver que l'IA ne peut pas faire la tâche avant d'ouvrir un poste.<\/li>\n<li>Deux types d'entreprises IA : <b>petits labos de recherche<\/b> (DeepSeek ~150 personnes, Mistral, Anthropic : équipes plates, rapides) et <b>gros constructeurs de produits<\/b> (ByteDance, Alibaba, Xiaomi, BYD, Microsoft).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>États-Unis<\/th><th>Europe<\/th><th>Chine<\/th><\/tr>\n<tr><td>Comment gagner de l'argent<\/td><td>Logiciel payant (20–30 $/utilisateur/mois), cloud<\/td><td>Logiciel d'entreprise sûr, contrats industriels B2B<\/td><td>Apps gratuites + pub e-commerce, voitures et matériel<\/td><\/tr>\n<tr><td>Force<\/td><td>Budgets de calcul, outils mondiaux<\/td><td>Protection des données, ingénierie industrielle<\/td><td>Lancements rapides, coûts bas, chaînes d'approvisionnement<\/td><\/tr>\n<tr><td>Exemples<\/td><td>OpenAI, Anthropic, Microsoft, Salesforce<\/td><td>Mistral, SAP, Schneider<\/td><td>DeepSeek, Qwen, Doubao, Xiaomi, BYD<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Organiser l'IA<\/b> : un labo isolé de data scientists échoue (des démos que personne n'utilise). Ce qui marche : un <b>petit hub central<\/b> (sécurité, technique) + des <b>« AI champions »<\/b> dans les ventes, le marketing, la finance, les RH. Moderna a même réuni RH et IT sous un seul dirigeant.<\/li>\n<li>4 métiers accessibles aux diplômés d'école de commerce : <b>AI product manager<\/b>, <b>consultant en workflows<\/b>, <b>vente entreprise et partenariats<\/b>, <b>spécialiste risques et régulation IA<\/b>.<\/li>\n<li>Par fonction : <b>ventes<\/b> (l'IA résume les appels et met à jour le CRM, la confiance reste humaine) ; <b>marketing<\/b> (traductions et variantes rapides, mais les pubs 100 % IA abîment les marques ; Klarna a réintégré des humains) ; <b>finance<\/b> (l'IA lit les factures, mais les calculs passent par Excel ou SAP) ; <b>RH<\/b> (l'IA répond aux questions, mais ne doit <b>jamais<\/b> trier ou rejeter des candidats seule : biais et lois européennes).<\/li>\n<li>Par où commencer : 1. gains de temps internes (retour en 3–6 mois) ; 2. assistance aux équipes avec validation humaine ; 3. nouveaux produits IA (long terme). À éviter : chatbot public sans contrôle.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Comment installer l'IA<\/th><th>Image<\/th><th>Pour quoi<\/th><th>Délai et coût<\/th><\/tr>\n<tr><td>Outil prêt à l'emploi<\/td><td>Costume en prêt-à-porter<\/td><td>Mails, notes, slides, traduction<\/td><td>1 jour, 20–30 $/utilisateur/mois<\/td><\/tr>\n<tr><td><b>RAG<\/b> (recherche dans les documents)<\/td><td>Examen à livre ouvert<\/td><td>~80 % des projets : catalogues, règles RH, politiques<\/td><td>2–4 semaines, coût faible à moyen, peu d'inventions si limité aux documents<\/td><\/tr>\n<tr><td>Fine-tuning<\/td><td>École de spécialisation<\/td><td>Style très précis (médical, juridique, marque), pas pour des prix qui changent<\/td><td>2–4 mois, coût élevé<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Shadow AI<\/b> : plus de la moitié des salariés utilisent des outils IA perso sans le dire (outils officiels lents, peur de paraître paresseux). Risque : coller des données clients dans des outils gratuits. Solution : un compte IA d'entreprise sécurisé pour tous, une règle claire, valoriser ceux qui partagent leurs méthodes.<\/li>\n<\/ul>\n<h3>Trois études à citer<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Harvard et BCG<\/b>758 consultants : avec l'IA, <b>25 % plus rapides<\/b> et <b>40 % de qualité en plus<\/b> (juniors +43 %). Mais <b>19 % moins bons<\/b> sur un cas piégé : ils ont « dormi au volant » et cessé de vérifier.<\/div>\n<div class=\"card\"><b class=\"t\">Wharton<\/b>Chaque idée IA paraît bonne seule, mais <b>94 %<\/b> se recoupent avec celles des autres : tout le monde finit par dire la même chose.<\/div>\n<div class=\"card\"><b class=\"t\">Stanford (données de paie)<\/b>Dans les métiers exposés à l'IA, les 35 ans et plus <b>+12 %<\/b>, les 22–25 ans <b>−11 %<\/b> (« Canaries in the Coal Mine », Brynjolfsson et al.).<\/div>\n<\/div>\n<ul>\n<li>Trois compétences que l'IA ne copie pas : <b>repérer le vrai problème<\/b>, <b>le goût et la vérification des faits<\/b>, <b>la confiance humaine et la responsabilité<\/b>.<\/li>\n<li>Formule de prompt : <b>Rôle · Contexte · Tâche · Règles<\/b> (ex. : rôle de distributeur de vin en Chine de l'Est, budget de 30 000 €, comparer 3 canaux dans un tableau, 220 mots max et 3 hypothèses à vérifier). Puis un prompt « CFO exigeant » pour tester les faiblesses.<\/li>\n<\/ul>"}, {"id": "c7", "short": "Legal and policy issues", "title": "7. Legal and policy issues around AI", "sub": "Week 4 · \"Key Legal &amp; Policy Issues\"", "en": "<p>Almost all current legal issues of LLMs stem from <b>training data<\/b> (GPT-3: Common Crawl 60%, WebText2 22%, books 16%, Wikipedia 3%). Four risk families: <b>privacy<\/b>, <b>copyright<\/b>, <b>misinformation and ethical risk<\/b>, <b>compliance<\/b>.<\/p>\n<h3>Copyright<\/h3>\n<ul>\n<li>Protects <b>original works of authorship fixed in a tangible medium<\/b>, not ideas. <b>Berne Convention<\/b> (1886): automatic protection in all member countries.<\/li>\n<li><b>Zarya of the Dawn<\/b> (US Copyright Office): Midjourney-generated images excluded from registration. <b>Human authorship<\/b> is required; a prompt is only a general direction. → A pure AI mascot is not protected: hard to sue a rival who copies it.<\/li>\n<li><b>Authors Guild v. Google<\/b>: digitizing books for snippet search = <b>transformative fair use<\/b> (new purpose, not a market substitute). Open debate: is LLM training even more transformative, or do AI summaries compete directly with publishers?<\/li>\n<\/ul>\n<h3>Privacy<\/h3>\n<ul>\n<li>Privacy = maintaining control over one's personal information when data collection is effortless and violations scale instantly.<\/li>\n<li><b>CNIL<\/b> (France): fine because consent was neither <b>specific<\/b> nor <b>unambiguous<\/b> (GDPR). A bundled 2022 \"I agree\" does not cover new AI training.<\/li>\n<li><b>Garante<\/b> (Italy): temporarily halted ChatGPT (unlawful data collection, no age checks). <b>FTC<\/b> (US): investigation of the March 2023 breach and false statements about individuals.<\/li>\n<li>Once personal data is baked into model weights, deleting one user is very hard. Safeguards: transparency, opt-outs, filtering. GDPR, CCPA and PIPL shape WeChat, Instagram and TikTok; strong privacy can become a competitive advantage.<\/li>\n<\/ul>\n<h3>Misinformation and ethics<\/h3>\n<ul>\n<li>Misinformation: false or inaccurate information spread, intentionally or not (social media, news, AI content).<\/li>\n<li><b>Mark Walters v. OpenAI<\/b>: ChatGPT invented a complaint accusing a radio host of embezzlement. First major <b>defamation<\/b> case over a hallucination.<\/li>\n<li>Other risks (DeepMind): discrimination, malicious use, overreliance, inequality; moral dilemmas (self-driving cars).<\/li>\n<\/ul>\n<h3>Compliance around the world<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">China<\/b>Algorithm filing and safety assessment <b>before launch<\/b> for public-facing services; anti-fraud watermarks; core social values; agile rules that leave room for industry to grow.<\/div>\n<div class=\"card\"><b class=\"t\">European Union<\/b><b>AI Act<\/b> with risk tiers; HR AI is \"high risk\": fines up to <b>7% of global revenue<\/b>; Article 53: mandatory training-data summary.<\/div>\n<div class=\"card\"><b class=\"t\">United States<\/b>Voluntary company commitments, no pre-approval: you can launch \"tomorrow\".<\/div>\n<\/div>\n<p>Balancing <b>security and development<\/b>: over-regulation kills local start-ups. Tech companies pave the way (fair use + paid licensing, filtering, regulator engagement). Sam Altman's three questions: governing AGI, sharing its benefits, sharing access to compute.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Case: Paris Media Group vs TechNext<\/span>\nA Paris publisher (1.8M-article archive, EBIT €22M, clicks −18%) finds that a US unicorn's OmniBrief reproduces its scoops (typos included), ignored its June 2024 robots.txt opt-out and cites it for a fake scandal.<br>\nOptions: sue in the US (high damages but 4–5 years, €10M+ fees, fair use defense) or in the EU (fast injunction under EU DSM Art. 4, smaller damages); accept the €14M/year offer (with 4 \"poison pills\": full waiver of claims, live scoops, flat fee with no audit, weights kept forever); \"sue to settle\"; EU publisher alliance.<br>\nLink with Negotiation: BATNA, anchoring, artificial deadline (offer valid 14 days).<\/div>", "fr": "<p>Presque tous les problèmes juridiques des LLM viennent des <b>données<\/b> d'entraînement (GPT-3 : Common Crawl 60 %, WebText2 22 %, livres 16 %, Wikipédia 3 %). Quatre familles de risques : <b>vie privée<\/b>, <b>droit d'auteur<\/b>, <b>désinformation et risques éthiques<\/b>, <b>conformité<\/b>.<\/p>\n<h3>Droit d'auteur<\/h3>\n<ul>\n<li>Protège les <b>œuvres originales fixées sur un support<\/b>, pas les idées. <b>Convention de Berne<\/b> (1886) : protection automatique dans tous les pays signataires.<\/li>\n<li><b>Zarya of the Dawn<\/b> (US Copyright Office) : les images générées par Midjourney sont exclues de l'enregistrement. Il faut un <b>auteur humain<\/b> ; un prompt n'est qu'une direction générale. → Une mascotte 100 % IA n'est pas protégée : difficile d'attaquer un concurrent qui la copie.<\/li>\n<li><b>Authors Guild v. Google<\/b> : numériser des livres pour la recherche par extraits = <b>usage transformatif<\/b> (fair use) : nouveau but, pas de substitut au livre. Débat actuel : l'entraînement des LLM est-il encore plus transformatif, ou les résumés IA concurrencent-ils directement les éditeurs ?<\/li>\n<\/ul>\n<h3>Vie privée<\/h3>\n<ul>\n<li>Vie privée = garder le contrôle sur ses données personnelles quand la collecte est facile et que les violations se propagent vite.<\/li>\n<li><b>CNIL<\/b> (France) : sanction parce que le consentement n'était ni <b>spécifique<\/b> ni <b>univoque<\/b> (RGPD). Un « J'accepte » groupé de 2022 ne couvre pas un nouvel entraînement d'IA.<\/li>\n<li><b>Garante<\/b> (Italie) : ChatGPT temporairement bloqué (collecte illégale, pas de vérification d'âge). <b>FTC<\/b> (États-Unis) : enquête sur la fuite de mars 2023 et les fausses déclarations sur des personnes.<\/li>\n<li>Une fois des données dans les poids du modèle, les effacer pour un seul utilisateur est très difficile. Protections : transparence, opt-out, filtrage. RGPD, CCPA et PIPL encadrent WeChat, Instagram, TikTok ; la protection de la vie privée peut devenir un avantage concurrentiel.<\/li>\n<\/ul>\n<h3>Désinformation et éthique<\/h3>\n<ul>\n<li>Désinformation : information fausse diffusée, volontairement ou non (réseaux, médias, contenus IA).<\/li>\n<li><b>Mark Walters v. OpenAI<\/b> : ChatGPT invente une plainte accusant un animateur radio de détournement de fonds. Première grande affaire de <b>diffamation<\/b> liée à une hallucination.<\/li>\n<li>Autres risques (DeepMind) : discrimination, usage malveillant, dépendance excessive, inégalités ; dilemmes moraux (voiture autonome).<\/li>\n<\/ul>\n<h3>Conformité dans le monde<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Chine<\/b>Enregistrement de l'algorithme et évaluation de sécurité <b>avant le lancement<\/b> d'un service public ; filigranes anti-fraude ; valeurs sociales ; règles souples pour laisser l'industrie se développer.<\/div>\n<div class=\"card\"><b class=\"t\">Union européenne<\/b><b>AI Act<\/b> par niveaux de risque ; l'IA RH est « à haut risque » : amendes jusqu'à <b>7 % du chiffre d'affaires mondial<\/b> ; article 53 : résumé obligatoire des données d'entraînement.<\/div>\n<div class=\"card\"><b class=\"t\">États-Unis<\/b>Engagements volontaires des entreprises, pas d'autorisation préalable : on peut lancer « demain ».<\/div>\n<\/div>\n<p>Équilibre <b>sécurité / développement<\/b> : trop de régulation étouffe les start-ups locales. Les entreprises tech ouvrent la voie (fair use + licences payantes, filtrage, dialogue avec les régulateurs). Trois questions de Sam Altman : gouverner l'AGI, partager ses bénéfices, partager l'accès au calcul.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Cas Paris Media Group vs TechNext<\/span>\nUn éditeur parisien (archives de 1,8 M d'articles, EBIT 22 M€, clics −18 %) découvre que l'outil OmniBrief d'une licorne américaine reproduit ses scoops (fautes de frappe comprises), a ignoré son opt-out robots.txt de juin 2024 et lui attribue un faux scandale.<br>\nOptions : procès aux États-Unis (dommages élevés mais 4–5 ans, 10 M€+ de frais, défense fair use) ou dans l'UE (injonction rapide via l'article 4 de la directive DSM, dommages plus faibles) ; accepter l'offre de 14 M€/an (avec 4 « pilules empoisonnées » : renonciation à tout recours, scoops en direct, montant fixe sans audit, poids conservés pour toujours) ; « attaquer pour négocier » ; alliance d'éditeurs européens.<br>\nLien avec le cours de négociation : BATNA, ancrage, date limite artificielle (offre valable 14 jours).<\/div>"}, {"id": "method", "short": "Practice MCQ", "title": "Practice MCQ and open question", "sub": "", "en": "<div class=\"q\"><div class=\"qt\">1. A bank wants to find unusual groups of accounts without knowing what to look for:<\/div><ol><li>supervised<\/li><li>unsupervised<\/li><li>reinforcement<\/li><\/ol>\n<details><summary>Answer<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. In the course's vocabulary, the company's own asset is:<\/div><ol><li>the algorithm<\/li><li>the model trained on its data<\/li><li>inference<\/li><\/ol>\n<details><summary>Answer<\/summary>b. The algorithm is the public recipe.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. An agent chains 10 steps at 95% accuracy each. End-to-end success rate?<\/div><ol><li>95%<\/li><li>≈ 60%<\/li><li>≈ 36%<\/li><\/ol>\n<details><summary>Answer<\/summary>b. 0.95¹⁰ ≈ 59.8%.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. Which layer of the \"cake\" collects revenue from end customers?<\/div><ol><li>Energy<\/li><li>Chips<\/li><li>Models<\/li><li>Applications<\/li><\/ol>\n<details><summary>Answer<\/summary>d.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. A legal opinion in an M&amp;A deal belongs to quadrant:<\/div><ol><li>A, autonomy<\/li><li>B, sandbox<\/li><li>C, backstage<\/li><li>D, human veto and signature<\/li><\/ol>\n<details><summary>Answer<\/summary>d.<\/details><\/div>\n<details><summary>Typical open question: \"Your company wants to automate its customer service with an AI agent. What do you think?\"<\/summary>\nOutline: 1) benefits (cost, 24/7, languages); 2) LLM limits (hallucinations, no accountability, Goodhart if you optimize closed tickets); 3) place the case in the matrix (open context + brand: keep a human, see Klarna); 4) controls (human escalation, refund caps, verification); 5) the five budget questions; recommendation: pilot on simple, verifiable requests.<\/details>", "fr": "<div class=\"q\"><div class=\"qt\">1. Une banque veut repérer des groupes de comptes inhabituels sans savoir quoi chercher :<\/div><ol><li>supervisé<\/li><li>non supervisé<\/li><li>renforcement<\/li><\/ol>\n<details><summary>Réponse<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. Dans le vocabulaire du cours, l'actif propre à l'entreprise est :<\/div><ol><li>l'algorithme<\/li><li>le modèle entraîné sur ses données<\/li><li>l'inférence<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. L'algorithme est la recette publique.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. Un agent enchaîne 10 étapes à 95 % de réussite chacune. Taux de réussite global ?<\/div><ol><li>95 %<\/li><li>≈ 60 %<\/li><li>≈ 36 %<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. 0,95¹⁰ ≈ 59,8 %.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. Quelle couche du « gâteau » encaisse le chiffre d'affaires des clients finaux ?<\/div><ol><li>Énergie<\/li><li>Puces<\/li><li>Modèles<\/li><li>Applications<\/li><\/ol>\n<details><summary>Réponse<\/summary>d.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. Un avis juridique dans une fusion relève du quadrant :<\/div><ol><li>A, autonomie<\/li><li>B, bac à sable<\/li><li>C, en coulisses<\/li><li>D, veto et signature humains<\/li><\/ol>\n<details><summary>Réponse<\/summary>d.<\/details><\/div>\n<details><summary>Question ouverte type : « Votre entreprise veut automatiser son service client avec un agent IA. Qu'en pensez-vous ? »<\/summary>\nPlan : 1) bénéfices (coûts, disponibilité, langues) ; 2) limites des LLM (hallucinations, pas de responsabilité, Goodhart si on optimise les tickets clos) ; 3) placer le cas dans la matrice (contexte ouvert + marque : garder un humain, cf. Klarna) ; 4) contrôles (escalade vers un humain, limites de remboursement, vérification) ; 5) les 5 questions avant de financer ; recommandation : pilote sur les demandes simples et vérifiables.<\/details>"}], "cases": [{"kind": "p", "sec": "Practice case", "sid": "", "title": "Practice: an AI agent for refunds", "body": "<p>An online retailer wants an AI agent that approves or refuses customer refunds on its own, with a target of reducing refunds by 20%.<\/p><ol><li>Place the use case in the two-question matrix.<\/li><li>Name two risks seen in the course.<\/li><li>What controls do you recommend?<\/li><\/ol>", "answer": "<p><b>1.<\/b> Partly verifiable (order data) but brand-sensitive and customer-facing: between B and C. Not quadrant A.<\/p><p><b>2.<\/b> <b>Goodhart's law<\/b>: optimizing \"fewer refunds\" teaches the agent to wear customers down. <b>Compounding errors<\/b> over several steps (check order, read photo, decide, pay).<\/p><p><b>3.<\/b> Hard dollar caps, human escalation above a threshold, deterministic checks between steps, a metric that includes customer satisfaction, pilot on simple cases first (Klarna lesson).<\/p>", "fr": "<p>Cas entre B et C (vérifiable en partie mais sensible pour la marque). Risques : loi de Goodhart (épuiser le client pour moins rembourser) et erreurs qui s'additionnent. Contrôles : plafonds, escalade humaine, vérifications entre étapes, indicateur de satisfaction, pilote limité.<\/p>"}, {"kind": "ex", "title": "Course quiz", "sec": "Machine learning", "sid": "c2", "body": "LVMH: which customers will buy a handbag in the next 90 days → <b>supervised<\/b> (past purchases are the labels).<br>\nShanghai bank: unusual groups of accounts it never looked for → <b>unsupervised<\/b>.<br>\nDecathlon: changes online prices every hour and learns from what sells → <b>reinforcement<\/b>.<br>\nHospital: pneumonia on 50,000 X-rays labelled by radiologists → <b>supervised<\/b>.<br>\nSpotify: group untagged songs into \"moods\" → <b>unsupervised<\/b>.<br>\nRobot arm learning to pick parcels → <b>reinforcement<\/b>.", "fr": "LVMH : quels clients achèteront un sac dans 90 jours → <b>supervisé<\/b> (achats passés = étiquettes).<br>\nBanque de Shanghai : groupes de comptes inhabituels jamais cherchés → <b>non supervisé<\/b>.<br>\nDecathlon : prix en ligne changés chaque heure en apprenant des ventes → <b>renforcement<\/b>.<br>\nHôpital : pneumonie sur 50 000 radios étiquetées → <b>supervisé<\/b>.<br>\nSpotify : classer des chansons non taguées en « humeurs » → <b>non supervisé<\/b>.<br>\nBras robot qui apprend à saisir des colis → <b>renforcement<\/b>."}, {"kind": "ex", "title": "Compounding errors", "sec": "Agents and the AI stack", "sid": "c4", "body": "95% accuracy at each step, independent steps:<br>\n5 steps: 0.95⁵ = <b>77.4%<\/b> · 10 steps: 0.95¹⁰ = <b>59.8%<\/b> · 20 steps: 0.95²⁰ = <b>35.8%<\/b> (two runs out of three need intervention).<br>\
