rrive 15 minutes early with your student card and a charged battery.<\/div>\n<ul>\n<li><b>MCQ + 1 case analysis + 2 open questions<\/b>, 40% of the grade.<\/li>\n<li>What is assessed: knowing intercultural communication theory; <b>using and explaining Hofstede's dimensions and Erin Meyer's Culture Map<\/b> in situations; theory and practice of <b>culture shock<\/b>.<\/li>\n<li>The rest: group report (40%, 1 December) and individual CQ analysis + cultural incident (20%, 29 November).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Lesson<\/th><th>Topic<\/th><\/tr>\n<tr><td>1<\/td><td>Making sense of experience in China: culture shock, cultural incidents, sensemaking, cultural quotient (CQ)<\/td><\/tr>\n<tr><td>2<\/td><td>Hierarchy and collectivism (Hofstede)<\/td><\/tr>\n<tr><td>3<\/td><td>Chinese business culture: deciding and planning, <b>face<\/b>, <b>guanxi<\/b> (Erin Meyer)<\/td><\/tr>\n<tr><td>4<\/td><td>Education, marriage, success, long-term orientation; group presentations<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box trap\"><span class=\"lbl\">Material<\/span>As of 25 November, lessons 1, 2 and 3 are on K2 and stored in <code>Final/<\/code>, with the case \"Paying the bill in China\" and the exercise \"Your First Week as an Intern\". Lesson 4 (education, marriage, success, long term) is not published yet.<\/div>", "fr": "<div class=\"box key\"><span class=\"lbl\">Ton calendrier (convocation)<\/span><b>Mar. 8 décembre, 10 h–11 h 30<\/b> (heure de Suzhou). QCM + questions ouvertes sur TestWe, 1 h 30. Pas de documents, <b>brouillon autorisé<\/b>, pas de calculatrice. Responsable : Julien Dreyfuss.<br>Salle 271, rang 5, place 6. Arriver 15 min avant avec ta carte étudiante, batterie chargée.<\/div>\n<ul>\n<li><b>QCM + 1 analyse de cas + 2 questions ouvertes<\/b>, 40 % de la note.<\/li>\n<li>Ce qui est évalué : connaître la théorie de la communication interculturelle ; <b>utiliser et expliquer les dimensions de Hofstede et la Culture Map d'Erin Meyer<\/b> dans des situations ; la théorie et la pratique du <b>choc culturel<\/b>.<\/li>\n<li>Le reste : rapport de groupe (40 %, 1<sup>er<\/sup> décembre) et analyse individuelle CQ + incident culturel (20 %, 29 novembre).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Leçon<\/th><th>Thème<\/th><\/tr>\n<tr><td>1<\/td><td>Making sense of experience in China : choc culturel, incidents culturels, sensemaking, quotient culturel (CQ)<\/td><\/tr>\n<tr><td>2<\/td><td>Hiérarchie et collectivisme (Hofstede)<\/td><\/tr>\n<tr><td>3<\/td><td>Culture d'affaires chinoise : décider et planifier, la <b>face<\/b>, le <b>guanxi<\/b> (Erin Meyer)<\/td><\/tr>\n<tr><td>4<\/td><td>Éducation, mariage, réussite, orientation long terme ; présentations de groupe<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box trap\"><span class=\"lbl\">Supports<\/span>Au 25 novembre, les leçons 1, 2 et 3 sont sur K2 et rangées dans <code>Final/<\/code>, avec le cas « Paying the bill in China » et l'exercice « Your First Week as an Intern ». La leçon 4 (éducation, mariage, réussite, long terme) n'est pas encore publiée.<\/div>"}, {"id": "c1", "short": "Culture shock", "title": "1. Culture shock and adaptation", "sub": "Lesson 1 · Bennett", "en": "<p><b>Cultural iceberg<\/b>: you see behaviours (food, gestures); values and meanings lie below the surface.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Stage<\/th><th>What you experience<\/th><\/tr>\n<tr><td>1. Honeymoon<\/td><td>Everything is new and exciting, you see the positive side.<\/td><\/tr>\n<tr><td>2. Anxiety (crisis)<\/td><td>Paperwork, housing, habits: it becomes heavy; you look for people from your own culture.<\/td><\/tr>\n<tr><td>3. Adjustment<\/td><td>You work on the anxiety and start adapting.<\/td><\/tr>\n<tr><td>4. Acceptance<\/td><td>You feel competent, interact effectively, integrate elements of the culture.<\/td><\/tr>\n<tr><td>5. Reverse culture shock<\/td><td>Coming home feels strange.<\/td><\/tr>\n<\/table><\/div>\n<h3>Three categories of reactions<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">1. Positive<\/b>What you admire or can learn. In China: hospitality, safety, efficient payments and transport, cost of living.<\/div>\n<div class=\"card\"><b class=\"t\">2. Acceptable differences<\/b>Surprising but with no moral stake: different politeness, fewer emotions in public, noise.<\/div>\n<div class=\"card\"><b class=\"t\">3. Core values in tension<\/b>They touch fairness, dignity, autonomy: internet control, gender roles, 坐月子 (zuò yuè zi, the month of confinement after giving birth), working hours. Understanding is not the same as taking part.<\/div>\n<\/div>\n<h3>The cultural incident<\/h3>\n<ul>\n<li>Several layers of explanation: <b>national culture<\/b>, subcultures (family, work, region, generation), <b>personality<\/b>, <b>situation<\/b>, <b>human nature<\/b>. Always consider several.<\/li>\n<li><b>Ethnocentrism<\/b>: implicitly believing that our way is the right way. We expect the other person to act like us → incident → anger or worry → retreat into our own culture.<\/li>\n<li>Knowing that differences exist is not enough: cultural conditioning triggers <b>automatic reactions<\/b>. Intercultural competence is a <b>practice<\/b> that builds new habits.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Course example: spitting in the street<\/span>\nObserved behaviour → automatic reaction (\"disgusting\") → <b>judgement about a group<\/b> (\"they are dirty\") = overgeneralization. Hypotheses to check instead of concluding: traditional medicine (expelling impurities), air pollution, a different idea of hygiene, generational differences.<br>\nThe mirror case: a Chinese visitor in Paris finds the metro \"old and dirty, is this a developed country?\". Ethnocentrism works both ways.<\/div>", "fr": "<p><b>Iceberg culturel<\/b> : on voit les comportements (nourriture, gestes) ; les valeurs et significations sont sous la surface.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Étape<\/th><th>Ce qu'on vit<\/th><\/tr>\n<tr><td>1. Lune de miel<\/td><td>Tout est nouveau et excitant, on voit le positif.<\/td><\/tr>\n<tr><td>2. Anxiété (crise)<\/td><td>Administration, logement, habitudes : ça devient lourd ; on cherche des gens de sa culture.<\/td><\/tr>\n<tr><td>3. Ajustement<\/td><td>On travaille sur l'anxiété et on commence à s'adapter.<\/td><\/tr>\n<tr><td>4. Acceptation<\/td><td>On se sent compétent, on interagit efficacement, on intègre des éléments de la culture.<\/td><\/tr>\n<tr><td>5. Choc culturel inversé<\/td><td>Le retour au pays paraît étrange.<\/td><\/tr>\n<\/table><\/div>\n<h3>Trois catégories de réactions<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">1. Positif<\/b>Ce qu'on admire ou peut apprendre. En Chine : accueil, sécurité, paiements et transports efficaces, coût de la vie.<\/div>\n<div class=\"card\"><b class=\"t\">2. Différences acceptables<\/b>Surprenantes mais sans enjeu moral : politesse différente, moins d'émotions en public, bruit.<\/div>\n<div class=\"card\"><b class=\"t\">3. Valeurs fondamentales en tension<\/b>Touchent l'équité, la dignité, l'autonomie : contrôle d'internet, rôles de genre, 坐月子 (zuò yuè zi, le mois de confinement après l'accouchement), heures de travail. Comprendre ≠ participer.<\/div>\n<\/div>\n<h3>L'incident culturel<\/h3>\n<ul>\n<li>Plusieurs couches d'explication : <b>culture nationale<\/b>, sous-cultures (famille, travail, région, génération), <b>personnalité<\/b>, <b>situation<\/b>, <b>nature humaine<\/b>. Toujours en envisager plusieurs.<\/li>\n<li><b>Ethnocentrisme<\/b> : croire implicitement que notre façon est la bonne. On s'attend à ce que l'autre agisse comme nous → incident → colère ou inquiétude → repli sur sa culture.<\/li>\n<li>Savoir qu'il existe des différences ne suffit pas : le conditionnement culturel déclenche des <b>réactions automatiques<\/b>. L'interculturel est une <b>pratique<\/b> qui crée de nouvelles habitudes.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Exemple du cours : cracher dans la rue<\/span>\nComportement observé → réaction automatique (« dégoûtant ») → <b>jugement sur un groupe<\/b> (« ils sont sales ») = surgénéralisation. Pistes à vérifier au lieu de conclure : médecine traditionnelle (expulser les impuretés), pollution de l'air, conception différente de l'hygiène, différences de génération.<br>\nSymétrique : un Chinois à Paris juge le métro « vieux, sale, est-ce un pays développé ? ». L'ethnocentrisme fonctionne dans les deux sens.<\/div>"}, {"id": "c2", "short": "Sensemaking and CQ", "title": "2. Understanding and reacting: sensemaking and cultural intelligence", "sub": "Lesson 1 · method, worksheet \"A Date Gone Wrong\", CQ questionnaire", "en": "<h3>Sensemaking in 5 steps<\/h3>\n<ol>\n<li><b>Recognize<\/b> a problem or something you do not understand.<\/li>\n<li><b>Identify the gaps<\/b>: what you know, what you do not know.<\/li>\n<li><b>Fill the gaps<\/b> with your experience and new information.<\/li>\n<li><b>Analyze<\/b>, then propose a solution.<\/li>\n<li><b>Implement<\/b> the new solution.<\/li>\n<\/ol>\n<p>To avoid incidents: <b>adjust your expectations<\/b> (become aware that you expect others to act like you, then expect them to be themselves) and <b>watch your emotions rise<\/b> (frustration, anger, disgust) consciously, possibly afterwards in a journal.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Case \"A Date Gone Wrong\": the method for the case analysis<\/span>\nAlex (French) and Emilie (Chinese) meet through a friend. She asks his view on marriage; he has not thought about it; she wants to get married within the year and gets upset; he lies to leave.<br>\n1. <b>Facts vs interpretations<\/b>: \"she asked a question about marriage\" is a fact; \"she is immature / ridiculous\" is an interpretation (whose?).<br>\n2. <b>Expectations and emotions<\/b> on both sides: Alex expected a no-stakes meeting; Emilie a meeting with marriage in view (the frame of an arranged date). Turning point: the marriage question and Alex's smile.<br>\n3. <b>Several explanations<\/b>: social norms (pressure to marry, arranged dates), each person's values and age, the situation (misunderstanding about the purpose of the date). Do not generalize to all French or all Chinese people.<br>\n4. <b>Solution<\/b>: clarify expectations from the start; react with empathy rather than mockery.<\/div>\n<h3>Cultural intelligence (CQ)<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">CQ Drive (motivation)<\/b>Curiosity, desire to interact, confidence, perseverance after a failure.<\/div>\n<div class=\"card\"><b class=\"t\">CQ Knowledge<\/b>Knowing that words, gestures and customs carry different meanings; diversity within one country.<\/div>\n<div class=\"card\"><b class=\"t\">CQ Strategy<\/b>Planning ahead, noticing when your own expectations bias your interpretation, considering cultural and non-cultural explanations.<\/div>\n<div class=\"card\"><b class=\"t\">CQ Action (behaviour)<\/b>Adapting your verbal and non-verbal communication to the situation.<\/div>\n<\/div>\n<p>Developing your CQ: <b>observe<\/b>, <b>study<\/b> the culture, <b>interact<\/b> with locals, <b>cross-check sources<\/b> (none is objective). Cycle: notice the incident → observe your reaction → question your expectations → learn → update your expectations.<\/p>", "fr": "<h3>Le sensemaking en 5 étapes<\/h3>\n<ol>\n<li><b>Reconnaître<\/b> un problème ou quelque chose qu'on ne comprend pas.<\/li>\n<li><b>Identifier les manques<\/b> : ce que l'on sait, ce que l'on ne sait pas.<\/li>\n<li><b>Combler<\/b> avec son expérience et de nouvelles informations.<\/li>\n<li><b>Analyser<\/b> puis proposer une solution.<\/li>\n<li><b>Mettre en œuvre<\/b> la nouvelle solution.<\/li>\n<\/ol>\n<p>Pour éviter les incidents : <b>ajuster ses attentes<\/b> (prendre conscience qu'on attend des autres qu'ils agissent comme nous, puis s'attendre à ce qu'ils soient eux-mêmes) et <b>observer la montée des émotions<\/b> (frustration, colère, dégoût) consciemment, éventuellement après coup dans un journal.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Cas « A Date Gone Wrong » : la méthode pour l'analyse de cas<\/span>\nAlex (français) et Emilie (chinoise) se rencontrent via un ami. Elle lui demande son avis sur le mariage ; il n'y pense pas ; elle cherche à se marier dans l'année et se fâche ; il ment pour partir.<br>\n1. <b>Faits vs interprétations<\/b> : « elle a posé une question sur le mariage » est un fait ; « elle est immature / ridicule » est une interprétation (de qui ?).<br>\n2. <b>Attentes et émotions<\/b> des deux : Alex attendait une rencontre sans enjeu ; Emilie, une rencontre en vue du mariage (cadre d'un rendez-vous arrangé). Tournant : la question sur le mariage et le sourire d'Alex.<br>\n3. <b>Plusieurs explications<\/b> : normes sociales (pression au mariage, rendez-vous arrangés), valeurs et âge de chacun, situation (malentendu sur l'objectif du rendez-vous). Ne pas généraliser à tous les Français ou tous les Chinois.<br>\n4. <b>Solution<\/b> : clarifier les attentes dès le départ ; réagir avec empathie plutôt que moquerie.<\/div>\n<h3>Le quotient culturel (CQ)<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">CQ Drive (motivation)<\/b>Curiosité, envie d'interagir, confiance, persévérance après un échec.<\/div>\n<div class=\"card\"><b class=\"t\">CQ Knowledge (connaissance)<\/b>Savoir que mots, gestes et coutumes ont des sens différents ; diversité à l'intérieur d'un même pays.<\/div>\n<div class=\"card\"><b class=\"t\">CQ Strategy (stratégie)<\/b>Anticiper, remarquer quand ses propres attentes biaisent l'interprétation, envisager des explications culturelles et non culturelles.<\/div>\n<div class=\"card\"><b class=\"t\">CQ Action (comportement)<\/b>Adapter sa communication verbale et non verbale à la situation.<\/div>\n<\/div>\n<p>Développer son CQ : <b>observer<\/b>, <b>étudier<\/b> la culture, <b>interagir<\/b> avec les locaux, <b>croiser les sources<\/b> (aucune n'est objective). Cycle : remarquer l'incident → observer sa réaction → questionner ses attentes → apprendre → mettre à jour ses attentes.<\/p>"}, {"id": "c3", "short": "Hofstede", "title": "3. Hierarchy and collectivism (Hofstede)", "sub": "Lesson 2 · \"2 Hierarchy and Collectivism\" · case \"Paying the bill in China\"", "en": "<p>Geert Hofstede (1928–2020), Dutch psychologist, surveyed IBM employees: 6 cultural dimensions. They are <b>national averages<\/b>, not individual traits.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Dimension<\/th><th class=\"num\">China<\/th><th class=\"num\">France<\/th><th>What the course says<\/th><\/tr>\n<tr><td><b>Power distance<\/b> (PDI)<\/td><td class=\"num\">80<\/td><td class=\"num\">68<\/td><td>Both accept hierarchy. In China, people respect authority and elders and rarely challenge them. In France, hierarchy is strong but people debate and criticize authority.<\/td><\/tr>\n<tr><td><b>Individualism<\/b> (IDV)<\/td><td class=\"num\">43<\/td><td class=\"num\">74<\/td><td>China is collectivist: group harmony, loyalty, decisions made with the family in mind. France is very individualist: personal goals and self-expression.<\/td><\/tr>\n<tr><td><b>Masculinity<\/b> (MAS)<\/td><td class=\"num\">≈ 66<\/td><td class=\"num\">≈ 43<\/td><td>Masculine = achievement, competition, \"big is beautiful\"; feminine = caring, quality of life, sympathy for the underdog. It is about expected roles, not individuals.<\/td><\/tr>\n<tr><td><b>Uncertainty avoidance<\/b> (UAI)<\/td><td class=\"num\">≈ 30<\/td><td class=\"num\">≈ 86<\/td><td>Tolerance of ambiguity vs need for rules and certainty.<\/td><\/tr>\n<\/table><\/div>\n<p style=\"font-size:13px;color:var(--muted)\">PDI and IDV: figures from the course slides. MAS and UAI: Hofstede's values (the course table is an image). Long-term orientation and indulgence were not detailed in lesson 2.<\/p>\n<h3>Where these differences come from (course examples)<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">China: hierarchy and the group<\/b><b>Confucius<\/b> and his 5 hierarchical relationships: ruler and subject, parent and child, husband and wife, elder and younger sibling, friend and friend. <b>Agriculture<\/b>: rice farming in the South requires cooperation and harmony; in the North, river floods required a central authority. Examples: Three Gorges Dam, the film <i>Still Life<\/i> (Jia Zhangke); helping a child pay the down payment on a flat = today's collectivism.<\/div>\n<div class=\"card\"><b class=\"t\">France: hierarchy and the individual<\/b>Absolute monarchy (Louis XIV: \"L'État, c'est moi\"); <b>grandes écoles<\/b> (ENA, Polytechnique, HEC) training the elite; state capitalism; one or two more hierarchical levels than in Germany or the UK. Individualism inherited from the <b>Enlightenment<\/b> (Descartes: \"I think, therefore I am\").<\/div>\n<\/div>\n<div class=\"box key\"><span class=\"lbl\">The French combination<\/span>High power distance + high individualism: a <b>rare<\/b> combination (only Belgium, partly Spain and northern Italy). The French separate work and private life very clearly, and prefer to depend on an impersonal central power that does not invade their private life.<\/div>\n<h3>The case \"Paying the bill in China\"<\/h3>\n<p>Vocabulary: <b>买单<\/b> mǎidān (paying the bill) · <b>AA制<\/b> AAzhì (everyone pays their share, among equals) · <b>请客<\/b> qǐngkè (treating someone: paying = hospitality and a relationship gesture) · <b>轮流请客<\/b> lúnliú qǐngkè (taking turns treating). Depends on the situation (friends, business, family), age and economic power.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Model analysis<\/span>\nAlex (French) is invited by Lin: \"tonight, you are my guest\". He insists on paying his share, then on paying for Lin and himself. \"Da Ge\" (the big brother of the group) chooses the table, orders for everyone and ends up paying after a \"fight\" over the bill.<br>\n<b>Micro-shocks<\/b>: refusing to be the guest (collectivism: rejecting the host's role); Da Ge decides for everyone and people follow (power distance, status and age); Alex insists privately on \"making up for it\" by inviting Lin alone (individualist, egalitarian logic, which prolongs the awkwardness).<br>\n<b>Repair<\/b>: thank them for the hospitality, stop talking about money, offer to return the invitation <b>later, to the group<\/b> (轮流请客), follow the elder.<\/div>", "fr": "<p>Geert Hofstede (1928–2020), psychologue néerlandais, enquête chez IBM : 6 dimensions culturelles. Ce sont des <b>moyennes nationales<\/b>, pas des traits individuels.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Dimension<\/th><th class=\"num\">Chine<\/th><th class=\"num\">France<\/th><th>Ce que le cours en dit<\/th><\/tr>\n<tr><td><b>Distance hiérarchique<\/b> (PDI)<\/td><td class=\"num\">80<\/td><td class=\"num\">68<\/td><td>Les deux acceptent la hiérarchie. En Chine, on respecte l'autorité et les aînés et on conteste peu. En France, la hiérarchie est forte mais on débat et on critique l'autorité.<\/td><\/tr>\n<tr><td><b>Individualisme<\/b> (IDV)<\/td><td class=\"num\">43<\/td><td class=\"num\">74<\/td><td>Chine collectiviste : harmonie du groupe, loyauté, décisions en pensant à la famille. France très individualiste : objectifs et expression personnels.<\/td><\/tr>\n<tr><td><b>Masculinité<\/b> (MAS)<\/td><td class=\"num\">≈ 66<\/td><td class=\"num\">≈ 43<\/td><td>Masculin = réussite, compétition, « big is beautiful » ; féminin = soin, qualité de vie, sympathie pour le plus faible. Il s'agit des rôles attendus, pas des individus.<\/td><\/tr>\n<tr><td><b>Contrôle de l'incertitude<\/b> (UAI)<\/td><td class=\"num\">≈ 30<\/td><td class=\"num\">≈ 86<\/td><td>Tolérance à l'ambiguïté vs besoin de règles et de certitudes.<\/td><\/tr>\n<\/table><\/div>\n<p style=\"font-size:13px;color:var(--muted)\">PDI et IDV : chiffres des slides du cours. MAS et UAI : valeurs de Hofstede (le tableau du cours est une image). Les dimensions long terme et indulgence n'ont pas été détaillées en leçon 2.<\/p>\n<h3>D'où viennent ces différences (exemples du cours)<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Chine : hiérarchie et groupe<\/b><b>Confucius<\/b> et ses 5 relations hiérarchiques : souverain et sujet, parent et enfant, mari et femme, aîné et cadet, ami et ami. <b>Agriculture<\/b> : le riz du Sud demande coopération et harmonie ; au Nord, les crues des fleuves ont exigé une autorité centrale. Exemples : barrage des Trois-Gorges, film <i>Still Life<\/i> (Jia Zhangke) ; aider un enfant à payer l'apport de son appartement = collectivisme d'aujourd'hui.<\/div>\n<div class=\"card\"><b class=\"t\">France : hiérarchie et individu<\/b>Monarchie absolue (Louis XIV : « L'État, c'est moi ») ; <b>grandes écoles<\/b> (ENA, Polytechnique, HEC) qui forment l'élite ; capitalisme d'État ; un ou deux niveaux hiérarchiques de plus qu'en Allemagne ou au Royaume-Uni. Individualisme hérité des <b>Lumières<\/b> (Descartes : « Je pense donc je suis »).<\/div>\n<\/div>\n<div class=\"box key\"><span class=\"lbl\">La combinaison française<\/span>Forte distance hiérarchique + fort individualisme : combinaison <b>rare<\/b> (seulement Belgique, en partie Espagne et Italie du Nord). Les Français séparent très nettement vie pro et vie privée, et préfèrent dépendre d'un pouvoir central impersonnel qui n'envahit pas leur vie privée.<\/div>\n<h3>Le cas « Paying the bill in China »<\/h3>\n<p>Vocabulaire : <b>买单<\/b> mǎidān (payer l'addition) · <b>AA制<\/b> AAzhì (chacun paie sa part, entre égaux) · <b>请客<\/b> qǐngkè (inviter : payer = hospitalité et geste de relation) · <b>轮流请客<\/b> lúnliú qǐngkè (inviter chacun son tour). Selon la situation (amis, affaires, famille), l'âge et le pouvoir économique.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Analyse type<\/span>\nAlex (français) est invité par Lin : « ce soir, tu es mon invité ». Il insiste pour payer sa part, puis pour Lin et lui. « Da Ge » (le grand frère du groupe) choisit la table, commande pour tout le monde et finit par payer après une « dispute » pour l'addition.<br>\n<b>Micro-chocs<\/b> : refuser d'être l'invité (collectivisme : rejeter le rôle d'hôte) ; Da Ge décide pour tous et on le suit (distance hiérarchique, statut et âge) ; Alex insiste en privé pour « réparer » en invitant Lin seule (logique individualiste et égalitaire, qui prolonge la gêne).<br>\n<b>Réparer<\/b> : remercier pour l'hospitalité, ne plus parler d'argent, proposer de rendre l'invitation <b>plus tard, au groupe<\/b> (轮流请客), suivre l'aîné.<\/div>"}, {"id": "c4", "short": "The Culture Map", "title": "4. Erin Meyer's Culture Map", "sub": "Lesson 3 · \"03 China France Business Culture\"", "en": "<p>Eight scales to place cultures <b>relative to each other<\/b>. A country's position is a <b>starting hypothesis<\/b>, not a description of every person.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Scale<\/th><th>Poles<\/th><th>France<\/th><th>China<\/th><\/tr>\n<tr><td><b>Communicating<\/b><\/td><td>Low-context ↔ high-context<\/td><td>Fairly high-context<\/td><td>Very high-context<\/td><\/tr>\n<tr><td><b>Evaluating<\/b><\/td><td>Direct ↔ indirect negative feedback<\/td><td>Direct<\/td><td>Indirect<\/td><\/tr>\n<tr><td><b>Persuading<\/b><\/td><td>Principles-first ↔ applications-first; holistic<\/td><td>Principles-first<\/td><td>Holistic<\/td><\/tr>\n<tr><td><b>Leading<\/b><\/td><td>Egalitarian ↔ hierarchical<\/td><td>Hierarchical<\/td><td>Very hierarchical<\/td><\/tr>\n<tr><td><b>Deciding<\/b><\/td><td>Consensual ↔ top-down<\/td><td>Lots of debate, decisions can be reopened<\/td><td>The boss announces, people implement<\/td><\/tr>\n<tr><td><b>Trusting<\/b><\/td><td>Task-based ↔ relationship-based<\/td><td>Rather task-based<\/td><td>Relationship-based<\/td><\/tr>\n<tr><td><b>Disagreeing<\/b><\/td><td>Confrontational ↔ avoids confrontation<\/td><td>Confrontational<\/td><td>Avoids confrontation<\/td><\/tr>\n<tr><td><b>Scheduling<\/b><\/td><td>Linear time ↔ flexible time<\/td><td>Rather flexible<\/td><td>Flexible<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>High-context<\/b>: nuanced, implicit messages; you read between the lines. <b>Low-context<\/b>: precise, explicit; you repeat and confirm in writing. More diverse countries (US, Brazil, Singapore, India) tend to be lower-context.<\/li>\n<li><b>Context and directness are two different things<\/b>: France is high-context but gives direct negative feedback.<\/li>\n<li>Two high-context cultures (China and Brazil) can still misunderstand each other: they do not share the same implicit references.<\/li>\n<li><b>Upgraders<\/b> (\"absolutely\", \"totally\") strengthen criticism; <b>downgraders<\/b> (\"a bit\", \"maybe\") soften it. \"We are not quite there yet\" may mean \"we are very far from it\".<\/li>\n<li>Higher-context colleagues who speak little in meetings: different pauses and silences, weaker language skills, meetings felt as a fight → listen beyond the words. With low-context colleagues: be clear, give your opinion, recap in writing, ask when you do not understand.<\/li>\n<li><b>\"Pleasant\" disagreement<\/b>: separate ideas from people (written brainstorming), private talks before the meeting, soften the disagreement, the boss stepping back to let others speak.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">The two opening cases of the lesson<\/span>\n<b>The silent warning signal<\/b>: \"Any risks?\" \"Nothing major.\" Later a colleague says in private that the supplier is unreliable. → High context and conflict avoidance: ask in private or in writing, ask \"what could delay delivery?\" rather than \"is there a problem?\".<br>\n<b>The email war<\/b>: Sophie writes \"this draft has big problems, fix it urgently\". The team answers \"Received\" and changes almost nothing. → Direct, public criticism (loss of face) + a vague instruction. Better: private, softened feedback that says precisely what to change.<\/div>", "fr": "<p>Huit échelles pour situer les cultures <b>les unes par rapport aux autres<\/b>. La position d'un pays est une <b>hypothèse de départ<\/b>, pas la description de chaque personne.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Échelle<\/th><th>Pôles<\/th><th>France<\/th><th>Chine<\/th><\/tr>\n<tr><td><b>Communicating<\/b><\/td><td>Bas contexte ↔ haut contexte<\/td><td>Plutôt haut contexte<\/td><td>Très haut contexte<\/td><\/tr>\n<tr><td><b>Evaluating<\/b><\/td><td>Feedback négatif direct ↔ indirect<\/td><td>Direct<\/td><td>Indirect<\/td><\/tr>\n<tr><td><b>Persuading<\/b><\/td><td>Principes d'abord ↔ applications d'abord ; holistique<\/td><td>Principes d'abord<\/td><td>Holistique<\/td><\/tr>\n<tr><td><b>Leading<\/b><\/td><td>Égalitaire ↔ hiérarchique<\/td><td>Hiérarchique<\/td><td>Très hiérarchique<\/td><\/tr>\n<tr><td><b>Deciding<\/b><\/td><td>Consensuel ↔ top-down<\/td><td>On débat beaucoup, la décision peut être rediscutée<\/td><td>Le chef annonce, on applique<\/td><\/tr>\n<tr><td><b>Trusting<\/b><\/td><td>Tâche ↔ relation<\/td><td>Plutôt tâche<\/td><td>Relation<\/td><\/tr>\n<tr><td><b>Disagreeing<\/b><\/td><td>Confrontation ↔ évitement<\/td><td>Confrontation<\/td><td>Évitement<\/td><\/tr>\n<tr><td><b>Scheduling<\/b><\/td><td>Temps linéaire ↔ flexible<\/td><td>Plutôt flexible<\/td><td>Flexible<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Haut contexte<\/b> : message nuancé, implicite, on lit entre les lignes. <b>Bas contexte<\/b> : précis, explicite, on répète et on confirme par écrit. Les pays plus diversifiés (États-Unis, Brésil, Singapour, Inde) sont plus bas contexte.<\/li>\n<li><b>Contexte et franchise sont deux choses différentes<\/b> : la France est haut contexte mais donne un feedback négatif direct.<\/li>\n<li>Deux cultures haut contexte (Chine et Brésil) peuvent quand même mal se comprendre : elles n'ont pas les mêmes références implicites.<\/li>\n<li><b>Upgraders<\/b> (« absolument », « totalement ») renforcent la critique ; <b>downgraders<\/b> (« un peu », « peut-être ») l'adoucissent. « We are not quite there yet » peut vouloir dire « on est très loin du compte ».<\/li>\n<li>Collègues plus haut contexte qui parlent peu en réunion : pauses et silences différents, langue non maîtrisée, réunion vécue comme un combat → écouter au-delà des mots. Avec des collègues bas contexte : être clair, donner son avis, récapituler par écrit, demander si on ne comprend pas.<\/li>\n<li><b>Désaccord « agréable »<\/b> : séparer les idées des personnes (brainstorming écrit), discussions privées avant la réunion, adoucir le désaccord, le chef qui se met en retrait pour laisser parler.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Les deux cas d'ouverture de la leçon<\/span>\n<b>Le signal d'alerte silencieux<\/b> : « Des risques ? » « Rien de majeur. » Plus tard, un collègue dit en privé que le fournisseur n'est pas fiable. → Haut contexte et évitement du conflit : poser la question en privé ou par écrit, demander « qu'est-ce qui pourrait retarder la livraison ? » plutôt que « y a-t-il un problème ? ».<br>\n<b>La guerre des mails<\/b> : Sophie écrit « ce brouillon a de gros problèmes, à corriger d'urgence ». L'équipe répond « Reçu » et ne change presque rien. → Critique directe et publique (perte de face) + consigne floue. Mieux : feedback privé, adouci, et précis sur ce qu'il faut changer.<\/div>"}, {"id": "c5", "short": "Face and guanxi", "title": "5. Business culture: face and guanxi", "sub": "Lesson 3 · exercise \"Your First Week as an Intern\"", "en": "<h3>Face<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">面子 miànzi<\/b>Social status and recognition: competence, role, success. E.g. a colleague's expertise acknowledged in public.<\/div>\n<div class=\"card\"><b class=\"t\">脸 liǎn<\/b>Moral standing in the group: integrity, conduct. E.g. repeated lies destroy trust in the person.<\/div>\n<\/div>\n<ul>\n<li><b>丢面子 diū miànzi<\/b> (making someone lose face): public blame; bypassing a coordinator; demanding a public \"yes\" from someone without the authority; taking credit for a colleague's work.<\/li>\n<li><b>留面子 liú miànzi<\/b> (saving face in a disagreement): 1. recall the shared goal; 2. describe the constraint; 3. invite options; 4. confirm the next step.<\/li>\n<li><b>给面子 gěi miànzi<\/b> (giving face): visible credit, acknowledging expertise and role, including a quiet colleague without putting them on the spot. Excessive praise costs credibility.<\/li>\n<li><b>Repairing<\/b> after a misstep: acknowledge what you did, acknowledge the effect, restore the facts, agree on a better way of working.<\/li>\n<li>Face must not prevent you from correcting an <b>important error<\/b>: correct the fact during the meeting (\"the figure I have is 6 million, can we check?\"), clarify in private afterwards.<\/li>\n<\/ul>\n<h3>Guanxi<\/h3>\n<p><b>关系 guānxi<\/b>: personal ties that create familiarity, mutual expectations and a willingness to help each other. Related notions: <b>感情 gǎnqíng<\/b> (affection, familiarity), <b>人情 rénqíng<\/b> (favours and reciprocity), <b>信任 xìnrèn<\/b> (trust in the person), <b>信用 xìnyòng<\/b> (credibility: keeping your word).<\/p>\n<ul>\n<li>An <b>introduction<\/b> opens a conversation and puts the introducer's reputation on the line: thank them, keep them informed, warn them if you cannot follow up.<\/li>\n<li>Trust <b>through work<\/b> (reliable, warns early) + trust <b>through interaction<\/b> (meals, attention). Reciprocity with limits: you can refuse politely.<\/li>\n<li>Guanxi opens the door, but you still need to clarify the real decision: need, budget, who recommends, who approves, next deadline.<\/li>\n<\/ul>\n<h3>Practical tips<\/h3>\n<ul>\n<li>Business dinner: titles and greetings, seats of the host and guest of honour, toasts (Maotai 茅台), giving face.<\/li>\n<li>Gifts to avoid: a <b>clock<\/b> 钟 (送终: attending a funeral), <b>shoes<\/b> 鞋 (邪: bad luck), an <b>umbrella<\/b> 伞 (散: breaking up), a <b>pear<\/b> 梨 (离: leaving).<\/li>\n<li>Numbers: <b>4<\/b> 四 sì ≈ 死 sǐ (death); <b>8<\/b> 八 ≈ 发 fā (prosperity). Auspicious days chosen with the almanac to sign, open, move house.<\/li>\n<li>Internship: know who decides, how to escalate a problem, which channels to use; professional WeChat message = context + specific interest + one reasonable request.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Exercise \"Your First Week as an Intern\" (Hangzhou): my suggestions, not the official answer key<\/span>\n<b>Monday<\/b>: Ms Chen says \"Very creative. Quite ambitious for a first event. Have you looked carefully at who visits this mall?\" → this is a <b>polite no<\/b> (indirect feedback, downgraders), not encouragement: propose a smaller version or an alternative.<br>\n<b>Tuesday<\/b>: her slide announces 6 brands, only 2 are confirmed → do not contradict her in front of the client (face) but do not let the error stand: <b>private message<\/b> or written update after the meeting.<br>\n<b>Wednesday<\/b>: lunch offered with Mr Liu, who controls access → the relationship matters (guanxi), but the decision also needs his director's approval: go, then make a precise request.<br>\n<b>Friday<\/b>: \"no presentation\" dinner with a potential client → build the relationship, follow Wei's lead, be honest (do not pretend to be a wine expert).<\/div>", "fr": "<h3>La face<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">面子 miànzi<\/b>Statut social et reconnaissance : compétence, rôle, réussite. Ex. : l'expertise d'un collègue reconnue en public.<\/div>\n<div class=\"card\"><b class=\"t\">脸 liǎn<\/b>Statut moral dans le groupe : intégrité, conduite. Ex. : des mensonges répétés détruisent la confiance dans la personne.<\/div>\n<\/div>\n<ul>\n<li><b>丢面子 diū miànzi<\/b> (faire perdre la face) : blâme public ; contourner un coordinateur ; exiger un « oui » public de quelqu'un qui n'a pas l'autorité ; s'approprier le travail d'un collègue.<\/li>\n<li><b>留面子 liú miànzi<\/b> (sauver la face dans un désaccord) : 1. rappeler l'objectif commun ; 2. décrire la contrainte ; 3. inviter à proposer des options ; 4. confirmer la prochaine étape.<\/li>\n<li><b>给面子 gěi miànzi<\/b> (donner de la face) : crédit visible, reconnaître l'expertise et le rôle, inclure un collègue discret sans le mettre en difficulté. Les louanges exagérées font perdre en crédibilité.<\/li>\n<li><b>Réparer<\/b> après un faux pas : reconnaître son geste, reconnaître l'effet, rétablir les faits, convenir d'une meilleure façon de faire.<\/li>\n<li>La face ne doit pas empêcher de corriger une <b>erreur importante<\/b> : corriger le fait pendant la réunion (« le chiffre que j'ai est 6 millions, on peut vérifier ? »), comprendre en privé après.<\/li>\n<\/ul>\n<h3>Le guanxi<\/h3>\n<p><b>关系 guānxi<\/b> : liens personnels qui créent familiarité, attentes mutuelles et envie de s'entraider. Notions liées : <b>感情 gǎnqíng<\/b> (affection, familiarité), <b>人情 rénqíng<\/b> (faveurs et réciprocité), <b>信任 xìnrèn<\/b> (confiance en la personne), <b>信用 xìnyòng<\/b> (crédibilité : tenir parole).<\/p>\n<ul>\n<li>Une <b>introduction<\/b> ouvre une conversation et engage la réputation de celui qui présente : le remercier, le tenir au courant, prévenir si on ne peut pas suivre.<\/li>\n<li>Confiance <b>par le travail<\/b> (fiable, prévient tôt) + confiance <b>par l'interaction<\/b> (repas, attention). Réciprocité avec des limites : on peut refuser poliment.<\/li>\n<li>Le guanxi ouvre la porte, mais il faut quand même clarifier la vraie décision : besoin, budget, qui recommande, qui approuve, prochaine échéance.<\/li>\n<\/ul>\n<h3>Repères pratiques<\/h3>\n<ul>\n<li>Dîner d'affaires : titres et salutations, place de l'hôte et de l'invité d'honneur, toasts (Maotai 茅台), donner de la face.<\/li>\n<li>Cadeaux à éviter : <b>horloge<\/b> 钟 (送终 : assister à un enterrement), <b>chaussures<\/b> 鞋 (邪 : mauvais sort), <b>parapluie<\/b> 伞 (散 : se séparer), <b>poire<\/b> 梨 (离 : partir).<\/li>\n<li>Chiffres : <b>4<\/b> 四 sì ≈ 死 sǐ (mort) ; <b>8<\/b> 八 ≈ 发 fā (prospérité). Jours propices choisis avec l'almanach pour signer, ouvrir, déménager.<\/li>\n<li>Stage : savoir qui décide, comment remonter un problème, quels canaux utiliser ; message WeChat pro = contexte + intérêt précis + une demande raisonnable.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Exercice « Ta première semaine de stage » (Hangzhou) : mes pistes, pas le corrigé officiel<\/span>\n<b>Lundi<\/b> : Ms Chen dit « Très créatif. Assez ambitieux pour un premier événement. Avez-vous bien regardé qui fréquente ce centre commercial ? » → c'est un <b>non poli<\/b> (feedback indirect, downgraders), pas un encouragement : proposer une version plus petite ou une alternative.<br>\n<b>Mardi<\/b> : sa slide annonce 6 marques, seules 2 sont confirmées → ne pas la contredire devant le client (face) mais ne pas laisser l'erreur : <b>message privé<\/b> ou mise à jour écrite après la réunion.<br>\n<b>Mercredi<\/b> : déjeuner proposé avec Mr Liu, qui gère l'accès → la relation compte (guanxi), mais la décision demande aussi l'accord de son directeur : y aller et faire une demande précise ensuite.<br>\n<b>Vendredi<\/b> : dîner « sans présentation » avec un client potentiel → construire la relation, suivre Wei, être honnête (ne pas jouer à l'expert en vin).<\/div>"}, {"id": "method", "short": "Practice MCQ and case", "title": "Practice MCQ and case method", "sub": "", "en": "<div class=\"box key\"><span class=\"lbl\">Case analysis in 5 points<\/span>\n1. Facts vs interpretations · 2. Expectations and emotions of each person, turning point · 3. Multiple explanations: culture (name the Hofstede dimension or the Meyer scale), personality, situation · 4. What each person could have done (sensemaking, adjusting expectations) · 5. A general lesson without stereotypes.<\/div>\n<div class=\"q\"><div class=\"qt\">1. After a few weeks, a student can no longer stand the paperwork and only sees French people. Which stage?<\/div><ol><li>honeymoon<\/li><li>anxiety<\/li><li>acceptance<\/li><li>reverse shock<\/li><\/ol>\n<details><summary>Answer<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. \"It's a bit difficult, we will think about it\" is typical of a culture that is:<\/div><ol><li>low-context<\/li><li>high-context<\/li><li>egalitarian<\/li><\/ol>\n<details><summary>Answer<\/summary>b. (Meyer, Communicating scale)<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. The largest Hofstede gap between France and China concerns:<\/div><ol><li>power distance<\/li><li>uncertainty avoidance<\/li><li>indulgence<\/li><\/ol>\n<details><summary>Answer<\/summary>b. (≈ 86 vs ≈ 30)<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. \"They are dirty\" after seeing one person spit is an example of:<\/div><ol><li>sensemaking<\/li><li>ethnocentric overgeneralization<\/li><li>CQ Strategy<\/li><\/ol>\n<details><summary>Answer<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. Noticing that your own expectations shape your interpretation belongs to:<\/div><ol><li>CQ Drive<\/li><li>CQ Knowledge<\/li><li>CQ Strategy<\/li><li>CQ Action<\/li><\/ol>\n<details><summary>Answer<\/summary>c.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">6. Publicly contradicting your boss in China is a problem mainly because of:<\/div><ol><li>low indulgence<\/li><li>power distance and face<\/li><li>long-term orientation<\/li><\/ol>\n<details><summary>Answer<\/summary>b.<\/details><\/div>", "fr": "<div class=\"box key\"><span class=\"lbl\">Analyse de cas en 5 points<\/span>\n1. Faits vs interprétations · 2. Attentes et émotions de chaque personne, moment de bascule · 3. Explications multiples : culture (nommer la dimension de Hofstede ou l'échelle de Meyer), personnalité, situation · 4. Ce que chacun aurait pu faire (sensemaking, ajuster ses attentes) · 5. Leçon générale sans stéréotype.<\/div>\n<div class=\"q\"><div class=\"qt\">1. Après quelques semaines, un étudiant ne supporte plus les démarches administratives et ne voit que des Français. Il est dans la phase :<\/div><ol><li>lune de miel<\/li><li>anxiété<\/li><li>acceptation<\/li><li>choc inversé<\/li><\/ol>\n<details><summary>Réponse<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. « C'est un peu difficile, on va y réfléchir » est typique d'une culture :<\/div><ol><li>bas contexte<\/li><li>haut contexte<\/li><li>égalitaire<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. (Meyer, échelle Communicating)<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. Le plus grand écart de Hofstede entre la France et la Chine concerne :<\/div><ol><li>la distance hiérarchique<\/li><li>le contrôle de l'incertitude<\/li><li>l'indulgence<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. (≈ 86 vs ≈ 30)<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. « Ils sont sales » après avoir vu une personne cracher est un exemple de :<\/div><ol><li>sensemaking<\/li><li>surgénéralisation ethnocentrique<\/li><li>CQ Strategy<\/li><\/ol>\n<details><summary>Réponse<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. Remarquer que ses propres attentes influencent son interprétation relève du :<\/div><ol><li>CQ Drive<\/li><li>CQ Knowledge<\/li><li>CQ Strategy<\/li><li>CQ Action<\/li><\/ol>\n<details><summary>Réponse<\/summary>c.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">6. Contredire publiquement son supérieur en Chine pose surtout problème à cause de :<\/div><ol><li>l'indulgence faible<\/li><li>la distance hiérarchique et la face<\/li><li>l'orientation long terme<\/li><\/ol>\n<details><summary>Réponse<\/summary>b.<\/details><\/div>"}], "cases": [{"kind": "p", "sec": "Practice case", "sid": "", "title": "Practice: the silent meeting", "body": "<p>Léa, a French project manager in Suzhou, asks her team in a meeting: \"Any objections to the new deadline?\" Nobody speaks. Two weeks later the deadline is missed and a colleague tells her privately that everyone thought it was impossible.<\/p><ol><li>Separate facts and interpretations.<\/li><li>Explain with one Hofstede dimension and one Meyer scale.<\/li><li>What should Léa do next time?<\/li><\/ol>", "answer": "<p><b>1.<\/b> Fact: nobody spoke, the deadline was missed. Interpretation: \"silence means agreement\" (Léa's).<\/p><p><b>2.<\/b> <b>Power distance<\/b> (China 80): people rarely challenge the boss in public. Meyer <b>Disagreeing<\/b> (avoids confrontation) and <b>Communicating<\/b> (high context). Also <b>face<\/b>: objecting publicly risks making her lose face.<\/p><p><b>3.<\/b> Ask in private or in writing, ask open questions (\"what could delay us?\"), use a trusted intermediary, recap decisions in writing. Avoid generalizing to all Chinese employees.<\/p>", "fr": "<p>Fait : silence et retard ; interprétation : « silence = accord ». Explications : distance hiérarchique, évitement de la confrontation, haut contexte, face. Solution : demander en privé ou par écrit, questions ouvertes, récapituler par écrit.<\/p>"}, {"kind": "ex", "title": "Course example: spitting in the street", "sec": "Culture shock", "sid": "c1", "body": "Observed behaviour → automatic reaction (\"disgusting\") → <b>judgement about a group<\/b> (\"they are dirty\") = overgeneralization. Hypotheses to check instead of concluding: traditional medicine (expelling impurities), air pollution, a different idea of hygiene, generational differences.<br>\nThe mirror case: a Chinese visitor in Paris finds the metro \"old and dirty, is this a developed country?\". Ethnocentrism works both ways.", "fr": "Comportement observé → réaction automatique (« dégoûtant ») → <b>jugement sur un groupe<\/b> (« ils sont sales ») = surgénéralisation. Pistes à vérifier au lieu de conclure : médecine traditionnelle (expulser les impuretés), pollution de l'air, conception différente de l'hygiène, différences de génération.<br>\nSymétrique : un Chinois à Paris juge le métro « vieux, sale, est-ce un pays développé ? ». L'ethnocentrisme fonctionne dans les deux sens."}, {"kind": "ex", "title": "Case \"A Date Gone Wrong\": the method for the case analysis", "sec": "Sensemaking and CQ", "sid": "c2", "body": "Alex (French) and Emilie (Chinese) meet through a friend. She asks his view on marriage; he has not thought about it; she wants to get married within the year and gets upset; he lies to leave.<br>\n1. <b>Facts vs interpretations<\/b>: \"she asked a question about marriage\" is a fact; \"she is immature / ridiculous\" is an interpretation (whose?).<br>\n2. <b>Expectations and emotions<\/b> on both sides: Alex expected a no-stakes meeting; Emilie a meeting with marriage in view (the frame of an arranged date). Turning point: the marriage question and Alex's smile.<br>\n3. <b>Several explanations<\/b>: social norms (pressure to marry, arranged dates), each person's values and age, the situation (misunderstanding about the purpose of the date). Do not generalize to all French or all Chinese people.<br>\n4. <b>Solution<\/b>: clarify expectations from the start; react with empathy rather than mockery.", "fr": "Alex (français) et Emilie (chinoise) se rencontrent via un ami. Elle lui demande son avis sur le mariage ; il n'y pense pas ; elle cherche à se marier dans l'année et se fâche ; il ment pour partir.<br>\n1. <b>Faits vs interprétations<\/b> : « elle a posé une question sur le mariage » est un fait ; « elle est immature / ridicule » est une interprétation (de qui ?).<br>\n2. <b>Attentes et émotions<\/b> des deux : Alex attendait une rencontre sans enjeu ; Emilie, une rencontre en vue du mariage (cadre d'un rendez-vous arrangé). Tournant : la question sur le mariage et le sourire d'Alex.<br>\n3. <b>Plusieurs explications<\/b> : normes sociales (pression au mariage, rendez-vous arrangés), valeurs et âge de chacun, situation (malentendu sur l'objectif du rendez-vous). Ne pas généraliser à tous les Français ou tous les Chinois.<br>\n4. <b>Solution<\/b> : clarifier les attentes dès le départ ; réagir avec empathie plutôt que moquerie."}, {"kind": "ex", "title": "Model analysis", "sec": "Hofstede", "sid": "c3", "body": "Alex (French) is invited by Lin: \"tonight, you are my guest\". He insists on paying his share, then on paying for Lin and himself. \"Da Ge\" (the big brother of the group) chooses the table, orders for everyone and ends up paying after a \"fight\" over the bill.<br>\n<b>Micro-shocks<\/b>: refusing to be the guest (collectivism: rejecting the host's role); Da Ge decides for everyone and people follow (power distance, status and age); Alex insists privately on \"making up for it\" by inviting Lin alone (individualist, egalitarian logic, which prolongs the awkwardness).<br>\n<b>Repair<\/b>: thank them for the hospitality, stop talking about money, offer to return the invitation <b>later, to the group<\/b> (轮流请客), follow the elder.", "fr": "Alex (français) est invité par Lin : « ce soir, tu es mon invité ». Il insiste pour payer sa part, puis pour Lin et lui. « Da Ge » (le grand frère du groupe) choisit la table, commande pour tout le monde et finit par payer après une « dispute » pour l'addition.<br>\n<b>Micro-chocs<\/b> : refuser d'être l'invité (collectivisme : rejeter le rôle d'hôte) ; Da Ge décide pour tous et on le suit (distance hiérarchique, statut et âge) ; Alex insiste en privé pour « réparer » en invitant Lin seule (logique individualiste et égalitaire, qui prolonge la gêne).<br>\n<b>Réparer<\/b> : remercier pour l'hospitalité, ne plus parler d'argent, proposer de rendre l'invitation <b>plus tard, au groupe<\/b> (轮流请客), suivre l'aîné."}, {"kind": "ex", "title": "The two opening cases of the lesson", "sec": "The Culture Map", "sid": "c4", "body": "<b>The silent warning signal<\/b>: \"Any risks?\" \"Nothing major.\" Later a colleague says in private that the supplier is unreliable. → High context and conflict avoidance: ask in private or in writing, ask \"what could delay delivery?\" rather than \"is there a problem?\".<br>\n<b>The email war<\/b>: Sophie writes \"this draft has big problems, fix it urgently\". The team answers \"Received\" and changes almost nothing. → Direct, public criticism (loss of face) + a vague instruction. Better: private, softened feedback that says precisely what to change.", "fr": "<b>Le signal d'alerte silencieux<\/b> : « Des risques ? » « Rien de majeur. » Plus tard, un collègue dit en privé que le fournisseur n'est pas fiable. → Haut contexte et évitement du conflit : poser la question en privé ou par écrit, demander « qu'est-ce qui pourrait retarder la livraison ? » plutôt que « y a-t-il un problème ? ».<br>\n<b>La guerre des mails<\/b> : Sophie écrit « ce brouillon a de gros problèmes, à corriger d'urgence ». L'équipe répond « Reçu » et ne change presque rien. → Critique directe et publique (perte de face) + consigne floue. Mieux : feedback privé, adouci, et précis sur ce qu'il faut changer."}, {"kind": "ex", "title": "Exercise \"Your First Week as an Intern\" (Hangzhou): my suggestions, not the official answer key", "sec": "Face and guanxi", "sid": "c5", "body": "<b>Monday<\/b>: Ms Chen says \"Very creative. Quite ambitious for a first event. Have you looked carefully at who visits this mall?\" → this is a <b>polite no<\/b> (indirect feedback, downgraders), not encouragement: propose a smaller version or an alternative.<br>\n<b>Tuesday<\/b>: her slide announces 6 brands, only 2 are confirmed → do not contradict her in front of the client (face) but do not let the error stand: <b>private message<\/b> or written update after the meeting.<br>\n<b>Wednesday<\/b>: lunch offered with Mr Liu, who controls access → the relationship matters (guanxi), but the decision also needs his director's approval: go, then make a precise request.<br>\n<b>Friday<\/b>: \"no presentation\" dinner with a potential client → build the relationship, follow Wei's lead, be honest (do not pretend to be a wine expert).", "fr": "<b>Lundi<\/b> : Ms Chen dit « Très créatif. Assez ambitieux pour un premier événement. Avez-vous bien regardé qui fréquente ce centre commercial ? » → c'est un <b>non poli<\/b> (feedback indirect, downgraders), pas un encouragement : proposer une version plus petite ou une alternative.<br>\n<b>Mardi<\/b> : sa slide annonce 6 marques, seules 2 sont confirmées → ne pas la contredire devant le client (face) mais ne pas laisser l'erreur : <b>message privé<\/b> ou mise à jour écrite après la réunion.<br>\n<b>Mercredi<\/b> : déjeuner proposé avec Mr Liu, qui gère l'accès → la relation compte (guanxi), mais la décision demande aussi l'accord de son directeur : y aller et faire une demande précise ensuite.<br>\n<b>Vendredi<\/b> : dîner « sans présentation » avec un client potentiel → construire la relation, suivre Wei, être honnête (ne pas jouer à l'expert en vin)."}], "quiz": [{"q": "After a few weeks, a student can no longer stand the paperwork and only sees French people. Which stage?", "o": ["honeymoon", "anxiety", "acceptance", "reverse shock"], "a": [1], "e": "", "fr": "", "src": "Practice MCQ and case"}, {"q": "\"It's a bit difficult, we will think about it\" is typical of a culture that is:", "o": ["low-context", "high-context", "egalitarian"], "a": [1], "e": "(Meyer, Communicating scale)", "fr": "(Meyer, échelle Communicating)", "src": "Practice MCQ and case"}, {"q": "The largest Hofstede gap between France and China concerns:", "o": ["power distance", "uncertainty avoidance", "indulgence"], "a": [1], "e": "(≈ 86 vs ≈ 30)", "fr": "(≈ 86 vs ≈ 30)", "src": "Practice MCQ and case"}, {"q": "\"They are dirty\" after seeing one person spit is an example of:", "o": ["sensemaking", "ethnocentric overgeneralization", "CQ Strategy"], "a": [1], "e": "", "fr": "", "src": "Practice MCQ and case"}, {"q": "Noticing that your own expectations shape your interpretation belongs to:", "o": ["CQ Drive", "CQ Knowledge", "CQ Strategy", "CQ Action"], "a": [2], "e": "", "fr": "", "src": "Practice MCQ and case"}, {"q": "Publicly contradicting your boss in China is a problem mainly because of:", "o": ["low indulgence", "power distance and face", "long-term orientation"], "a": [1], "e": "", "fr": "", "src": "Practice MCQ and case"}, {"q": "Which stage of culture shock comes first?", "o": ["Anxiety", "Honeymoon", "Adjustment", "Acceptance"], "a": [1], "e": "Honeymoon → anxiety → adjustment → acceptance → reverse shock.", "fr": "Lune de miel → anxiété → ajustement → acceptation → choc inversé.", "src": "Culture shock"}, {"q": "Coming back home and finding it strange is called:", "o": ["Ethnocentrism", "Reverse culture shock", "Honeymoon", "Sensemaking"], "a": [1], "e": "The 5th stage.", "fr": "La 5e étape.", "src": "Culture shock"}, {"q": "Implicitly believing that your own way is the right one is:", "o": ["Cultural intelligence", "Ethnocentrism", "Collectivism", "High context"], "a": [1], "e": "It leads to incidents and to retreating into your own culture.", "fr": "Mène aux incidents et au repli sur sa culture.", "src": "Culture shock"}, {"q": "First step of sensemaking:", "o": ["Implement a solution", "Recognize a problem or something you do not understand", "Fill the gaps", "Analyze"], "a": [1], "e": "Recognize → identify gaps → fill gaps → analyze → implement.", "fr": "Reconnaître → identifier les manques → combler → analyser → mettre en œuvre.", "src": "Sensemaking and CQ"}, {"q": "Curiosity and perseverance after a failure belong to:", "o": ["CQ Drive", "CQ Knowledge", "CQ Strategy", "CQ Action"], "a": [0], "e": "Drive = motivation.", "fr": "Drive = la motivation.", "src": "Sensemaking and CQ"}, {"q": "Hofstede individualism scores (course slides): China / France", "o": ["80 / 68", "43 / 74", "30 / 86", "66 / 43"], "a": [1], "e": "IDV China 43, France 74. 80/68 is power distance.", "fr": "IDV Chine 43, France 74. 80/68 = distance hiérarchique.", "src": "Hofstede"}, {"q": "France combines high power distance with:", "o": ["Low individualism", "High individualism", "Low uncertainty avoidance", "High indulgence"], "a": [1], "e": "A rare combination (Belgium, partly Spain and northern Italy).", "fr": "Combinaison rare (Belgique, en partie Espagne, Italie du Nord).", "src": "Hofstede"}, {"q": "\"Tonight, you are my guest\" in China refers to:", "o": ["AA制", "请客 qǐngkè", "买单 mǎidān only", "关系"], "a": [1], "e": "Treating someone: paying is hospitality and a relationship gesture.", "fr": "Inviter : payer = hospitalité et geste de relation.", "src": "Hofstede"}, {"q": "France is high-context but gives negative feedback:", "o": ["Indirectly", "Directly", "Never", "Only in writing"], "a": [1], "e": "Context and directness are two separate scales.", "fr": "Contexte et franchise sont deux échelles différentes.", "src": "Culture Map"}, {"q": "\"We are not quite there yet\" uses:", "o": ["An upgrader", "A downgrader", "Low context", "Confrontation"], "a": [1], "e": "Downgraders soften criticism; it may mean \"very far from it\".", "fr": "Downgrader : adoucit la critique, peut vouloir dire « très loin du compte ».", "src": "Culture Map"}, {"q": "Publicly blaming a colleague in a meeting makes them:", "o": ["给面子 (gain face)", "丢面子 (lose face)", "留面子 (save face)", "Build guanxi"], "a": [1], "e": "Diū miànzi: public blame is a classic case.", "fr": "Diū miànzi : le blâme public est l'exemple type.", "src": "Face and guanxi"}, {"q": "Which gift should you avoid in China?", "o": ["Tea", "A clock", "Fruit basket (oranges)", "Books"], "a": [1], "e": "钟 sounds like 送终 (attending a funeral).", "fr": "钟 rappelle 送终 (assister à un enterrement).", "src": "Face and guanxi"}, {"q": "信用 xìnyòng means:", "o": ["Affection", "Favours and reciprocity", "Credibility: keeping your word", "Face"], "a": [2], "e": "感情 affection, 人情 favours, 信任 trust in the person, 信用 credibility.", "fr": "感情 affection, 人情 faveurs, 信任 confiance, 信用 crédibilité.", "src": "Face and guanxi"}]}, {"id": "strategy", "name": "Strategy", "short": "Strategy", "start": "2026-12-08T15:30:00+08:00", "when": "Mar. 8 déc. · 15:30–17:00", "fmt": "Cas inédit + QCM + 1 question ouverte · 1h30", "weight": "50 %", "rules": "Calculatrice TI BA II Plus ou HP 12c, brouillon autorisé", "hue": 210, "lead": "The 8 sessions (4 theory, 4 cases), the frameworks you must be able to apply, the calculations that come up (ROS, AT, ROA, CR4, HHI, BCG) and the method for the open question.", "prof": "M1 · Martin LOCKSTROM", "sections": [{"id": "exam", "short": "The final exam", "title": "The final exam: what is tested", "sub": "\"How to Prepare for the Strategy Final Exam\" + answer keys of the practice exams", "en": "<div class=\"box key\"><span class=\"lbl\">Your calendar (exam notice)<\/span><b>Tue 8 December, 15:30–17:00<\/b> (Suzhou time). MCQ + open questions on TestWe, 1h30. No documents, <b>scratch paper allowed<\/b>. <b>Non-programmable calculator: bring your own<\/b> (the TestWe one will be disabled). Only the <b>TI BA II Plus<\/b> and the <b>HP 12c<\/b> are accepted. Person in charge: Saverio Favaron.<br>Room 271, row 5, seat 6. Arrive 15 minutes early with your student card and a charged battery.<\/div>\n<ol>\n<li><b>A short case study<\/b> on a real company you have not seen in class, with tables and charts.<\/li>\n<li><b>An MCQ<\/b> (one correct answer per question).<\/li>\n<li><b>An open question<\/b> in 2 or 3 parts, with a word limit.<\/li>\n<\/ol>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Use the data<\/b>Calculate and compare ROS, asset turnover (AT), ROA, relative market share.<\/div>\n<div class=\"card\"><b class=\"t\">Recognize the right concept<\/b>Which Porter force changes, which type of synergy, which test a diversification passes or fails.<\/div>\n<div class=\"card\"><b class=\"t\">Argue briefly<\/b>Claim → figures from the case → explanation with the course concept.<\/div>\n<\/div>\n<div class=\"box exam\"><span class=\"lbl\">What loses points (official answer keys)<\/span>\n<ul><li>Summarizing or rephrasing the case instead of analyzing it (half the points at best).<\/li>\n<li>Describing the 5 forces in general without assessing their intensity <b>in this industry<\/b>.<\/li>\n<li>Confusing <b>competitors<\/b> and <b>substitutes<\/b>.<\/li>\n<li>Treating value creation and value capture as the same thing.<\/li>\n<li>Recommendations that do not follow from the analysis.<\/li><\/ul><\/div>\n<p>Practice: <code>Final/Preparation examen<\/code>. Practice exam 1 (Netflix, sessions 1–4) and Practice exam 2 (Tyson Foods, sessions 5–8, <b>closest to the real format<\/b>), each as a PDF with answer key and as a browser version (HTML file).<\/p>", "fr": "<div class=\"box key\"><span class=\"lbl\">Ton calendrier (convocation)<\/span><b>Mar. 8 décembre, 15 h 30–17 h<\/b> (heure de Suzhou). QCM + questions ouvertes sur TestWe, 1 h 30. Pas de documents, <b>brouillon autorisé<\/b>. <b>Calculatrice non programmable : apporte la tienne<\/b> (celle de TestWe sera désactivée). Seules la <b>TI BA II Plus<\/b> et la <b>HP 12c<\/b> sont acceptées. Responsable : Saverio Favaron.<br>Salle 271, rang 5, place 6. Arriver 15 min avant avec ta carte étudiante, batterie chargée.<\/div>\n<ol>\n<li><b>Une courte étude de cas<\/b> sur une entreprise réelle que tu n'as pas vue en cours, avec des tableaux et graphiques.<\/li>\n<li><b>Un QCM<\/b> (une seule bonne réponse par question).<\/li>\n<li><b>Une question ouverte<\/b> en 2 ou 3 parties, avec une limite de mots.<\/li>\n<\/ol>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Utiliser les données<\/b>Calculer et comparer ROS, rotation des actifs (AT), ROA, part de marché relative.<\/div>\n<div class=\"card\"><b class=\"t\">Reconnaître le bon concept<\/b>Quelle force de Porter change, quel type de synergie, quel test une diversification réussit ou rate.<\/div>\n<div class=\"card\"><b class=\"t\">Argumenter court<\/b>Affirmation → chiffres du cas → explication avec le concept du cours.<\/div>\n<\/div>\n<div class=\"box exam\"><span class=\"lbl\">Ce qui fait perdre des points (corrigés officiels)<\/span>\n<ul><li>Résumer ou reformuler le cas au lieu de l'analyser (au mieux la moitié des points).<\/li>\n<li>Décrire les 5 forces en général sans évaluer leur intensité <b>dans cette industrie<\/b>.<\/li>\n<li>Confondre <b>concurrents<\/b> et <b>substituts<\/b>.<\/li>\n<li>Traiter création et captation de valeur comme la même chose.<\/li>\n<li>Recommandations qui ne découlent pas de l'analyse.<\/li><\/ul><\/div>\n<p>Entraînement : <code>Final/Preparation examen<\/code>. Practice exam 1 (Netflix, cours 1–4) et Practice exam 2 (Tyson Foods, cours 5–8, <b>le plus proche du vrai format<\/b>), chacun en PDF avec corrigé et en version navigateur (fichier HTML).<\/p>"}, {"id": "c1", "short": "What is strategy", "title": "1. What is strategy?", "sub": "Session 1 · Grant ch. 1", "en": "<p>Strategy = \"what to achieve and how to achieve it\". It is a coherent set of decisions to <b>create and capture value<\/b> over time, with a logic explaining why the advantage resists competition.<\/p>\n<h3>Value creation vs value capture<\/h3>\n<div class=\"f\">B = customer's willingness to pay · P = price · C = cost\nValue created            = B − C\nConsumer surplus         = B − P\nValue captured (rent)    = P − C<\/div>\n<div class=\"box key\"><span class=\"lbl\">Competitive advantage<\/span>Creating value for the customer that is <b>higher than its cost<\/b> and <b>higher than competitors'<\/b> (B − C larger than rivals). Industry profit depends on 3 things: the value customers perceive, the intensity of competition, bargaining power along the value chain.<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Example<\/span>A subscription is worth B = €15 to the customer, costs C = €6 to produce, sells at P = €10. Value created €9 = consumer surplus €5 + firm's rent €4. If studios raise the cost of content to C = €9, value captured falls to €1 while the customer is just as happy: that is Netflix's problem.<\/div>\n<ul>\n<li><b>Ricardian rents<\/b>: come from superior (durable) resources. <b>Monopoly rents<\/b>: come from market power (easier to lose).<\/li>\n<li>A good idea does not guarantee profit: Prozac, the Ford Model T, the Macintosh, TV and the Internet created a lot of value, not always captured by the inventor.<\/li>\n<\/ul>\n<h3>Levels of strategy<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Level<\/th><th>Question<\/th><\/tr>\n<tr><td><b>Corporate<\/b><\/td><td>Which markets / industries should we be in?<\/td><\/tr>\n<tr><td><b>Business<\/b><\/td><td>How do we win in each market?<\/td><\/tr>\n<tr><td><b>Functional<\/b><\/td><td>How does each function (marketing, operations, finance…) execute?<\/td><\/tr>\n<\/table><\/div>\n<p><b>Vision<\/b> = the desired future (Tesla: \"accelerate the world's transition to sustainable energy / electric vehicles\"). <b>Mission<\/b> = what the organization does to create value (Southwest: service quality, warmth). Strategy (long term, broad) vs tactics (specific actions, short term) vs operations (day to day).<\/p>\n<p><b>SWOT<\/b>: strengths/weaknesses = <b>internal<\/b> (controllable); opportunities/threats = <b>external<\/b>.<\/p>\n<h3>Positioning: ROS × AT = ROA<\/h3>\n<div class=\"f\">ROS (return on sales)  = Net income / Sales\nAT  (asset turnover)   = Sales / Total assets\nROA (return on assets) = Net income / Total assets = ROS × AT<\/div>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Differentiation<\/b>High ROS, low AT (Hermès, Apple, Perdue).<\/div>\n<div class=\"card\"><b class=\"t\">Cost leadership<\/b>Low ROS, high AT (Walmart, Pilgrim's Pride).<\/div>\n<div class=\"card\"><b class=\"t\">Stuck in the middle<\/b>Average ROS and AT → ROA below the leaders' iso-ROA curve.<\/div>\n<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Example (Tyson-style)<\/span>\n<div class=\"tw\"><table>\n<tr><th>Firm<\/th><th class=\"num\">Sales<\/th><th class=\"num\">Income<\/th><th class=\"num\">Assets<\/th><th class=\"num\">ROS<\/th><th class=\"num\">AT<\/th><th class=\"num\">ROA<\/th><\/tr>\n<tr><td>X (cost)<\/td><td class=\"num\">20<\/td><td class=\"num\">1.0<\/td><td class=\"num\">10<\/td><td class=\"num\">5%<\/td><td class=\"num\">2.0<\/td><td class=\"num\">10%<\/td><\/tr>\n<tr><td>Y (differentiation)<\/td><td class=\"num\">8<\/td><td class=\"num\">1.2<\/td><td class=\"num\">10<\/td><td class=\"num\">15%<\/td><td class=\"num\">0.8<\/td><td class=\"num\">12%<\/td><\/tr>\n<tr><td>Z (middle)<\/td><td class=\"num\">10<\/td><td class=\"num\">0.6<\/td><td class=\"num\">10<\/td><td class=\"num\">6%<\/td><td class=\"num\">1.0<\/td><td class=\"num\">6%<\/td><\/tr>\n<\/table><\/div>\nFor Z to reach a 12% ROA: either ROS = 12% / 1.0 = <b>12%<\/b> with constant AT, or AT = 12% / 6% = <b>2.0<\/b> with constant ROS (assets fall from 10 to 5 at constant sales). Pick the route that builds on Z's <b>resources<\/b> and justify it.<\/div>", "fr": "<p>Stratégie = « quoi atteindre et comment l'atteindre ». C'est un ensemble cohérent de décisions pour <b>créer et capter de la valeur<\/b> dans la durée, avec une logique qui explique pourquoi l'avantage résiste à la concurrence.<\/p>\n<h3>Création vs captation de valeur<\/h3>\n<div class=\"f\">B = disposition à payer du client (willingness to pay) · P = prix · C = coût\nValeur créée          = B − C\nSurplus du client     = B − P\nValeur captée (rente) = P − C<\/div>\n<div class=\"box key\"><span class=\"lbl\">Avantage concurrentiel<\/span>Créer pour le client une valeur <b>supérieure à son coût<\/b> et <b>supérieure à celle des concurrents<\/b> (B − C plus grand que les rivaux). Le profit d'une industrie dépend de 3 choses : la valeur perçue par les clients, l'intensité de la concurrence, le pouvoir de négociation dans la chaîne de valeur.<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple<\/span>Un abonnement vaut B = 15 € pour le client, coûte C = 6 € à produire, est vendu P = 10 €. Valeur créée 9 € = surplus client 5 € + rente de l'entreprise 4 €. Si les studios augmentent le coût du contenu à C = 9 €, la valeur captée tombe à 1 € alors que le client est toujours aussi satisfait : c'est le problème de Netflix.<\/div>\n<ul>\n<li><b>Rentes ricardiennes<\/b> : viennent de ressources supérieures (durables). <b>Rentes de monopole<\/b> : viennent du pouvoir de marché (plus faciles à perdre).<\/li>\n<li>Une bonne idée ne garantit pas le profit : Prozac, Ford T, Macintosh, la TV, Internet ont créé beaucoup de valeur, pas toujours captée par l'inventeur.<\/li>\n<\/ul>\n<h3>Niveaux de stratégie<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Niveau<\/th><th>Question<\/th><\/tr>\n<tr><td><b>Corporate<\/b><\/td><td>Dans quels marchés/industries être présent ?<\/td><\/tr>\n<tr><td><b>Business<\/b><\/td><td>Comment gagner dans chaque marché ?<\/td><\/tr>\n<tr><td><b>Fonctionnel<\/b><\/td><td>Comment chaque fonction (marketing, opérations, finance…) exécute ?<\/td><\/tr>\n<\/table><\/div>\n<p><b>Vision<\/b> = le futur visé (Tesla : « accélérer la transition vers les véhicules électriques »). <b>Mission<\/b> = ce que l'organisation fait pour créer de la valeur (Southwest : qualité de service, chaleur). Stratégie (long terme, large) ≠ tactique (actions précises, court terme) ≠ opérations (quotidien).<\/p>\n<p><b>SWOT<\/b> : forces/faiblesses = <b>internes<\/b> (contrôlables) ; opportunités/menaces = <b>externes<\/b>.<\/p>\n<h3>Positionnement : la relation ROS × AT = ROA<\/h3>\n<div class=\"f\">ROS (return on sales)  = Résultat / Ventes\nAT  (asset turnover)   = Ventes / Total actif\nROA (return on assets) = Résultat / Total actif = ROS × AT<\/div>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Différenciation<\/b>ROS élevé, AT faible (Hermès, Apple, Perdue).<\/div>\n<div class=\"card\"><b class=\"t\">Domination par les coûts<\/b>ROS faible, AT élevé (Walmart, Pilgrim's Pride).<\/div>\n<div class=\"card\"><b class=\"t\">Coincé au milieu<\/b>ROS et AT moyens → ROA sous la courbe iso-ROA des leaders.<\/div>\n<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple (type Tyson)<\/span>\n<div class=\"tw\"><table>\n<tr><th>Firme<\/th><th class=\"num\">Ventes<\/th><th class=\"num\">Résultat<\/th><th class=\"num\">Actifs<\/th><th class=\"num\">ROS<\/th><th class=\"num\">AT<\/th><th class=\"num\">ROA<\/th><\/tr>\n<tr><td>X (coûts)<\/td><td class=\"num\">20<\/td><td class=\"num\">1,0<\/td><td class=\"num\">10<\/td><td class=\"num\">5 %<\/td><td class=\"num\">2,0<\/td><td class=\"num\">10 %<\/td><\/tr>\n<tr><td>Y (différenciation)<\/td><td class=\"num\">8<\/td><td class=\"num\">1,2<\/td><td class=\"num\">10<\/td><td class=\"num\">15 %<\/td><td class=\"num\">0,8<\/td><td class=\"num\">12 %<\/td><\/tr>\n<tr><td>Z (milieu)<\/td><td class=\"num\">10<\/td><td class=\"num\">0,6<\/td><td class=\"num\">10<\/td><td class=\"num\">6 %<\/td><td class=\"num\">1,0<\/td><td class=\"num\">6 %<\/td><\/tr>\n<\/table><\/div>\nPour que Z atteigne 12 % de ROA : soit ROS = 12 % / 1,0 = <b>12 %<\/b> à AT constant, soit AT = 12 % / 6 % = <b>2,0<\/b> à ROS constant (les actifs passent de 10 à 5 à ventes constantes). Choisis la voie qui s'appuie sur les <b>ressources<\/b> de Z et justifie-la.<\/div>"}, {"id": "c2", "short": "Uber case", "title": "2. Uber case: sources and sustainability of advantage", "sub": "Session 2 · Uber case", "en": "<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">What Uber hoped for<\/b>Massive fundraising → global monopoly; <b>asset-light<\/b> model; <b>network effects<\/b> and economies of scale; AI algorithms; transition to robotaxis. Vision: \"the Amazon of transportation\" (MaaS, an $8.5 trillion market).<\/div>\n<div class=\"card\"><b class=\"t\">The reality<\/b>Owns neither vehicles nor drivers; <b>low switching costs<\/b> (customers compare apps); weak network effects (no lock-in); strong competition (Lyft, DiDi, Grab); subsidized public transport; regulation (congestion).<\/div>\n<\/div>\n<ul>\n<li>Losses from 2013 to 2022, <b>first positive operating income in August 2023<\/b>.<\/li>\n<li>Comparison with Amazon: Amazon also earned little for 20 years, but while building physical <b>barriers to entry<\/b> (logistics, cloud) and Prime loyalty; Uber is easy to imitate.<\/li>\n<li>Robotaxis: partnership dilemma (Waymo, Nuro) vs control of the platform; threat of an integrated competitor (Tesla); Lyft–Baidu alliance in Europe.<\/li>\n<\/ul>\n<div class=\"box key\"><span class=\"lbl\">Lesson<\/span>Creating a lot of value for the customer (high B − P) is not enough: without barriers to imitation or lock-in, value captured (P − C) stays low.<\/div>", "fr": "<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Ce qu'Uber espérait<\/b>Levées de fonds massives → monopole mondial ; modèle <b>asset-light<\/b> ; <b>effets de réseau<\/b> et économies d'échelle ; algorithmes IA ; transition vers les robotaxis. Vision : « l'Amazon du transport » (MaaS, 8 500 Md$ de marché).<\/div>\n<div class=\"card\"><b class=\"t\">La réalité<\/b>Ne possède ni véhicules ni chauffeurs ; <b>coûts de changement faibles<\/b> (les clients comparent les applis) ; effets de réseau faibles (pas de lock-in) ; concurrence forte (Lyft, DiDi, Grab) ; transports publics subventionnés ; régulation (congestion).<\/div>\n<\/div>\n<ul>\n<li>Pertes de 2013 à 2022, <b>premier résultat d'exploitation positif en août 2023<\/b>.<\/li>\n<li>Comparaison Amazon : Amazon aussi a peu gagné pendant 20 ans, mais en construisant des <b>barrières à l'entrée<\/b> physiques (logistique, cloud) et la fidélité Prime ; Uber est facile à imiter.<\/li>\n<li>Robotaxis : dilemme partenariat (Waymo, Nuro) vs contrôle de la plateforme ; menace d'un concurrent intégré (Tesla) ; alliance Lyft–Baidu en Europe.<\/li>\n<\/ul>\n<div class=\"box key\"><span class=\"lbl\">Leçon<\/span>Créer beaucoup de valeur pour le client (B − P élevé) ne suffit pas : sans barrière à l'imitation ni lock-in, la valeur captée (P − C) reste faible.<\/div>"}, {"id": "c3", "short": "Industry analysis", "title": "3. Industry analysis and evolution", "sub": "Session 3 · Grant ch. 3, 4, 8", "en": "<p>Three layers: <b>macro<\/b> (PESTEL), <b>industry<\/b> (5 forces), <b>competitors<\/b> (strategic groups). Performance depends on <b>industry structure<\/b> and on the firm's <b>relative position<\/b> within the industry.<\/p>\n<h3>PESTEL<\/h3>\n<p>Political, Economic, Social, Technological, Environmental, Legal. Car industry example: tariffs and subsidies; high interest rates; Gen Z less interested in ownership; software-defined vehicles; Euro 7 standards; liability for autonomous driving.<\/p>\n<h3>Porter's 5 forces<\/h3>\n<p>Rule: <b>the stronger a force, the less attractive the industry<\/b>.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Force<\/th><th>It is strong when…<\/th><\/tr>\n<tr><td>Threat of <b>new entrants<\/b><\/td><td>Low barriers: few economies of scale, little capital needed, low differentiation, low switching costs, easy access to distribution, no regulation, little expected retaliation.<\/td><\/tr>\n<tr><td><b>Supplier<\/b> power<\/td><td>Suppliers more concentrated than the industry, no substitute, critical or expensive input, switching costs, credible forward integration, the industry is a small customer for them.<\/td><\/tr>\n<tr><td><b>Buyer<\/b> power<\/td><td>Concentrated or high-volume purchases, standard product, low switching costs, credible backward integration, full information, low-profit buyers.<\/td><\/tr>\n<tr><td>Threat of <b>substitutes<\/b><\/td><td>Good price/performance of the substitute, low switching costs, customers willing to switch.<\/td><\/tr>\n<tr><td><b>Rivalry<\/b><\/td><td>Many competitors of equal size, slow growth, high fixed or storage costs, little differentiation, capacity added in large increments, <b>overcapacity<\/b>, high exit barriers.<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box trap\"><span class=\"lbl\">Do not confuse<\/span>\n<b>Competitor<\/b> = sells the same product (Disney+ for Netflix). <b>Substitute<\/b> = a different product meeting the same need (YouTube, video games for Netflix). <b>Complement<\/b> = increases the product's value when used together (broadband and smart TVs for streaming; fuel for cars). Complements <b>increase<\/b> industry value, substitutes <b>reduce<\/b> it.<\/div>\n<h3>Measuring concentration<\/h3>\n<div class=\"f\">CR4 = sum of the market shares of the top 4 firms\nHHI = Σ (market share in %)²   (from ~0 to 10,000)<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Example<\/span>Market shares 40%, 30%, 20%, 10% → CR4 = 100%; HHI = 1,600 + 900 + 400 + 100 = <b>3,000<\/b> (highly concentrated). A rising CR4 = consolidation, typical of the <b>shakeout<\/b> phase; other things equal, fewer price wars between leaders.<\/div>\n<h3>Strategic groups and key success factors<\/h3>\n<ul>\n<li><b>Strategic group<\/b>: firms with similar strategies; rivalry is stronger within a group than between groups (cars: global mass-market, national specialists, sports cars…).<\/li>\n<li><b>Key success factors<\/b> = what customers want + how to survive competition.<\/li>\n<li>Define the industry boundaries with the <b>substitutability<\/b> criterion (demand side and supply side).<\/li>\n<\/ul>\n<h3>Industry life cycle<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Stage<\/th><th>What happens<\/th><\/tr>\n<tr><td>Introduction<\/td><td>Few customers, high costs, losses, <b>product<\/b> innovation (fluid phase, multiple designs).<\/td><\/tr>\n<tr><td>Growth<\/td><td>Rapid penetration, first profits; a <b>dominant design<\/b> emerges.<\/td><\/tr>\n<tr><td>Shakeout<\/td><td>The dominant design sets the rules, competition moves to <b>costs<\/b>; many firms exit (US cars: ~100 firms, then a handful).<\/td><\/tr>\n<tr><td>Maturity<\/td><td>Replacement demand, <b>process<\/b> innovation, price competition.<\/td><\/tr>\n<tr><td>Decline<\/td><td>Technologically superior substitutes; falling sales and ROA. Firms sometimes stay because of exit barriers.<\/td><\/tr>\n<\/table><\/div>\n<p>Limits of the 5 forces: static model (structure → conduct → performance); ignores alliances, co-opetition and \"creative destruction\" (Schumpeter, hypercompetition) where strategy <b>changes<\/b> the structure.<\/p>", "fr": "<p>Trois couches : <b>macro<\/b> (PESTEL), <b>industrie<\/b> (5 forces), <b>concurrents<\/b> (groupes stratégiques). La performance dépend de la <b>structure de l'industrie<\/b> et de la <b>position relative<\/b> dans l'industrie.<\/p>\n<h3>PESTEL<\/h3>\n<p>Politique, Économique, Social, Technologique, Environnemental, Légal. Ex. automobile : droits de douane et subventions ; taux d'intérêt élevés ; désintérêt de la Gen Z pour la possession ; véhicules définis par logiciel ; normes Euro 7 ; responsabilité de la conduite autonome.<\/p>\n<h3>Les 5 forces de Porter<\/h3>\n<p>Règle : <b>plus une force est forte, moins l'industrie est attractive<\/b>.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Force<\/th><th>Elle est forte quand…<\/th><\/tr>\n<tr><td>Menace de <b>nouveaux entrants<\/b><\/td><td>Barrières faibles : peu d'économies d'échelle, peu de capital nécessaire, faible différenciation, coûts de changement bas, accès facile à la distribution, pas de régulation, peu de représailles attendues.<\/td><\/tr>\n<tr><td>Pouvoir des <b>fournisseurs<\/b><\/td><td>Fournisseurs plus concentrés que l'industrie, pas de substitut, input critique ou cher, coûts de changement, intégration en aval crédible, l'industrie est un petit client pour eux.<\/td><\/tr>\n<tr><td>Pouvoir des <b>clients<\/b><\/td><td>Achats concentrés ou en gros volumes, produit standard, coûts de changement faibles, intégration en amont crédible, information complète, clients peu rentables.<\/td><\/tr>\n<tr><td>Menace des <b>substituts<\/b><\/td><td>Bon rapport prix/performance du substitut, coûts de changement faibles, clients prêts à changer.<\/td><\/tr>\n<tr><td><b>Rivalité<\/b><\/td><td>Nombreux concurrents de taille égale, croissance lente, coûts fixes ou de stockage élevés, peu de différenciation, capacité ajoutée par gros paliers, <b>surcapacité<\/b>, barrières à la sortie élevées.<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box trap\"><span class=\"lbl\">Ne pas confondre<\/span>\n<b>Concurrent<\/b> = vend le même produit (Disney+ pour Netflix). <b>Substitut<\/b> = autre produit qui répond au même besoin (YouTube, jeux vidéo pour Netflix). <b>Complément<\/b> = augmente la valeur du produit quand on les utilise ensemble (haut débit et TV connectées pour le streaming ; essence pour la voiture). Les compléments <b>augmentent<\/b> la valeur de l'industrie, les substituts la <b>réduisent<\/b>.<\/div>\n<h3>Mesurer la concentration<\/h3>\n<div class=\"f\">CR4 = somme des parts de marché des 4 premiers\nHHI = Σ (part de marché en %)²   (de ~0 à 10 000)<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple<\/span>Parts de marché 40 %, 30 %, 20 %, 10 % → CR4 = 100 % ; HHI = 1 600 + 900 + 400 + 100 = <b>3 000<\/b> (très concentré). Un CR4 qui monte = consolidation, typique de la phase de <b>shakeout<\/b> ; à autres choses égales, moins de guerre des prix entre leaders.<\/div>\n<h3>Groupes stratégiques et facteurs clés de succès<\/h3>\n<ul>\n<li><b>Groupe stratégique<\/b> : firmes aux stratégies similaires ; la rivalité est plus forte à l'intérieur d'un groupe qu'entre groupes (automobile : généralistes mondiaux, spécialistes nationaux, sportives…).<\/li>\n<li><b>Facteurs clés de succès<\/b> = ce que veulent les clients + comment survivre à la concurrence.<\/li>\n<li>Délimiter l'industrie avec le critère de <b>substituabilité<\/b> (côté demande et côté offre).<\/li>\n<\/ul>\n<h3>Cycle de vie de l'industrie<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Phase<\/th><th>Ce qui se passe<\/th><\/tr>\n<tr><td>Introduction<\/td><td>Peu de clients, coûts élevés, pertes, innovation <b>produit<\/b> (phase fluide, designs multiples).<\/td><\/tr>\n<tr><td>Croissance<\/td><td>Pénétration rapide, premiers profits ; un <b>design dominant<\/b> émerge.<\/td><\/tr>\n<tr><td>Shakeout<\/td><td>Le design dominant fixe les règles, la concurrence passe sur les <b>coûts<\/b> ; beaucoup de firmes sortent (US auto : ~100 firmes puis quelques-unes).<\/td><
