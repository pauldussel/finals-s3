>une baisse du chômage provoque peu d'inflation<\/li><li>l'inflation est toujours monétaire<\/li><li>le NAIRU a disparu<\/li><\/ol>\n<details><summary>Réponse<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. Le « tariff jumping » désigne :<\/div><ol><li>une hausse brutale des droits de douane<\/li><li>le contournement d'un tarif en produisant dans le pays protégé ou via un pays tiers<\/li><li>les représailles d'un partenaire<\/li><li>l'absorption du tarif par l'exportateur<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Théorème de Mundell (1957).<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. Pour prendre des mesures anti-dumping, il faut :<\/div><ol><li>seulement un prix d'export inférieur au prix domestique<\/li><li>dumping + préjudice + lien de causalité<\/li><li>une subvention publique notifiée à l'OMC<\/li><li>l'accord de l'exportateur<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Les 3 conditions cumulatives.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">6. Un marché a 5 firmes de taille égale. Son HHI vaut :<\/div><ol><li>500<\/li><li>1 000<\/li><li>2 000<\/li><li>5 000<\/li><\/ol>\n<details><summary>Réponse<\/summary>c. 10 000 / 5 = 2 000 (5 × 20²).<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">7. Le DMA se distingue du droit de la concurrence classique car il est :<\/div><ol><li>ex post<\/li><li>ex ante, ciblé sur les gatekeepers<\/li><li>limité aux fusions<\/li><li>national<\/li><\/ol>\n<details><summary>Réponse<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">8. Un leader innove peu en rupture parce que l'innovation remplacerait ses propres profits. C'est :<\/div><ol><li>l'effet de remplacement d'Arrow<\/li><li>le paradoxe de Solow<\/li><li>l'aléa moral<\/li><li>l'excès d'inertie<\/li><\/ol>\n<details><summary>Réponse<\/summary>a.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">9. Une banque relève ses taux et les bons emprunteurs renoncent au crédit. C'est :<\/div><ol><li>de l'aléa moral<\/li><li>de la sélection adverse<\/li><li>une vallée de la mort<\/li><li>un effet d'agglomération<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Elle a lieu avant le prêt ; l'aléa moral a lieu après.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">10. Selon Stolper-Samuelson, l'ouverture d'un pays riche au commerce avec un pays à main-d'œuvre abondante :<\/div><ol><li>augmente tous les salaires<\/li><li>baisse la rémunération du travail peu qualifié dans le pays riche<\/li><li>n'a pas d'effet sur la répartition<\/li><li>baisse la rémunération du travail qualifié dans le pays riche<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Le facteur rare (travail peu qualifié) perd.<\/details><\/div>"}], "cases": [{"kind": "p", "sec": "Practice case", "sid": "", "title": "Practice: two firms and carbon permits", "body": "<p>Firms X and Y each emit 50,000 t. The cap is 90,000 t, so 45,000 permits each. Abatement cost: X = €20/t, Y = €60/t. Permit price: €40.<\/p><ol><li>Cost without trading.<\/li><li>What does each firm do with trading?<\/li><li>Total cost with trading.<\/li><\/ol>", "answer": "<p><b>1.<\/b> Each cuts 5,000 t: X 100,000 + Y 300,000 = <b>€400,000<\/b>.<\/p><p><b>2.<\/b> X is cheaper than the permit price: it cuts 10,000 t (€200,000) and sells 5,000 permits (+€200,000). Y buys 5,000 permits (€200,000) instead of abating at €60.<\/p><p><b>3.<\/b> Real cost to society = X's abatement only = <b>€200,000<\/b> &lt; €400,000. Same target, half the cost.<\/p>", "fr": "<p>Sans échange : 400 000 €. Avec échange, X réduit 10 000 t et vend 5 000 quotas, Y achète. Coût total 200 000 € : même objectif, moitié prix.<\/p>"}, {"kind": "ex", "title": "Course example", "sec": "Climate", "sid": "c1", "body": "A and B each emit 100,000 t; target 190,000 t → 95,000 permits each. Abatement cost: A = €5/t, B = €15/t.<br>\nWithout trading: A cuts 5,000 t (€25,000) + B cuts 5,000 t (€75,000) = <b>€100,000<\/b>.<br>\nWith a permit price of €10: A cuts 10,000 t (€50,000) and sells 5,000 permits (+€50,000) → net cost 0; B buys 5,000 permits (€50,000).<br>\nTotal <b>€75,000 &lt; €100,000<\/b>: same target, cheaper. That is the advantage of the market.", "fr": "A et B émettent chacun 100 000 t ; objectif 190 000 t → 95 000 quotas chacun. Coût de réduction : A = 5 €/t, B = 15 €/t.<br>\nSans échange : A réduit 5 000 t (25 000 €) + B réduit 5 000 t (75 000 €) = <b>100 000 €<\/b>.<br>\nAvec un prix du quota à 10 € : A réduit 10 000 t (50 000 €) et vend 5 000 quotas (+50 000 €) → coût net 0 ; B achète 5 000 quotas (50 000 €).<br>\nTotal <b>75 000 € &lt; 100 000 €<\/b> : même objectif, moins cher. C'est l'avantage du marché."}, {"kind": "ex", "title": "Example", "sec": "Inflation", "sid": "c2", "body": "Money supply +7%, real GDP +2%, stable velocity → inflation ≈ 7 − 2 = <b>5%<\/b>.", "fr": "Masse monétaire +7 %, PIB réel +2 %, vitesse stable → inflation ≈ 7 − 2 = <b>5 %<\/b>."}, {"kind": "ex", "title": "How the \"reciprocal\" tariff is calculated", "sec": "Protectionism", "sid": "c3", "body": "Imports from A = $200B, exports to A = $100B → deficit = $100B. Deficit / imports = 50%, halved → <b>25%<\/b>.<br>\nOfficial formula: Δτ = (x − m) / (ε × φ × m), with ε = −4 (elasticity) and φ = 0.25 (pass-through). Since ε × φ = −1, it boils down to <b>deficit / imports<\/b>. The implicit assumption (every deficit comes from unfair practices) is debatable.", "fr": "Importations depuis A = 200 Md$, exportations vers A = 100 Md$ → déficit = 100 Md$. Déficit / importations = 50 %, divisé par deux → <b>25 %<\/b>.<br>\nFormule officielle : Δτ = (x − m) / (ε × φ × m), avec ε = −4 (élasticité) et φ = 0,25 (pass-through). Comme ε × φ = −1, cela revient à <b>déficit / importations<\/b>. L'hypothèse implicite (tout déficit vient de pratiques déloyales) est contestable."}, {"kind": "ex", "title": "Figures to remember", "sec": "Protectionism", "sid": "c3", "body": "• Washing machines (Fed, 2019): prices +12%, <b>$1.5B<\/b> extra cost for 1,800 jobs saved → about <b>$815,000 per job per year<\/b> (≈ $67,900 per month).<br>\n• Fed (2020), 76 industries: direct effect +0.3%; via inputs −1.1%; via retaliation −0.7% → <b>net effect −1.5%<\/b> on employment.<br>\n• Conversely, the China shock created about <b>$400,000 of consumer surplus per job lost<\/b> (Jaravel and Sager, 2019).", "fr": "• Machines à laver (Fed, 2019) : prix +12 %, <b>1,5 Md$<\/b> de surcoût pour 1 800 emplois sauvés → environ <b>815 000 $ par emploi et par an<\/b> (≈ 67 900 $ par mois).<br>\n• Fed (2020), 76 industries : effet direct +0,3 % ; via les intrants −1,1 % ; via les représailles −0,7 % → <b>effet net −1,5 %<\/b> sur l'emploi.<br>\n• Inversement, le China shock a créé environ <b>400 000 $ de surplus consommateur par emploi perdu<\/b> (Jaravel et Sager, 2019)."}, {"kind": "ex", "title": "Example", "sec": "Competition", "sid": "c5", "body": "4 equal firms: HHI = 4 × 25² = <b>2,500<\/b> (= 10,000/4) → highly concentrated. Shares 50/30/20: 2,500 + 900 + 400 = <b>3,800<\/b>.", "fr": "4 firmes égales : HHI = 4 × 25² = <b>2 500<\/b> (= 10 000/4) → très concentré. Parts 50/30/20 : 2 500 + 900 + 400 = <b>3 800<\/b>."}], "quiz": [{"q": "In the Kaya identity, replacing a coal plant with wind turbines reduces:", "o": ["GDP", "energy intensity", "carbon intensity", "population"], "a": [2], "e": "The same energy is produced with less CO₂.", "fr": "On produit la même énergie avec moins de CO₂.", "src": "Practice MCQ"}, {"q": "With an emissions trading market, emissions are cut first by:", "o": ["the most polluting firm", "the firm with the lowest abatement cost", "both equally", "the state"], "a": [1], "e": "That is what minimizes the total cost (example A at €5 and B at €15).", "fr": "C'est ce qui minimise le coût total (exemple A à 5 € et B à 15 €).", "src": "Practice MCQ"}, {"q": "The flattening of the Phillips curve means that:", "o": ["unemployment no longer varies", "a fall in unemployment causes little inflation", "inflation is always monetary", "the NAIRU has disappeared"], "a": [1], "e": "", "fr": "", "src": "Practice MCQ"}, {"q": "\"Tariff jumping\" means:", "o": ["a sudden rise in tariffs", "getting around a tariff by producing in the protected country or via a third country", "a partner's retaliation", "the exporter absorbing the tariff"], "a": [1], "e": "Mundell theorem (1957).", "fr": "Théorème de Mundell (1957).", "src": "Practice MCQ"}, {"q": "To take anti-dumping measures, you need:", "o": ["only an export price below the home price", "dumping + injury + causal link", "a public subsidy notified to the WTO", "the exporter's consent"], "a": [1], "e": "The 3 cumulative conditions.", "fr": "Les 3 conditions cumulatives.", "src": "Practice MCQ"}, {"q": "A market has 5 firms of equal size. Its HHI is:", "o": ["500", "1,000", "2,000", "5,000"], "a": [2], "e": "10,000 / 5 = 2,000 (5 × 20²).", "fr": "10 000 / 5 = 2 000 (5 × 20²).", "src": "Practice MCQ"}, {"q": "The DMA differs from classic competition law because it is:", "o": ["ex post", "ex ante, targeted at gatekeepers", "limited to mergers", "national"], "a": [1], "e": "", "fr": "", "src": "Practice MCQ"}, {"q": "A leader rarely innovates radically because the innovation would replace its own profits. This is:", "o": ["Arrow's replacement effect", "the Solow paradox", "moral hazard", "excess inertia"], "a": [0], "e": "", "fr": "", "src": "Practice MCQ"}, {"q": "A bank raises its rates and good borrowers give up on credit. This is:", "o": ["moral hazard", "adverse selection", "a valley of death", "an agglomeration effect"], "a": [1], "e": "It happens before the loan; moral hazard happens after.", "fr": "Elle a lieu avant le prêt ; l'aléa moral a lieu après.", "src": "Practice MCQ"}, {"q": "According to Stolper-Samuelson, a rich country opening to trade with a labour-abundant country:", "o": ["raises all wages", "lowers the pay of low-skilled labour in the rich country", "has no effect on distribution", "lowers the pay of skilled labour in the rich country"], "a": [1], "e": "The scarce factor (low-skilled labour) loses.", "fr": "Le facteur rare (travail peu qualifié) perd.", "src": "Practice MCQ"}, {"q": "Kaya identity: CO₂ =", "o": ["GDP × E/GDP × CO₂/E", "Population × GDP", "GDP / energy", "E × CO₂ / GDP"], "a": [0], "e": "Three levers: activity, energy intensity, carbon intensity.", "fr": "Trois leviers : activité, intensité énergétique, intensité carbone.", "src": "Climate"}, {"q": "A Pigouvian tax aims to:", "o": ["Raise revenue", "Make polluters pay the social cost and change behaviour", "Subsidize renewables", "Ban emissions"], "a": [1], "e": "Polluter-pays principle.", "fr": "Principe pollueur-payeur.", "src": "Climate"}, {"q": "EU CBAM fully applies from:", "o": ["2019", "2023", "2026", "2035"], "a": [2], "e": "Reporting since 2023, full application in 2026.", "fr": "Reporting dès 2023, application pleine en 2026.", "src": "Climate"}, {"q": "Money supply +7%, real GDP +2%, stable velocity. Inflation ≈", "o": ["9%", "5%", "2%", "7%"], "a": [1], "e": "dP/P = dM/M − dY/Y.", "fr": "dP/P = dM/M − dY/Y.", "src": "Inflation"}, {"q": "\"Rules rather than discretion\" (time inconsistency) comes from:", "o": ["Friedman", "Kydland and Prescott", "Goodhart", "Phillips"], "a": [1], "e": "Basis for central bank independence.", "fr": "Fondement de l'indépendance des banques centrales.", "src": "Inflation"}, {"q": "Which ECB rate is the deposit facility?", "o": ["MRO", "DFR", "MLF", "LTRO"], "a": [1], "e": "MRO refinancing, DFR deposit, MLF marginal lending.", "fr": "MRO refinancement, DFR dépôt, MLF prêt marginal.", "src": "Inflation"}, {"q": "Imports from A $200B, exports to A $100B. \"Reciprocal\" tariff:", "o": ["50%", "25%", "10%", "100%"], "a": [1], "e": "Deficit / imports = 50%, halved.", "fr": "Déficit / importations = 50 %, divisé par deux.", "src": "Protectionism"}, {"q": "Few organized producers vs many dispersed consumers creates a protectionist bias. This is:", "o": ["Stolper-Samuelson", "Olson's paradox", "The Mundell theorem", "The China shock"], "a": [1], "e": "Collective action problem.", "fr": "Problème d'action collective.", "src": "Protectionism"}, {"q": "Washing machine tariffs (Fed, 2019) cost per job saved per year about:", "o": ["$15,000", "$81,500", "$815,000", "$8 million"], "a": [2], "e": "$1.5B for 1,800 jobs.", "fr": "1,5 Md$ pour 1 800 emplois.", "src": "Protectionism"}, {"q": "Foreign value added contained in my own exports is a:", "o": ["Forward linkage", "Backward linkage", "Smile curve", "Nearshoring"], "a": [1], "e": "Vietnam assembling Korean screens.", "fr": "Le Vietnam assemble des écrans coréens.", "src": "Economic sovereignty"}, {"q": "Kuka (German robotics bought by Midea) led to EU rules on:", "o": ["Anti-dumping", "FDI screening", "State aid", "Carbon leakage"], "a": [1], "e": "Regulation 2019/452.", "fr": "Règlement 2019/452.", "src": "Economic sovereignty"}, {"q": "Abusing a dominant position falls under:", "o": ["Art. 101 TFEU", "Art. 102 TFEU", "The DMA only", "Merger control"], "a": [1], "e": "101 = cartels, 102 = abuse of dominance.", "fr": "101 = ententes, 102 = abus de position dominante.", "src": "Competition"}, {"q": "Under the RPI − X price cap, X represents:", "o": ["Inflation", "Expected productivity gains", "The tax rate", "The firm's margin"], "a": [1], "e": "Prices may rise by inflation minus efficiency gains.", "fr": "Les prix montent de l'inflation moins les gains de productivité.", "src": "Competition"}, {"q": "Which is NOT a condition for a patent?", "o": ["Novelty", "Inventive step", "Industrial application", "Commercial success"], "a": [3], "e": "Max 20 years.", "fr": "20 ans maximum.", "src": "Innovation"}, {"q": "\"You can see the computer age everywhere but in the productivity statistics\" is:", "o": ["Schumpeter", "Solow", "Arrow", "Gordon"], "a": [1], "e": "The Solow paradox (1987).", "fr": "Le paradoxe de Solow (1987).", "src": "Innovation"}]}];</script>
<script>
(function(){
"use strict";
var D=null, $app=document.getElementById('app');
var KEY='finals-s3-app-v1', S={done:{},q:{},fr:false,sec:{},theme:null};
try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&typeof o==='object') S=Object.assign(S,o);} }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
/* Supabase project used for automatic sync (publishable key: safe to ship in the page) */
var CFG={url:"https://asvhxegfyreunhoarlch.supabase.co",key:"sb_publishable_vxWyuwUPQS5ZbEjL_irPaw_IbSSwROB"};
var AUTO_OK=!/claude/i.test(location.hostname);
S.ts=S.ts||{};
(function(){ Object.keys(S.done).forEach(function(sid){ Object.keys(S.done[sid]||{}).forEach(function(x){ var k='d|'+sid+'|'+x; if(!S.ts[k]) S.ts[k]=1; }); });
  Object.keys(S.q).forEach(function(k){ if(!S.ts['q|'+k]) S.ts['q|'+k]=1; }); })();
function setDone(sid,x,v){ S.done[sid]=S.done[sid]||{}; if(v) S.done[sid][x]=true; else delete S.done[sid][x]; S.ts['d|'+sid+'|'+x]=Date.now(); save(); dirty(); }
function setQ(k,v){ if(v===0||v===1) S.q[k]=v; else delete S.q[k]; S.ts['q|'+k]=Date.now(); save(); dirty(); }
function items(){ var o={}; Object.keys(S.ts).forEach(function(k){ var p=k.split('|'), v;
  if(p[0]==='d'){ v=(S.done[p[1]]&&S.done[p[1]][p[2]])?1:0; } else if(p[0]==='q'){ var x=S.q[p[1]]; v=(x===0||x===1)?x:-1; } else return;
  o[k]=[v,S.ts[k]]; }); return o; }
function applyItems(m){ var n=0; Object.keys(m||{}).forEach(function(k){ var it=m[k]; if(!Array.isArray(it)) return; var ts=+it[1]||0; if((S.ts[k]||0)>=ts) return;
  var p=k.split('|'), v=it[0];
  if(p[0]==='d'){ S.done[p[1]]=S.done[p[1]]||{}; if(v===1) S.done[p[1]][p[2]]=true; else delete S.done[p[1]][p[2]]; }
  else if(p[0]==='q'){ if(v===0||v===1) S.q[p[1]]=v; else delete S.q[p[1]]; } else return;
  S.ts[k]=ts; n++; }); if(n) save(); return n; }
var SY={busy:false,err:'',timer:null,again:false};
function syncOn(){ return !!(AUTO_OK&&CFG.url&&CFG.key&&S.syncKey); }
function setBadge(){ var b=document.getElementById('syncbtn'); if(b) b.setAttribute('data-s', !syncOn()?'off':SY.busy?'busy':SY.err?'err':'ok'); }
function dirty(){ if(!syncOn()) return; clearTimeout(SY.timer); SY.timer=setTimeout(syncNow,2000); }
function syncNow(){
  if(!syncOn()) return; if(SY.busy){ SY.again=true; return; }
  SY.busy=true; setBadge(); updSyncStatus();
  var h={'Content-Type':'application/json','apikey':CFG.key}; if(/^eyJ/.test(CFG.key)) h.Authorization='Bearer '+CFG.key;
  fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/rpc/sync_progress',{method:'POST',headers:h,body:JSON.stringify({p_key:S.syncKey,p_items:items()})})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(m){ var n=applyItems(m); SY.err=''; S.lastSync=Date.now(); save(); if(n) softRefresh(); })
  .catch(function(){ SY.err=(navigator.onLine===false)?'Pas de connexion internet':'Serveur injoignable'; })
  .then(function(){ SY.busy=false; setBadge(); updSyncStatus(); if(SY.again){ SY.again=false; syncNow(); } });
}
function softRefresh(){ var h=location.hash||'#home'; if(h==='#sync'||document.querySelector('.qcard:not(.end)')) return; route(); }
function updSyncStatus(){ var e=document.getElementById('syncstat'); if(!e) return;
  var cls=SY.busy?'busy':SY.err?'err':'ok', t;
  if(SY.busy) t='Synchronisation…';
  else if(SY.err) t=SY.err+'. Vérifie ta connexion (ou ton VPN) : l\'appli réessaie toute seule.';
  else if(S.lastSync) t='À jour · dernière synchro à '+new Date(S.lastSync).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  else t='Prête';
  e.className='syncstat '+cls; e.innerHTML='<i></i><span>'+t+'</span>'; }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') syncNow(); });
window.addEventListener('online',function(){ syncNow(); });
setInterval(function(){ if(document.visibilityState==='visible') syncNow(); },60000);
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(id){ return document.getElementById(id); }

/* theme + FR mode */
function applyTheme(){ if(S.theme) document.documentElement.setAttribute('data-theme',S.theme); else document.documentElement.removeAttribute('data-theme'); }
applyTheme();
el('theme').onclick=function(){
  var dark = S.theme ? S.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
function syncFr(){ el('frmode').setAttribute('aria-pressed', S.fr?'true':'false'); }
syncFr();
el('frmode').onclick=function(){ S.fr=!S.fr; save(); syncFr(); route(); };
el('home-btn').onclick=function(){ go('home'); };
el('back').onclick=function(){ go('home'); };
el('syncbtn').onclick=function(){ go('sync'); };

/* dates (Suzhou time) */
function dayNum(d){ var p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); return Math.round(Date.parse(p+'T00:00:00Z')/864e5); }
function countdown(s){
  if(!s.start) return {txt:'Date à confirmer',past:false};
  var st=new Date(s.start), now=new Date();
  if(now-st > 3*3600e3) return {txt:'Passé',past:true};
  var n=dayNum(st)-dayNum(now);
  if(n<=0) return {txt:"Aujourd'hui",past:false};
  if(n===1) return {txt:'Demain',past:false};
  return {txt:'J−'+n,past:false};
}
function dparts(s){ var d=new Date(s.start); var f=function(o){ return new Intl.DateTimeFormat('fr-FR',Object.assign({timeZone:'Asia/Shanghai'},o)).format(d); };
  return {d:f({day:'numeric'}), m:f({weekday:'short'}).replace('.','')+' '+f({month:'short'}).replace('.','')}; }

/* progress */
function secDone(s){ var m=S.done[s.id]||{}; return s.sections.filter(function(x){return m[x.id];}).length; }
function quizStat(s){ var seen=0, ok=0; s.quiz.forEach(function(q,i){ var v=S.q[s.id+':'+i]; if(v===0||v===1){ seen++; if(v===1) ok++; } }); return {seen:seen, ok:ok, total:s.quiz.length}; }
function pct(a,b){ return b? Math.round(100*a/b):0; }

/* routing */
var view={};
function go(h){ if(location.hash!=='#'+h) location.hash=h; else route(); }
window.addEventListener('hashchange',route);
function subj(id){ for(var i=0;i<D.length;i++) if(D[i].id===id) return D[i]; return null; }
function route(){
  if(!D) return;
  var h=(location.hash||'').replace(/^#/,'')||'home';
  var m=h.match(/^([a-z]+)(?:-(fiche|cas|quiz))?$/);
  document.documentElement.style.setProperty('--h', 230);
  el('back').style.display='none';
  if(h==='mix'){ el('back').style.display='inline-block'; return renderMix(); }
  if(h==='sync'){ el('back').style.display='inline-block'; return renderSync(); }
  var s=m&&subj(m[1]);
  if(!s){ return renderHome(); }
  document.documentElement.style.setProperty('--h', s.hue);
  el('back').style.display='inline-block';
  renderSubject(s, m[2]||'fiche');
}

/* HOME */
function renderHome(){
  var up=D.filter(function(s){ return !countdown(s).past; });
  var nx=up[0];
  var totalSec=0,doneSec=0,qSeen=0,qOk=0;
  D.forEach(function(s){ totalSec+=s.sections.length; doneSec+=secDone(s); var q=quizStat(s); qSeen+=q.seen; qOk+=q.ok; });
  var html='<section class="hero">';
  if(nx){ var c=countdown(nx);
    html+='<div class="next" style="--h:'+nx.hue+'"><span class="k">Prochain exam · '+esc(c.txt)+'</span><h1>'+esc(nx.name)+'</h1><span class="cd">'+esc(nx.when)+'</span><span style="opacity:.8;font-size:14px">'+esc(nx.fmt)+'</span>'+
      '<div style="margin-top:10px"><button class="mixbtn" type="button" data-go="'+nx.id+'-fiche">Réviser cette matière</button></div></div>';
  } else html+='<div class="next"><span class="k">Finals S3</span><h1>Tous les exams sont passés</h1></div>';
  html+='<div class="seat"><span class="k">Ta convocation</span><div class="row"><div><div class="v">271</div><div class="l">Salle</div></div><div><div class="v">5</div><div class="l">Rang</div></div><div><div class="v">6</div><div class="l">Place</div></div></div>'+
    '<p>Arrive 15 min avant avec ta carte étudiante et une batterie chargée. Exams sur TestWe.</p>'+
    '<div class="row"><div class="meter">Fiches <i><b style="width:'+pct(doneSec,totalSec)+'%"></b></i> '+doneSec+'/'+totalSec+'</div><div class="meter">Quiz <i><b style="width:'+pct(qOk,qSeen)+'%"></b></i> '+qOk+'/'+qSeen+'</div></div>'+
    '<button class="mixbtn" type="button" data-go="mix">Quiz mélangé · 20 questions</button></div></section>';
  html+='<h2 class="sec-h">Calendrier des finals</h2><div class="slips">';
  D.forEach(function(s){
    var c=countdown(s), dp=dparts(s), q=quizStat(s), dn=secDone(s);
    html+='<button class="slip" type="button" style="--h:'+s.hue+'" data-go="'+s.id+'-fiche">'+
      '<span class="date"><span class="d">'+dp.d+'</span><span class="m">'+esc(dp.m)+'</span></span>'+
      '<span style="min-width:0"><span class="nm">'+esc(s.name)+'</span><span class="meta" style="display:block">'+esc(s.when.split(' · ')[1]||'')+' · '+esc(s.fmt)+' · Poids '+esc(s.weight)+'</span>'+
      '<span class="meters"><span class="meter">Fiche <i><b style="width:'+pct(dn,s.sections.length)+'%"></b></i> '+dn+'/'+s.sections.length+'</span>'+
      '<span class="meter">Quiz <i><b style="width:'+pct(q.ok,q.total)+'%"></b></i> '+q.ok+'/'+q.total+'</span>'+
      '<span class="meter">'+s.cases.length+' cas</span></span></span>'+
      '<span class="cd-pill'+(c.past?' past':'')+'">'+esc(c.txt)+'</span></button>';
  });
  html+='</div>';
  $app.innerHTML=html; window.scrollTo(0,0);
}
$app.addEventListener('click',function(e){ var t=e.target.closest('[data-go]'); if(t) go(t.getAttribute('data-go')); });

/* SUBJECT */
function renderSubject(s, tab){
  var q=quizStat(s);
  var html='<section class="subhead"><span class="k">'+esc(s.prof)+'</span><h1>'+esc(s.name)+'</h1><p class="lead">'+s.lead+'</p><div class="facts">'+
    '<span class="fact"><b>'+esc(s.when)+'</b></span><span class="fact">'+esc(s.fmt)+'</span><span class="fact">Poids <b>'+esc(s.weight)+'</b></span><span class="fact">'+esc(s.rules)+'</span></div></section>';
  html+='<nav class="tabs" role="tablist">'+
    tabBtn(s,'fiche','Fiche',secDone(s)+'/'+s.sections.length, tab)+
    tabBtn(s,'cas','Cas et exemples',s.cases.length, tab)+
    tabBtn(s,'quiz','Quiz',q.total, tab)+'</nav><div id="pane"></div>';
  $app.innerHTML=html;
  var pane=el('pane');
  if(tab==='cas') renderCases(s,pane); else if(tab==='quiz') renderQuizStart(s,pane); else renderSheet(s,pane);
}
function tabBtn(s,id,label,n,cur){ return '<button class="tab" role="tab" type="button" aria-selected="'+(cur===id)+'" data-go="'+s.id+'-'+id+'">'+label+'<span class="n">'+n+'</span></button>'; }

function frBlock(fr, open, label){
  if(!fr) return '';
  return '<div class="frbox"><button type="button" data-fr aria-expanded="'+(open?'true':'false')+'"><span>'+(label||'Explication en français')+'</span><span>'+(open?'−':'+')+'</span></button><div class="frin rich"'+(open?'':' hidden')+'>'+fr+'</div></div>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-fr]'); if(!b) return;
  var box=b.nextElementSibling, open=box.hidden; box.hidden=!open;
  b.setAttribute('aria-expanded',open?'true':'false'); b.lastElementChild.textContent=open?'−':'+';
});

function renderSheet(s,pane){
  var cur=S.sec[s.id]; var idx=0;
  s.sections.forEach(function(x,i){ if(x.id===cur) idx=i; });
  var done=S.done[s.id]||{};
  var toc='<nav class="toc" aria-label="Sections">'+s.sections.map(function(x,i){
    return '<button type="button" data-sec="'+i+'" aria-current="'+(i===idx)+'"><span class="ck'+(done[x.id]?' on':'')+'">'+(done[x.id]?'✓':'')+'</span>'+esc(x.short)+'</button>'; }).join('')+'</nav>';
  var sel='<select class="tocsel" id="tocsel" aria-label="Section">'+s.sections.map(function(x,i){ return '<option value="'+i+'"'+(i===idx?' selected':'')+'>'+(done[x.id]?'✓ ':'')+esc(x.short)+'</option>'; }).join('')+'</select>';
  var x=s.sections[idx];
  var body='<div style="min-width:0">'+sel+'<article class="card-sec"><h2>'+esc(x.title)+'</h2><div class="sub">'+x.sub+'</div><div class="rich">'+x.en+'</div>'+frBlock(x.fr,S.fr)+'</article>'+
    '<div class="secnav"><button class="btn" type="button" data-sec="'+(idx-1)+'"'+(idx===0?' disabled':'')+'>← Précédente</button>'+
    '<button class="btn'+(done[x.id]?' done':'')+'" type="button" id="markdone">'+(done[x.id]?'✓ Revue':'Marquer comme revue')+'</button>'+
    '<button class="btn pri" type="button" data-sec="'+(idx+1)+'"'+(idx===s.sections.length-1?' disabled':'')+'>Suivante →</button></div></div>';
  pane.innerHTML='<div class="sheet">'+toc+body+'</div>';
  pane.querySelectorAll('[data-sec]').forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute('data-sec'); if(i<0||i>=s.sections.length) return; S.sec[s.id]=s.sections[i].id; save(); renderSheet(s,pane); pane.scrollIntoView({block:'start'}); window.scrollBy(0,-70); }; });
  el('tocsel').onchange=function(){ S.sec[s.id]=s.sections[+this.value].id; save(); renderSheet(s,pane); };
  el('markdone').onclick=function(){ setDone(s.id, x.id, !(S.done[s.id]&&S.done[s.id][x.id]));
    var t=document.querySelector('.tab[aria-selected="true"] .n'); if(t) t.textContent=secDone(s)+'/'+s.sections.length; renderSheet(s,pane); };
}

var KIND={ex:'Exemple corrigé', q:'Question ouverte', p:"Cas d'entraînement"};
function renderCases(s,pane){
  var f=view.caseFilter&&view.caseFilter.s===s.id?view.caseFilter.k:'all';
  var counts={ex:0,q:0,p:0}; s.cases.forEach(function(c){ counts[c.kind]++; });
  var html='<div class="filters">'+[['all','Tous',s.cases.length],['p',"Cas d'entraînement",counts.p],['q','Questions ouvertes',counts.q],['ex','Exemples corrigés',counts.ex]]
    .filter(function(o){ return o[0]==='all'||o[2]>0; })
    .map(function(o){ return '<button class="chipbtn" type="button" data-cf="'+o[0]+'" aria-pressed="'+(f===o[0])+'">'+o[1]+' · '+o[2]+'</button>'; }).join('')+'</div><div class="cases">';
  s.cases.forEach(function(c,i){
    if(f!=='all'&&c.kind!==f) return;
    html+='<div class="case" data-open="0"><button type="button" data-case="'+i+'" aria-expanded="false"><span class="kind '+c.kind+'">'+KIND[c.kind]+'</span><span class="ti">'+c.title+'<span class="from">'+esc(c.sec)+'</span></span><span class="chev">›</span></button><div class="cb rich" hidden></div></div>';
  });
  html+='</div>';
  pane.innerHTML=html;
  pane.querySelectorAll('[data-cf]').forEach(function(b){ b.onclick=function(){ view.caseFilter={s:s.id,k:b.getAttribute('data-cf')}; renderCases(s,pane); }; });
  pane.querySelectorAll('[data-case]').forEach(function(b){ b.onclick=function(){
    var card=b.parentNode, cb=b.nextElementSibling, c=s.cases[+b.getAttribute('data-case')];
    var open=card.getAttribute('data-open')!=='1';
    card.setAttribute('data-open',open?'1':'0'); b.setAttribute('aria-expanded',open); cb.hidden=!open;
    if(open&&!cb.innerHTML){
      if(c.kind==='p'){ cb.innerHTML=c.body+'<div class="qact" style="justify-content:flex-start"><button class="btn pri" type="button" data-ans>Voir le corrigé</button></div><div class="answer" hidden>'+c.answer+frBlock(c.fr,S.fr)+'</div>';
        cb.querySelector('[data-ans]').onclick=function(){ cb.querySelector('.answer').hidden=false; this.parentNode.remove(); }; }
      else if(c.kind==='q'){ cb.innerHTML='<p style="color:var(--muted);font-size:14px">Réfléchis à ta réponse, puis ouvre le plan.</p><div class="qact" style="justify-content:flex-start"><button class="btn pri" type="button" data-ans>Voir le plan de réponse</button></div><div class="answer" hidden>'+c.body+frBlock(c.fr,S.fr)+'</div>';
        cb.querySelector('[data-ans]').onclick=function(){ cb.querySelector('.answer').hidden=false; this.parentNode.remove(); }; }
      else cb.innerHTML=c.body+frBlock(c.fr,S.fr);
    }
  }; });
}

/* QUIZ */
var run=null;
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function renderQuizStart(s,pane){
  var st=quizStat(s), wrong=s.quiz.filter(function(_,i){ return S.q[s.id+':'+i]===0; }).length, unseen=s.quiz.length-st.seen;
  var srcs=[]; s.quiz.forEach(function(q){ if(srcs.indexOf(q.src)<0) srcs.push(q.src); });
  var html='<div class="qstart"><h2>Quiz '+esc(s.short)+'</h2>'+
    '<div class="qstats"><div><b>'+s.quiz.length+'</b><span>questions</span></div><div><b>'+st.seen+'</b><span>déjà faites</span></div><div><b>'+pct(st.ok,st.seen)+' %</b><span>de bonnes réponses</span></div><div><b>'+wrong+'</b><span>erreurs à revoir</span></div></div>'+
    '<div><div class="sec-h" style="margin-bottom:6px">Questions</div><div class="seg" id="qmode">'+
      '<button class="chipbtn" type="button" data-m="all" aria-pressed="true">Toutes</button>'+
      '<button class="chipbtn" type="button" data-m="new" aria-pressed="false"'+(unseen?'':' disabled')+'>Pas encore faites · '+unseen+'</button>'+
      '<button class="chipbtn" type="button" data-m="err" aria-pressed="false"'+(wrong?'':' disabled')+'>Mes erreurs · '+wrong+'</button></div></div>'+
    (srcs.length>1?'<div><div class="sec-h" style="margin-bottom:6px">Thème</div><select class="tocsel" style="display:block;max-width:360px" id="qsrc"><option value="">Tous les thèmes</option>'+srcs.map(function(x){ return '<option>'+esc(x)+'</option>'; }).join('')+'</select></div>':'')+
    '<div><button class="btn pri" type="button" id="qgo">Commencer</button> <button class="btn" type="button" id="qreset">Remettre à zéro</button></div></div>';
  pane.innerHTML=html;
  var mode='all';
  pane.querySelectorAll('[data-m]').forEach(function(b){ b.onclick=function(){ mode=b.getAttribute('data-m'); pane.querySelectorAll('[data-m]').forEach(function(x){ x.setAttribute('aria-pressed', x===b); }); }; });
  el('qreset').onclick=function(){ if(this.dataset.c!=='1'){ this.dataset.c='1'; this.textContent='Confirmer la remise à zéro'; return; } s.quiz.forEach(function(_,i){ var k=s.id+':'+i; if(S.q[k]===0||S.q[k]===1) setQ(k,null); }); renderQuizStart(s,pane); };
  el('qgo').onclick=function(){
    var src=el('qsrc')?el('qsrc').value:'';
    var ids=[]; s.quiz.forEach(function(q,i){ var v=S.q[s.id+':'+i];
      if(src&&q.src!==src) return; if(mode==='new'&&(v===0||v===1)) return; if(mode==='err'&&v!==0) return; ids.push({s:s,i:i}); });
    if(!ids.length){ el('qgo').textContent='Aucune question pour ce choix'; return; }
    startRun(shuffle(ids), pane, function(){ renderQuizStart(s,pane); });
  };
}
function renderMix(){
  document.documentElement.style.setProperty('--h', 230);
  var all=[]; D.forEach(function(s){ if(countdown(s).past) return; s.quiz.forEach(function(_,i){ all.push({s:s,i:i}); }); });
  $app.innerHTML='<section class="subhead"><span class="k">Toutes les matières</span><h1>Quiz mélangé</h1><p class="lead">20 questions tirées au hasard dans toutes les matières qui restent.</p></section><div id="pane"></div>';
  startRun(shuffle(all).slice(0,20), el('pane'), function(){ renderMix(); });
}
function startRun(items, pane, back){ run={items:items,n:0,ok:0,wrong:[],pane:pane,back:back}; showQ(); }
function showQ(){
  var r=run, it=r.items[r.n], q=it.s.quiz[it.i], multi=q.a.length>1, pane=r.pane;
  document.documentElement.style.setProperty('--h', it.s.hue);
  var html='<div class="qcard"><div class="qtop"><span>Question '+(r.n+1)+' / '+r.items.length+'</span><span>'+r.ok+' juste'+(r.ok>1?'s':'')+'</span></div><div class="prog"><b style="width:'+pct(r.n,r.items.length)+'%"></b></div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><span class="qtag">'+esc(it.s.short)+'</span><span class="qtag">'+esc(q.src)+'</span>'+(q.real?'<span class="qtag" style="background:var(--warn-soft);color:var(--warn)">Vraie question de quiz</span>':'')+'</div>'+
    '<p class="qtext">'+q.q+(multi?' <span style="color:var(--muted);font-weight:500;font-size:14px">(plusieurs réponses)</span>':'')+'</p><div class="opts">'+
    q.o.map(function(o,k){ return '<button class="opt" type="button" data-k="'+k+'"><span class="L">'+String.fromCharCode(97+k)+'</span><span>'+o+'</span></button>'; }).join('')+'</div><div id="fbz"></div>'+
    '<div class="qact">'+(multi?'<button class="btn pri" type="button" id="qcheck">Valider</button>':'')+'<button class="btn" type="button" id="qquit">Arrêter</button></div></div>';
  pane.innerHTML=html;
  var answered=false;
  function grade(chosen){
    if(answered) return; answered=true;
    var good=chosen.length===q.a.length&&chosen.every(function(k){ return q.a.indexOf(k)>=0; });
    setQ(it.s.id+':'+it.i, good?1:0);
    if(good) r.ok++; else r.wrong.push(it);
    pane.querySelectorAll('.opt').forEach(function(b){ var k=+b.getAttribute('data-k'); b.disabled=true;
      if(q.a.indexOf(k)>=0) b.classList.add('good'); else if(chosen.indexOf(k)>=0) b.classList.add('bad'); });
    var letters=q.a.map(function(k){ return String.fromCharCode(97+k); }).join(', ');
    var expl=(q.e?'<div>'+q.e+'</div>':'')+(q.fr?'<div class="fr"><b>FR :</b> '+q.fr+'</div>':'');
    el('fbz').innerHTML='<div class="fb '+(good?'good':'bad')+'"><div class="h">'+(good?'Juste':'Faux · réponse '+letters)+'</div>'+expl+'</div>';
    var act=pane.querySelector('.qact'); act.innerHTML='<button class="btn" type="button" id="qquit">Arrêter</button><button class="btn pri" type="button" id="qnext">'+(r.n+1<r.items.length?'Question suivante →':'Voir mon score')+'</button>';
    el('qquit').onclick=quit; el('qnext').onclick=next; el('qnext').focus();
  }
  pane.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){
    var k=+b.getAttribute('data-k');
    if(multi){ b.classList.toggle('sel'); return; }
    grade([k]); }; });
  if(multi) el('qcheck').onclick=function(){ var ch=[].map.call(pane.querySelectorAll('.opt.sel'),function(b){ return +b.getAttribute('data-k'); }); if(ch.length) grade(ch); };
  el('qquit').onclick=quit;
  function next(){ r.n++; if(r.n<r.items.length) showQ(); else end(); }
  function quit(){ if(r.n>0||answered) end(true); else r.back(); }
}
function end(early){
  var r=run, done=r.n+(early?1:0); if(done>r.items.length) done=r.items.length;
  var answered=r.ok+r.wrong.length;
  r.pane.innerHTML='<div class="qcard end"><span class="sec-h">Résultat</span><div class="big">'+r.ok+' / '+answered+'</div><p style="margin:0;color:var(--muted)">'+(answered?pct(r.ok,answered):0)+' % de bonnes réponses</p>'+
    '<div class="qact" style="justify-content:center">'+(r.wrong.length?'<button class="btn pri" type="button" id="redo">Refaire mes '+r.wrong.length+' erreur'+(r.wrong.length>1?'s':'')+'</button>':'')+'<button class="btn" type="button" id="again">Nouveau quiz</button></div></div>';
  if(el('redo')) el('redo').onclick=function(){ startRun(shuffle(r.wrong.slice()), r.pane, r.back); };
  el('again').onclick=r.back;
}

/* SYNC: progress packed into a short code. Per subject: 1 bit per section (revue), 2 bits per quiz question (0 jamais, 1 faux, 2 juste). */
var B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function encodeProgress(){
  var bits=[];
  D.forEach(function(s){
    var dn=S.done[s.id]||{};
    s.sections.forEach(function(x){ bits.push(dn[x.id]?1:0); });
    s.quiz.forEach(function(_,i){ var v=S.q[s.id+':'+i]; var c=v===1?2:(v===0?1:0); bits.push(c>>1, c&1); });
  });
  while(bits.length%6) bits.push(0);
  var out='', sum=0;
  for(var i=0;i<bits.length;i+=6){ var n=0; for(var j=0;j<6;j++) n=n*2+bits[i+j]; out+=B64[n]; sum=(sum+n)%64; }
  out=out.replace(/A+$/,'');
  return 'S3-'+B64[sum]+out;
}
function decodeProgress(code){
  code=String(code||'').replace(/\s+/g,'');
  var m=code.match(/^S3-([A-Za-z0-9_-])([A-Za-z0-9_-]*)$/);
  if(!m) return null;
  var sum=0, bits=[];
  for(var i=0;i<m[2].length;i++){ var n=B64.indexOf(m[2][i]); sum=(sum+n)%64; for(var j=5;j>=0;j--) bits.push((n>>j)&1); }
  if(B64[sum]!==m[1]) return null;
  var p=0, got={done:{},q:{}};
  function bit(){ return p<bits.length?bits[p++]:(p++,0); }
  D.forEach(function(s){
    s.sections.forEach(function(x){ if(bit()){ (got.done[s.id]=got.done[s.id]||{})[x.id]=true; } });
    s.quiz.forEach(function(_,i){ var c=bit()*2+bit(); if(c===2) got.q[s.id+':'+i]=1; else if(c===1) got.q[s.id+':'+i]=0; });
  });
  return got;
}
function mergeProgress(got){
  var addS=0, addQ=0, conflict=0;
  Object.keys(got.done).forEach(function(sid){ Object.keys(got.done[sid]).forEach(function(x){
    if(!(S.done[sid]&&S.done[sid][x])){ setDone(sid,x,true); addS++; } }); });
  Object.keys(got.q).forEach(function(k){ var v=got.q[k], mine=S.q[k];
    if(mine!==0&&mine!==1){ setQ(k,v); addQ++; }
    else if(mine!==v){ setQ(k,0); conflict++; } });
  return {s:addS, q:addQ, c:conflict};
}
function renderSync(){
  var code=encodeProgress(), canShare=!!navigator.share;
  var totalSec=0,doneSec=0,qSeen=0; D.forEach(function(s){ totalSec+=s.sections.length; doneSec+=secDone(s); qSeen+=quizStat(s).seen; });
  $app.innerHTML='<section class="subhead"><span class="k">Téléphone ⇄ ordinateur</span><h1>Synchroniser ma progression</h1>'+
    '<p class="lead">Chaque appareil garde sa propre progression. Pour la passer de l\'un à l\'autre, copie le code de cet appareil et colle-le sur l\'autre. Les deux progressions sont fusionnées : rien n\'est effacé.</p>'+
    '<div class="facts"><span class="fact">Sur cet appareil : <b>'+doneSec+'/'+totalSec+'</b> sections revues</span><span class="fact"><b>'+qSeen+'</b> questions de quiz faites</span></div></section>'+
    autoCard()+
    '<details class="manual"'+(syncOn()?'':' open')+'><summary>Méthode manuelle (code à copier-coller)</summary>'+
    '<div class="sync"><div class="qstart"><h2>1. Envoyer depuis cet appareil</h2><ol class="steps"><li>Copie ou partage le code ci-dessous.</li><li>Envoie-le sur l\'autre appareil (AirDrop, Notes, message à toi-même… ou un simple copier-coller si ton iPhone et ton Mac sont sur le même compte Apple).</li></ol>'+
    '<textarea class="codebox" id="mycode" readonly aria-label="Code de progression">'+code+'</textarea>'+
    '<div class="seg"><button class="btn pri" type="button" id="copycode">Copier le code</button>'+(canShare?'<button class="btn" type="button" id="sharecode">Partager…</button>':'')+'</div><div id="copymsg"></div></div>'+
    '<div class="qstart"><h2>2. Recevoir sur cet appareil</h2><ol class="steps"><li>Colle ici le code venu de l\'autre appareil.</li><li>Appuie sur Importer.</li></ol>'+
    '<textarea class="codebox" id="incode" placeholder="S3-…" aria-label="Code à importer" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>'+
    '<div class="seg"><button class="btn pri" type="button" id="doimport">Importer et fusionner</button></div><div id="impmsg"></div>'+
    '<p style="margin:0;font-size:13px;color:var(--muted)">Si une même question est juste sur un appareil et fausse sur l\'autre, elle repasse dans « Mes erreurs » pour que tu la refasses.</p></div></div></details>';
  el('copycode').onclick=function(){
    var ta=el('mycode'), done=function(ok){ el('copymsg').innerHTML='<div class="msg '+(ok?'good':'bad')+'">'+(ok?'Code copié. Colle-le sur l\'autre appareil.':'Copie impossible ici : sélectionne le code et copie-le à la main.')+'</div>'; };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(function(){ done(true); },function(){ ta.focus(); ta.select(); done(false); }); }
    else { ta.focus(); ta.select(); try{ done(document.execCommand('copy')); }catch(e){ done(false); } }
  };
  if(canShare) el('sharecode').onclick=function(){ navigator.share({title:'Progression Finals S3', text:el('mycode').value}).catch(function(){}); };
  el('doimport').onclick=function(){
    var got=decodeProgress(el('incode').value);
    if(!got){ el('impmsg').innerHTML='<div class="msg bad">Ce code n\'est pas valide. Vérifie qu\'il commence par « S3- » et qu\'il est complet, puis réessaie.</div>'; return; }
    var r=mergeProgress(got);
    el('impmsg').innerHTML='<div class="msg good">Importé : '+r.s+' section'+(r.s>1?'s':'')+' et '+r.q+' réponse'+(r.q>1?'s':'')+' en plus'+(r.c?', '+r.c+' question'+(r.c>1?'s':'')+' à refaire':'')+'.</div>';
    el('incode').value=''; el('mycode').value=encodeProgress();
  };
  bindAuto(); updSyncStatus();
  window.scrollTo(0,0);
}
var KEYRE=/^S3K-[A-Za-z0-9_-]{24}$/;
function newKey(){ var a=new Uint8Array(18); crypto.getRandomValues(a); var s=''; for(var i=0;i<18;i+=3){ var n=(a[i]<<16)|(a[i+1]<<8)|a[i+2]; for(var j=18;j>=0;j-=6) s+=B64[(n>>j)&63]; } return 'S3K-'+s; }
function autoCard(){
  if(!CFG.url||!CFG.key) return '';
  if(!AUTO_OK) return '<div class="autosync"><h2>Synchro automatique</h2><p style="margin:0">Elle marche dans l\'appli installée : <b>pauldussel.github.io/finals-s3</b>. Ici, utilise le code manuel ci-dessous.</p></div>';
  if(S.syncKey) return '<div class="autosync"><h2>Synchro automatique · activée</h2><div class="syncstat" id="syncstat"></div>'+
    '<p style="margin:0;font-size:14px;color:var(--muted)">Ta progression se met à jour toute seule sur tous tes appareils qui ont cette clé, dès qu\'ils sont connectés.</p>'+
    '<div><div class="sec-h" style="margin-bottom:6px">Ta clé (à coller une seule fois sur un nouvel appareil)</div><div class="keyrow"><input id="mykey" readonly value="'+esc(S.syncKey)+'" aria-label="Clé de synchro"><button class="btn" type="button" id="copykey">Copier</button></div></div>'+
    '<div class="seg"><button class="btn pri" type="button" id="syncnow">Synchroniser maintenant</button><button class="btn" type="button" id="unlink">Désactiver sur cet appareil</button></div><div id="keymsg"></div></div>';
  return '<div class="autosync"><h2>Synchro automatique</h2>'+
    '<ol class="steps"><li><b>Sur ton premier appareil</b> : crée ta clé, puis copie-la.</li><li><b>Sur chaque autre appareil</b> : colle la même clé. C\'est tout, ensuite tout se fait tout seul.</li></ol>'+
    '<div class="seg"><button class="btn pri" type="button" id="mkkey">Créer ma clé</button></div>'+
    '<div><div class="sec-h" style="margin-bottom:6px">J\'ai déjà une clé</div><div class="keyrow"><input id="inkey" placeholder="S3K-…" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Clé de synchro"><button class="btn" type="button" id="usekey">Utiliser cette clé</button></div></div><div id="keymsg"></div>'+
    '<p style="margin:0;font-size:13px;color:var(--muted)">Ta progression est envoyée sur un serveur à Singapour, rangée sous cette clé. Garde-la pour toi : quelqu\'un qui l\'a peut voir et modifier ta progression.</p></div>';
}
function bindAuto(){
  var mk=el('mkkey'), uk=el('usekey'), ck=el('copykey'), sn=el('syncnow'), ul=el('unlink');
  function link(k){ S.syncKey=k; save(); renderSync(); syncNow(); }
  if(mk) mk.onclick=function(){ link(newKey()); };
  if(uk) uk.onclick=function(){ var k=el('inkey').value.replace(/\s+/g,''); if(!KEYRE.test(k)){ el('keymsg').innerHTML='<div class="msg bad">Cette clé n\'est pas valide. Elle commence par « S3K- » et fait 28 caractères.</div>'; return; } link(k); };
  if(ck) ck.onclick=function(){ var i=el('mykey'); var ok=function(b){ el('keymsg').innerHTML='<div class="msg '+(b?'good':'bad')+'">'+(b?'Clé copiée. Colle-la sur ton autre appareil, dans « J\'ai déjà une clé ».':'Copie impossible : sélectionne la clé et copie-la à la main.')+'</div>'; };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(i.value).then(function(){ ok(true); },function(){ i.select(); ok(false); }); else { i.select(); ok(false); } };
  if(sn) sn.onclick=function(){ syncNow(); };
  if(ul) ul.onclick=function(){ if(this.dataset.c!=='1'){ this.dataset.c='1'; this.textContent='Confirmer : désactiver ici'; return; } delete S.syncKey; save(); setBadge(); renderSync(); };
}

/* boot */
function boot(data){ D=data; route(); setBadge(); syncNow(); }
if(window.APPDATA) boot(window.APPDATA);
else fetch('data.json').then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(boot).catch(function(){ $app.innerHTML='<p class="empty">Impossible de charger les fiches. Recharge la page.</p>'; });
})();
