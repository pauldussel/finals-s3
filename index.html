b> / (1 + r)<sup>n<\/sup>\nValeur actuelle :                 PV  = Σ F<sub>t<\/sub> / (1 + r)<sup>t<\/sup>\nVAN (NPV) :                       NPV = −I<sub>0<\/sub> + Σ F<sub>t<\/sub> / (1 + r)<sup>t<\/sup>\nAnnuité constante (N ans) :       PV  = F × [1 − (1 + r)<sup>−N<\/sup>] / r\nPerpétuité :                      PV  = F / r\nPerpétuité croissante (r > g) :   PV  = F<sub>1<\/sub> / (r − g) = F<sub>0<\/sub>(1 + g) / (r − g)<\/div>\n<ul>\n<li><b>Règle<\/b> : VAN &gt; 0 → investir ; VAN &lt; 0 → rejeter. Le taux d'actualisation reflète le <b>risque<\/b> du projet.<\/li>\n<li>3 lectures de la VAN : la valeur créée ; le montant maximum supplémentaire qu'on accepterait de payer ; l'écart entre valeur actuelle et prix de marché. Sur un marché efficient, VAN = 0.<\/li>\n<li>Plus le taux est élevé, plus la VAN baisse (relation décroissante).<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Exemple<\/span>10 000 € placés 3 ans à 10 % → 10 000 × 1,1³ = <b>13 310 €<\/b> (intérêts 1 000, 1 100, 1 210).<br>\nProjet : −1 000 aujourd'hui, puis 400, 500, 300 ; taux 8 %.<br>\nPV = 400/1,08 + 500/1,08² + 300/1,08³ = 370,37 + 428,67 + 238,15 = 1 037,19 → <b>VAN = +37,19<\/b> → on investit.<\/div>\n<details><summary>À toi : mensualité d'un prêt<\/summary>\nPrêt de 20 000 € sur 5 ans à 5 %, annuités constantes : F = 20 000 × 0,05 / (1 − 1,05<sup>−5<\/sup>) = <b>4 619,50 € par an<\/b>.<\/details>\n<div class=\"box trap\"><span class=\"lbl\">Pièges<\/span>\n<ul><li>Perpétuité croissante : le numérateur est le flux de l'<b>année 1<\/b>. Si on te donne le flux d'aujourd'hui, multiplie par (1 + g).<\/li>\n<li>On ne calcule pas un rendement annuel en divisant le gain total par le nombre d'années (3 310 / 3 / 10 000 = 11 % est faux ; le vrai taux est 10 %).<\/li><\/ul><\/div>"}, {"id": "c3", "short": "IRR and other criteria", "title": "3. IRR and other investment criteria", "sub": "Session 3 · Vernimmen ch. 17", "en": "<p>The <b>IRR<\/b> is the rate that makes the NPV equal to zero. Rule: invest if IRR &gt; required return.<\/p>\n<div class=\"f\">0 = −I<sub>0<\/sub> + Σ F<sub>t<\/sub> / (1 + IRR)<sup>t<\/sup>\nOver 2 years: set x = 1/(1+r), solve a·x² + b·x + c = 0, keep the positive root.<\/div>\n<div class=\"tw\"><table>\n<tr><th>IRR limit<\/th><th>When<\/th><th>What to do<\/th><\/tr>\n<tr><td>Multiple IRRs<\/td><td>Cash flows change sign several times (−, +, −)<\/td><td>Use the NPV<\/td><\/tr>\n<tr><td>No IRR<\/td><td>Some cash flow profiles never set the NPV to zero<\/td><td>Use the NPV<\/td><\/tr>\n<tr><td>Financing rather than investment<\/td><td>1<sup>st<\/sup> cash flow positive then negative: NPV rises with the rate<\/td><td>Accept if IRR &lt; required rate<\/td><\/tr>\n<tr><td>Rates changing over time<\/td><td>Long projects<\/td><td>NPV with a rate per period<\/td><\/tr>\n<tr><td>Mutually exclusive projects: scale effect<\/td><td>Small project with high IRR vs large one with high NPV<\/td><td>NPV or <b>incremental IRR<\/b><\/td><\/tr>\n<tr><td>Mutually exclusive projects: timing effect<\/td><td>Early vs late cash flows<\/td><td>NPV<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box ex\"><span class=\"lbl\">Course example: scale effect (required rate 25%)<\/span>\nSmall: −10 then +40 (NPV 22, IRR 300%). Large: −25 then +65 (NPV 27, IRR 160%).<br>\nIncremental cash flows (large − small): −15 then +25 → incremental IRR <b>66.67%<\/b> &gt; 25% → take the <b>large<\/b> project, as the NPV says.<\/div>\n<h3>Payback period<\/h3>\n<p>Time to recover the investment = investment / annual cash flow (if constant). Otherwise, cumulate the cash flows and interpolate within the year. The <b>discounted<\/b> version is always longer. It is a <b>risk<\/b> indicator, poorly suited to long or innovative projects.<\/p>\n<h3>Nominal, proportional, effective rate<\/h3>\n<div class=\"f\">Effective annual rate: r<sub>e<\/sub> = (1 + r<sub>a<\/sub>/n)<sup>n<\/sup> − 1<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Example<\/span>Loan at 10% with interest compounded semi-annually: (1 + 0.10/2)² − 1 = <b>10.25%<\/b>. The proportional rate (5% per half-year) is not equivalent. Only effective rates are comparable.<\/div>", "fr": "<p>Le <b>TRI<\/b> (IRR) est le taux qui annule la VAN. Règle : investir si TRI &gt; rendement exigé.<\/p>\n<div class=\"f\">0 = −I<sub>0<\/sub> + Σ F<sub>t<\/sub> / (1 + IRR)<sup>t<\/sup>\nSur 2 ans : poser x = 1/(1+r), résoudre a·x² + b·x + c = 0, garder la racine positive.<\/div>\n<div class=\"tw\"><table>\n<tr><th>Limite du TRI<\/th><th>Quand<\/th><th>Que faire<\/th><\/tr>\n<tr><td>TRI multiples<\/td><td>Les flux changent de signe plusieurs fois (−, +, −)<\/td><td>Utiliser la VAN<\/td><\/tr>\n<tr><td>Pas de TRI<\/td><td>Certains profils de flux n'annulent jamais la VAN<\/td><td>Utiliser la VAN<\/td><\/tr>\n<tr><td>Financement plutôt qu'investissement<\/td><td>1<sup>er<\/sup> flux positif puis négatifs : la VAN augmente avec le taux<\/td><td>Accepter si TRI &lt; taux exigé<\/td><\/tr>\n<tr><td>Taux qui changent dans le temps<\/td><td>Projets longs<\/td><td>VAN avec des taux par période<\/td><\/tr>\n<tr><td>Projets exclusifs : effet taille<\/td><td>Petit projet à fort TRI vs gros à forte VAN<\/td><td>VAN ou <b>TRI incrémental<\/b><\/td><\/tr>\n<tr><td>Projets exclusifs : effet calendrier<\/td><td>Flux tôt vs flux tard<\/td><td>VAN<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple du cours : effet taille (taux exigé 25 %)<\/span>\nPetit : −10 puis +40 (VAN 22, TRI 300 %). Gros : −25 puis +65 (VAN 27, TRI 160 %).<br>\nFlux incrémentaux (gros − petit) : −15 puis +25 → TRI incrémental <b>66,67 %<\/b> &gt; 25 % → prendre le <b>gros<\/b> projet, comme le dit la VAN.<\/div>\n<h3>Délai de récupération (payback)<\/h3>\n<p>Temps pour récupérer l'investissement = investissement / flux annuel (si flux constants). Sinon, cumuler les flux et interpoler dans l'année. La version <b>actualisée<\/b> est toujours plus longue. C'est un indicateur de <b>risque<\/b>, mal adapté aux projets longs ou innovants.<\/p>\n<h3>Taux nominal, proportionnel, effectif<\/h3>\n<div class=\"f\">Taux effectif annuel : r<sub>e<\/sub> = (1 + r<sub>a<\/sub>/n)<sup>n<\/sup> − 1<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple<\/span>Prêt à 10 % avec intérêts calculés semestriellement : (1 + 0,10/2)² − 1 = <b>10,25 %<\/b>. Le taux proportionnel (5 % par semestre) n'est pas équivalent. Seuls les taux effectifs sont comparables.<\/div>"}, {"id": "c4", "short": "Incremental cash flows", "title": "4. Investment decisions: incremental cash flows", "sub": "Session 4 · Vernimmen ch. 28 · <b>core of final questions 1 to 3<\/b>", "en": "<h3>The 6 principles<\/h3>\n<ol>\n<li>Reason in <b>cash flows<\/b>, not accounting income.<\/li>\n<li>Count only <b>incremental<\/b> cash flows (what the project changes).<\/li>\n<li>Reason in <b>opportunity cost<\/b> (the CFO is an \"asset dealer\").<\/li>\n<li><b>Ignore financing<\/b>: no interest in the cash flows, otherwise it is counted twice (it is already in the rate).<\/li>\n<li>Take <b>taxes<\/b> into account (depreciation tax shield, tax on capital gains from disposals).<\/li>\n<li>Be <b>consistent<\/b> (nominal rate with nominal cash flows, etc.).<\/li>\n<\/ol>\n<div class=\"f\">Operating cash flow = EBIT × (1 − T<sub>c<\/sub>) + Depreciation − ΔNWC\nNWC = Receivables + Inventory − Payables\nΔNWC<sub>n<\/sub> = NWC<sub>n<\/sub> − NWC<sub>n−1<\/sub>   (NWC is recovered at the end of the project)<\/div>\n<div class=\"tw\"><table>\n<tr><th>Item<\/th><th>Treatment<\/th><\/tr>\n<tr><td>Market study already paid<\/td><td><b>Sunk cost<\/b> → ignore<\/td><\/tr>\n<tr><td>Land already owned<\/td><td><b>Opportunity cost<\/b> = price it could be sold for today (not its historical cost)<\/td><\/tr>\n<tr><td>Financing costs / interest<\/td><td>Ignore (already in the WACC)<\/td><\/tr>\n<tr><td>Depreciation<\/td><td>Deducted to compute tax, then added back<\/td><\/tr>\n<tr><td>Resale at the end of the project<\/td><td>Sale price − tax × (sale price − net book value)<\/td><\/tr>\n<tr><td>Land resold<\/td><td>Tax on (sale price − value used in year 0), which can be negative (tax saving)<\/td><\/tr>\n<tr><td>Negative EBIT<\/td><td>Negative tax = tax saving (the group is assumed profitable)<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box ex\"><span class=\"lbl\">Worked example: 2019 final (Albioma, 3-year storage project)<\/span>\nData: land owned (historical cost $0.5M, could be sold for $0.6M); plant $2.4M depreciated straight-line over 3 years; market study $0.1M already paid; sales $0.8M in year 1 then +20%/year; cost of sales 10%; admin costs $0.2M/year; tax 30%; receivables 10%, inventory 15%, payables 5% of sales; NWC financed at year end and recovered in year 4; resale in year 3: land $0.5M, plant $1M.\n<h4>Q1: year 0<\/h4>\nLand −600,000 (opportunity cost) + plant −2,400,000; study = sunk cost → <b>−3,000,000<\/b>.\n<h4>Q2: year 1<\/h4>\n<div class=\"f\">Sales                         800,000\n− Cost of sales (10%)          80,000\n− Admin costs                 200,000\n− Depreciation (2.4M / 3)     800,000\n= EBIT                       −280,000\n− Tax 30%                     −84,000   (tax saving)\n= EBIT(1 − T)                −196,000\n+ Depreciation                800,000   → 604,000\nNWC = (10% + 15% − 5%) × 800,000 = 160,000 → ΔNWC = 160,000\nYear 1 cash flow = 604,000 − 160,000 = <b>444,000<\/b><\/div>\nYear 4: no more activity, the year 3 NWC is recovered = 20% × 1,152,000 = <b>+230,400<\/b>.\n<h4>Q3: divestment in year 3<\/h4>\nLand sold 500,000, tax = 30% × (500,000 − 600,000) = −30,000 (saving). Plant sold 1,000,000, NBV = 0, tax = 300,000. Cash flow = 1,500,000 − 270,000 = <b>1,230,000<\/b>.\n<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Common mistakes<\/span>Putting interest in the cash flows; using the historical cost of the land; forgetting the \"sunk\" study; forgetting to recover the NWC; using total NWC instead of its <b>change<\/b>.<\/div>", "fr": "<h3>Les 6 principes<\/h3>\n<ol>\n<li>Raisonner en <b>flux de trésorerie<\/b>, pas en résultat comptable.<\/li>\n<li>Ne compter que les flux <b>incrémentaux<\/b> (ce que le projet change).<\/li>\n<li>Raisonner en <b>coût d'opportunité<\/b> (le CFO est un « marchand d'actifs »).<\/li>\n<li><b>Ignorer le financement<\/b> : pas d'intérêts dans les flux, sinon on le compte deux fois (il est déjà dans le taux).<\/li>\n<li>Tenir compte des <b>impôts<\/b> (économie d'impôt de l'amortissement, impôt sur les plus-values de cession).<\/li>\n<li>Être <b>cohérent<\/b> (taux nominal avec flux nominaux, etc.).<\/li>\n<\/ol>\n<div class=\"f\">Flux d'exploitation = EBIT × (1 − T<sub>c<\/sub>) + Amortissement − ΔBFR\nBFR (NWC) = Créances clients + Stocks − Dettes fournisseurs\nΔBFR<sub>n<\/sub> = BFR<sub>n<\/sub> − BFR<sub>n−1<\/sub>   (le BFR est récupéré à la fin du projet)<\/div>\n<div class=\"tw\"><table>\n<tr><th>Élément<\/th><th>Traitement<\/th><\/tr>\n<tr><td>Étude de marché déjà payée<\/td><td><b>Coût irrécupérable<\/b> (sunk cost) → ignorer<\/td><\/tr>\n<tr><td>Terrain déjà possédé<\/td><td><b>Coût d'opportunité<\/b> = prix auquel on pourrait le vendre aujourd'hui (pas son coût historique)<\/td><\/tr>\n<tr><td>Frais financiers / intérêts<\/td><td>Ignorer (déjà dans le WACC)<\/td><\/tr>\n<tr><td>Amortissement<\/td><td>Déduit pour calculer l'impôt, puis rajouté<\/td><\/tr>\n<tr><td>Revente en fin de projet<\/td><td>Prix de vente − impôt × (prix de vente − valeur nette comptable)<\/td><\/tr>\n<tr><td>Terrain revendu<\/td><td>Impôt sur (prix de vente − valeur retenue en année 0), qui peut être négatif (économie d'impôt)<\/td><\/tr>\n<tr><td>EBIT négatif<\/td><td>Impôt négatif = économie d'impôt (le groupe est supposé bénéficiaire)<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple corrigé : final 2019 (Albioma, projet de stockage sur 3 ans)<\/span>\nDonnées : terrain possédé (coût historique 0,5 M$, revendable 0,6 M$) ; usine 2,4 M$ amortie linéairement sur 3 ans ; étude de marché 0,1 M$ déjà payée ; ventes 0,8 M$ en année 1 puis +20 %/an ; coût des ventes 10 % ; frais administratifs 0,2 M$/an ; impôt 30 % ; créances 10 %, stocks 15 %, fournisseurs 5 % des ventes ; BFR financé en fin d'année et récupéré en année 4 ; revente en année 3 : terrain 0,5 M$, usine 1 M$.\n<h4>Q1 : année 0<\/h4>\nTerrain −600 000 (coût d'opportunité) + usine −2 400 000 ; étude = sunk cost → <b>−3 000 000<\/b>.\n<h4>Q2 : année 1<\/h4>\n<div class=\"f\">Ventes                       800 000\n− Coût des ventes (10 %)       80 000\n− Frais administratifs        200 000\n− Amortissement (2,4 M / 3)   800 000\n= EBIT                       −280 000\n− Impôt 30 %                  −84 000   (économie d'impôt)\n= EBIT(1 − T)                −196 000\n+ Amortissement               800 000   → 604 000\nBFR = (10 % + 15 % − 5 %) × 800 000 = 160 000 → ΔBFR = 160 000\nFlux année 1 = 604 000 − 160 000 = <b>444 000<\/b><\/div>\nAnnée 4 : plus d'activité, on récupère le BFR de l'année 3 = 20 % × 1 152 000 = <b>+230 400<\/b>.\n<h4>Q3 : désinvestissement en année 3<\/h4>\nTerrain vendu 500 000, impôt = 30 % × (500 000 − 600 000) = −30 000 (économie). Usine vendue 1 000 000, VNC = 0, impôt = 300 000. Flux = 1 500 000 − 270 000 = <b>1 230 000<\/b>.\n<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Erreurs fréquentes<\/span>Mettre les intérêts dans les flux ; prendre le coût historique du terrain ; oublier l'étude « sunk » ; oublier de récupérer le BFR ; mettre le BFR total au lieu de sa <b>variation<\/b>.<\/div>"}, {"id": "c5", "short": "Valuing a stock", "title": "5. Valuing a stock", "sub": "Session 5 · Vernimmen ch. 22, 31", "en": "<p>Book value ≠ market value; the gap corresponds to <b>goodwill<\/b>. Market-value balance sheet: V = E + D. Two approaches: <b>absolute<\/b> (discounting cash flows) and <b>relative<\/b> (multiples).<\/p>\n<div class=\"f\">1 year:              P<sub>0<\/sub> = (Div<sub>1<\/sub> + P<sub>1<\/sub>) / (1 + r)\nConstant dividend:   P<sub>0<\/sub> = Div / r            (\"income stock\", e.g. utilities)\nGordon (DDM):        P<sub>0<\/sub> = Div<sub>1<\/sub> / (r − g)      (\"growth stock\")\nGrowth:              g = ROE × retention ratio (1 − payout)\nP/E = Price / EPS = Market cap / Net income = payout / (r − g)\nP/B = Price / Book value per share      (> 1 if ROE > k<sub>E<\/sub>)\nEBIT multiple = Enterprise value / EBIT\nP<sub>0<\/sub> = EPS<sub>1<\/sub> / r + PVGO<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Course example: PVGO<\/span>\nr = 15%, Div<sub>1<\/sub> = €5, g = 10%, EPS<sub>1<\/sub> = €8.33, ROE = 25%.<br>\nPrice = 5 / (0.15 − 0.10) = <b>€100<\/b>. Payout = 5 / 8.33 = 60%, so retention 40%; g = 25% × 40% = 10% ✓.<br>\nWithout growth: 8.33 / 0.15 = <b>€55.56<\/b>. So <b>PVGO = €44.44<\/b>. The value of a growth stock comes mostly from future investments (Amazon: PVGO ≈ 92% of the price; Walmart ≈ 30%).<\/div>\n<div class=\"box exam\"><span class=\"lbl\">Final question 8<\/span>P/E = share price × number of shares / net income. Compare it with the industry average P/E: higher → the stock looks <b>expensive<\/b> (or the market expects more growth); lower → <b>cheap<\/b>. E.g. 2022: €38 × 329M / €600M = <b>20.8<\/b> vs 20.9 for the industry → valuation in line with peers.<\/div>", "fr": "<p>Valeur comptable (book value) ≠ valeur de marché ; l'écart correspond au <b>goodwill<\/b>. Bilan en valeur de marché : V = E + D. Deux approches : <b>absolue<\/b> (actualisation des flux) et <b>relative<\/b> (multiples).<\/p>\n<div class=\"f\">1 an :                  P<sub>0<\/sub> = (Div<sub>1<\/sub> + P<sub>1<\/sub>) / (1 + r)\nDividende constant :   P<sub>0<\/sub> = Div / r            (« income stock », ex. utilities)\nGordon (DDM) :         P<sub>0<\/sub> = Div<sub>1<\/sub> / (r − g)      (« growth stock »)\nCroissance :           g = ROE × taux de rétention (1 − payout)\nPER = Prix / BPA = Capitalisation / Résultat net = payout / (r − g)\nPBR = Prix / Valeur comptable par action      (> 1 si ROE > k<sub>E<\/sub>)\nMultiple d'EBIT = Valeur de l'entreprise / EBIT\nP<sub>0<\/sub> = BPA<sub>1<\/sub> / r + PVGO<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple du cours : PVGO<\/span>\nr = 15 %, Div<sub>1<\/sub> = 5 €, g = 10 %, BPA<sub>1<\/sub> = 8,33 €, ROE = 25 %.<br>\nPrix = 5 / (0,15 − 0,10) = <b>100 €<\/b>. Payout = 5 / 8,33 = 60 %, donc rétention 40 % ; g = 25 % × 40 % = 10 % ✓.<br>\nSans croissance : 8,33 / 0,15 = <b>55,56 €<\/b>. Donc <b>PVGO = 44,44 €<\/b>. La valeur d'une growth stock vient surtout des investissements futurs (Amazon : PVGO ≈ 92 % du prix ; Walmart ≈ 30 %).<\/div>\n<div class=\"box exam\"><span class=\"lbl\">Question 8 du final<\/span>PER = cours × nombre d'actions / résultat net. Compare-le au PER moyen du secteur : plus élevé → l'action paraît <b>chère<\/b> (ou le marché anticipe plus de croissance) ; plus bas → <b>bon marché<\/b>. Ex. 2022 : 38 € × 329 M / 600 M€ = <b>20,8<\/b> vs 20,9 pour le secteur → valorisation en ligne avec les comparables.<\/div>"}, {"id": "c6", "short": "Valuing a bond", "title": "6. Valuing a bond", "sub": "Session 6 · Vernimmen ch. 20", "en": "<p>Debt vs equity: fixed return, priority in bankruptcy, repaid, no voting rights. Vocabulary: face value (par value), coupon, maturity, bullet repayment, issue price.<\/p>\n<div class=\"f\">Price = Σ C<sub>t<\/sub> / (1 + y)<sup>t<\/sup> + Face value / (1 + y)<sup>N<\/sup>\ny = yield to maturity (YTM) = the bond's IRR<\/div>\n<ul>\n<li><b>Price and yield move in opposite directions.<\/b> Coupon = YTM → price at par; coupon &gt; YTM → above par; coupon &lt; YTM → below par.<\/li>\n<li>The rate must be over the <b>same period<\/b> as the coupon (semi-annual coupon → semi-annual rate, number of periods × 2).<\/li>\n<li>Ratings: AAA to BBB = <b>investment grade<\/b>; BB to D = <b>speculative / junk<\/b>. The lower the rating, the higher the <b>spread<\/b> (gap with the risk-free rate).<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Course examples<\/span>\n6% bond, 5 years, annual coupon, similar bonds yield 6.9%: 60/1.069 + … + 1,060/1.069⁵ = <b>963 → 96.3% of par<\/b>.<br>\n8% semi-annual coupon, 5 years, face value 1,000: coupon 40 over 10 half-years.<br>\n• YTM 10% → 5% per half-year → price = <b>922.78<\/b> (below par)<br>\n• YTM 7% → 3.5% per half-year → price = <b>1,041.58<\/b> (above par)<\/div>\n<div class=\"box exam\"><span class=\"lbl\">Final question 4<\/span>k<sub>D<\/sub> = risk-free rate + rating spread. V<sub>D<\/sub> = coupons and face value discounted at k<sub>D<\/sub>. E.g. 2019: $1,100M debt, 3% coupon, 3 years; k<sub>D<\/sub> = 0.8% + 2% = 2.8% → V<sub>D<\/sub> = 33/1.028 + 33/1.028² + 1,133/1.028³ = <b>$1,106.2M<\/b>.<\/div>", "fr": "<p>Dette vs actions : rémunération fixe, prioritaire en cas de faillite, remboursée, pas de droit de vote. Vocabulaire : nominal (par value), coupon, maturité, remboursement « in fine », prix d'émission.<\/p>\n<div class=\"f\">Prix = Σ C<sub>t<\/sub> / (1 + y)<sup>t<\/sup> + Nominal / (1 + y)<sup>N<\/sup>\ny = taux de rendement actuariel (YTM) = le TRI de l'obligation<\/div>\n<ul>\n<li><b>Prix et taux varient en sens inverse.<\/b> Coupon = YTM → prix au pair ; coupon &gt; YTM → au-dessus du pair ; coupon &lt; YTM → en dessous.<\/li>\n<li>Le taux doit être sur la <b>même période<\/b> que le coupon (coupon semestriel → taux semestriel, nombre de périodes × 2).<\/li>\n<li>Notation : AAA à BBB = <b>investment grade<\/b> ; BB à D = <b>speculative / junk<\/b>. Plus la note est basse, plus le <b>spread<\/b> (écart avec le taux sans risque) est élevé.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Exemples du cours<\/span>\nObligation 6 %, 5 ans, coupon annuel, obligations similaires à 6,9 % : 60/1,069 + … + 1 060/1,069⁵ = <b>963 → 96,3 % du pair<\/b>.<br>\nCoupon 8 % semestriel, 5 ans, nominal 1 000 : coupon 40 sur 10 semestres.<br>\n• YTM 10 % → taux 5 % par semestre → prix = <b>922,78<\/b> (sous le pair)<br>\n• YTM 7 % → 3,5 % par semestre → prix = <b>1 041,58<\/b> (au-dessus du pair)<\/div>\n<div class=\"box exam\"><span class=\"lbl\">Question 4 du final<\/span>k<sub>D<\/sub> = taux sans risque + spread lié à la note. V<sub>D<\/sub> = les coupons et le nominal actualisés à k<sub>D<\/sub>. Ex. 2019 : dette de 1 100 M$, coupon 3 %, 3 ans ; k<sub>D<\/sub> = 0,8 % + 2 % = 2,8 % → V<sub>D<\/sub> = 33/1,028 + 33/1,028² + 1 133/1,028³ = <b>1 106,2 M$<\/b>.<\/div>"}, {"id": "c7", "short": "Risk and return", "title": "7. Risk and return: statistics", "sub": "Session 7 · Vernimmen ch. 18", "en": "<ul>\n<li><b>Economic<\/b> risks (political, natural, inflation, operational) affecting cash flows; <b>financial<\/b> risks (liquidity, currency, interest rate).<\/li>\n<li>The riskier a security, the more volatile its price; risk looks lower over the long term.<\/li>\n<\/ul>\n<div class=\"f\">Expected return (ex ante):  E(R) = Σ p<sub>t<\/sub> × R<sub>t<\/sub>          Historical: mean = (1/N) Σ R<sub>t<\/sub>\nVariance (ex ante):         V(R) = Σ p<sub>t<\/sub> (R<sub>t<\/sub> − R̄)²       Historical: V = 1/(N−1) × Σ (R<sub>t<\/sub> − R̄)²\nStandard deviation:         σ = √V<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Example<\/span>Historical returns: 10%, −5%, 15%, 4%. Mean = 6%. Deviations: 4, −11, 9, −2 → squares 16 + 121 + 81 + 4 = 222 (in %²). V = 222 / 3 = 74 → <b>σ ≈ 8.6%<\/b>.<\/div>\n<h3>Diversification<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Specific (diversifiable) risk<\/b>Specific to the company: project, competition, industry. Disappears when you hold many securities. <b>Not rewarded.<\/b><\/div>\n<div class=\"card\"><b class=\"t\">Market (systematic) risk<\/b>Affects all companies: rates, inflation, currency, politics. Cannot be diversified away. <b>The only rewarded risk.<\/b><\/div>\n<\/div>", "fr": "<ul>\n<li>Risques <b>économiques<\/b> (politiques, naturels, inflation, opérationnels) qui touchent les flux ; risques <b>financiers<\/b> (liquidité, change, taux).<\/li>\n<li>Plus un titre est risqué, plus son prix est volatil ; le risque paraît plus faible sur le long terme.<\/li>\n<\/ul>\n<div class=\"f\">Espérance (ex ante) :  E(R) = Σ p<sub>t<\/sub> × R<sub>t<\/sub>          Historique : moyenne = (1/N) Σ R<sub>t<\/sub>\nVariance (ex ante) :   V(R) = Σ p<sub>t<\/sub> (R<sub>t<\/sub> − R̄)²       Historique : V = 1/(N−1) × Σ (R<sub>t<\/sub> − R̄)²\nÉcart-type :           σ = √V<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple<\/span>Rendements historiques : 10 %, −5 %, 15 %, 4 %. Moyenne = 6 %. Écarts : 4, −11, 9, −2 → carrés 16 + 121 + 81 + 4 = 222 (en %²). V = 222 / 3 = 74 → <b>σ ≈ 8,6 %<\/b>.<\/div>\n<h3>La diversification<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Risque spécifique (diversifiable)<\/b>Propre à l'entreprise : projet, concurrence, secteur. Disparaît quand on détient beaucoup de titres. <b>Non rémunéré.<\/b><\/div>\n<div class=\"card\"><b class=\"t\">Risque de marché (systématique)<\/b>Touche toutes les entreprises : taux, inflation, change, politique. Ne se diversifie pas. <b>Seul risque rémunéré.<\/b><\/div>\n<\/div>"}, {"id": "c8", "short": "CAPM and cost of equity", "title": "8. CAPM and cost of equity", "sub": "Session 8 · Vernimmen ch. 19 · <b>final question 5<\/b>", "en": "<div class=\"f\">β<sub>J<\/sub> = Cov(R<sub>J<\/sub>, R<sub>M<\/sub>) / Var(R<sub>M<\/sub>)\nk<sub>E<\/sub> = R<sub>F<\/sub> + β × (k<sub>M<\/sub> − R<sub>F<\/sub>)        (k<sub>M<\/sub> − R<sub>F<\/sub>) = market risk premium\nV<sub>E<\/sub> = share price × number of shares<\/div>\n<ul>\n<li>The required return depends <b>only on market risk<\/b> (β), not on total risk.<\/li>\n<li>β = 1: moves with the market; β &gt; 1: amplifies; β &lt; 1: defensive.<\/li>\n<li><b>SML<\/b> (security market line): a security <b>above<\/b> the line is <b>undervalued<\/b>, below it is overvalued. A parallel shift = change in interest rates; a change in slope = change in the reward for risk.<\/li>\n<li>Portfolio β = <b>weighted average<\/b> of the βs.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Example (2019 final)<\/span>R<sub>F<\/sub> = 0.8%, β = 0.7, k<sub>M<\/sub> = 9.6% → k<sub>E<\/sub> = 0.8% + 0.7 × 8.8% = <b>6.96%<\/b>. V<sub>E<\/sub> = $23 × 31M = <b>$713M<\/b>.<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Trap<\/span>If the question gives the <b>risk premium<\/b> (k<sub>M<\/sub> − R<sub>F<\/sub>), do not subtract R<sub>F<\/sub> a second time. If it gives the <b>market return<\/b> k<sub>M<\/sub>, you must subtract it.<\/div>", "fr": "<div class=\"f\">β<sub>J<\/sub> = Cov(R<sub>J<\/sub>, R<sub>M<\/sub>) / Var(R<sub>M<\/sub>)\nk<sub>E<\/sub> = R<sub>F<\/sub> + β × (k<sub>M<\/sub> − R<sub>F<\/sub>)        (k<sub>M<\/sub> − R<sub>F<\/sub>) = prime de risque du marché\nV<sub>E<\/sub> = cours de l'action × nombre d'actions<\/div>\n<ul>\n<li>Le rendement exigé dépend du <b>seul risque de marché<\/b> (β), pas du risque total.<\/li>\n<li>β = 1 : bouge comme le marché ; β &gt; 1 : amplifie ; β &lt; 1 : défensif.<\/li>\n<li><b>SML<\/b> (security market line) : un titre <b>au-dessus<\/b> de la droite est <b>sous-évalué<\/b>, en dessous il est surévalué. Un déplacement parallèle = variation des taux ; un changement de pente = changement de la rémunération du risque.<\/li>\n<li>β d'un portefeuille = <b>moyenne pondérée<\/b> des β.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Exemple (final 2019)<\/span>R<sub>F<\/sub> = 0,8 %, β = 0,7, k<sub>M<\/sub> = 9,6 % → k<sub>E<\/sub> = 0,8 % + 0,7 × 8,8 % = <b>6,96 %<\/b>. V<sub>E<\/sub> = 23 $ × 31 M = <b>713 M$<\/b>.<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Piège<\/span>Si l'énoncé donne la <b>prime de risque<\/b> (k<sub>M<\/sub> − R<sub>F<\/sub>), ne retranche pas R<sub>F<\/sub> une deuxième fois. S'il donne le <b>rendement du marché<\/b> k<sub>M<\/sub>, il faut le retrancher.<\/div>"}, {"id": "c9", "short": "WACC and decision", "title": "9. WACC and enterprise value", "sub": "Session 9 · Vernimmen ch. 29 · <b>final questions 6 and 7<\/b>", "en": "<div class=\"f\">WACC = k<sub>E<\/sub> × V<sub>E<\/sub>/(V<sub>E<\/sub>+V<sub>D<\/sub>) + k<sub>D<\/sub> × (1 − T<sub>c<\/sub>) × V<sub>D<\/sub>/(V<sub>E<\/sub>+V<sub>D<\/sub>)<\/div>\n<ul>\n<li>Use <b>market values<\/b>, not balance-sheet book values.<\/li>\n<li>Interest is tax-deductible → <b>after-tax<\/b> cost of debt k<sub>D<\/sub>(1 − T).<\/li>\n<li>The WACC is the discount rate for a project's cash flows (with a stable capital structure) or for the company's. Value is created if the return on assets &gt; WACC.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">End of the Albioma 2019 case<\/span>\nV<sub>E<\/sub> = 713; V<sub>D<\/sub> = 1,106.2; total 1,819.2.<br>\nWACC = 6.96% × 713/1,819.2 + 2.8% × 0.7 × 1,106.2/1,819.2 = 2.73% + 1.19% = <b>3.92%<\/b>.<br>\nProject cash flows: −3,000,000; +444,000; +672,800; +787,360 + 1,230,000; +230,400.<br>\nNPV at 3.92% ≈ <b>+$45,000 &gt; 0 → invest<\/b>.<\/div>\n<details><summary>Your turn: quick WACC<\/summary>\nV<sub>E<\/sub> = 600, k<sub>E<\/sub> = 10%; V<sub>D<\/sub> = 400, k<sub>D<\/sub> = 5%; T = 25%.<br>\nWACC = 10% × 0.6 + 5% × 0.75 × 0.4 = 6% + 1.5% = <b>7.5%<\/b>.<\/details>\n<h3>Enterprise value from FCF (Microsoft case)<\/h3>\n<ol>\n<li>Operating cash flows: NOPAT = EBIT(1 − T), + depreciation − capex − ΔNWC.<\/li>\n<li>Value and cost of debt; value and cost of equity; WACC.<\/li>\n<li>Discount the FCF at the WACC → <b>enterprise value<\/b>.<\/li>\n<li>Equity value = enterprise value − debt; ÷ number of shares → compare with the share price.<\/li>\n<\/ol>", "fr": "<div class=\"f\">WACC = k<sub>E<\/sub> × V<sub>E<\/sub>/(V<sub>E<\/sub>+V<sub>D<\/sub>) + k<sub>D<\/sub> × (1 − T<sub>c<\/sub>) × V<sub>D<\/sub>/(V<sub>E<\/sub>+V<sub>D<\/sub>)<\/div>\n<ul>\n<li>Utiliser les <b>valeurs de marché<\/b>, pas les valeurs comptables du bilan.<\/li>\n<li>Les intérêts sont déductibles → coût de la dette <b>après impôt<\/b> k<sub>D<\/sub>(1 − T).<\/li>\n<li>Le WACC est le taux d'actualisation des flux d'un projet (à structure financière stable) ou de l'entreprise. On crée de la valeur si la rentabilité des actifs &gt; WACC.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Fin du cas Albioma 2019<\/span>\nV<sub>E<\/sub> = 713 ; V<sub>D<\/sub> = 1 106,2 ; total 1 819,2.<br>\nWACC = 6,96 % × 713/1 819,2 + 2,8 % × 0,7 × 1 106,2/1 819,2 = 2,73 % + 1,19 % = <b>3,92 %<\/b>.<br>\nFlux du projet : −3 000 000 ; +444 000 ; +672 800 ; +787 360 + 1 230 000 ; +230 400.<br>\nVAN à 3,92 % ≈ <b>+45 000 $ &gt; 0 → investir<\/b>.<\/div>\n<details><summary>À toi : WACC rapide<\/summary>\nV<sub>E<\/sub> = 600, k<sub>E<\/sub> = 10 % ; V<sub>D<\/sub> = 400, k<sub>D<\/sub> = 5 % ; T = 25 %.<br>\nWACC = 10 % × 0,6 + 5 % × 0,75 × 0,4 = 6 % + 1,5 % = <b>7,5 %<\/b>.<\/details>\n<h3>Valeur de l'entreprise par les FCF (cas Microsoft)<\/h3>\n<ol>\n<li>Flux d'exploitation : NOPAT = EBIT(1 − T), + amortissement − investissements − ΔBFR.<\/li>\n<li>Valeur et coût de la dette ; valeur et coût des fonds propres ; WACC.<\/li>\n<li>Actualiser les FCF au WACC → <b>valeur de l'entreprise<\/b>.<\/li>\n<li>Valeur des fonds propres = valeur de l'entreprise − dette ; ÷ nombre d'actions → comparer au cours.<\/li>\n<\/ol>"}, {"id": "method", "short": "Method and self-test", "title": "Method for exam day", "sub": "", "en": "<div class=\"box key\"><span class=\"lbl\">Steps for the case study<\/span>\n<ol>\n<li>Read the whole case and underline: sunk costs, opportunity costs, depreciation period, tax rate, NWC %, NWC timing, resale prices.<\/li>\n<li>Build a table year 0 → year 4 and fill it line by line (the layout of the answer keys).<\/li>\n<li>Debt: k<sub>D<\/sub> = R<sub>F<\/sub> + spread, then V<sub>D<\/sub> by discounting. Equity: k<sub>E<\/sub> with the CAPM, V<sub>E<\/sub> = share price × number of shares.<\/li>\n<li>WACC with market values and after-tax k<sub>D<\/sub>.<\/li>\n<li>NPV at the WACC, conclusion in one sentence: \"NPV &gt; 0, so we invest\".<\/li>\n<li>Use the year 2 and 3 cash flows given in the case (they give them so you can finish even if you made an error earlier).<\/li>\n<\/ol><\/div>\n<h3>Practice MCQ<\/h3>\n<div class=\"q\"><div class=\"qt\">1. A bond has a 5% coupon and market rates rise to 6%. Its price:<\/div><ol><li>rises above par<\/li><li>falls below par<\/li><li>does not change<\/li><\/ol>\n<details><summary>Answer<\/summary>b. Price and yield move in opposite directions; coupon &lt; YTM → price below par.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. In a project, the interest on the loan that finances it must be:<\/div><ol><li>deducted from the cash flows<\/li><li>ignored because it is in the discount rate<\/li><li>added to the cash flows<\/li><\/ol>\n<details><summary>Answer<\/summary>b. Otherwise financing is counted twice.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. Which risk is rewarded according to the CAPM?<\/div><ol><li>Total risk<\/li><li>Specific risk<\/li><li>Systematic risk<\/li><\/ol>\n<details><summary>Answer<\/summary>c. Specific risk is eliminated by diversification, so it is not rewarded.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. Two mutually exclusive projects: A has the higher IRR, B the higher NPV. You choose:<\/div><ol><li>A<\/li><li>B<\/li><li>the one with the shorter payback<\/li><\/ol>\n<details><summary>Answer<\/summary>b. In case of conflict, NPV wins (or use the incremental IRR).<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. An asset increasing in working capital (inventory +100):<\/div><ol><li>increases cash by 100<\/li><li>reduces cash by 100<\/li><li>has no effect<\/li><\/ol>\n<details><summary>Answer<\/summary>b. An asset that increases uses cash.<\/details><\/div>", "fr": "<div class=\"box key\"><span class=\"lbl\">Déroulé de l'étude de cas<\/span>\n<ol>\n<li>Lis tout l'énoncé et souligne : sunk costs, coûts d'opportunité, durée d'amortissement, taux d'impôt, % du BFR, timing du BFR, prix de revente.<\/li>\n<li>Fais un tableau année 0 → année 4 et remplis ligne par ligne (mise en forme des corrigés).<\/li>\n<li>Dette : k<sub>D<\/sub> = R<sub>F<\/sub> + spread, puis V<sub>D<\/sub> par actualisation. Actions : k<sub>E<\/sub> par CAPM, V<sub>E<\/sub> = cours × nombre d'actions.<\/li>\n<li>WACC avec valeurs de marché et k<sub>D<\/sub> après impôt.<\/li>\n<li>VAN au WACC, conclusion en une phrase : « VAN &gt; 0, donc on investit ».<\/li>\n<li>Utilise les flux des années 2 et 3 fournis dans l'énoncé (ils les donnent pour que tu puisses finir même en cas d'erreur avant).<\/li>\n<\/ol><\/div>\n<h3>Mini-QCM<\/h3>\n<div class=\"q\"><div class=\"qt\">1. Une obligation a un coupon de 5 % et les taux du marché montent à 6 %. Son prix :<\/div><ol><li>monte au-dessus du pair<\/li><li>baisse sous le pair<\/li><li>ne change pas<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Prix et taux varient en sens inverse ; coupon &lt; YTM → prix sous le pair.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. Dans un projet, les intérêts de l'emprunt qui le finance doivent :<\/div><ol><li>être déduits des flux<\/li><li>être ignorés car ils sont dans le taux d'actualisation<\/li><li>être ajoutés aux flux<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Sinon le financement est compté deux fois.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. Quel risque est rémunéré selon le CAPM ?<\/div><ol><li>Le risque total<\/li><li>Le risque spécifique<\/li><li>Le risque systématique<\/li><\/ol>\n<details><summary>Réponse<\/summary>c. Le risque spécifique s'élimine par diversification, il n'est donc pas rémunéré.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. Deux projets exclusifs : A a le TRI le plus élevé, B la VAN la plus élevée. On choisit :<\/div><ol><li>A<\/li><li>B<\/li><li>celui au payback le plus court<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. En cas de conflit, la VAN l'emporte (ou TRI incrémental).<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. Un actif en hausse dans le BFR (stocks +100) :<\/div><ol><li>augmente le cash de 100<\/li><li>réduit le cash de 100<\/li><li>n'a pas d'effet<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Un actif qui augmente consomme du cash.<\/details><\/div>"}], "cases": [{"kind": "p", "sec": "Practice case", "sid": "", "title": "Practice: a 3-year machine project", "body": "<p>Machine 300,000, straight-line over 3 years, no resale value. Extra sales 250,000 a year, cash costs 100,000 a year, tax 25%. NWC: 30,000 in year 0, recovered in year 3. WACC 10%.<\/p><ol><li>Year 0 cash flow.<\/li><li>Operating cash flow of years 1 to 3.<\/li><li>NPV and decision.<\/li><\/ol>", "answer": "<p><b>1.<\/b> −300,000 − 30,000 = <b>−330,000<\/b>.<\/p><p><b>2.<\/b> EBIT = 250,000 − 100,000 − 100,000 = 50,000; EBIT(1 − T) = 37,500; + depreciation 100,000 = <b>137,500<\/b> per year. Year 3: 137,500 + 30,000 = 167,500.<\/p><p><b>3.<\/b> NPV = −330,000 + 137,500/1.1 + 137,500/1.1² + 167,500/1.1³ = −330,000 + 125,000 + 113,636 + 125,845 ≈ <b>+34,481<\/b> &gt; 0 → invest.<\/p>", "fr": "<p>Année 0 : −330 000. Flux annuel : EBIT 50 000, après impôt 37 500, + amortissement 100 000 = 137 500 ; année 3 avec le BFR récupéré : 167 500. VAN ≈ +34 500 → on investit.<\/p>"}, {"kind": "ex", "title": "Course example: Mysmallbusiness (croissants)", "sec": "Financial statements", "sid": "c1", "body": "Needs: table 50 + cash register 100 + freezer 150 + microwave 150 = 450 of fixed assets; inventory 50; cash 50. Total = <b>550<\/b>. Financing: 300 contributed (equity) + 250 borrowed from parents over 5 years (debt). Assets 550 = Liabilities and equity 550.<br>\nTesla 2019: operating +2,405; investing −1,436; financing +1,529; FX +8 → change in cash <b>+$2,506M<\/b>.", "fr": "Besoins : table 50 + caisse 100 + congélateur 150 + micro-ondes 150 = 450 d'actifs immobilisés ; stock 50 ; caisse 50. Total = <b>550<\/b>. Financement : 300 d'apports (equity) + 250 empruntés aux parents sur 5 ans (dette). Actif 550 = Passif 550.<br>\nTesla 2019 : exploitation +2 405 ; investissement −1 436 ; financement +1 529 ; change +8 → variation de trésorerie <b>+2 506<\/b> M$."}, {"kind": "ex", "title": "Example", "sec": "Time value, NPV", "sid": "c2", "body": "€10,000 invested for 3 years at 10% → 10,000 × 1.1³ = <b>€13,310<\/b> (interest 1,000, 1,100, 1,210).<br>\nProject: −1,000 today, then 400, 500, 300; rate 8%.<br>\nPV = 400/1.08 + 500/1.08² + 300/1.08³ = 370.37 + 428.67 + 238.15 = 1,037.19 → <b>NPV = +37.19<\/b> → invest.", "fr": "10 000 € placés 3 ans à 10 % → 10 000 × 1,1³ = <b>13 310 €<\/b> (intérêts 1 000, 1 100, 1 210).<br>\nProjet : −1 000 aujourd'hui, puis 400, 500, 300 ; taux 8 %.<br>\nPV = 400/1,08 + 500/1,08² + 300/1,08³ = 370,37 + 428,67 + 238,15 = 1 037,19 → <b>VAN = +37,19<\/b> → on investit."}, {"kind": "q", "title": "Your turn: loan payment", "sec": "Time value, NPV", "sid": "c2", "body": "Loan of €20,000 over 5 years at 5%, constant annual payments: F = 20,000 × 0.05 / (1 − 1.05<sup>−5<\/sup>) = <b>€4,619.50 per year<\/b>.", "fr": "Prêt de 20 000 € sur 5 ans à 5 %, annuités constantes : F = 20 000 × 0,05 / (1 − 1,05<sup>−5<\/sup>) = <b>4 619,50 € par an<\/b>."}, {"kind": "ex", "title": "Course example: scale effect (required rate 25%)", "sec": "IRR and other criteria", "sid": "c3", "body": "Small: −10 then +40 (NPV 22, IRR 300%). Large: −25 then +65 (NPV 27, IRR 160%).<br>\nIncremental cash flows (large − small): −15 then +25 → incremental IRR <b>66.67%<\/b> &gt; 25% → take the <b>large<\/b> project, as the NPV says.", "fr": "Petit : −10 puis +40 (VAN 22, TRI 300 %). Gros : −25 puis +65 (VAN 27, TRI 160 %).<br>\nFlux incrémentaux (gros − petit) : −15 puis +25 → TRI incrémental <b>66,67 %<\/b> &gt; 25 % → prendre le <b>gros<\/b> projet, comme le dit la VAN."}, {"kind": "ex", "title": "Example", "sec": "IRR and other criteria", "sid": "c3", "body": "Loan at 10% with interest compounded semi-annually: (1 + 0.10/2)² − 1 = <b>10.25%<\/b>. The proportional rate (5% per half-year) is not equivalent. Only effective rates are comparable.", "fr": "Prêt à 10 % avec intérêts calculés semestriellement : (1 + 0,10/2)² − 1 = <b>10,25 %<\/b>. Le taux proportionnel (5 % par semestre) n'est pas équivalent. Seuls les taux effectifs sont comparables."}, {"kind": "ex", "title": "Worked example: 2019 final (Albioma, 3-year storage project)", "sec": "Incremental cash flows", "sid": "c4", "body": "Data: land owned (historical cost $0.5M, could be sold for $0.6M); plant $2.4M depreciated straight-line over 3 years; market study $0.1M already paid; sales $0.8M in year 1 then +20%/year; cost of sales 10%; admin costs $0.2M/year; tax 30%; receivables 10%, inventory 15%, payables 5% of sales; NWC financed at year end and recovered in year 4; resale in year 3: land $0.5M, plant $1M.\n<h4>Q1: year 0<\/h4>\nLand −600,000 (opportunity cost) + plant −2,400,000; study = sunk cost → <b>−3,000,000<\/b>.\n<h4>Q2: year 1<\/h4>\n<div class=\"f\">Sales                         800,000\n− Cost of sales (10%)          80,000\n− Admin costs                 200,000\n− Depreciation (2.4M / 3)     800,000\n= EBIT                       −280,000\n− Tax 30%                     −84,000   (tax saving)\n= EBIT(1 − T)                −196,000\n+ Depreciation                800,000   → 604,000\nNWC = (10% + 15% − 5%) × 800,000 = 160,000 → ΔNWC = 160,000\nYear 1 cash flow = 604,000 − 160,000 = <b>444,000<\/b><\/div>\nYear 4: no more activity, the year 3 NWC is recovered = 20% × 1,152,000 = <b>+230,400<\/b>.\n<h4>Q3: divestment in year 3<\/h4>\nLand sold 500,000, tax = 30% × (500,000 − 600,000) = −30,000 (saving). Plant sold 1,000,000, NBV = 0, tax = 300,000. Cash flow = 1,500,000 − 270,000 = <b>1,230,000<\/b>.", "fr": "Données : terrain possédé (coût historique 0,5 M$, revendable 0,6 M$) ; usine 2,4 M$ amortie linéairement sur 3 ans ; étude de marché 0,1 M$ déjà payée ; ventes 0,8 M$ en année 1 puis +20 %/an ; coût des ventes 10 % ; frais administratifs 0,2 M$/an ; impôt 30 % ; créances 10 %, stocks 15 %, fournisseurs 5 % des ventes ; BFR financé en fin d'année et récupéré en année 4 ; revente en année 3 : terrain 0,5 M$, usine 1 M$.\n<h4>Q1 : année 0<\/h4>\nTerrain −600 000 (coût d'opportunité) + usine −2 400 000 ; étude = sunk cost → <b>−3 000 000<\/b>.\n<h4>Q2 : année 1<\/h4>\n<div class=\"f\">Ventes                       800 000\n− Coût des ventes (10 %)       80 000\n− Frais administratifs        200 000\n− Amortissement (2,4 M / 3)   800 000\n= EBIT                       −280 000\n− Impôt 30 %                  −84 000   (économie d'impôt)\n= EBIT(1 − T)                −196 000\n+ Amortissement               800 000   → 604 000\nBFR = (10 % + 15 % − 5 %) × 800 000 = 160 000 → ΔBFR = 160 000\nFlux année 1 = 604 000 − 160 000 = <b>444 000<\/b><\/div>\nAnnée 4 : plus d'activité, on récupère le BFR de l'année 3 = 20 % × 1 152 000 = <b>+230 400<\/b>.\n<h4>Q3 : désinvestissement en année 3<\/h4>\nTerrain vendu 500 000, impôt = 30 % × (500 000 − 600 000) = −30 000 (économie). Usine vendue 1 000 000, VNC = 0, impôt = 300 000. Flux = 1 500 000 − 270 000 = <b>1 230 000<\/b>."}, {"kind": "ex", "title": "Course example: PVGO", "sec": "Valuing a stock", "sid": "c5", "body": "r = 15%, Div<sub>1<\/sub> = €5, g = 10%, EPS<sub>1<\/sub> = €8.33, ROE = 25%.<br>\nPrice = 5 / (0.15 − 0.10) = <b>€100<\/b>. Payout = 5 / 8.33 = 60%, so retention 40%; g = 25% × 40% = 10% ✓.<br>\nWithout growth: 8.33 / 0.15 = <b>€55.56<\/b>. So <b>PVGO = €44.44<\/b>. The value of a growth stock comes mostly from future investments (Amazon: PVGO ≈ 92% of the price; Walmart ≈ 30%).", "fr": "r = 15 %, Div<sub>1<\/sub> = 5 €, g = 10 %, BPA<sub>1<\/sub> = 8,33 €, ROE = 25 %.<br>\nPrix = 5 / (0,15 − 0,10) = <b>100 €<\/b>. Payout = 5 / 8,33 = 60 %, donc rétention 40 % ; g = 25 % × 40 % = 10 % ✓.<br>\nSans croissance : 8,33 / 0,15 = <b>55,56 €<\/b>. Donc <b>PVGO = 44,44 €<\/b>. La valeur d'une growth stock vient surtout des investissements futurs (Amazon : PVGO ≈ 92 % du prix ; Walmart ≈ 30 %)."}, {"kind": "ex", "title": "Course examples", "sec": "Valuing a bond", "sid": "c6", "body": "6% bond, 5 years, annual coupon, similar bonds yield 6.9%: 60/1.069 + … + 1,060/1.069⁵ = <b>963 → 96.3% of par<\/b>.<br>\n8% semi-annual coupon, 5 years, face value 1,000: coupon 40 over 10 half-years.<br>\n• YTM 10% → 5% per half-year → price = <b>922.78<\/b> (below par)<br>\n• YTM 7% → 3.5% per half-year → price = <b>1,041.58<\/b> (above par)", "fr": "Obligation 6 %, 5 ans, coupon annuel, obligations similaires à 6,9 % : 60/1,069 + … + 1 060/1,069⁵ = <b>963 → 96,3 % du pair<\/b>.<br>\nCoupon 8 % semestriel, 5 ans, nominal 1 000 : coupon 40 sur 10 semestres.<br>\n• YTM 10 % → taux 5 % par semestre → prix = <b>922,78<\/b> (sous le pair)<br>\n• YTM 7 % → 3,5 % par semestre → prix = <b>1 041,58<\/b> (au-dessus du pair)"}, {"kind": "ex", "title": "Example", "sec": "Risk and return", "sid": "c7", "body": "Historical returns: 10%, −5%, 15%, 4%. Mean = 6%. Deviations: 4, −11, 9, −2 → squares 16 + 121 + 81 + 4 = 222 (in %²). V = 222 / 3 = 74 → <b>σ ≈ 8.6%<\/b>.", "fr": "Rendements historiques : 10 %, −5 %, 15 %, 4 %. Moyenne = 6 %. Écarts : 4, −11, 9, −2 → carrés 16 + 121 + 81 + 4 = 222 (en %²). V = 222 / 3 = 74 → <b>σ ≈ 8,6 %<\/b>."}, {"kind": "ex", "title": "Example (2019 final)", "sec": "CAPM and cost of equity", "sid": "c8", "body": "R<sub>F<\/sub> = 0.8%, β = 0.7, k<sub>M<\/sub> = 9.6% → k<sub>E<\/sub> = 0.8% + 0.7 × 8.8% = <b>6.96%<\/b>. V<sub>E<\/sub> = $23 × 31M = <b>$713M<\/b>.", "fr": "R<sub>F<\/sub> = 0,8 %, β = 0,7, k<sub>M<\/sub> = 9,6 % → k<sub>E<\/sub> = 0,8 % + 0,7 × 8,8 % = <b>6,96 %<\/b>. V<sub>E<\/sub> = 23 $ × 31 M = <b>713 M$<\/b>."}, {"kind": "ex", "title": "End of the Albioma 2019 case", "sec": "WACC and decision", "sid": "c9", "body": "V<sub>E<\/sub> = 713; V<sub>D<\/sub> = 1,106.2; total 1,819.2.<br>\nWACC = 6.96% × 713/1,819.2 + 2.8% × 0.7 × 1,106.2/1,819.2 = 2.73% + 1.19% = <b>3.92%<\/b>.<br>\nProject cash flows: −3,000,000; +444,000; +672,800; +787,360 + 1,230,000; +230,400.<br>\nNPV at 3.92% ≈ <b>+$45,000 &gt; 0 → invest<\/b>.", "fr": "V<sub>E<\/sub> = 713 ; V<sub>D<\/sub> = 1 106,2 ; total 1 819,2.<br>\nWACC = 6,96 % × 713/1 819,2 + 2,8 % × 0,7 × 1 106,2/1 819,2 = 2,73 % + 1,19 % = <b>3,92 %<\/b>.<br>\nFlux du projet : −3 000 000 ; +444 000 ; +672 800 ; +787 360 + 1 230 000 ; +230 400.<br>\nVAN à 3,92 % ≈ <b>+45 000 $ &gt; 0 → investir<\/b>."}, {"kind": "q", "title": "Your turn: quick WACC", "sec": "WACC and decision", "sid": "c9", "body": "V<sub>E<\/sub> = 600, k<sub>E<\/sub> = 10%; V<sub>D<\/sub> = 400, k<sub>D<\/sub> = 5%; T = 25%.<br>\nWACC = 10% × 0.6 + 5% × 0.75 × 0.4 = 6% + 1.5% = <b>7.5%<\/b>.", "fr": "V<sub>E<\/sub> = 600, k<sub>E<\/sub> = 10 % ; V<sub>D<\/sub> = 400, k<sub>D<\/sub> = 5 % ; T = 25 %.<br>\nWACC = 10 % × 0,6 + 5 % × 0,75 × 0,4 = 6 % + 1,5 % = <b>7,5 %<\/b>."}], "quiz": [{"q": "A bond has a 5% coupon and market rates rise to 6%. Its price:", "o": ["rises above par", "falls below par", "does not change"], "a": [1], "e": "Price and yield move in opposite directions; coupon &lt; YTM → price below par.", "fr": "Prix et taux varient en sens inverse ; coupon &lt; YTM → prix sous le pair.", "src": "Method and self-test"}, {"q": "In a project, the interest on the loan that finances it must be:", "o": ["deducted from the cash flows", "ignored because it is in the discount rate", "added to the cash flows"], "a": [1], "e": "Otherwise financing is counted twice.", "fr": "Sinon le financement est compté deux fois.", "src": "Method and self-test"}, {"q": "Which risk is rewarded according to the CAPM?", "o": ["Total risk", "Specific risk", "Systematic risk"], "a": [2], "e": "Specific risk is eliminated by diversification, so it is not rewarded.", "fr": "Le risque spécifique s'élimine par diversification, il n'est donc pas rémunéré.", "src": "Method and self-test"}, {"q": "Two mutually exclusive projects: A has the higher IRR, B the higher NPV. You choose:", "o": ["A", "B", "the one with the shorter payback"], "a": [1], "e": "In case of conflict, NPV wins (or use the incremental IRR).", "fr": "En cas de conflit, la VAN l'emporte (ou TRI incrémental).", "src": "Method and self-test"}, {"q": "An asset increasing in working capital (inventory +100):", "o": ["increases cash by 100", "reduces cash by 100", "has no effect"], "a": [1], "e": "An asset that increases uses cash.", "fr": "Un actif qui augmente consomme du cash.", "src": "Method and self-test"}, {"q": "€10,000 at 10% for 3 years becomes:", "o": ["€13,000", "€13,310", "€13,100", "€12,100"], "a": [1], "e": "10,000 × 1.1³ = 13,310.", "fr": "10 000 × 1,1³ = 13 310.", "src": "Time value, NPV"}, {"q": "A growing perpetuity: the numerator is the cash flow of:", "o": ["Today (year 0)", "Year 1", "The last year", "Any year"], "a": [1], "e": "PV = F1 / (r − g). If given F0, multiply by (1 + g).", "fr": "VA = F1 / (r − g). Si on te donne F0, multiplie par (1 + g).", "src": "Time value, NPV"}, {"q": "Effective annual rate of 10% compounded semi-annually:", "o": ["10%", "10.25%", "5%", "20%"], "a": [1], "e": "(1 + 0.05)² − 1 = 10.25%.", "fr": "(1 + 0,05)² − 1 = 10,25 %.", "src": "IRR and other criteria"}, {"q": "Cash flows −, +, − (sign changes twice). The IRR:", "o": ["Is unique", "May be multiple: use the NPV", "Is always 0", "Equals the WACC"], "a": [1], "e": "Multiple sign changes can give several IRRs.", "fr": "Plusieurs changements de signe = plusieurs TRI possibles.", "src": "IRR and other criteria"}, {"q": "A market study already paid before the decision is:", "o": ["An opportunity cost", "A sunk cost: ignore it", "A tax shield", "Part of NWC"], "a": [1], "e": "It is spent whatever you decide.", "fr": "Il est payé quoi qu'on décide.", "src": "Incremental cash flows"}, {"q": "Land the firm already owns, used by the project, is valued at:", "o": ["Its historical cost", "Zero", "Its current resale value (opportunity cost)", "Its book value"], "a": [2], "e": "What the firm gives up by using it.", "fr": "Ce à quoi on renonce en l'utilisant.", "src": "Incremental cash flows"}, {"q": "Depreciation of 800,000 with a 30% tax rate saves:", "o": ["800,000", "240,000", "560,000", "0"], "a": [1], "e": "Tax shield = depreciation × tax rate.", "fr": "Économie d'impôt = amortissement × taux.", "src": "Incremental cash flows"}, {"q": "Plant sold 1,000,000 with a net book value of 0, tax 30%. After-tax cash flow:", "o": ["1,000,000", "700,000", "300,000", "1,300,000"], "a": [1], "e": "1,000,000 − 30% × (1,000,000 − 0).", "fr": "1 000 000 − 30 % × (1 000 000 − 0).", "src": "Incremental cash flows"}, {"q": "r = 15%, Div1 = €5, g = 10%. Gordon price:", "o": ["€33.3", "€50", "€100", "€150"], "a": [2], "e": "5 / (0.15 − 0.10) = 100.", "fr": "5 / (0,15 − 0,10) = 100.", "src": "Valuing a stock"}, {"q": "A company's P/E is well above its industry average. The stock looks:", "o": ["Cheap", "Expensive, or the market expects more growth", "Correctly priced in all cases", "Risk-free"], "a": [1], "e": "Always compare with growth and risk.", "fr": "À comparer avec la croissance et le risque.", "src": "Valuing a stock"}, {"q": "A bond's coupon is above its YTM. The bond trades:", "o": ["At par", "Above par", "Below par", "At zero"], "a": [1], "e": "Coupon > YTM → price above par.", "fr": "Coupon > YTM → prix au-dessus du pair.", "src": "Valuing a bond"}, {"q": "8% semi-annual coupon, 5 years: which rate and how many periods?", "o": ["8%, 5 periods", "4% per half-year, 10 periods", "8%, 10 periods", "4%, 5 periods"], "a": [1], "e": "Rate over the same period as the coupon.", "fr": "Taux sur la même période que le coupon.", "src": "Valuing a bond"}, {"q": "Rf = 0.8%, β = 0.7, market return 9.6%. Cost of equity:", "o": ["6.72%", "6.96%", "7.52%", "9.6%"], "a": [1], "e": "0.8% + 0.7 × (9.6% − 0.8%) = 6.96%.", "fr": "0,8 % + 0,7 × 8,8 % = 6,96 %.", "src": "CAPM and cost of equity"}, {"q": "Correlation 0.6, σJ = 30%, σM = 20%. Beta:", "o": ["0.4", "0.6", "0.9", "1.5"], "a": [2], "e": "β = Corr × σJ / σM = 0.6 × 30 / 20.", "fr": "β = Corr × σJ / σM = 0,6 × 30 / 20.", "src": "CAPM and cost of equity"}, {"q": "VE = 600 at 10%, VD = 400 at 5%, tax 25%. WACC:", "o": ["7.5%", "8%", "8.5%", "6%"], "a": [0], "e": "10% × 0.6 + 5% × 0.75 × 0.4 = 7.5%.", "fr": "10 % × 0,6 + 5 % × 0,75 × 0,4 = 7,5 %.", "src": "WACC and decision"}]}, {"id": "hr", "name": "Managing Human Resources", "short": "HR", "start": "2026-12-11T15:30:00+08:00", "when": "Ven. 11 déc. · 15:30–17:00", "fmt": "3 questions ouvertes · 1h30", "weight": "50 %", "rules": "Sans documents, sans brouillon", "hue": 330, "lead": "The 6 sessions: the manager's role, responsible and sustainable management, HRM, difficulties at work (bullying, stress, burnout), conflict management and AI at work. With the definitions and authors to quote in open answers.", "prof": "M1 · Ali AHSAN (Eliane BACHA's course)", "sections": [{"id": "exam", "short": "The final exam", "title": "The final exam", "sub": "Session 1 slides + syllabus", "en": "<div class=\"box key\"><span class=\"lbl\">Your calendar (exam notice)<\/span><b>Fri 11 December, 15:30–17:00<\/b> (Suzhou time). <b>Open questions<\/b> on TestWe, 1h30. No documents, no scratch paper, no calculator. Person in charge: Eliane Bacha.<br>Room 271, row 5, seat 6. Arrive 15 minutes early with your student card and a charged battery.<\/div>\n<ul>\n<li>\"<b>Comprehensive final exam<\/b>\": <b>3 open questions<\/b> on the course concepts, in December on <b>TestWe<\/b>. 50% of the grade.<\/li>\n<li>The rest: individual essay (25%) and group project (25%).<\/li>\n<\/ul>\n<div class=\"box key\"><span class=\"lbl\">How to answer<\/span>For each question: <b>definition with the author<\/b> (e.g. \"Storey (2007) defines HRM as…\") → <b>the elements of the model<\/b> (the 4 functions, the 5 stages…) → <b>a concrete example<\/b> (company from the course, experience) → <b>recommendation<\/b> for the manager. The course loves lists: learn them in order.<\/div>", "fr": "<div class=\"box key\"><span class=\"lbl\">Ton calendrier (convocation)<\/span><b>Ven. 11 décembre, 15 h 30–17 h<\/b> (heure de Suzhou). <b>Questions ouvertes<\/b> sur TestWe, 1 h 30. Pas de documents, pas de brouillon, pas de calculatrice. Responsable : Eliane Bacha.<br>Salle 271, rang 5, place 6. Arriver 15 min avant avec ta carte étudiante, batterie chargée.<\/div>\n<ul>\n<li>« <b>Comprehensive final exam<\/b> » : <b>3 questions ouvertes<\/b> sur les concepts du cours, en décembre sur <b>TestWe<\/b>. 50 % de la note.<\/li>\n<li>Le reste : essai individuel (25 %) et projet de groupe (25 %).<\/li>\n<\/ul>\n<div class=\"box key\"><span class=\"lbl\">Comment répondre<\/span>Pour chaque question : <b>définition avec l'auteur<\/b> (ex. « Storey (2007) définit la GRH comme… ») → <b>les éléments du modèle<\/b> (les 4 fonctions, les 5 étapes…) → <b>un exemple<\/b> concret (entreprise du cours, expérience) → <b>recommandation<\/b> pour le manager. Le cours aime les listes : apprends-les dans l'ordre.<\/div>"}, {"id": "c1", "short": "The manager's role", "title": "1. Know yourself to manage better: the manager's role", "sub": "Session 1 · Robbins and Coulter (2015), ch. 1; Goleman; Gardner", "en": "<ul>\n<li><b>Organization<\/b>: a deliberate arrangement of people to accomplish a purpose. Three characteristics: <b>goals, people, structure<\/b>.<\/li>\n<li><b>Management<\/b>: getting things done <b>effectively<\/b> and <b>efficiently<\/b>, with and through other people. <b>Effectiveness<\/b> = doing the right things (reaching goals). <b>Efficiency<\/b> = doing things right (most output for least input).<\/li>\n<li><b>Manager<\/b>: coordinates and oversees the work of others. The job is not personal achievement but helping others do their work.<\/li>\n<li>Levels: <b>top managers<\/b> (decisions for the whole organization), <b>middle managers<\/b> (manage first-line managers), <b>first-line managers<\/b> (manage non-managerial employees).<\/li>\n<\/ul>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">4 functions (after Fayol)<\/b>Fayol proposed 5 (plan, organize, command, coordinate, control). Today: <b>Planning<\/b> (goals, strategies, plans), <b>Organizing<\/b> (structuring work), <b>Leading<\/b> (working with and through people), <b>Controlling<\/b> (monitoring, comparing, correcting).<\/div>\n<div class=\"card\"><b class=\"t\">4 skills<\/b><b>Conceptual<\/b> (analyzing complex situations), <b>interpersonal<\/b> (communicating, motivating, delegating), <b>technical<\/b> (job-specific know-how), <b>political<\/b> (building a power base and networks).<\/div>\n<\/div>\n<h3>The 5 manager styles<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Style<\/th><th>Profile<\/th><th>How to adapt<\/th><\/tr>\n<tr><td><b>Bureaucrat<\/b><\/td><td>Cautious, controls through rules, authoritarian, high need for power<\/td><td>Know the rules and present your proposals as compliant with the system<\/td><\/tr>\n<tr><td><b>Autocrat<\/b><\/td><td>Strong opinions, does not listen, intolerant of mistakes<\/td><td>Avoid confrontation; have a source of power they lack<\/td><\/tr>\n<tr><td><b>Wheeler-dealer<\/b><\/td><td>Senior executive who negotiates resources, influence rather than coercion, delegates<\/td><td>Be proactive, decide and keep them informed<\/td><\/tr>\n<tr><td><b>Reluctant manager<\/b><\/td><td>Promoted for technical skill, laissez-faire, high need for achievement<\/td><td>Present several options with your argued preference<\/td><\/tr>\n<tr><td><b>Open manager<\/b><\/td><td>Participative, regular meetings, high need for affiliation<\/td><td>Get involved; know how to say no<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li>A good manager (Beck and Harter, HBR 2014): motivates each employee, is assertive, creates a culture of accountability, builds trusting relationships, makes decisions based on productivity rather than politics.<\/li>\n<li><b>Emotional intelligence<\/b> (Goleman, 1995): the best predictor of leadership. 5 components: <b>self-awareness, self-regulation, motivation, empathy, social skills<\/b>. It can be learned and increases with age.<\/li>\n<li><b>Five minds for the future<\/b> (Gardner, 2008): <b>disciplined<\/b> (think like an expert), <b>synthesizing<\/b> (sort and organize information), <b>creating<\/b> (ask new questions), <b>respectful<\/b> (value diversity), <b>ethical<\/b> (responsible as worker and citizen).<\/li>\n<li><b>VUCA world<\/b>: Volatility → vision; Uncertainty → understanding; Complexity → clarity and collaboration; Ambiguity → agility.<\/li>\n<li>McKinsey (De Smet et al., 2023), 5 leadership shifts: from profit to <b>impact<\/b>, from expectations to <b>wholeness<\/b>, from command to <b>collaboration<\/b>, from control to <b>evolution<\/b>, from competition to <b>co-creation<\/b>.<\/li>\n<li><b>Remote work<\/b> (Sawhney, 2021): monotony, isolation, burnout, less collaboration, hard to disconnect. Responses: rules with the family, dedicated space, routine, scheduled meetings, socializing, clear communication. Key: <b>empathy<\/b> (listen, take the other's perspective, build trust).<\/li>\n<\/ul>", "fr": "<ul>\n<li><b>Organisation<\/b> : arrangement délibéré de personnes pour atteindre un but. Trois caractéristiques : <b>objectifs, personnes, structure<\/b>.<\/li>\n<li><b>Management<\/b> : faire faire les choses <b>efficacement<\/b> et <b>efficiemment<\/b>, avec et par les autres. <b>Efficacité<\/b> (effectiveness) = faire les bonnes choses (atteindre les objectifs). <b>Efficience<\/b> (efficiency) = bien faire les choses (le plus de résultat pour le moins de ressources).<\/li>\n<li><b>Manager<\/b> : coordonne et supervise le travail des autres. Son travail n'est pas la réussite personnelle mais d'aider les autres à travailler.<\/li>\n<li>Niveaux : <b>top managers<\/b> (décisions pour toute l'organisation), <b>middle managers<\/b> (gèrent les managers de premier niveau), <b>first-line managers<\/b> (gèrent les employés non managers).<\/li>\n<\/ul>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">4 fonctions (d'après Fayol)<\/b>Fayol en proposait 5 (planifier, organiser, commander, coordonner, contrôler). Aujourd'hui : <b>Planning<\/b> (objectifs, stratégies, plans), <b>Organizing<\/b> (structurer le travail), <b>Leading<\/b> (travailler avec et par les gens), <b>Controlling<\/b> (suivre, comparer, corriger).<\/div>\n<div class=\"card\"><b class=\"t\">4 compétences<\/b><b>Conceptuelles<\/b> (analyser des situations complexes), <b>interpersonnelles<\/b> (communiquer, motiver, déléguer), <b>techniques<\/b> (savoir-faire du métier), <b>politiques<\/b> (se construire une base de pouvoir et des réseaux).<\/div>\n<\/div>\n<h3>Les 5 styles de managers<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Style<\/th><th>Profil<\/th><th>Comment s'adapter<\/th><\/tr>\n<tr><td><b>Bureaucrat<\/b><\/td><td>Prudent, contrôle par les règles, autoritaire, fort besoin de pouvoir<\/td><td>Connaître les règles et présenter ses propositions comme conformes au système<\/td><\/tr>\n<tr><td><b>Autocrat<\/b><\/td><td>Avis tranchés, n'écoute pas, intolérant aux erreurs<\/td><td>Éviter la confrontation ; avoir une source de pouvoir qu'il n'a pas<\/td><\/tr>\n<tr><td><b>Wheeler-dealer<\/b><\/td><td>Cadre senior qui négocie les ressources, influence plutôt que coercition, délègue<\/td><td>Être proactif, décider et le tenir informé<\/td><\/tr>\n<tr><td><b>Reluctant manager<\/b><\/td><td>Promu pour sa compétence technique, laisse faire, fort besoin d'accomplissement<\/td><td>Lui présenter plusieurs options avec sa préférence argumentée<\/td><\/tr>\n<tr><td><b>Open manager<\/b><\/td><td>Participatif, réunions régulières, fort besoin d'affiliation<\/td><td>S'impliquer ; savoir dire non<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li>Bon manager (Beck et Harter, HBR 2014) : motive chaque employé, s'affirme, crée une culture de responsabilité, construit des relations de confiance, décide sur la productivité et non la politique.<\/li>\n<li><b>Intelligence émotionnelle<\/b> (Goleman, 1995) : meilleur prédicteur du leadership. 5 composantes : <b>conscience de soi, maîtrise de soi, motivation, empathie, compétences sociales<\/b>. Elle s'apprend et augmente avec l'âge.<\/li>\n<li><b>Les 5 esprits du futur<\/b> (Gardner, 2008) : <b>discipliné<\/b> (penser en expert), <b>synthétique<\/b> (trier et organiser l'information), <b>créatif<\/b> (poser de nouvelles questions), <b>respectueux<\/b> (valoriser la diversité), <b>éthique<\/b> (responsable comme travailleur et citoyen).<\/li>\n<li><b>Monde VUCA<\/b> : Volatilité → avoir une vision ; Incertitude → comprendre ; Complexité → clarté et collaboration ; Ambiguïté → agilité.<\/li>\n<li>McKinsey (De Smet et al., 2023), 5 changements de leadership : du profit à l'<b>impact<\/b>, des attentes à la <b>plénitude<\/b>, du commandement à la <b>collaboration<\/b>, du contrôle à l'<b>évolution<\/b>, de la compétition à la <b>co-création<\/b>.<\/li>\n<li><b>Télétravail<\/b> (Sawhney, 2021) : monotonie, isolement, burn-out, moins de collaboration, difficulté à déconnecter. Réponses : règles avec la famille, espace dédié, routine, réunions planifiées, socialisation, communication claire. Clé : l'<b>empathie<\/b> (écouter, se mettre à la place, construire la confiance).<\/li>\n<\/ul>"}, {"id": "c2", "short": "Responsible management", "title": "2. Responsible management and sustainable business", "sub": "Session 2 · Laasch and Conaway (2016); Carroll; Freeman; Elkington", "en": "<ul>\n<li><b>Responsible leadership<\/b> (Voegtlin): 4 pillars: ethical decisions, listening to all stakeholders, solving problems with those affected, empowering everyone. Three roles (2021): <b>expert, facilitator, citizen<\/b>. It supports sustainable decisions and well-being.<\/li>\n<li><b>Responsible management<\/b>: the process of managing capital and the social, environmental and economic impacts, aiming at sustainable business (Laasch and Conaway). Maak and Pless (2006): based on moral values and oriented towards the common good.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Dimension<\/th><th>Author and idea<\/th><\/tr>\n<tr><td>Ethics and integrity<\/td><td><b>Carroll (1991)<\/b>: CSR pyramid: <b>economic, legal, ethical, philanthropic<\/b> responsibilities<\/td><\/tr>\n<tr><td>Stakeholders<\/td><td><b>Freeman (1984)<\/b>: obligations to everyone affected by the company, not only shareholders<\/td><\/tr>\n<tr><td>Sustainability<\/td><td><b>Elkington (1997)<\/b>: <b>triple bottom line<\/b>: people, planet, profit<\/td><\/tr>\n<tr><td>Reflexivity<\/td><td><b>Waddock (2007)<\/b>: ongoing critical reflection, not a checklist<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li>Responsible management process: an <b>actor<\/b> (company, NGO, state), <b>stakeholders<\/b>, an <b>impact area<\/b>. Example: HP (actor), employees (stakeholder), inclusion at work (impact).<\/li>\n<li><b>Responsible business<\/b>: committed to becoming sustainable (e.g. Innocent). <b>Sustainable business<\/b>: neutral to positive social, environmental and economic impact. <b>Sustainable development<\/b>: harmonizing these three capitals for society as a whole.<\/li>\n<li>3 instruments: <b>policies, codes and charters<\/b>; <b>social marketing<\/b>; <b>sustainability education<\/b>. Communication (AccountAbility): clear scope, agreed decision process, transparency, timeliness, flexibility.<\/li>\n<li>Dimensions of sustainable business: environment (Porter and van der Linde 1995: ecology and competitiveness go together), social, economic resilience (Hart and Milstein 2003), governance and <b>ESG<\/b> reporting (GRI, TCFD), new business models (Bocken et al. 2014). Companies with good ESG ratings have a lower cost of capital.<\/li>\n<li>Building a sustainable strategy: assess the problem, define your mission (Patagonia: quality, integrity, environment, justice), profitable strategy (triple bottom line), implement and reassess.<\/li>\n<li>Why it fails (Farri et al., HBR 2022): unsuitable processes, culture and leadership, lack of skills, gap between words and deeds. Solutions: community of practice, redesigning processes, a new social contract.<\/li>\n<li>The UN's <b>17 SDGs<\/b>; e.g. SDG 3 (health, well-being): Deloitte, 3 pillars: well-being built into work, benefits and policies, workspaces and remote work.<\/li>\n<\/ul>", "fr": "<ul>\n<li><b>Leadership responsable<\/b> (Voegtlin) : 4 piliers : décisions éthiques, écouter toutes les parties prenantes, résoudre les problèmes avec les personnes concernées, responsabiliser chacun. Trois rôles (2021) : <b>expert, facilitateur, citoyen<\/b>. Il soutient les décisions durables et le bien-être.<\/li>\n<li><b>Management responsable<\/b> : processus de gestion du capital et des impacts sociaux, environnementaux et économiques, visant l'entreprise durable (Laasch et Conaway). Maak et Pless (2006) : fondé sur des valeurs morales et orienté vers le bien commun.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Dimension<\/th><th>Auteur et idée<\/th><\/tr>\n<tr><td>Éthique et intégrité<\/td><td><b>Carroll (1991)<\/b> : pyramide de la RSE : responsabilités <b>économiques, légales, éthiques, philanthropiques<\/b><\/td><\/tr>\n<tr><td>Parties prenantes<\/td><td><b>Freeman (1984)<\/b> : des obligations envers tous ceux qui sont affectés par l'entreprise, pas seulement les actionnaires<\/td><\/tr>\n<tr><td>Durabilité<\/td><td><b>Elkington (1997)<\/b> : <b>triple bottom line<\/b> : people, planet, profit<\/td><\/tr>\n<tr><td>Réflexivité<\/td><td><b>Waddock (2007)<\/b> : réflexion critique continue, pas une checklist<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li>Processus du management responsable : un <b>acteur<\/b> (entreprise, ONG, État), des <b>parties prenantes<\/b>, une <b>zone d'impact<\/b>. Exemple : HP (acteur), employés (partie prenante), inclusion au travail (impact).<\/li>\n<li><b>Entreprise responsable<\/b> : engagée à devenir durable (ex. Innocent). <b>Entreprise durable<\/b> : impact neutre à positif sur les plans social, environnemental et économique. <b>Développement durable<\/b> : harmonisation de ces trois capitaux pour toute la société.<\/li>\n<li>3 instruments : <b>politiques, codes et chartes<\/b> ; <b>marketing social<\/b> ; <b>éducation à la durabilité<\/b>. Communication (AccountAbility) : périmètre clair, processus de décision convenu, transparence, rapidité, flexibilité.<\/li>\n<li>Dimensions de l'entreprise durable : environnement (Porter et van der Linde 1995 : écologie et compétitivité vont ensemble), social, résilience économique (Hart et Milstein 2003), gouvernance et reporting <b>ESG<\/b> (GRI, TCFD), nouveaux modèles d'affaires (Bocken et al. 2014). Les entreprises bien notées ESG ont un coût du capital plus faible.<\/li>\n<li>Bâtir une stratégie durable : évaluer le problème, définir sa mission (Patagonia : qualité, intégrité, environnement, justice), stratégie rentable (triple bottom line), mettre en œuvre et réévaluer.<\/li>\n<li>Pourquoi ça échoue (Farri et al., HBR 2022) : processus non adaptés, culture et leadership, manque de compétences, écart entre discours et actes. Solutions : communauté de pratique, repenser les processus, nouveau contrat social.<\/li>\n<li><b>17 ODD<\/b> de l'ONU ; ex. ODD 3 (santé, bien-être) : Deloitte, 3 piliers : bien-être intégré au travail, avantages et politiques, espaces et télétravail.<\/li>\n<\/ul>"}, {"id": "c3", "short": "HRM", "title": "3. Introduction to human resource management", "sub": "Session 3 · Robbins and Coulter ch. 13; Storey; Armstrong", "en": "<div class=\"box key\"><span class=\"lbl\">Definition to quote<\/span><b>Storey (2007)<\/b>: a distinctive approach to employment management which seeks to achieve <b>competitive advantage<\/b> through the strategic deployment of a highly <b>committed and capable<\/b> workforce, using an array of cultural, structural and personnel techniques.<\/div>\n<p>HRM matters because it is a source of competitive advantage, part of strategy, and it influences performance.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Attract<\/b>HR planning (5 steps: mission → HR objectives → current needs → forecast → plans), based on <b>job analysis<\/b> (job description and job specification); <b>recruitment<\/b> (agencies, internet, LinkedIn, referrals, <b>employer branding<\/b>); <b>selection<\/b> (cognitive, non-cognitive and performance characteristics).<\/div>\n<div class=\"card\"><b class=\"t\">Develop<\/b><b>Socialization<\/b>, <b>orientation<\/b> (onboarding), <b>training<\/b>: on the job (rotation, coaching, mentoring, role model) or off the job, management development; performance appraisal.<\/div>\n<div class=\"card\"><b class=\"t\">Retain<\/b>Career development (path, plan, <b>career plateau<\/b>), work-life balance, compensation (base pay, benefits, flexible benefits), managing exits and turnover, employee relations.<\/div>\n<\/div>\n<ul>\n<li><b>Reward management<\/b> (Armstrong, 2012): strategies and processes to recognize people's contribution fairly. Shaped by HR strategy, business strategy and culture; goal: <b>attract, motivate, retain<\/b>.<\/li>\n<li><b>Setting pay<\/b>: internal factors (ability to pay, job evaluation) and external factors (labour market, regulation, pay surveys); <b>job-based<\/b> approach (tasks, responsibilities) or <b>person-based<\/b> approach (skills, performance).<\/li>\n<li>Trends: <b>Generation Y<\/b> (1980–1994: autonomy, continuous feedback, teamwork, less loyal, digital nomads) and <b>Z<\/b> (1997–2013: recognition, flexibility, learning) → realistic job preview, meaningful work, authenticity. <b>Agile organizations<\/b>: small teams, flatter hierarchy, project mode.<\/li>\n<li>Country differences: interviews dominate selection in Europe; in France, 1.5% of payroll is spent on training; over 50% of employees trained in Finland and Sweden; Nordic countries lead on work-life balance.<\/li>\n<li>Remote work and HR: fairness, socialization, communication, training, technology. Recruiting for autonomy; pay adjusted to location (44% would accept −10% for permanent remote work); appraisal based on the quality of the work produced.<\/li>\n<\/ul>", "fr": "<div class=\"box key\"><span class=\"lbl\">Définition à citer<\/span><b>Storey (2007)<\/b> : approche distinctive de la gestion de l'emploi qui cherche un <b>avantage concurrentiel<\/b> par le déploiement stratégique d'une main-d'œuvre <b>engagée et compétente<\/b>, à l'aide de techniques culturelles, structurelles et de personnel.<\/div>\n<p>La GRH compte car elle est une source d'avantage concurrentiel, fait partie de la stratégie et influence la performance.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Attirer<\/b>Planification RH (5 étapes : mission → objectifs RH → besoins actuels → prévision → plans), fondée sur l'<b>analyse de poste<\/b> (description de poste et profil requis) ; <b>recrutement<\/b> (cabinets, internet, LinkedIn, cooptation, <b>marque employeur<\/b>) ; <b>sélection<\/b> (caractéristiques cognitives, non cognitives, de performance).<\/div>\n<div class=\"card\"><b class=\"t\">Développer<\/b><b>Socialisation<\/b>, <b>orientation<\/b> (intégration), <b>formation<\/b> : sur le poste (rotation, coaching, mentorat, modèle) ou hors poste, développement des managers ; évaluation de la performance.<\/div>\n<div class=\"card\"><b class=\"t\">Retenir<\/b>Développement de carrière (parcours, plan, <b>plateau de carrière<\/b>), équilibre vie pro/perso, rémunération (base, avantages, avantages flexibles), gestion des départs et du turnover, relations sociales.<\/div>\n<\/div>\n<ul>\n<li><b>Gestion des rémunérations<\/b> (Armstrong, 2012) : stratégies et processus pour reconnaître équitablement la contribution des personnes. Façonnée par la stratégie RH, la stratégie d'entreprise et la culture ; but : <b>attirer, motiver, retenir<\/b>.<\/li>\n<li><b>Détermination du salaire<\/b> : facteurs internes (capacité à payer, évaluation des postes) et externes (marché du travail, réglementation, enquêtes de salaires) ; approche par le <b>poste<\/b> (tâches, responsabilités) ou par la <b>personne<\/b> (compétences, performance).<\/li>\n<li>Tendances : <b>Génération Y<\/b> (1980–1994 : autonomie, feedback continu, travail d'équipe, peu fidèles, nomades numériques) et <b>Z<\/b> (1997–2013 : reconnaissance, flexibilité, apprentissage) → aperçu réaliste du poste, travail qui a du sens, authenticité. <b>Organisations agiles<\/b> : petites équipes, hiérarchie aplatie, mode projet.<\/li>\n<li>Différences entre pays : entretiens dominants pour la sélection en Europe ; en France, 1,5 % de la masse salariale consacrée à la formation ; plus de 50 % des salariés formés en Finlande et en Suède ; pays nordiques en pointe sur l'équilibre vie pro/perso.<\/li>\n<li>Télétravail et RH : équité, socialisation, communication, formation, technologie. Recrutement sur l'autonomie ; salaires ajustés selon le lieu (44 % accepteraient −10 % pour du télétravail permanent) ; évaluation sur la qualité du travail produit.<\/li>\n<\/ul>"}, {"id": "c4", "short": "Difficulties at work", "title": "4. Difficulties at work: bullying, stress, burnout", "sub": "Session 4 · Einarsen; Cummings and Cooper; Cartwright and Cooper; Deci and Ryan", "en": "<h3>Workplace bullying<\/h3>\n<p><b>Einarsen et al. (2011)<\/b>: harassing, offending, socially excluding someone or negatively affecting their work, <b>repeatedly and regularly<\/b> (e.g. weekly) and <b>over a period of time<\/b> (about 6 months). A one-off incident or a conflict between parties of equal strength is not bullying.<\/p>\n<ul>\n<li>Factors: rapid change and uncertainty, lack of time, growing diversity, downsizing, fewer middle managers, unclear cultural norms.<\/li>\n<li>Effects on the organization: lower productivity, absenteeism, intention to leave, mediation costs.<\/li>\n<li>Prevention: \"zero bullying\" policy, <b>training<\/b> (including managers), reporting system, <b>support<\/b> for victims.<\/li>\n<\/ul>\n<h3>Stress<\/h3>\n<p><b>Cummings and Cooper (1979)<\/b>: any force that pushes a psychological or physical function beyond its range of stability, producing strain.<\/p>\n<p><b>6 sources of stress<\/b> (Cartwright and Cooper): factors <b>intrinsic to the job<\/b>, <b>role<\/b> in the organization, <b>relationships<\/b> at work, <b>career<\/b> development, organizational <b>structure and climate<\/b>, factors <b>outside work<\/b>.<\/p>\n<p>Managing your stress: identify your triggers (journal), healthy responses (exercise, sleep), boundaries (no emails in the evening), recover, relax, talk to your supervisor, seek support (employee assistance programme). The manager: open communication, recognizing successes, team moments. The company: well-being, flexible hours, remote work, counselling, recognition.<\/p>\n<h3>Burnout<\/h3>\n<p>Exhaustion of mental, physical and emotional energy, when you constantly give without receiving in return. The manager helps by: monitoring workload, encouraging time off, work-life balance, remote work, career goals, open communication, leading by example.<\/p>\n<h3>Sexual harassment<\/h3>\n<p>A form of gender-based discrimination, illegal when it becomes a condition of employment, influences career decisions, disrupts work or creates a <b>hostile environment<\/b>.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">The manager's 7 actions<\/span>1. A clear written policy with several reporting channels · 2. Communicate it and have it signed · 3. Train (at least yearly) · 4. Audit employment decisions · 5. Investigate quickly and seriously · 6. Discipline (from warning to dismissal) · 7. Follow up with the person who complained.<\/div>\n<h3>New ways of working (NWW)<\/h3>\n<p>Remote work, nomadic work, flex office, coworking, virtual work (Aroles et al., 2021). <b>Self-determination theory<\/b> (Deci and Ryan): 3 psychological needs: <b>autonomy, competence, relatedness<\/b>. Remote work mainly threatens <b>relatedness<\/b> → motivating language, genuine concern for well-being, trust, information sharing, tools like Slack (Wang et al., 2021).<\/p>", "fr": "<h3>Le harcèlement moral (workplace bullying)<\/h3>\n<p><b>Einarsen et al. (2011)<\/b> : harceler, offenser, exclure ou nuire au travail de quelqu'un, de façon <b>répétée et régulière<\/b> (par ex. chaque semaine) et <b>dans la durée<\/b> (environ 6 mois). Un incident isolé ou un conflit entre parties de force égale n'en est pas.<\/p>\n<ul>\n<li>Facteurs : changement rapide et incertitude, manque de temps, diversité croissante, réductions d'effectifs, moins de managers intermédiaires, normes culturelles floues.<\/li>\n<li>Effets sur l'organisation : baisse de productivité, absentéisme, intentions de départ, coûts de médiation.<\/li>\n<li>Prévention : politique « zéro harcèlement », <b>formation<\/b> (dont les managers), système de signalement, <b>soutien<\/b> aux victimes.<\/li>\n<\/ul>\n<h3>Le stress<\/h3>\n<p><b>Cummings et Cooper (1979)<\/b> : toute force qui pousse une fonction psychologique ou physique hors de sa zone de stabilité, créant une tension.<\/p>\n<p><b>6 sources de stress<\/b> (Cartwright et Cooper) : facteurs <b>intrinsèques au poste<\/b>, <b>rôle<\/b> dans l'organisation, <b>relations<\/b> au travail, <b>carrière<\/b>, <b>structure et climat<\/b> de l'organisation, facteurs <b>hors travail<\/b>.<\/p>\n<p>Gérer son stress : identifier ses déclencheurs (journal), réponses saines (sport, sommeil), limites (pas de mails le soir), récupérer, se relaxer, parler au supérieur, chercher du soutien (programme d'aide aux employés). Le manager : communication ouverte, reconnaître les réussites, moments d'équipe. L'entreprise : bien-être, horaires flexibles, télétravail, conseil psychologique, reconnaissance.<\/p>\n<h3>Le burn-out<\/h3>\n<p>Épuisement de l'énergie mentale, physique et émotionnelle, quand on donne constamment sans recevoir en retour. Le manager aide en : surveillant la charge, encourageant les congés, l'équilibre vie pro/perso, le télétravail, les objectifs de carrière, la communication ouverte, en montrant l'exemple.<\/p>\n<h3>Le harcèlement sexuel<\/h3>\n<p>Forme de discrimination fondée sur le genre, illégale quand il devient une condition d'emploi, influence les décisions de carrière, perturbe le travail ou crée un <b>environnement hostile<\/b>.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Les 7 actions du manager<\/span>1. Politique écrite claire avec plusieurs voies de signalement · 2. La diffuser et la faire signer · 3. Former (au moins chaque année) · 4. Auditer les décisions d'emploi · 5. Enquêter vite et sérieusement · 6. Sanctionner (avertissement à licenciement) · 7. Faire le suivi auprès de la personne qui s'est plainte.<\/div>\n<h3>Nouvelles façons de travailler (NWW)<\/h3>\n<p>Télétravail, nomadisme, flex office, coworking, travail virtuel (Aroles et al., 2021). <b>Théorie de l'autodétermination<\/b> (Deci et Ryan) : 3 besoins psychologiques : <b>autonomie, compétence, appartenance (relatedness)<\/b>. Le travail à distance menace surtout l'<b>appartenance<\/b> → langage motivant, souci sincère du bien-être, confiance, partage d'information, outils comme Slack (Wang et al., 2021).<\/p>"}, {"id": "c5", "short": "Conflict management", "title": "5. Group processes: conflict management", "sub": "Session 5 · Robbins et al. ch. 15; Lewicki ch. 4", "en": "<p><b>Conflict<\/b>: perceived incompatible differences in a group that interfere with or oppose its tasks. <b>Functional<\/b> (constructive) or <b>dysfunctional<\/b> (destructive). Three types: <b>task<\/b> (content and goals), <b>relationship<\/b> (interpersonal relations), <b>process<\/b> (how the work gets done).<\/p>\n<h3>The 5-stage conflict process (Robbins)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Stage<\/th><th>Content<\/th><\/tr>\n<tr><td>1. Potential opposition or incompatibility<\/td><td>Conditions: <b>communication<\/b> (jargon, lack of information, noise), <b>structure<\/b> (size, specialization), <b>personal variables<\/b> (personality, emotions, values)<\/td><\/tr>\n<tr><td>2. Cognition and personalization<\/td><td>The parties defi
