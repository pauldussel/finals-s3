nRemedy: deterministic checks, schema validators and hard dollar caps between model calls.", "fr": "Précision de 95 % à chaque étape, étapes indépendantes :<br>\n5 étapes : 0,95⁵ = <b>77,4 %<\/b> · 10 étapes : 0,95¹⁰ = <b>59,8 %<\/b> · 20 étapes : 0,95²⁰ = <b>35,8 %<\/b> (deux fois sur trois, il faut intervenir).<br>\nRemède : contrôles déterministes, validateurs et plafonds de dépense entre les appels au modèle."}, {"kind": "ex", "title": "Case: Paris Media Group vs TechNext", "sec": "Legal and policy issues", "sid": "c7", "body": "A Paris publisher (1.8M-article archive, EBIT €22M, clicks −18%) finds that a US unicorn's OmniBrief reproduces its scoops (typos included), ignored its June 2024 robots.txt opt-out and cites it for a fake scandal.<br>\nOptions: sue in the US (high damages but 4–5 years, €10M+ fees, fair use defense) or in the EU (fast injunction under EU DSM Art. 4, smaller damages); accept the €14M/year offer (with 4 \"poison pills\": full waiver of claims, live scoops, flat fee with no audit, weights kept forever); \"sue to settle\"; EU publisher alliance.<br>\nLink with Negotiation: BATNA, anchoring, artificial deadline (offer valid 14 days).", "fr": "Un éditeur parisien (archives de 1,8 M d'articles, EBIT 22 M€, clics −18 %) découvre que l'outil OmniBrief d'une licorne américaine reproduit ses scoops (fautes de frappe comprises), a ignoré son opt-out robots.txt de juin 2024 et lui attribue un faux scandale.<br>\nOptions : procès aux États-Unis (dommages élevés mais 4–5 ans, 10 M€+ de frais, défense fair use) ou dans l'UE (injonction rapide via l'article 4 de la directive DSM, dommages plus faibles) ; accepter l'offre de 14 M€/an (avec 4 « pilules empoisonnées » : renonciation à tout recours, scoops en direct, montant fixe sans audit, poids conservés pour toujours) ; « attaquer pour négocier » ; alliance d'éditeurs européens.<br>\nLien avec le cours de négociation : BATNA, ancrage, date limite artificielle (offre valable 14 jours)."}, {"kind": "q", "title": "Typical open question: \"Your company wants to automate its customer service with an AI agent. What do you think?\"", "sec": "Practice MCQ", "sid": "method", "body": "Outline: 1) benefits (cost, 24/7, languages); 2) LLM limits (hallucinations, no accountability, Goodhart if you optimize closed tickets); 3) place the case in the matrix (open context + brand: keep a human, see Klarna); 4) controls (human escalation, refund caps, verification); 5) the five budget questions; recommendation: pilot on simple, verifiable requests.", "fr": "Plan : 1) bénéfices (coûts, disponibilité, langues) ; 2) limites des LLM (hallucinations, pas de responsabilité, Goodhart si on optimise les tickets clos) ; 3) placer le cas dans la matrice (contexte ouvert + marque : garder un humain, cf. Klarna) ; 4) contrôles (escalade vers un humain, limites de remboursement, vérification) ; 5) les 5 questions avant de financer ; recommandation : pilote sur les demandes simples et vérifiables."}], "quiz": [{"q": "A bank wants to find unusual groups of accounts without knowing what to look for:", "o": ["supervised", "unsupervised", "reinforcement"], "a": [1], "e": "", "fr": "", "src": "Practice MCQ"}, {"q": "In the course's vocabulary, the company's own asset is:", "o": ["the algorithm", "the model trained on its data", "inference"], "a": [1], "e": "The algorithm is the public recipe.", "fr": "L'algorithme est la recette publique.", "src": "Practice MCQ"}, {"q": "An agent chains 10 steps at 95% accuracy each. End-to-end success rate?", "o": ["95%", "≈ 60%", "≈ 36%"], "a": [1], "e": "0.95¹⁰ ≈ 59.8%.", "fr": "0,95¹⁰ ≈ 59,8 %.", "src": "Practice MCQ"}, {"q": "Which layer of the \"cake\" collects revenue from end customers?", "o": ["Energy", "Chips", "Models", "Applications"], "a": [3], "e": "", "fr": "", "src": "Practice MCQ"}, {"q": "A legal opinion in an M&amp;A deal belongs to quadrant:", "o": ["A, autonomy", "B, sandbox", "C, backstage", "D, human veto and signature"], "a": [3], "e": "", "fr": "", "src": "Practice MCQ"}, {"q": "Which of these is NOT one of the 3 drivers of the current AI wave?", "o": ["Powerful computing", "Advances in algorithms", "Massive amounts of data", "Open-source licenses"], "a": [3], "e": "The 3 drivers are computing power, algorithms and data.", "fr": "Les 3 moteurs : puissance de calcul, algorithmes, données.", "src": "AI vocabulary"}, {"q": "The Transformer architecture behind today's LLMs was made public in:", "o": ["2012", "2017", "2020", "2022"], "a": [1], "e": "Google, \"Attention Is All You Need\", 2017. That is why the algorithm itself is not a durable advantage.", "fr": "Publié par Google en 2017 : l'algorithme n'est donc pas un avantage durable.", "src": "AI vocabulary"}, {"q": "Which source of advantage is the hardest for rivals to copy?", "o": ["The algorithm", "Proprietary data", "Access to a public cloud", "The chatbot interface"], "a": [1], "e": "Proprietary data is unique to the firm; algorithms are public and cloud access can be bought.", "fr": "Les données propriétaires sont uniques ; l'algorithme est public et le cloud s'achète.", "src": "AI vocabulary"}, {"q": "In the course's vocabulary, \"inference\" is:", "o": ["Training the model on data", "The model answering a new question", "Choosing the algorithm", "Labelling the data"], "a": [1], "e": "Inference = serving: cheap per query, but paid millions of times a day.", "fr": "L'inférence = le service : peu cher par requête, mais payé des millions de fois.", "src": "Machine learning"}, {"q": "Spotify groups untagged songs into \"moods\". Which type of learning?", "o": ["Supervised", "Unsupervised", "Reinforcement", "Self-supervised"], "a": [1], "e": "No labels, the model finds hidden structure: unsupervised.", "fr": "Pas d'étiquettes, on cherche des groupes cachés : non supervisé.", "src": "Machine learning"}, {"q": "A model trained on 2019 data fails in March 2020. The course calls this:", "o": ["Hallucination", "Out-of-distribution", "Goodhart's law", "Overfitting to labels"], "a": [1], "e": "The new data no longer looks like the training data.", "fr": "Les nouvelles données ne ressemblent plus à celles de l'entraînement.", "src": "Machine learning"}, {"q": "An LLM confidently states a false fact. In the course, this is:", "o": ["A bug in the code", "A hallucination: a probable continuation that happens to be false", "A training failure", "The ELIZA effect"], "a": [1], "e": "Same mechanism as a correct answer: next probable token. Fluency is not evidence.", "fr": "Même mécanisme qu'une bonne réponse : le token le plus probable. La fluidité n'est pas une preuve.", "src": "LLMs"}, {"q": "An agent chains 20 steps, each 95% reliable. End-to-end success is about:", "o": ["95%", "77%", "60%", "36%"], "a": [3], "e": "0.95^20 ≈ 35.8%: two runs out of three need a human.", "fr": "0,95^20 ≈ 35,8 % : deux fois sur trois il faut intervenir.", "src": "Agents"}, {"q": "In the Five-Layer Cake, ASML belongs to which layer?", "o": ["Energy", "Chips", "Cloud", "Models"], "a": [1], "e": "ASML makes lithography machines: chip layer.", "fr": "ASML fabrique les machines de lithographie : couche puces.", "src": "Agents"}, {"q": "A Siemens copilot writing code for factory machines sits in which quadrant?", "o": ["A: scale autonomy", "B: deterministic sandbox and caps", "C: keep AI backstage", "D: human veto and signature"], "a": [1], "e": "Clear verifier but a high cost of error: sandbox and hard limits.", "fr": "Vérification possible mais erreur très coûteuse : bac à sable et plafonds.", "src": "Twelve industries"}, {"q": "In the Harvard & BCG study, consultants using AI on a tricky case performed:", "o": ["Better", "The same", "19% worse", "43% better"], "a": [2], "e": "They stopped checking facts (\"asleep at the wheel\").", "fr": "Ils ne vérifiaient plus les faits.", "src": "AI teams"}, {"q": "Which setup fits about 80% of company AI projects (catalogs, HR rules)?", "o": ["Fine-tuning", "RAG (open-book search)", "Training a model from scratch", "A public chatbot"], "a": [1], "e": "RAG: 2–4 weeks, low cost, few invented facts when restricted to company documents.", "fr": "RAG : 2–4 semaines, peu cher, peu de faits inventés.", "src": "AI teams"}, {"q": "Zarya of the Dawn showed that, in the US, purely AI-generated images:", "o": ["Are protected like photos", "Cannot be registered: human authorship is required", "Belong to the AI company", "Are in the public domain only in Europe"], "a": [1], "e": "A prompt is only a general direction.", "fr": "Un prompt n'est qu'une direction générale.", "src": "Legal and policy"}, {"q": "Which jurisdiction requires an algorithm filing and safety assessment before launching a public-facing AI service?", "o": ["United States", "European Union", "China", "None"], "a": [2], "e": "China: pre-launch filing; EU: AI Act risk tiers; US: voluntary commitments.", "fr": "Chine : dépôt avant lancement ; UE : AI Act ; US : engagements volontaires.", "src": "Legal and policy"}, {"q": "Under the EU AI Act, an AI tool used in HR is classed as:", "o": ["Minimal risk", "Limited risk", "High risk", "Banned"], "a": [2], "e": "High risk, with fines up to 7% of global revenue.", "fr": "Haut risque, amendes jusqu'à 7 % du CA mondial.", "src": "Legal and policy"}]}, {"id": "excel", "name": "Advanced Excel", "short": "Excel", "start": "2026-12-07T18:00:00+08:00", "when": "Lun. 7 déc. · 18:00–19:00", "fmt": "QCM · 1h", "weight": "inconnu", "rules": "Sans documents, sans brouillon, sans calculatrice", "hue": 145, "lead": "The 6 modules of the course: formulas and functions, lookups (VLOOKUP, XLOOKUP, INDEX/MATCH), tables and filters, pivot tables, data validation, what-if tools and macros. The exam is an MCQ: you need to know which formula to write and which tool to use.", "prof": "M1 · David CAPELLA", "sections": [{"id": "exam", "short": "The final exam", "title": "The final exam", "sub": "Your Google Calendar (created 25 November) + K2 course", "en": "<ul>\n<li><b>Monday 7 December, 18:00–19:00<\/b> (Suzhou time), room 271, row 5, seat 6. Arrive 15 minutes early with your student card and a charged battery.<\/li>\n<li><b>MCQ on TestWe, 1 hour.<\/b> No documents, no scratch paper, no calculator. Person in charge: David Capella.<\/li>\n<li>The K2 syllabus is still not published: the weight of the exam in the grade is unknown.<\/li>\n<\/ul>\n<div class=\"box exam\"><span class=\"lbl\">Important<\/span><b>Many final exam questions will be taken from the module quizzes.<\/b> The last two sections of this sheet are there to learn them: the 10 real questions of quiz 5, then an interactive trainer covering every module.<\/div>\n<div class=\"box key\"><span class=\"lbl\">What the questions look like<\/span>The module quizzes (Module01 to Module05 on K2) set the style: \"which formula returns…\", \"which tool would you use to…\", \"how many parameters at most…\", true/false, and sometimes several correct answers. On K2, quiz review is blocked (\"Review not permitted\"). No calculator: you must be able to read a formula and predict its result in your head.<\/div>\n<p>Material in <code>Excel/Final/<\/code>: exercise files for the 6 modules, PDF guides for modules 1, 2 and 4, instructions for labs 3 and 6.<\/p>", "fr": "<ul>\n<li><b>Lundi 7 décembre, 18 h–19 h<\/b> (heure de Suzhou), salle 271, rang 5, place 6. Arriver 15 min avant avec ta carte étudiante, batterie chargée.<\/li>\n<li><b>QCM sur TestWe, 1 h.<\/b> Pas de documents, pas de brouillon, pas de calculatrice. Responsable : David Capella.<\/li>\n<li>Le syllabus K2 n'est toujours pas publié : je n'ai pas le poids de l'examen dans la note.<\/li>\n<\/ul>\n<div class=\"box exam\"><span class=\"lbl\">Important<\/span>D'après ce que tu sais, <b>beaucoup de questions du final reprendront celles des quiz de module<\/b>. Les deux dernières sections de cette fiche servent à les apprendre : les 10 vraies questions du quiz 5, puis un entraînement interactif sur tous les modules.<\/div>\n<div class=\"box key\"><span class=\"lbl\">À quoi ressemblent les questions<\/span>Les quiz de module (Module01 à Module05 sur K2) donnent le style : « quelle formule donne… », « quel outil utiliser pour… », « combien de paramètres au maximum… », vrai/faux, et parfois plusieurs bonnes réponses. Sur K2, la relecture des quiz est bloquée (« Review not permitted »). Pas de calculatrice : il faut savoir lire une formule et prévoir son résultat de tête.<\/div>\n<p>Supports dans <code>Excel/Final/<\/code> : les fichiers d'exercices des 6 modules, les guides PDF des modules 1, 2 et 4, les consignes des labs 3 et 6.<\/p>"}, {"id": "m1", "short": "Basics and formulas", "title": "1. Basics: interface, formulas, functions", "sub": "Module 1 · \"Module 1 Lecture\" guide", "en": "<h3>Numbers to know<\/h3>\n<ul>\n<li><b>16,384 columns<\/b> (A to <b>XFD<\/b>) and <b>1,048,576 rows<\/b>. Over 3,000 functions.<\/li>\n<li>Text: 32,767 characters max in a cell; formula: under 8,192 characters. Sheet name: under 32 characters, without <code>\\ / * [ ] : ?<\/code>.<\/li>\n<li>Dates: from 01/01/1900 to 31/12/9999, stored as <b>serial numbers<\/b>. Times: fractions of a day (12:00 = 0.5).<\/li>\n<li><code>####<\/code> in a cell = column too narrow. <code>#DIV/0!<\/code> = division by zero. <code>#N/A<\/code> = value not found.<\/li>\n<\/ul>\n<h3>Shortcuts<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Shortcut<\/th><th>Effect<\/th><\/tr>\n<tr><td><code>Ctrl + arrow<\/code><\/td><td>Jump to the last filled cell<\/td><\/tr>\n<tr><td><code>Ctrl + Shift + arrow<\/code><\/td><td>Select up to the last filled cell<\/td><\/tr>\n<tr><td><code>Ctrl + A<\/code> (twice)<\/td><td>Select the block, then the whole sheet<\/td><\/tr>\n<tr><td><code>Ctrl + Enter<\/code><\/td><td>Fill the whole selection with the value typed<\/td><\/tr>\n<tr><td><code>Ctrl + D<\/code><\/td><td>Fill down<\/td><\/tr>\n<tr><td><code>F4<\/code><\/td><td>Make a reference absolute (<code>$A$1<\/code>)<\/td><\/tr>\n<tr><td><code>Alt<\/code><\/td><td>Access the ribbon with the keyboard<\/td><\/tr>\n<\/table><\/div>\n<h3>Relative and absolute references<\/h3>\n<div class=\"f\">=A1        relative: changes when copied\n=$A$1      absolute: never changes\n=$A1       column locked, row free\n=A$1       row locked, column free<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Course example<\/span>Compare each average with the class average in J27: <code>=J2&lt;$J$27<\/code>, then fill down. Without the <code>$<\/code>, the reference would slide to J28, J29… and the result would be wrong.<br>\nA <b>named range<\/b> (e.g. <code>FinalMark<\/code> for G2:G25, via the Name Box) behaves like an absolute reference: <code>=AVERAGE(FinalMark)<\/code>. Managed in Formulas &gt; Name Manager.<br>\nReference to another sheet: <code>='Sheet name'!B2<\/code>.<\/div>\n<h3>Basic functions<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Function<\/th><th>What it does<\/th><th>Trap<\/th><\/tr>\n<tr><td><code>SUM, AVERAGE, MIN, MAX, PRODUCT<\/code><\/td><td>Calculations on a range<\/td><td><code>=SUM(C3:C10)<\/code> includes a row inserted in the middle; <code>=SUM(C3,C4,C5…)<\/code> does not<\/td><\/tr>\n<tr><td><code>COUNT<\/code><\/td><td>Counts <b>numeric<\/b> cells<\/td><td><code>COUNT<\/code> on names = 0<\/td><\/tr>\n<tr><td><code>COUNTA<\/code><\/td><td>Counts <b>non-empty<\/b> cells, any type<\/td><td><\/td><\/tr>\n<tr><td><code>COUNTBLANK<\/code><\/td><td>Counts empty cells in <b>one<\/b> range<\/td><td><\/td><\/tr>\n<tr><td><code>ROUND(x; n)<\/code><\/td><td>Rounds to n decimals<\/td><td><\/td><\/tr>\n<tr><td><code>TRUNC(x; n)<\/code><\/td><td>Cuts to n decimals without rounding<\/td><td><\/td><\/tr>\n<tr><td><code>INT(x)<\/code><\/td><td>Integer part, rounded down<\/td><td><b>INT(−2.5) = −3<\/b> (always smaller)<\/td><\/tr>\n<tr><td><code>LEN<\/code><\/td><td>Number of characters<\/td><td>Spaces count<\/td><\/tr>\n<tr><td><code>FIND(text; within; [start])<\/code><\/td><td>Position of a text inside another<\/td><td><code>[ ]<\/code> = optional argument<\/td><\/tr>\n<tr><td><code>MID(text; start; n)<\/code>, <code>LEFT<\/code>, <code>RIGHT<\/code><\/td><td>Extract characters<\/td><td><\/td><\/tr>\n<tr><td><code>TRIM<\/code><\/td><td>Removes leading, trailing and double spaces<\/td><td><\/td><\/tr>\n<tr><td><code>&amp;<\/code>, <code>CONCATENATE<\/code>, <code>CONCAT<\/code>, <code>TEXTJOIN<\/code><\/td><td>Join texts<\/td><td><code>TEXTJOIN(\" , \"; TRUE; C11:C15)<\/code> adds a separator and ignores blanks<\/td><\/tr>\n<tr><td><code>UPPER, LOWER, PROPER<\/code><\/td><td>Uppercase, lowercase, first letter capitalized<\/td><td><\/td><\/tr>\n<\/table><\/div>\n<div class=\"box ex\"><span class=\"lbl\">Examples<\/span>Initials: <code>=LEFT(A2;1)&amp;LEFT(B2;1)<\/code> · Full name: <code>=A2&amp;\" \"&amp;B2<\/code> · <code>=MID(\"Excel2026\";6;4)<\/code> → <b>2026<\/b> · <code>=ROUND(2.456;1)<\/code> → 2.5; <code>=TRUNC(2.456;1)<\/code> → 2.4.<\/div>\n<h3>Dates and times<\/h3>\n<ul>\n<li><code>TODAY()<\/code>, <code>NOW()<\/code>, <code>DAY<\/code>, <code>MONTH<\/code>, <code>YEAR<\/code>, <code>WEEKDAY<\/code> (by default Sunday = 1), <code>DATE(year; month; day)<\/code>, <code>HOUR<\/code>, <code>MINUTE<\/code>, <code>SECOND<\/code>, <code>TIME(h; m; s)<\/code>.<\/li>\n<li>Days between two dates, both included: <code>=end − start + 1<\/code>. Years between two dates: <code>=DATEDIF(start; end; \"Y\")<\/code>.<\/li>\n<li>Typing <code>1/3<\/code> gives a date (3 January or 1 March); for the number, type <code>=1/3<\/code>.<\/li>\n<li>A sum of hours over 24 h displays badly (15:10 instead of 37:30): use the <code>[h]:mm:ss<\/code> format.<\/li>\n<\/ul>\n<div class=\"box trap\"><span class=\"lbl\">Classic trap<\/span>Paying $30 an hour for a total duration in D25: <code>=D25*30<\/code> is wrong, because Excel stores durations in <b>days<\/b> (1.62 days). You need <code>=D25*30*24<\/code>.<\/div>\n<p>Charts: select the data &gt; Insert; Chart Design and Format ribbons; \"Move Chart\" to a new sheet; \"Select Data\" to change the horizontal axis labels; \"Add Chart Element\" for data labels.<\/p>", "fr": "<h3>Chiffres à connaître<\/h3>\n<ul>\n<li><b>16 384 colonnes<\/b> (de A à <b>XFD<\/b>) et <b>1 048 576 lignes<\/b>. Plus de 3 000 fonctions.<\/li>\n<li>Texte : 32 767 caractères max dans une cellule ; formule : moins de 8 192 caractères. Nom de feuille : moins de 32 caractères, sans <code>\\ / * [ ] : ?<\/code>.<\/li>\n<li>Dates : du 01/01/1900 au 31/12/9999, stockées comme des <b>nombres de série<\/b>. Heures : des fractions de jour (12 h = 0,5).<\/li>\n<li><code>#<\/code> dans une cellule = colonne trop étroite. <code>#DIV/0!<\/code> = division par zéro. <code>#N/A<\/code> = valeur non trouvée.<\/li>\n<\/ul>\n<h3>Raccourcis<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Raccourci<\/th><th>Effet<\/th><\/tr>\n<tr><td><code>Ctrl + flèche<\/code><\/td><td>Aller à la dernière cellule remplie<\/td><\/tr>\n<tr><td><code>Ctrl + Maj + flèche<\/code><\/td><td>Sélectionner jusqu'à la dernière cellule remplie<\/td><\/tr>\n<tr><td><code>Ctrl + A<\/code> (deux fois)<\/td><td>Sélectionner le bloc, puis toute la feuille<\/td><\/tr>\n<tr><td><code>Ctrl + Entrée<\/code><\/td><td>Remplir toute la sélection avec la valeur saisie<\/td><\/tr>\n<tr><td><code>Ctrl + D<\/code><\/td><td>Recopier vers le bas<\/td><\/tr>\n<tr><td><code>F4<\/code><\/td><td>Passer une référence en absolue (<code>$A$1<\/code>)<\/td><\/tr>\n<tr><td><code>Alt<\/code><\/td><td>Accéder au ruban au clavier<\/td><\/tr>\n<\/table><\/div>\n<h3>Références relatives et absolues<\/h3>\n<div class=\"f\">=A1        relative : change quand on recopie\n=$A$1      absolue : ne change jamais\n=$A1       colonne bloquée, ligne libre\n=A$1       ligne bloquée, colonne libre<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple du cours<\/span>Comparer chaque moyenne à la moyenne de la classe en J27 : <code>=J2&lt;$J$27<\/code>, puis recopier vers le bas. Sans les <code>$<\/code>, la référence glisserait vers J28, J29… et le résultat serait faux.<br>\nUne <b>plage nommée<\/b> (ex. <code>FinalMark<\/code> pour G2:G25, via la zone Nom) se comporte comme une référence absolue : <code>=AVERAGE(FinalMark)<\/code>. Gestion dans Formules &gt; Gestionnaire de noms.<br>\nRéférence vers une autre feuille : <code>='Nom de la feuille'!B2<\/code>.<\/div>\n<h3>Fonctions de base<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Fonction<\/th><th>Ce qu'elle fait<\/th><th>Piège<\/th><\/tr>\n<tr><td><code>SUM, AVERAGE, MIN, MAX, PRODUCT<\/code><\/td><td>Calculs sur une plage<\/td><td><code>=SUM(C3:C10)<\/code> inclut une ligne insérée au milieu ; <code>=SUM(C3,C4,C5…)<\/code> non<\/td><\/tr>\n<tr><td><code>COUNT<\/code><\/td><td>Compte les cellules <b>numériques<\/b><\/td><td><code>COUNT<\/code> sur des noms = 0<\/td><\/tr>\n<tr><td><code>COUNTA<\/code><\/td><td>Compte les cellules <b>non vides<\/b>, tout type<\/td><td><\/td><\/tr>\n<tr><td><code>COUNTBLANK<\/code><\/td><td>Compte les cellules vides d'<b>une<\/b> plage<\/td><td><\/td><\/tr>\n<tr><td><code>ROUND(x; n)<\/code><\/td><td>Arrondit à n décimales<\/td><td><\/td><\/tr>\n<tr><td><code>TRUNC(x; n)<\/code><\/td><td>Coupe à n décimales sans arrondir<\/td><td><\/td><\/tr>\n<tr><td><code>INT(x)<\/code><\/td><td>Partie entière vers le bas<\/td><td><b>INT(−2,5) = −3<\/b> (toujours plus petit)<\/td><\/tr>\n<tr><td><code>LEN<\/code><\/td><td>Nombre de caractères<\/td><td>Les espaces comptent<\/td><\/tr>\n<tr><td><code>FIND(texte; dans; [début])<\/code><\/td><td>Position d'un texte dans un autre<\/td><td><code>[ ]<\/code> = argument facultatif<\/td><\/tr>\n<tr><td><code>MID(texte; début; nb)<\/code>, <code>LEFT<\/code>, <code>RIGHT<\/code><\/td><td>Extraire des caractères<\/td><td><\/td><\/tr>\n<tr><td><code>TRIM<\/code><\/td><td>Supprime les espaces au début, à la fin et en double<\/td><td><\/td><\/tr>\n<tr><td><code>&amp;<\/code>, <code>CONCATENATE<\/code>, <code>CONCAT<\/code>, <code>TEXTJOIN<\/code><\/td><td>Assembler des textes<\/td><td><code>TEXTJOIN(\" , \"; TRUE; C11:C15)<\/code> met un séparateur et ignore les vides<\/td><\/tr>\n<tr><td><code>UPPER, LOWER, PROPER<\/code><\/td><td>Majuscules, minuscules, première lettre en majuscule<\/td><td><\/td><\/tr>\n<\/table><\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemples<\/span>Initiales : <code>=LEFT(A2;1)&amp;LEFT(B2;1)<\/code> · Nom complet : <code>=A2&amp;\" \"&amp;B2<\/code> · <code>=MID(\"Excel2026\";6;4)<\/code> → <b>2026<\/b> · <code>=ROUND(2,456;1)<\/code> → 2,5 ; <code>=TRUNC(2,456;1)<\/code> → 2,4.<\/div>\n<h3>Dates et heures<\/h3>\n<ul>\n<li><code>TODAY()<\/code>, <code>NOW()<\/code>, <code>DAY<\/code>, <code>MONTH<\/code>, <code>YEAR<\/code>, <code>WEEKDAY<\/code> (par défaut dimanche = 1), <code>DATE(année; mois; jour)<\/code>, <code>HOUR<\/code>, <code>MINUTE<\/code>, <code>SECOND<\/code>, <code>TIME(h; m; s)<\/code>.<\/li>\n<li>Jours entre deux dates, bornes incluses : <code>=fin − début + 1<\/code>. Années entre deux dates : <code>=DATEDIF(début; fin; \"Y\")<\/code>.<\/li>\n<li>Saisir <code>1/3<\/code> donne une date (3 janvier) ; pour le nombre, taper <code>=1/3<\/code>.<\/li>\n<li>Une somme d'heures qui dépasse 24 h s'affiche mal (15:10 au lieu de 37:30) : utiliser le format <code>[h]:mm:ss<\/code>.<\/li>\n<\/ul>\n<div class=\"box trap\"><span class=\"lbl\">Piège classique<\/span>Payer 30 $ de l'heure pour une durée totale en D25 : <code>=D25*30<\/code> est faux, car Excel stocke la durée en <b>jours<\/b> (1,62 jour). Il faut <code>=D25*30*24<\/code>.<\/div>\n<p>Graphiques : sélectionner les données &gt; Insertion ; rubans Création de graphique et Format ; « Déplacer le graphique » vers une nouvelle feuille ; « Sélectionner les données » pour changer les étiquettes de l'axe horizontal ; « Ajouter un élément » pour les étiquettes de données.<\/p>"}, {"id": "m2", "short": "Lookups and tables", "title": "2. Lookup functions, sorting, filters and tables", "sub": "Module 2 · \"Module 2 Lecture\" guide", "en": "<div class=\"f\">VLOOKUP(lookup_value; table_array; col_index_num; [range_lookup])\nHLOOKUP(lookup_value; table_array; row_index_num; [range_lookup])\nXLOOKUP(lookup_value; lookup_array; return_array; [if_not_found]; [match_mode]; [search_mode])<\/div>\n<ul>\n<li><b>VLOOKUP<\/b> searches the <b>first column<\/b> of the table and returns the value from column n. Last argument: <code>FALSE<\/code> or 0 = <b>exact<\/b> match; <code>TRUE<\/code> or 1 = <b>approximate<\/b> match (the table must be sorted in <b>ascending<\/b> order).<\/li>\n<li>In approximate mode, Excel returns the row of the largest value <b>less than or equal to<\/b> the lookup value. E.g. price 675.18 with steps at 600 and 900 → the 600 step discount (10%). Price −100 → <code>#N/A<\/code> (nothing smaller).<\/li>\n<li>Always lock the table: <code>$H$4:$I$8<\/code>, or use a named table.<\/li>\n<li><b>HLOOKUP<\/b>: same thing for a horizontal table (searches the first row).<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Course examples<\/span><code>=VLOOKUP(C15;A3:C12;2;FALSE)<\/code> → the name matching the ID in C15.<br>\n<code>=VLOOKUP(C4;$H$4:$I$8;2;TRUE)<\/code> → the discount rate of the price step.<br>\n<code>=XLOOKUP(A3;C6:C15;A6:B15;\"ID not found\";0;1)<\/code> → name and country in one go, with a message if the ID does not exist.<\/div>\n<h3>Why XLOOKUP is more powerful<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>VLOOKUP / HLOOKUP<\/th><th>XLOOKUP<\/th><\/tr>\n<tr><td>Direction<\/td><td>Vertical or horizontal (two functions)<\/td><td>Both with one function<\/td><\/tr>\n<tr><td>Result column<\/td><td>Must be to the <b>right<\/b> of the lookup column<\/td><td>Anywhere<\/td><\/tr>\n<tr><td>Match<\/td><td>Exact or approximate<\/td><td>0 exact · −1 exact or next smaller · 1 exact or next larger · 2 wildcard<\/td><\/tr>\n<tr><td>Search direction<\/td><td>Top to bottom<\/td><td>1 first to last · −1 last to first · 2 / −2 binary search<\/td><\/tr>\n<tr><td>Missing value<\/td><td>Needs <code>IFERROR<\/code> or <code>IFNA<\/code><\/td><td>Built-in <code>if_not_found<\/code> argument<\/td><\/tr>\n<tr><td>Results<\/td><td>One value<\/td><td>Several columns possible<\/td><\/tr>\n<\/table><\/div>\n<h3>Sort, filter, format as a table<\/h3>\n<ul>\n<li>To sort on <b>several levels<\/b> (last name ascending, then first name descending): use the <b>Sort<\/b> dialog box in the Data tab. Two successive sorts with the filter button only keep the last one.<\/li>\n<li>You can <b>clear a filter<\/b>, but <b>not a sort<\/b>.<\/li>\n<li>Filters: by color, number filters (\"greater than\"), text filters (\"ends with\", \"contains\"). Wildcard <code>?<\/code> = any single character: <code>?a*<\/code> = second letter \"a\". <code>*<\/code> = any sequence of characters.<\/li>\n<li><b>Format as Table<\/b> (Home): automatic filters, table name in \"Table Design\", formulas that fill down on their own and use column names (structured references): <code>=[@FirstName]&amp;\" \"&amp;[@LastName]<\/code>, <code>=[@[Price per Unit]]*[@Quantity]<\/code>.<\/li>\n<li>Table options: <b>Total Row<\/b> (with a drop-down to change the calculation), <b>Remove Duplicates<\/b>, <b>slicer<\/b> to filter by clicking.<\/li>\n<\/ul>", "fr": "<div class=\"f\">VLOOKUP(valeur_cherchée; tableau; n°_colonne; [valeur_proche])\nHLOOKUP(valeur_cherchée; tableau; n°_ligne; [valeur_proche])\nXLOOKUP(valeur_cherchée; plage_recherche; plage_résultat; [si_non_trouvé]; [mode_correspondance]; [mode_recherche])<\/div>\n<ul>\n<li><b>VLOOKUP<\/b> cherche dans la <b>première colonne<\/b> du tableau et renvoie la valeur de la colonne n°. Dernier argument : <code>FALSE<\/code> ou 0 = correspondance <b>exacte<\/b> ; <code>TRUE<\/code> ou 1 = <b>approximative<\/b> (le tableau doit être trié par ordre <b>croissant<\/b>).<\/li>\n<li>En approximatif, Excel renvoie la ligne de la plus grande valeur <b>inférieure ou égale<\/b>. Ex. : prix 675,18 avec des paliers 600 et 900 → remise du palier 600 (10 %). Prix −100 → <code>#N/A<\/code> (rien d'inférieur).<\/li>\n<li>Toujours bloquer le tableau : <code>$H$4:$I$8<\/code>, ou utiliser un tableau nommé.<\/li>\n<li><b>HLOOKUP<\/b> : même chose pour un tableau horizontal (cherche dans la première ligne).<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Exemples du cours<\/span><code>=VLOOKUP(C15;A3:C12;2;FALSE)<\/code> → le nom correspondant à l'ID en C15.<br>\n<code>=VLOOKUP(C4;$H$4:$I$8;2;TRUE)<\/code> → le taux de remise du palier de prix.<br>\n<code>=XLOOKUP(A3;C6:C15;A6:B15;\"ID not found\";0;1)<\/code> → nom et pays d'un coup, avec un message si l'ID n'existe pas.<\/div>\n<h3>Pourquoi XLOOKUP est plus puissant<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>VLOOKUP / HLOOKUP<\/th><th>XLOOKUP<\/th><\/tr>\n<tr><td>Direction<\/td><td>Verticale ou horizontale (deux fonctions)<\/td><td>Les deux avec une seule fonction<\/td><\/tr>\n<tr><td>Colonne de résultat<\/td><td>Forcément à <b>droite<\/b> de la colonne cherchée<\/td><td>N'importe où<\/td><\/tr>\n<tr><td>Correspondance<\/td><td>Exacte ou approchée<\/td><td>0 exacte · −1 exacte ou plus petite · 1 exacte ou plus grande · 2 caractères génériques<\/td><\/tr>\n<tr><td>Sens de recherche<\/td><td>Haut vers bas<\/td><td>1 du premier au dernier · −1 du dernier au premier · 2 / −2 recherche binaire<\/td><\/tr>\n<tr><td>Valeur absente<\/td><td>Il faut <code>IFERROR<\/code> ou <code>IFNA<\/code><\/td><td>Argument <code>si_non_trouvé<\/code> intégré<\/td><\/tr>\n<tr><td>Résultats<\/td><td>Une seule valeur<\/td><td>Plusieurs colonnes possibles<\/td><\/tr>\n<\/table><\/div>\n<h3>Trier, filtrer, mettre sous forme de tableau<\/h3>\n<ul>\n<li>Trier sur <b>plusieurs niveaux<\/b> (nom croissant puis prénom décroissant) : passer par la boîte <b>Trier<\/b> de l'onglet Données. Deux tris successifs avec le bouton filtre ne gardent que le dernier.<\/li>\n<li>On peut <b>effacer un filtre<\/b>, mais <b>pas un tri<\/b>.<\/li>\n<li>Filtres : par couleur, numériques (« supérieur à »), textuels (« se termine par », « contient »). Caractère générique <code>?<\/code> = un caractère quelconque : <code>?a*<\/code> = deuxième lettre « a ». <code>*<\/code> = n'importe quelle suite de caractères.<\/li>\n<li><b>Mettre sous forme de tableau<\/b> (Accueil) : filtres automatiques, nom du tableau dans « Création de tableau », formules qui se recopient seules et utilisent les noms de colonnes : <code>=[@FirstName]&amp;\" \"&amp;[@LastName]<\/code>, <code>=[@[Price per Unit]]*[@Quantity]<\/code>.<\/li>\n<li>Options du tableau : <b>ligne de total<\/b> (avec liste déroulante pour changer le calcul), <b>supprimer les doublons<\/b>, <b>segment<\/b> (slicer) pour filtrer en cliquant.<\/li>\n<\/ul>"}, {"id": "m3", "short": "Pivot tables", "title": "3. Analyzing data with pivot tables", "sub": "Module 3 · files Part 1 to 3 + Lab 3", "en": "<ul>\n<li>Start from a range or, better, a <b>table<\/b> (the pivot table then follows new rows after a refresh). Insert &gt; PivotTable. Drag fields into <b>Rows<\/b>, <b>Columns<\/b>, <b>Values<\/b>, <b>Filters<\/b>.<\/li>\n<li>Change the value calculation: sum, count, average; \"Show Values As\" <b>% of Grand Total<\/b>.<\/li>\n<li><b>Group<\/b>: dates by year, quarter, month; numbers by intervals (e.g. 0 to 100,000 by steps of 20,000).<\/li>\n<li>Subtotals and grand totals; rename the pivot table (right-click &gt; PivotTable Options).<\/li>\n<li><b>Slicer<\/b> to filter a category, <b>timeline<\/b> to filter a period; <b>connect<\/b> them to several pivot tables (Report Connections) to filter them all at once.<\/li>\n<li>Combining two tables: either add a column with <code>VLOOKUP<\/code> (Part 2), or create a <b>relationship<\/b> between tables and use the data model (Part 3; the Relationships feature is not available in every version).<\/li>\n<li>PivotChart: a chart linked to the pivot table.<\/li>\n<\/ul>\n<div class=\"box trap\"><span class=\"lbl\">What Lab 3 graded (useful for the MCQ)<\/span>Exact table name (<code>tblPart1<\/code>); date format dd/mm/yyyy; multi-level sort in <b>one single<\/b> operation; total row added with the <b>table option<\/b>, not by hand; pivot table placed at a precise cell; grouping by quarter <b>only<\/b>; slicer and timeline connected to both pivot tables.<\/div>", "fr": "<ul>\n<li>Partir d'une plage ou, mieux, d'un <b>tableau<\/b> (le TCD suit alors les nouvelles lignes). Insertion &gt; Tableau croisé dynamique. Glisser les champs dans <b>Lignes<\/b>, <b>Colonnes<\/b>, <b>Valeurs<\/b>, <b>Filtres<\/b>.<\/li>\n<li>Changer le calcul des valeurs : somme, nombre, moyenne ; « Afficher les valeurs » en <b>% du total général<\/b>.<\/li>\n<li><b>Grouper<\/b> : des dates par année, trimestre, mois ; des nombres par intervalles (ex. de 0 à 100 000 par pas de 20 000).<\/li>\n<li>Sous-totaux et totaux généraux ; renommer le TCD (clic droit &gt; Options du tableau croisé dynamique).<\/li>\n<li><b>Segment<\/b> (slicer) pour filtrer une catégorie, <b>chronologie<\/b> (timeline) pour filtrer une période ; les <b>connecter<\/b> à plusieurs TCD pour les filtrer en même temps.<\/li>\n<li>Combiner deux tableaux : soit ajouter une colonne avec <code>VLOOKUP<\/code> (Part 2), soit créer une <b>relation<\/b> entre tableaux et utiliser le modèle de données (Part 3 ; la fonction Relations n'existe pas sur toutes les versions).<\/li>\n<li>Graphique croisé dynamique : un graphique lié au TCD.<\/li>\n<\/ul>\n<div class=\"box trap\"><span class=\"lbl\">Ce que le Lab 3 notait (utile pour le QCM)<\/span>Nom exact du tableau (<code>tblPart1<\/code>) ; format de date jj/mm/aaaa ; tri sur plusieurs niveaux en <b>une seule<\/b> opération ; ligne de total ajoutée par l'<b>option du tableau<\/b>, pas à la main ; TCD placé à une cellule précise ; grouper <b>uniquement<\/b> par trimestre ; segment et chronologie connectés aux deux TCD.<\/div>"}, {"id": "m4", "short": "Validation and advanced lookups", "title": "4. Data validation and advanced lookups", "sub": "Module 4 · \"Module 4 – Part 2\" guide", "en": "<h3>Data validation<\/h3>\n<p>Data &gt; Data Validation: only allow one type of entry (whole number between two limits, drop-down list, date or time within a period, text length, custom formula), with an <b>input message<\/b> and an <b>error alert<\/b> (Stop, Warning, Information). The course file practises on: customer ID, name, start and end dates, age, hours, postcode, username.<\/p>\n<h3>MATCH, XMATCH, INDEX<\/h3>\n<div class=\"f\">MATCH(value; range; type)             → the POSITION of the value in the range\n   type 0 = exact (no sorting needed)\n   type 1 = largest value ≤ (range sorted ascending)\n   type −1 = smallest value ≥ (range sorted descending)\nXMATCH(value; range; [type]; [mode])   → like MATCH + type 2 (wildcards) + mode −1 (from the end)\nINDEX(range; row_num; col_num)         → the VALUE at that intersection\nINDEX((range1;range2); row; col; area_num)   → \"reference\" form over several areas<\/div>\n<div class=\"box ex\"><span class=\"lbl\">INDEX + MATCH: the classic combination<\/span>\nSales by region (rows B4:B10) and by customer (columns C3:H3), values in C4:H10:<br>\n<code>=INDEX(C4:H10; MATCH(C14;B4:B10;0); MATCH(C15;C3:H3;0))<\/code> → sales of the region in C14 for the customer in C15.<br>\nAdvantage over VLOOKUP: the result column can be anywhere, and you search on two axes.<\/div>\n<ul>\n<li><b>Nested XLOOKUP<\/b> (two-way lookup, like INDEX/MATCH): <code>=XLOOKUP(D$2;$B$6:$B$14;XLOOKUP($C$3;$C$5:$F$5;$C$6:$F$14))<\/code>.<\/li>\n<li>Guide examples: <code>=XLOOKUP(F3;D3:D12;A3:C12;\"ID unknown\";−1;1)<\/code>; wildcard search starting from the end: <code>=XLOOKUP(F7;A3:A12;B3:B12;;2;−1)<\/code>.<\/li>\n<li><b>FILTER(array; include; [if_empty])<\/b>: returns every row that meets the condition. <code>*<\/code> between two conditions = <b>AND<\/b>; <code>+<\/code> = <b>OR<\/b>.<br><code>=FILTER(B3:E12;(LEFT(B3:B12;1)=H2)*(C3:C12=H3)*(MONTH(D3:D12)&lt;&gt;2);\"No matches found\")<\/code><\/li>\n<li>Depending on the computer settings, the argument separator is a comma or a semicolon.<\/li>\n<\/ul>", "fr": "<h3>Validation des données<\/h3>\n<p>Données &gt; Validation des données : n'autoriser qu'un type de saisie (nombre entier entre deux bornes, liste déroulante, date ou heure dans une période, longueur de texte, formule personnalisée), avec un <b>message de saisie<\/b> et un <b>message d'erreur<\/b> (arrêt, avertissement, information). Le fichier du cours s'entraîne sur : ID client, nom, dates de début et de fin, âge, heures, code postal, identifiant.<\/p>\n<h3>MATCH, XMATCH, INDEX<\/h3>\n<div class=\"f\">MATCH(valeur; plage; type)            → la POSITION de la valeur dans la plage\n   type 0 = exacte (pas besoin de trier)\n   type 1 = plus grande valeur ≤ (plage triée croissante)\n   type −1 = plus petite valeur ≥ (plage triée décroissante)\nXMATCH(valeur; plage; [type]; [sens])  → comme MATCH + type 2 (caractères génériques) + sens −1 (de la fin)\nINDEX(plage; n°_ligne; n°_colonne)    → la VALEUR à cette intersection\nINDEX((plage1;plage2); ligne; colonne; n°_zone)   → forme « référence » sur plusieurs zones<\/div>\n<div class=\"box ex\"><span class=\"lbl\">INDEX + MATCH : la combinaison classique<\/span>\nVentes par région (lignes B4:B10) et par client (colonnes C3:H3), valeurs en C4:H10 :<br>\n<code>=INDEX(C4:H10; MATCH(C14;B4:B10;0); MATCH(C15;C3:H3;0))<\/code> → la vente de la région en C14 pour le client en C15.<br>\nAvantage sur VLOOKUP : la colonne de résultat peut être n'importe où, et on cherche sur deux axes.<\/div>\n<ul>\n<li><b>XLOOKUP imbriqué<\/b> (recherche sur deux axes, comme INDEX/MATCH) : <code>=XLOOKUP(D$2;$B$6:$B$14;XLOOKUP($C$3;$C$5:$F$5;$C$6:$F$14))<\/code>.<\/li>\n<li>Exemples du guide : <code>=XLOOKUP(F3;D3:D12;A3:C12;\"ID unknown\";−1;1)<\/code> ; recherche par caractère générique en partant de la fin : <code>=XLOOKUP(F7;A3:A12;B3:B12;;2;−1)<\/code>.<\/li>\n<li><b>FILTER(plage; condition; [si_vide])<\/b> : renvoie toutes les lignes qui respectent la condition. <code>*<\/code> entre deux conditions = <b>ET<\/b> ; <code>+<\/code> = <b>OU<\/b>.<br><code>=FILTER(B3:E12;(LEFT(B3:B12;1)=H2)*(C3:C12=H3)*(MONTH(D3:D12)&lt;&gt;2);\"No matches found\")<\/code><\/li>\n<li>Selon les réglages de l'ordinateur, le séparateur d'arguments est la virgule ou le point-virgule.<\/li>\n<\/ul>"}, {"id": "m5", "short": "What-if and scripts", "title": "5. What-if analysis and automation", "sub": "Module 5 · WhatIF and \"Make things automatic\" files · Module05 quiz", "en": "<p>Data tab &gt; <b>What-If Analysis<\/b>: three tools.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Tool<\/th><th>Question it answers<\/th><th>Example<\/th><\/tr>\n<tr><td><b>Goal Seek<\/b><\/td><td>Which value of <b>one<\/b> input cell gives the result I want?<\/td><td>Which sales price gives a turnover of $1,500?<\/td><\/tr>\n<tr><td><b>Scenario Manager<\/b><\/td><td>Compare <b>several saved sets<\/b> of assumptions (optimistic, average, pessimistic) and produce a summary<\/td><td>Three scenarios of bonus rate and threshold<\/td><\/tr>\n<tr><td><b>Data Table<\/b><\/td><td>See the result of a formula for a series of values of <b>1 or 2<\/b> variables at most<\/td><td>Turnover for 10 prices and 10 quantities<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box key\"><span class=\"lbl\">Goal Seek vs Scenario Manager (quiz question)<\/span>Scenario Manager handles <b>multiple what-if scenarios<\/b>; Goal Seek finds <b>a single desired result<\/b> by changing one cell.<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Building a two-variable data table<\/span>\nB1 = cost price, B2 = sales price, B4 = result (calculated from B1 and B2). We want to test 10 values of B1 and 10 of B2 starting from A10:<br>\n1) in the <b>corner<\/b> A10: a link to the formula, <code>=B4<\/code>;<br>\n2) one series of values in a <b>column<\/b> below the corner (A11:A20) and the other in a <b>row<\/b> to the right of the corner (B10:K10);<br>\n3) select A10:K20 &gt; Data Table: \"row input cell\" = the cell matching the values in the row, \"column input cell\" = the cell matching the values in the column.<br>\nWhich variable goes where (B1 in the column and B2 in the row, or the reverse) does not matter, as long as the input cells match.<\/div>\n<ul>\n<li>The WhatIF file calculates a bonus: <code>=IF(E5&gt;$B$1;E5−$B$1;0)<\/code> (amount above the threshold), multiplied by the rate, then added to the fixed salary. Ideal to test the threshold and the rate with the three tools.<\/li>\n<li><b>Automating with scripts<\/b>: the <b>Automate<\/b> tab and <b>Office Scripts<\/b>. You record actions (\"Record Actions\") that become a reusable script, for example to format the IBM, TESLA and APPLE sheets the same way. Scripts also work in <b>Excel online<\/b>, unlike VBA macros.<\/li>\n<\/ul>", "fr": "<p>Onglet Données &gt; <b>Analyse de scénarios<\/b> (What-If Analysis) : trois outils.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Outil<\/th><th>Question qu'il résout<\/th><th>Exemple<\/th><\/tr>\n<tr><td><b>Valeur cible<\/b> (Goal Seek)<\/td><td>Quelle valeur d'<b>une<\/b> cellule d'entrée donne le résultat que je veux ?<\/td><td>Quel prix de vente pour un chiffre d'affaires de 1 500 $ ?<\/td><\/tr>\n<tr><td><b>Gestionnaire de scénarios<\/b> (Scenario Manager)<\/td><td>Comparer <b>plusieurs jeux<\/b> d'hypothèses enregistrés (optimiste, moyen, pessimiste) et produire une synthèse<\/td><td>Trois scénarios de taux de prime et de plafond<\/td><\/tr>\n<tr><td><b>Table de données<\/b> (Data Table)<\/td><td>Voir le résultat d'une formule pour une série de valeurs de <b>1 ou 2<\/b> variables au maximum<\/td><td>Chiffre d'affaires selon 10 prix et 10 quantités<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box key\"><span class=\"lbl\">Valeur cible vs gestionnaire de scénarios (question du quiz)<\/span>Le gestionnaire de scénarios gère <b>plusieurs scénarios<\/b> ; la valeur cible cherche <b>un seul résultat voulu<\/b> en faisant varier une seule cellule.<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Construire une table de données à 2 variables<\/span>\nB1 = prix de revient, B2 = prix de vente, B4 = résultat (calculé à partir de B1 et B2). On veut tester 10 valeurs de B1 et 10 de B2 à partir de A10 :<br>\n1) dans le <b>coin<\/b> A10 : un lien vers la formule, <code>=B4<\/code> ;<br>\n2) une série de valeurs en <b>colonne<\/b> sous le coin (A11:A20) et l'autre en <b>ligne<\/b> à droite du coin (B10:K10) ;<br>\n3) sélectionner A10:K20 &gt; Table de données : « cellule d'entrée en ligne » = la cellule qui correspond aux valeurs de la ligne, « cellule d'entrée en colonne » = celle des valeurs de la colonne.<br>\nLe sens (B1 en colonne et B2 en ligne, ou l'inverse) importe peu, du moment que les cellules d'entrée correspondent.<\/div>\n<ul>\n<li>Le fichier WhatIF calcule une prime : <code>=IF(E5&gt;$B$1;E5−$B$1;0)<\/code> (dépassement au-dessus du plafond), multiplié par le taux, puis ajouté au fixe. Idéal pour tester le plafond et le taux avec les trois outils.<\/li>\n<li><b>Automatiser avec des scripts<\/b> : onglet <b>Automatiser<\/b> (Automate) et les <b>Office Scripts<\/b>. On enregistre des actions (« Enregistrer des actions ») qui deviennent un script réutilisable, par exemple pour mettre en forme les feuilles IBM, TESLA et APPLE de la même façon. Les scripts marchent aussi dans <b>Excel en ligne<\/b>, contrairement aux macros VBA.<\/li>\n<\/ul>"}, {"id": "m6", "short": "Macros", "title": "6. Recording macros", "sub": "Module 6 · \"Recording a macro\" file + Lab 6", "en": "<ul>\n<li>A <b>macro<\/b> records a series of actions as <b>VBA<\/b> code so you can replay them. <b>Developer<\/b> tab (enable it in File &gt; Options &gt; Customize Ribbon) &gt; Record Macro: name (no spaces), optional shortcut, location (this workbook or Personal Macro Workbook).<\/li>\n<li><b>Relative references<\/b> (\"Use Relative References\" button): the macro replays the actions from the active cell; otherwise it always uses the same cells. Useful when the number of rows changes from one sheet to another.<\/li>\n<li>Save the workbook as <b>.xlsm<\/b>: an .xlsx does <b>not<\/b> keep macros (0 in Lab 6 otherwise).<\/li>\n<li>Running a macro: Developer &gt; Macros, a keyboard shortcut, or a <b>button<\/b> (Insert &gt; Form Controls) assigned to the macro.<\/li>\n<li>Security: Excel disables macros in downloaded files; you have to enable content.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Lab 6 in a nutshell<\/span>Macro \"Macro1\" that first clears the \"Extraction\" sheet, then copies from D1, D2 and D3 every row with an amount under €20, with the header only once in row 1; a button on the \"Menu\" sheet; file saved as .xlsm.<\/div>", "fr": "<ul>\n<li>Une <b>macro<\/b> enregistre une suite d'actions en code <b>VBA<\/b> pour les rejouer. Onglet <b>Développeur<\/b> (à activer dans Fichier &gt; Options &gt; Personnaliser le ruban) &gt; Enregistrer une macro : nom (sans espace), raccourci éventuel, emplacement (ce classeur ou classeur de macros personnel).<\/li>\n<li><b>Références relatives<\/b> (bouton « Utiliser les références relatives ») : la macro rejoue les actions à partir de la cellule active ; sinon elle reprend toujours les mêmes cellules. Utile quand le nombre de lignes change d'une feuille à l'autre.<\/li>\n<li>Enregistrer le classeur en <b>.xlsm<\/b> : un .xlsx ne garde <b>pas<\/b> les macros (0 au Lab 6 sinon).<\/li>\n<li>Lancer une macro : Développeur &gt; Macros, un raccourci clavier, ou un <b>bouton<\/b> (Insertion &gt; Contrôles de formulaire) affecté à la macro.<\/li>\n<li>Sécurité : Excel désactive les macros des fichiers téléchargés ; il faut activer le contenu.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Le Lab 6 en résumé<\/span>Macro « Macro1 » qui vide d'abord la feuille « Extraction », puis copie depuis D1, D2 et D3 toutes les lignes avec un montant inférieur à 20 €, l'en-tête une seule fois en ligne 1 ; un bouton sur la feuille « Menu » ; fichier en .xlsm.<\/div>"}, {"id": "quiz5", "short": "The real quiz 5 questions", "title": "The 10 real questions of the module 5 quiz", "sub": "From your screenshots of 2 November (folder <code>Excel/Module 5<\/code>) · answers checked against the course", "en": "<p>Many final exam questions are taken from the quizzes. These are the only ones we have word for word: learn them by heart. <span class=\"frline-inline\">(FR : beaucoup de questions du final reprennent celles des quiz ; apprends celles-ci par cœur.)<\/span><\/p>\n<div class=\"q\"><div class=\"qt\">1. How many parameters can I change at the maximum when using a Data Table (of \"what-if analysis\" tools)?<\/div><ol><li>2<\/li><li>4<\/li><li>1<\/li><li>3<\/li><\/ol>\n<details><summary>Answer<\/summary><b>a. 2.<\/b> A data table has one row input cell and one column input cell: 2 variables at most.<div class=\"frline\"><b>En français :<\/b> Une table de données a une cellule d'entrée en ligne et une en colonne : 2 variables au maximum.<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. What is the primary purpose of using Data Table (of \"what-if analysis\" tools)?<\/div><ol><li>To test what could be the impact of changing parameters on a calculated value<\/li><li>To perform complex calculations<\/li><li>To organize and display data in a tabular format<\/li><li>To Create Charts and Graphs<\/li><\/ol>\n<details><summary>Answer<\/summary><b>a.<\/b> See the effect of several input values on a calculated result. Trap: c describes an ordinary table, not a data table.<div class=\"frline\"><b>En français :<\/b> Voir l'effet de plusieurs valeurs d'entrée sur un résultat calculé. Piège : c. décrit un tableau classique, pas une table de données.<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. Which tool am I going to use if I want to check what could be the impact of changing multiple parameters to test different hypothesis depending on different parameters?<\/div><ol><li>Scenario manager<\/li><li>Data Table<\/li><li>Goal seek<\/li><li>Pivot tables<\/li><\/ol>\n<details><summary>Answer<\/summary><b>a. Scenario manager.<\/b> \"Multiple parameters\" + \"different hypotheses\" = saved sets of values = scenarios. A data table is limited to 2 parameters.<div class=\"frline\"><b>En français :<\/b> « Plusieurs paramètres » + « différentes hypothèses » = jeux de valeurs enregistrés = scénarios. La table de données est limitée à 2 paramètres.<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. Which layout am I going to use for my data table if I want to check the impact of changing B1 and B2 on the value of B4 (B4 depends on B1 and B2 by formulas)? We plan to test from A10, 10 values for B1 (10, 20… 100) and B2 (20, 40… 200). <i>(several answers possible)<\/i><\/div><ol><li>We don't have enough information to process<\/li><li>I will put in the cells from A11 to A20 the values to be used for B2 and in range B10 to K10 the values for B1<\/li><li>I will put in the cells from A10 to A19 the values to be used for B1 and in range B10 to K10 the values for B2<\/li><li>I will put in cell A10 a link to the cell B4<\/li><li>I will put in the cells from A11 to A20 the values to be used for B1 and in range B10 to K10 the values for B2<\/li><\/ol>\n<details><summary>Answer<\/summary><b>d<\/b> The corner A10 holds the formula (=B4). One series goes <b>below<\/b> the corner (A11:A20), the other <b>to the right<\/b> (B10:K10). Which variable goes where does not matter as long as the input cells match, so b and e are both valid. c is wrong (A10 is the corner, not a value).<div class=\"frline\"><b>En français :<\/b>, plus <b>b<\/b> et <b>e<\/b>. Le coin A10 contient la formule (=B4). Une série va <b>sous<\/b> le coin (A11:A20), l'autre <b>à droite<\/b> (B10:K10). Peu importe quelle variable va où, tant que les cellules d'entrée correspondent : b et e sont donc toutes les deux valables. c est faux (A10 est le coin, pas une valeur). Si la question n'accepte qu'une disposition, prends <b>d + e<\/b> (B1 en colonne, dans l'ordre de l'énoncé).<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. What does the \"Automate ribbon\" allow us to do?<\/div><ol><li>It checks and corrects errors<\/li><li>Create a VBA code to manipulate the Excel document<\/li><li>To create a Javascript script to manipulate the excel document<\/li><li>It allows you to automatically save the different versions of the document<\/li><\/ol>\n<details><summary>Answer<\/summary><b>c.<\/b> The Automate tab creates <b>Office Scripts<\/b>, written in TypeScript (a version of JavaScript). VBA is for macros in the Developer tab (module 6).<div class=\"frline\"><b>En français :<\/b> L'onglet Automatiser crée des <b>Office Scripts<\/b>, écrits en TypeScript (une version de JavaScript). Le VBA, c'est les macros de l'onglet Développeur (module 6).<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">6. It's possible to create and use scripts created in the automate ribbon when editing the document with the Excel online<\/div><ol><li>True<\/li><li>False<\/li><\/ol>\n<details><summary>Answer<\/summary><b>True.<\/b> Office Scripts work in Excel online (that is where they were born). VBA macros do not run online.<div class=\"frline\"><b>En français :<\/b> Les Office Scripts marchent dans Excel en ligne (c'est même là qu'ils sont nés). Les macros VBA, elles, ne s'exécutent pas en ligne.<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">7. How does Scenario Manager differ from Goal Seek in Excel?<\/div><ol><li>Scenario Manager allows for multiple what-if scenarios, while Goal Seek finds a single desired result<\/li><li>Goal Seek allows for multiple what-if scenarios, while Scenario Manager finds a single desired result<\/li><li>Goal Seek is used for creating interactive dashboards, while Scenario Manager is used for creating pivot tables<\/li><li>Scenario Manager is used for sorting data, while Goal Seek is used for filtering data<\/li><\/ol>\n<details><summary>Answer<\/summary><b>a.<\/b> Trap: b is the same sentence reversed.<div class=\"frline\"><b>En français :<\/b> Piège : b. est la même phrase inversée.<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">8. Which of the following statements best describes the purpose of using Scenario Manager?<\/div><ol><li>To display data in a tabular format for easy analysis<\/li><li>To perform iterative calculations based on changing criteria<\/li><li>To find the input value required to achieve a specific result<\/li><li>To create and manage different sets of input values for what-if analysis<\/li><\/ol>\n<details><summary>Answer<\/summary><b>d.<\/b> Trap: c is the definition of <b>Goal Seek<\/b>.<div class=\"frline\"><b>En français :<\/b> Piège : c. est la définition de la <b>valeur cible<\/b> (Goal Seek).<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">9. It is possible to remove a few values from a Data Table (of \"what-if analysis\" tools)<\/div><ol><li>True<\/li><li>False<\/li><\/ol>\n<details><summary>Answer<\/summary><b>False.<\/b> Data table results form one block (TABLE array formula): Excel refuses with \"Cannot change part of a data table\". You can only clear the whole table.<div class=\"frline\"><b>En français :<\/b> Les résultats d'une table de données forment un bloc (formule matricielle TABLE) : Excel refuse « Cannot change part of a data table ». On ne peut effacer que la table entière.<\/div><\/details><\/div>\n<div class=\"q\"><div class=\"qt\">10. It's possible to put a Data Table (of \"what-if analysis\" tools) in a different worksheet from the input cells<\/div><ol><li>True<\/li><li>False<\/li><\/ol>\n<details><summary>Answer<\/summary><b>False.<\/b> The input cell must be on the <b>same sheet<\/b> as the table (\"Input cell reference is not valid\").<div class=\"frline\"><b>En français :<\/b> La cellule d'entrée doit être sur la <b>même feuille<\/b> que la table (« Input cell reference is not valid »). Astuce si besoin : mettre la table sur la feuille du modèle.<\/div><\/details><\/div>", "fr": ""}], "cases": [{"kind": "p", "sec": "Practice case", "sid": "", "title": "Practice: read the formulas", "body": "<ol><li><code>=VLOOKUP(450;$H$4:$I$8;2;TRUE)<\/code> with steps 0, 300, 600, 900 → 0%, 5%, 10%, 15%.<\/li><li><code>=INDEX(C4:H10;3;2)<\/code><\/li><li><code>=FILTER(A2:C20;(B2:B20=\"Paris\")+(C2:C20&gt;100))<\/code><\/li><li><code>=INT(-3,7)<\/code> and <code>=TRUNC(-3,7)<\/code><\/li><\/ol>", "answer": "<p><b>1.<\/b> Largest step ≤ 450 is 300 → <b>5%<\/b>.<\/p><p><b>2.<\/b> Row 3, column 2 of C4:H10 → the value in <b>D6<\/b>.<\/p><p><b>3.<\/b> <code>+<\/code> = OR: rows where B is Paris <b>or<\/b> C &gt; 100.<\/p><p><b>4.<\/b> INT rounds down: <b>−4<\/b>; TRUNC cuts: <b>−3<\/b>.<\/p>", "fr": "<p>1. 5 % (palier 300). 2. D6. 3. Le + veut dire OU. 4. INT(−3,7) = −4, TRUNC(−3,7) = −3.<\/p>"}, {"kind": "ex", "title": "Course example", "sec": "Basics and formulas", "sid": "m1", "body": "Compare each average with the class average in J27: <code>=J2&lt;$J$27<\/code>, then fill down. Without the <code>$<\/code>, the reference would slide to J28, J29… and the result would be wrong.<br>\nA <b>named range<\/b> (e.g. <code>FinalMark<\/code> for G2:G25, via the Name Box) behaves like an absolute reference: <code>=AVERAGE(FinalMark)<\/code>. Managed in Formulas &gt; Name Manager.<br>\nReference to another sheet: <code>='Sheet name'!B2<\/code>.", "fr": "Comparer chaque moyenne à la moyenne de la classe en J27 : <code>=J2&lt;$J$27<\/code>, puis recopier vers le bas. Sans les <code>$<\/code>, la référence glisserait vers J28, J29… et le résultat serait faux.<br>\nUne <b>plage nommée<\/b> (ex. <code>FinalMark<\/code> pour G2:G25, via la zone Nom) se comporte comme une référence absolue : <code>=AVERAGE(FinalMark)<\/code>. Gestion dans Formules &gt; Gestionnaire de noms.<br>\nRéférence vers une autre feuille : <code>='Nom de la feuille'!B2<\/code>."}, {"kind": "ex", "title": "Examples", "sec": "Basics and formulas", "sid": "m1", "body": "Initials: <code>=LEFT(A2;1)&amp;LEFT(B2;1)<\/code> · Full name: <code>=A2&amp;\" \"&amp;B2<\/code> · <code>=MID(\"Excel2026\";6;4)<\/code> → <b>2026<\/b> · <code>=ROUND(2.456;1)<\/code> → 2.5; <code>=TRUNC(2.456;1)<\/code> → 2.4.", "fr": "Initiales : <code>=LEFT(A2;1)&amp;LEFT(B2;1)<\/code> · Nom complet : <code>=A2&amp;\" \"&amp;B2<\/code> · <code>=MID(\"Excel2026\";6;4)<\/code> → <b>2026<\/b> · <code>=ROUND(2,456;1)<\/code> → 2,5 ; <code>=TRUNC(2,456;1)<\/code> → 2,4."}, {"kind": "ex", "title": "Course examples", "sec": "Lookups and tables", "sid": "m2", "body": "<code>=VLOOKUP(C15;A3:C12;2;FALSE)<\/code> → the name matching the ID in C15.<br>\n<code>=VLOOKUP(C4;$H$4:$I$8;2;TRUE)<\/code> → the discount rate of the price step.<br>\n<code>=XLOOKUP(A3;C6:C15;A6:B15;\"ID not found\";0;1)<\/code> → name and country in one go, with a message if the ID does not exist.", "fr": "<code>=VLOOKUP(C15;A3:C12;2;FALSE)<\/code> → le nom correspondant à l'ID en C15.<br>\n<code>=VLOOKUP(C4;$H$4:$I$8;2;TRUE)<\/code> → le taux de remise du palier de prix.<br>\n<code>=XLOOKUP(A3;C6:C15;A6:B15;\"ID not found\";0;1)<\/code> → nom et pays d'un coup, avec un message si l'ID n'existe pas."}, {"kind": "ex", "title": "INDEX + MATCH: the classic combination", "sec": "Validation and advanced lookups", "sid": "m4", "body": "Sales by region (rows B4:B10) and by customer (columns C3:H3), values in C4:H10:<br>\n<code>=INDEX(C4:H10; MATCH(C14;B4:B10;0); MATCH(C15;C3:H3;0))<\/code> → sales of the region in C14 for the customer in C15.<br>\nAdvantage over VLOOKUP: the result column can be anywhere, and you search on two axes.", "fr": "Ventes par région (lignes B4:B10) et par client (colonnes C3:H3), valeurs en C4:H10 :<br>\n<code>=INDEX(C4:H10; MATCH(C14;B4:B10;0); MATCH(C15;C3:H3;0))<\/code> → la vente de la région en C14 pour le client en C15.<br>\nAvantage sur VLOOKUP : la colonne de résultat peut être n'importe où, et on cherche sur deux axes."}, {"kind": "ex", "title": "Building a two-variable data table", "sec": "What-if and scripts", "sid": "m5", "body": "B1 = cost price, B2 = sales price, B4 = result (calculated from B1 and B2). We want to test 10 values of B1 and 10 of B2 starting from A10:<br>\n1) in the <b>corner<\/b> A10: a link to the formula, <code>=B4<\/code>;<br>\n2) one series of values in a <b>column<\/b> below the corner (A11:A20) and the other in a <b>row<\/b> to the right of the corner (B10:K10);<br>\n3) select A10:K20 &gt; Data Table: \"row input cell\" = the cell matching the values in the row, \"column input cell\" = the cell matching the values in the column.<br>\nWhich variable goes where (B1 in the column and B2 in the row, or the reverse) does not matter, as long as the input cells match.", "fr": "B1 = prix de revient, B2 = prix de vente, B4 = résultat (calculé à partir de B1 et B2). On veut tester 10 valeurs de B1 et 10 de B2 à partir de A10 :<br>\n1) dans le <b>coin<\/b> A10 : un lien vers la formule, <code>=B4<\/code> ;<br>\n2) une série de valeurs en <b>colonne<\/b> sous le coin (A11:A20) et l'autre en <b>ligne<\/b> à droite du coin (B10:K10) ;<br>\n3) sélectionner A10:K20 &gt; Table de données : « cellule d'entrée en ligne » = la cellule qui correspond aux valeurs de la ligne, « cellule d'entrée en colonne » = celle des valeurs de la colonne.<br>\nLe sens (B1 en colonne et B2 en ligne, ou l'inverse) importe peu, du moment que les cellules d'entrée correspondent."}, {"kind": "ex", "title": "Lab 6 in a nutshell", "sec": "Macros", "sid": "m6", "body": "Macro \"Macro1\" that first clears the \"Extraction\" sheet, then copies from D1, D2 and D3 every row with an amount under €20, with the header only once in row 1; a button on the \"Menu\" sheet; file saved as .xlsm.", "fr": "Macro « Macro1 » qui vide d'abord la feuille « Extraction », puis copie depuis D1, D2 et D3 toutes les lignes avec un montant inférieur à 20 €, l'en-tête une seule fois en ligne 1 ; un bouton sur la feuille « Menu » ; fichier en .xlsm."}], "quiz": [{"q": "How many parameters can I change at the maximum when using a Data Table (of \"what-if analysis\" tools)?", "o": ["2", "4", "1", "3"], "a": [0], "e": "", "fr": "Une cellule d'entrée en ligne + une en colonne : 2 au maximum.", "src": "Real quiz 5", "real": true}, {"q": "What is the primary purpose of using Data Table (of \"what-if analysis\" tools)?", "o": ["To test what could be the impact of changing parameters on a calculated value", "To perform complex calculations", "To organize and display data in a tabular format", "To Create Charts and Graphs"], "a": [0], "e": "", "fr": "Tester l'effet de plusieurs valeurs d'entrée sur un résultat calculé.", "src": "Real quiz 5", "real": true}, {"q": "Which tool am I going to use if I want to check what could be the impact of changing multiple parameters to test different hypothesis depending on different parameters?", "o": ["Scenario manager", "Data Table", "Goal seek", "Pivot tables"], "a": [0], "e": "", "fr": "Plusieurs paramètres et plusieurs hypothèses = gestionnaire de scénarios.", "src": "Real quiz 5", "real": true}, {"q": "Data table to test the impact of B1 and B2 on B4, starting from A10 with 10 values for B1 and 10 for B2. Which layout? (several answers)", "o": ["We don't have enough information to process", "A11:A20 = values for B2, B10:K10 = values for B1", "A10:A19 = values for B1, B10:K10 = values for B2", "A10 = a link to the cell B4", "A11:A20 = values for B1, B10:K10 = values for B2"], "a": [1, 3, 4], "e": "", "fr": "Le coin A10 contient =B4 ; une série sous le coin, l'autre à droite. b et e sont deux dispositions valables.", "src": "Real quiz 5", "real": true}, {"q": "What does the \"Automate ribbon\" allow us to do?", "o": ["It checks and corrects errors", "Create a VBA code to manipulate the Excel document", "To create a Javascript script to manipulate the excel document", "It allows you to automatically save the different versions of the document"], "a": [2], "e": "", "fr": "Office Scripts = TypeScript/JavaScript. Le VBA, c'est les macros (onglet Développeur).", "src": "Real quiz 5", "real": true}, {"q": "It's possible to create and use scripts created in the automate ribbon when editing the document with the Excel online", "o": ["True", "False"], "a": [0], "e": "", "fr": "Les Office Scripts fonctionnent dans Excel en ligne (pas les macros VBA).", "src": "Real quiz 5", "real": true}, {"q": "How does Scenario Manager differ from Goal Seek in Excel?", "o": ["Scenario Manager allows for multiple what-if scenarios, while Goal Seek finds a single desired result", "Goal Seek allows for multiple what-if scenarios, while Scenario Manager finds a single desired result", "Goal Seek is used for creating interactive dashboards, while Scenario Manager is used for creating pivot tables", "Scenario Manager is used for sorting data, while Goal Seek is used for filtering data"], "a": [0], "e": "", "fr": "Plusieurs scénarios vs un seul résultat voulu. b est le piège inversé.", "src": "Real quiz 5", "real": true}, {"q": "Which of the following statements best describes the purpose of using Scenario Manager?", "o": ["To display data in a tabular format for easy analysis", "To perform iterative calculations based on changing criteria", "To find the input value required to achieve a specific result", "To create and manage different sets of input values for what-if analysis"], "a": [3], "e": "", "fr": "c est la valeur cible (Goal Seek).", "src": "Real quiz 5", "real": true}, {"q": "It is possible to remove a few values from a Data Table (of \"what-if analysis\" tools)", "o": ["True", "False"], "a": [1], "e": "", "fr": "« Cannot change part of a data table » : on efface tout ou rien.", "src": "Real quiz 5", "real": true}, {"q": "It's possible to put a Data Table (of \"what-if analysis\" tools) in a different worksheet from the input cells", "o": ["True", "False"], "a": [1], "e": "", "fr": "La cellule d'entrée doit être sur la même feuille que la table.", "src": "Real quiz 5", "real": true}, {"q": "You want to know which sales price gives exactly a turnover of $1,500. Which tool?", "o": ["Scenario Manager", "Goal Seek", "Data Table", "Pivot table"], "a": [1], "e": "", "fr": "Un résultat visé, une cellule à faire varier : valeur cible.", "src": "Module 5", "real": false}, {"q": "In a one-variable Data Table with input values in a column (A11:A20), where do you put the formula?", "o": ["In A10", "In B10 (one row above the first value, one column to the right)", "Anywhere on the sheet", "In the input cell itself"], "a": [1], "e": "", "fr": "Table à 1 variable en colonne : la formule va dans la cellule au-dessus et à droite de la première valeur.", "src": "Module 5", "real": false}, {"q": "Goal Seek can change how many input cells at once?", "o": ["1", "2", "As many as needed", "Up to 32"], "a": [0], "e": "", "fr": "Une seule cellule variable. Pour plusieurs, on passe au Solveur ou aux scénarios.", "src": "Module 5", "real": false}, {"q": "=INT(-2,5) returns:", "o": ["-2", "-3", "-2,5", "#VALUE!"], "a": [1], "e": "", "fr": "INT arrondit toujours vers le bas : -3 < -2,5.", "src": "Module 1", "real": false}, {"q": "=COUNT(A3:A26) on a column of last names returns:", "o": ["24", "0", "#N/A", "The number of blank cells"], "a": [1], "e": "", "fr": "COUNT ne compte que les nombres. Pour du texte : COUNTA.", "src": "Module 1", "real": false}, {"q": "Which function counts the empty cells of ONE range?", "o": ["COUNT", "COUNTA", "COUNTBLANK", "COUNTIF"], "a": [2], "e": "", "fr": "COUNTBLANK.", "src": "Module 1", "real": false}, {"q": "=MID(\"SKEMA2026\";6;4) returns:", "o": ["SKEMA", "2026", "A202", "MA20"], "a": [1], "e": "", "fr": "À partir du 6e caractère, 4 caractères : 2026.", "src": "Module 1", "real": false}, {"q": "=LEN(\"Pe ter\") returns:", "o": ["5", "6", "4", "#VALUE!"], "a": [1], "e": "", "fr": "Les espaces comptent : 6.", "src": "Module 1", "real": false}, {"q": "=ROUND(3,456;1) and =TRUNC(3,456;1) return:", "o": ["3,5 and 3,5", "3,4 and 3,4", "3,5 and 3,4", "3,46 and 3,45"], "a": [2], "e": "", "fr": "ROUND arrondit, TRUNC coupe.", "src": "Module 1", "real": false}, {"q": "You copy =J2<$J$27 down to J3. What becomes of it?", "o": ["=J3<$J$28", "=J3<$J$27", "=J2<$J$27", "=J3<J28"], "a": [1], "e": "", "fr": "Partie relative J2 → J3, partie absolue $J$27 fixe.", "src": "Module 1", "real": false}, {"q": "Which reference keeps the row fixed but lets the column change?", "o": ["$A$1", "A$1", "$A1", "A1"], "a": [1], "e": "", "fr": "Le $ devant 1 bloque la ligne.", "src": "Module 1", "real": false}, {"q": "What is the last column of an Excel worksheet?", "o": ["ZZ", "XFD", "IV", "AAA"], "a": [1], "e": "", "fr": "XFD = 16 384e colonne. Lignes : 1 048 576.", "src": "Module 1", "real": false}, {"q": "Which shortcut fills all the selected cells with the value you just typed?", "o": ["Ctrl + D", "Ctrl + Enter", "Ctrl + A", "F4"], "a": [1], "e": "", "fr": "Ctrl + Entrée. Ctrl + D recopie vers le bas, F4 met les $.", "src": "Module 1", "real": false}, {"q": "A total of durations shows 13:30 instead of 37:30. What should you do?", "o": ["Use =SUM()*24", "Apply the format [h]:mm:ss", "Use =HOUR()", "Nothing, it's correct"], "a": [1], "e": "", "fr": "Le format [h] affiche plus de 24 heures.", "src": "Module 1", "real": false}, {"q": "D25 contains a total duration (time format). Pay is $30 per hour. Correct formula?", "o": ["=D25*30", "=D25*30*24", "=D25*30/24", "=HOUR(D25)*30"], "a": [1], "e": "", "fr": "Excel stocke la durée en jours : × 24 pour avoir des heures.", "src": "Module 1", "real": false}, {"q": "You type 1/3 in an empty cell. Excel stores:", "o": ["0,333", "A date", "The text \"1/3\"", "An error"], "a": [1], "e": "", "fr": "Excel l'interprète comme une date. Pour la fraction : =1/3.", "src": "Module 1", "real": false}, {"q": "=DATEDIF(B17;B18;\"Y\") returns:", "o": ["The number of days", "The number of complete years", "The year of B18", "An error"], "a": [1], "e": "", "fr": "Nombre d'années complètes entre deux dates.", "src": "Module 1", "real": false}, {"q": "By default, =WEEKDAY(date) returns 1 for:", "o": ["Monday", "Sunday", "Saturday", "It depends on the language"], "a": [1], "e": "", "fr": "Par défaut, dimanche = 1.", "src": "Module 1", "real": false}, {"q": "=TEXTJOIN(\" , \";TRUE;C11:C15) does what TRUE means?", "o": ["Adds a space", "Ignores empty cells", "Converts to uppercase", "Sorts the values"], "a": [1], "e": "", "fr": "TRUE = ignorer les cellules vides.", "src": "Module 1", "real": false}, {"q": "Why prefer =SUM(B12:B18) over =SUM(B12;B13;B14;B15;B16;B17;B18)?", "o": ["It is faster", "It includes a row inserted inside the range", "It ignores text", "No difference"], "a": [1], "e": "", "fr": "Une ligne insérée dans la plage est prise en compte automatiquement.", "src": "Module 1", "real": false}, {"q": "A cell shows ####. Most likely cause?", "o": ["Division by zero", "Column too narrow", "Value not found", "Circular reference"], "a": [1], "e": "", "fr": "#DIV/0! = division par zéro, #N/A = non trouvé.", "src": "Module 1", "real": false}, {"q": "In =VLOOKUP(C15;A3:C12;2;FALSE), FALSE means:", "o": ["Approximate match", "Exact match", "Search from the bottom", "Return the 2nd row"], "a": [1], "e": "", "fr": "FALSE ou 0 = exacte ; TRUE ou 1 = approximative.", "src": "Module 2", "real": false}, {"q": "For an approximate VLOOKUP (TRUE), the first column of the table must be:", "o": ["Sorted ascending", "Sorted descending", "Formatted as a table", "Unique values only"], "a": [0], "e": "", "fr": "Tri croissant obligatoire, sinon résultats faux.", "src": "Module 2", "real": false}, {"q": "Discount steps: 0 → 0 %, 300 → 5 %, 600 → 10 %, 900 → 15 %. =VLOOKUP(675;steps;2;TRUE) returns:", "o": ["5 %", "10 %", "15 %", "#N/A"], "a": [1], "e": "", "fr": "Plus grande valeur ≤ 675 = 600 → 10 %.", "src": "Module 2", "real": false}, {"q": "Same table, price = -100. The approximate VLOOKUP returns:", "o": ["0 %", "#N/A", "5 %", "#VALUE!"], "a": [1], "e": "", "fr": "Aucune valeur ≤ -100 dans la table.", "src": "Module 2", "real": false}, {"q": "VLOOKUP searches the lookup value in:", "o": ["Any column", "The first column of the table array", "The last column", "The first row"], "a": [1], "e": "", "fr": "Première colonne. HLOOKUP : première ligne.", "src": "Module 2", "real": false}, {"q": "Which function can return a column located to the LEFT of the lookup column?", "o": ["VLOOKUP", "HLOOKUP", "XLOOKUP", "COUNTA"], "a": [2], "e": "", "fr": "XLOOKUP (et INDEX/MATCH).", "src": "Module 2", "real": false}, {"q": "In XLOOKUP, which argument replaces the need for IFERROR?", "o": ["match_mode", "search_mode", "if_not_found", "return_array"], "a": [2], "e": "", "fr": "if_not_found, ex. \"ID not found\".", "src": "Module 2", "real": false}, {"q": "XLOOKUP match_mode 2 means:", "o": ["Exact match", "Exact or next smaller", "Exact or next larger", "Wildcard match"], "a": [3], "e": "", "fr": "0 exact, -1 plus petit, 1 plus grand, 2 caractères génériques.", "src": "Module 2", "real": false}, {"q": "XLOOKUP search_mode -1 means:", "o": ["Search first to last", "Search last to first", "Binary search", "No search"], "a": [1], "e": "", "fr": "Recherche en partant de la fin.", "src": "Module 2", "real": false}, {"q": "Text filter to show last names whose SECOND letter is \"a\":", "o": ["*a", "?a*", "a?", "*a*"], "a": [1], "e": "", "fr": "? = exactement un caractère, * = n'importe quelle suite.", "src": "Module 2", "real": false}, {"q": "Is it possible to clear a sort like you clear a filter?", "o": ["Yes", "No"], "a": [1], "e": "", "fr": "On efface un filtre, pas un tri.", "src": "Module 2", "real": false}, {"q": "To sort by LastName ascending AND FirstName descending in one go, use:", "o": ["The filter button twice", "The Sort dialog box (Data tab) with two levels", "A pivot table", "XLOOKUP"], "a": [1], "e": "", "fr": "Deux tris successifs avec le bouton filtre ne gardent que le dernier.", "src": "Module 2", "real": false}, {"q": "In a table, the formula =[@FirstName]&\" \"&[@LastName] uses:", "o": ["Absolute references", "Structured references (column names)", "Named ranges", "Wildcards"], "a": [1], "e": "", "fr": "Référence structurée, recopiée automatiquement sur toute la colonne.", "src": "Module 2", "real": false}, {"q": "How do you add a row counting the customers at the bottom of a table?", "o": ["Type =COUNTA() manually", "Tick \"Total Row\" in Table Design", "Insert a pivot table", "Use a slicer"], "a": [1], "e": "", "fr": "Option Ligne de total, avec liste déroulante pour changer le calcul.", "src": "Module 2", "real": false}, {"q": "A slicer lets you:", "o": ["Cut a table in two", "Filter a table or pivot table by clicking buttons", "Remove duplicates", "Split text"], "a": [1], "e": "", "fr": "Segment = filtre visuel.", "src": "Module 2", "real": false}, {"q": "Why build a pivot table from a table rather than a normal range?", "o": ["It is faster to calculate", "New rows are included automatically after a refresh", "It removes duplicates", "It sorts the data"], "a": [1], "e": "", "fr": "Le tableau s'agrandit tout seul ; il suffit d'actualiser le TCD.", "src": "Module 3", "real": false}, {"q": "The source data changed. What must you do so the pivot table shows it?", "o": ["Nothing, it updates live", "Refresh the pivot table", "Recreate it", "Press F4"], "a": [1], "e": "", "fr": "Analyse du TCD > Actualiser.", "src": "Module 3", "real": false}, {"q": "To show quantities as a share of the total, use:", "o": ["Show Values As > % of Grand Total", "Group > Quarter", "A slicer", "Sort descending"], "a": [0], "e": "", "fr": "« Afficher les valeurs » en % du total général.", "src": "Module 3", "real": false}, {"q": "Which filter is designed for dates (period selection)?", "o": ["Slicer", "Timeline", "Data validation", "Goal Seek"], "a": [1], "e": "", "fr": "Chronologie = dates ; segment = catégories.", "src": "Module 3", "real": false}, {"q": "One slicer filtering two pivot tables at once requires:", "o": ["Report Connections to both pivot tables", "Two slicers", "A macro", "Nothing special"], "a": [0], "e": "", "fr": "Connexions de rapport.", "src": "Module 3", "real": false}, {"q": "Grouping final prices \"from 0 to 100 000 by 20 000\" is done with:", "o": ["Group on the row field", "A VLOOKUP", "Data validation", "Conditional formatting"], "a": [0], "e": "", "fr": "Clic droit sur le champ > Grouper, début, fin, pas.", "src": "Module 3", "real": false}, {"q": "MATCH(lookup_value;lookup_array;0) returns:", "o": ["The value found", "The position of the value in the range", "The row number of the sheet", "TRUE or FALSE"], "a": [1], "e": "", "fr": "Une position dans la plage (si Lyon est en B6 dans B4:B10, MATCH renvoie 3).", "src": "Module 4", "real": false}, {"q": "MATCH with match_type 1 finds:", "o": ["Exact match", "Largest value ≤ lookup value (range sorted ascending)", "Smallest value ≥ lookup value (range sorted descending)", "Wildcard match"], "a": [1], "e": "", "fr": "1 = plus grande valeur ≤ ; -1 = plus petite valeur ≥ ; 0 = exacte.", "src": "Module 4", "real": false}, {"q": "Which match_type does NOT require the lookup range to be sorted?", "o": ["0", "1", "-1", "All of them require sorting"], "a": [0], "e": "", "fr": "Seule la correspondance exacte ne demande pas de tri.", "src": "Module 4", "real": false}, {"q": "What does XMATCH add compared with MATCH?", "o": ["Wildcard match (2) and reverse search", "Returns the value instead of the position", "Works only horizontally", "Nothing"], "a": [0], "e": "", "fr": "Type 2 pour les caractères génériques et sens de recherche -1.", "src": "Module 4", "real": false}, {"q": "=INDEX(C3:I9;2;3) returns:", "o": ["The value in row 2, column 3 of C3:I9", "The value in E2", "The position of 2", "Cell C2"], "a": [0], "e": "", "fr": "Ligne et colonne relatives à la plage : ici E4.", "src": "Module 4", "real": false}, {"q": "The classic two-way lookup combination is:", "o": ["INDEX + MATCH", "SUM + IF", "LEFT + RIGHT", "COUNT + COUNTA"], "a": [0], "e": "", "fr": "=INDEX(valeurs;MATCH(ligne;...;0);MATCH(colonne;...;0)), ou XLOOKUP imbriqué.", "src": "Module 4", "real": false}, {"q": "In =FILTER(B3:E12;(C3:C12=H3)*(MONTH(D3:D12)<>2);\"No matches found\"), the * means:", "o": ["Multiply the values", "AND between the two conditions", "OR between the two conditions", "Wildcard"], "a": [1], "e": "", "fr": "* = ET, + = OU.", "src": "Module 4", "real": false}, {"q": "In FILTER, the third argument is used when:", "o": ["There are too many results", "No row matches the criteria", "The array is not sorted", "There is an error in the data"], "a": [1], "e": "", "fr": "if_empty : affiché si aucun résultat.", "src": "Module 4", "real": false}, {"q": "To force users to pick a value from a drop-down list, use:", "o": ["Data Validation > Allow: List", "Conditional formatting", "A slicer", "Goal Seek"], "a": [0], "e": "", "fr": "Validation des données, autoriser : Liste.", "src": "Module 4", "real": false}, {"q": "Which Data Validation error alert style blocks an invalid entry completely?", "o": ["Stop", "Warning", "Information", "All three"], "a": [0], "e": "", "fr": "Avertissement et Information laissent passer la saisie.", "src": "Module 4", "real": false}, {"q": "In INDEX reference form =INDEX((C3:I9;L3:R9);2;3;2), the last 2 means:", "o": ["Row 2", "Column 2", "The second area (L3:R9)", "Return 2 values"], "a": [2], "e": "", "fr": "area_num choisit la zone.", "src": "Module 4", "real": false}, {"q": "To keep a recorded macro, you must save the workbook as:", "o": [".xlsx", ".xlsm", ".csv", ".pdf"], "a": [1], "e": "", "fr": ".xlsx ne garde pas les macros.", "src": "Module 6", "real": false}, {"q": "Recorded macros are written in:", "o": ["JavaScript", "VBA", "Python", "SQL"], "a": [1], "e": "", "fr": "VBA (Visual Basic for Applications). Les Office Scripts, eux, sont en TypeScript.", "src": "Module 6", "real": false}, {"q": "Where do you find \"Record Macro\" and the macro tools?", "o": ["Developer tab", "Automate tab", "Data tab", "View tab only"], "a": [0], "e": "", "fr": "Onglet Développeur, à activer dans Options > Personnaliser le ruban (on peut aussi passer par Affichage > Macros).", "src": "Module 6", "real": false}, {"q": "Why use \"Use Relative References\" while recording?", "o": ["To make the macro faster", "So the macro replays from the active cell instead of the same fixed cells", "To protect the macro", "To translate the macro"], "a": [1], "e": "", "fr": "Utile quand le nombre de lignes change.", "src": "Module 6", "real": false}, {"q": "How can a user run a macro by clicking on the sheet?", "o": ["Insert a form control button and assign the macro", "Add a slicer", "Use a hyperlink to the macro", "Impossible"], "a": [0], "e": "", "fr": "Développeur > Insérer > Bouton (contrôle de formulaire) > Affecter une macro.", "src": "Module 6", "real": false}, {"q": "Can VBA macros run in Excel online?", "o": ["Yes", "No"], "a": [1], "e": "", "fr": "Non. En ligne, on utilise les Office Scripts (onglet Automatiser).", "src": "Module 6", "real": false}]}, {"id": "interculture", "name": "China France Interculture", "short": "Interculture", "start": "2026-12-08T10:00:00+08:00", "when": "Mar. 8 déc. · 10:00–11:30", "fmt": "QCM + 1 cas + 2 questions ouvertes · 1h30", "weight": "40 %", "rules": "Sans documents, brouillon autorisé", "hue": 8, "lead": "Updated 25 November with lessons 2 and 3. What the exam explicitly asks for: culture shock, Hofstede's dimensions and Erin Meyer's Culture Map applied to French-Chinese situations. Plus the sensemaking method, cultural intelligence, face and guanxi.", "prof": "M1/DESMI1 · Julien DREYFUSS", "sections": [{"id": "exam", "short": "The final exam", "title": "The final exam", "sub": "Syllabus + lesson 1 slides", "en": "<div class=\"box key\"><span class=\"lbl\">Your calendar (exam notice)<\/span><b>Tue 8 December, 10:00–11:30<\/b> (Suzhou time). MCQ + open questions on TestWe, 1h30. No documents, <b>scratch paper allowed<\/b>, no calculator. Person in charge: Julien Dreyfuss.<br>Room 271, row 5, seat 6. A
