ne what the conflict is about; this definition shapes the possible solutions<\/td><\/tr>\n<tr><td>3. Intentions<\/td><td>5 intentions: <b>competing<\/b> (my interests first), <b>collaborating<\/b> (fully satisfy both), <b>avoiding<\/b> (withdraw or suppress), <b>accommodating<\/b> (the other's interests first), <b>compromising<\/b> (each gives something up)<\/td><\/tr>\n<tr><td>4. Behaviour<\/td><td>The conflict becomes visible, from minor disagreement to overt efforts to destroy the other party (escalation)<\/td><\/tr>\n<tr><td>5. Outcomes<\/td><td><b>Functional<\/b> (better decisions, creativity, challenging the status quo) or <b>dysfunctional<\/b> (less effectiveness and cohesion, group survival threatened)<\/td><\/tr>\n<\/table><\/div>\n<h3>Resolution techniques<\/h3>\n<ol>\n<li><b>Problem solving<\/b>: face-to-face meeting and open discussion.<\/li>\n<li><b>Superordinate goals<\/b>: a shared goal that cannot be reached without cooperation.<\/li>\n<li><b>Expansion of resources<\/b>: when the conflict comes from a scarce resource.<\/li>\n<li><b>Authoritative command<\/b>: management decides.<\/li>\n<li><b>Altering the human variable<\/b>: human relations training.<\/li>\n<li><b>Altering the structural variables<\/b>: redesigning jobs, transfers, coordinating positions.<\/li>\n<\/ol>\n<p>Prevention (Laker and Pereira, HBR 2022): clear communication channels, transparent performance expectations, realistic deadlines, clarified roles and tasks.<\/p>\n<h3>Negotiation<\/h3>\n<p>A method for settling disputes. <b>Distributive<\/b> (win-lose, dividing resources) or <b>integrative<\/b> (win-win, creating value). Setting your goals is the first step. Three phases: beginning, middle (problem solving), end. Ideal process: <b>preparation → relationship building → information gathering → information using → bidding → closing the deal → implementing the agreement<\/b>.<\/p>", "fr": "<p><b>Conflit<\/b> : différences incompatibles perçues dans un groupe, qui gênent ou s'opposent à ses tâches. <b>Fonctionnel<\/b> (constructif) ou <b>dysfonctionnel<\/b> (destructeur). Trois types : de <b>tâche<\/b> (contenu et objectifs), <b>relationnel<\/b> (relations interpersonnelles), de <b>processus<\/b> (comment le travail se fait).<\/p>\n<h3>Le processus du conflit en 5 étapes (Robbins)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Étape<\/th><th>Contenu<\/th><\/tr>\n<tr><td>1. Opposition potentielle<\/td><td>Conditions : <b>communication<\/b> (jargon, manque d'info, bruit), <b>structure<\/b> (taille, spécialisation), <b>variables personnelles<\/b> (personnalité, émotions, valeurs)<\/td><\/tr>\n<tr><td>2. Cognition et personnalisation<\/td><td>Les parties définissent de quoi parle le conflit ; cette définition oriente les solutions possibles<\/td><\/tr>\n<tr><td>3. Intentions<\/td><td>5 intentions : <b>competing<\/b> (mes intérêts d'abord), <b>collaborating<\/b> (satisfaire pleinement les deux), <b>avoiding<\/b> (fuir ou étouffer), <b>accommodating<\/b> (les intérêts de l'autre d'abord), <b>compromising<\/b> (chacun cède quelque chose)<\/td><\/tr>\n<tr><td>4. Comportement<\/td><td>Le conflit devient visible, du simple désaccord jusqu'aux efforts pour détruire l'autre (escalade)<\/td><\/tr>\n<tr><td>5. Résultats<\/td><td><b>Fonctionnels<\/b> (meilleures décisions, créativité, remise en cause du statu quo) ou <b>dysfonctionnels<\/b> (moins d'efficacité et de cohésion, survie du groupe menacée)<\/td><\/tr>\n<\/table><\/div>\n<h3>Techniques de résolution<\/h3>\n<ol>\n<li><b>Résolution de problème<\/b> : rencontre face à face et discussion ouverte.<\/li>\n<li><b>Objectifs supérieurs<\/b> : un but commun impossible à atteindre sans coopérer.<\/li>\n<li><b>Expansion des ressources<\/b> : si le conflit vient d'une ressource rare.<\/li>\n<li><b>Commandement autoritaire<\/b> : la direction tranche.<\/li>\n<li><b>Changer la variable humaine<\/b> : formation aux relations humaines.<\/li>\n<li><b>Changer la structure<\/b> : redéfinir les postes, mutations, postes de coordination.<\/li>\n<\/ol>\n<p>Prévention (Laker et Pereira, HBR 2022) : canaux de communication clairs, attentes de performance transparentes, délais réalistes, rôles et tâches clarifiés.<\/p>\n<h3>La négociation<\/h3>\n<p>Méthode pour régler des différends. <b>Distributive<\/b> (gagnant-perdant, partager des ressources) ou <b>intégrative<\/b> (gagnant-gagnant, créer de la valeur). Fixer ses objectifs est la première étape. Trois phases : début, milieu (résolution de problème), fin. Processus idéal : <b>préparation → relation → recueil d'information → utilisation de l'information → offres et contre-offres → conclusion → mise en œuvre<\/b>.<\/p>"}, {"id": "c6", "short": "AI at work", "title": "6. Artificial intelligence at work", "sub": "Session 6 · Bankins (2021); Davenport and Ronanki (2018); Melkonian (2018); Jarrahi et al. (2023)", "en": "<ul>\n<li><b>AI<\/b> (Rai et al., 2019): the ability of a machine to perform cognitive functions associated with human minds (perceiving, reasoning, learning, problem solving, decision making, creativity).<\/li>\n<li><b>Ethical AI<\/b> (Bankins, 2021): fair development, use and management of AI. <b>5 principles<\/b>: <b>beneficence<\/b> (benefit people and the planet), <b>non-maleficence<\/b> (do no harm, protect privacy), <b>autonomy<\/b> (humans keep control over delegation), <b>justice<\/b> (fair outcomes, no bias), <b>explicability<\/b> (understandable and accountable).<\/li>\n<li>Uses: production monitoring, content, personalized training, customer service, accounting, financial analysis.<\/li>\n<li>Benefits: for the <b>manager<\/b>, more time for strategy and relationships (Melkonian); for <b>teams<\/b>, collective learning, clearer responsibilities, collaboration, morale (MIT Sloan/BCG); for the <b>organization<\/b>, better products and decisions, optimized operations, new markets (Davenport and Ronanki).<\/li>\n<li>Skills to work with AI (Jarrahi et al., 2023): <b>data<\/b> skills, <b>AI literacy<\/b> (how it works and its biases), <b>algorithmic communication<\/b> (explaining the results).<\/li>\n<li>Barriers to adoption: attracting AI talent, competing investment priorities, security, <b>cultural resistance<\/b>, lack of technical capabilities, lack of leadership support.<\/li>\n<li>Will AI replace managers? <b>No<\/b>: human-centred, relationship-oriented managers remain irreplaceable (Melkonian). Nor will it replace talent: AI is copiable, relies on past data and can <b>hallucinate<\/b> (Sanders and Wood, 2023). Skills of tomorrow's manager (Pagani and Champion): curiosity, openness, creativity, agility, ethics.<\/li>\n<li><b>ChatGPT<\/b>: HR (job descriptions, onboarding), data analysis, customer service, sales (CRM), marketing. Good practices: let people explore, train them on the limits, share feedback, measure impact. Generative AI and creativity: divergent thinking, challenging expertise bias, evaluating ideas, collaboration.<\/li>\n<\/ul>", "fr": "<ul>\n<li><b>IA<\/b> (Rai et al., 2019) : capacité d'une machine à réaliser des fonctions cognitives associées à l'esprit humain (percevoir, raisonner, apprendre, résoudre des problèmes, décider, créer).<\/li>\n<li><b>IA éthique<\/b> (Bankins, 2021) : développement, usage et gestion justes de l'IA. <b>5 principes<\/b> : <b>bienfaisance<\/b> (bénéficier aux personnes et à la planète), <b>non-malfaisance<\/b> (ne pas nuire, protéger la vie privée), <b>autonomie<\/b> (les humains gardent la main sur la délégation), <b>justice<\/b> (résultats équitables, sans biais), <b>explicabilité<\/b> (compréhensible et responsable).<\/li>\n<li>Usages : suivi de production, contenu, formation personnalisée, service client, comptabilité, analyse financière.<\/li>\n<li>Bénéfices : pour le <b>manager<\/b>, plus de temps pour la stratégie et la relation (Melkonian) ; pour les <b>équipes<\/b>, apprentissage collectif, responsabilités clarifiées, collaboration, moral (MIT Sloan/BCG) ; pour l'<b>organisation<\/b>, meilleurs produits et décisions, opérations optimisées, nouveaux marchés (Davenport et Ronanki).<\/li>\n<li>Compétences pour travailler avec l'IA (Jarrahi et al., 2023) : compétences <b>data<\/b>, <b>culture de l'IA<\/b> (AI literacy : fonctionnement et biais), <b>communication algorithmique<\/b> (expliquer les résultats).<\/li>\n<li>Obstacles à l'adoption : attirer les talents IA, priorités d'investissement concurrentes, sécurité, <b>résistance culturelle<\/b>, manque de capacités techniques, manque de soutien de la direction.<\/li>\n<li>L'IA remplacera-t-elle le manager ? <b>Non<\/b> : les managers centrés sur l'humain et la relation restent irremplaçables (Melkonian). Le talent non plus : l'IA est copiable, repose sur des données passées et peut <b>halluciner<\/b> (Sanders et Wood, 2023). Compétences du manager de demain (Pagani et Champion) : curiosité, ouverture, créativité, agilité, éthique.<\/li>\n<li><b>ChatGPT<\/b> : RH (fiches de poste, onboarding), analyse de données, service client, vente (CRM), marketing. Bonnes pratiques : laisser explorer, former aux limites, partager les retours, mesurer l'impact. IA générative et créativité : pensée divergente, remise en cause du biais d'expertise, évaluation des idées, collaboration.<\/li>\n<\/ul>"}, {"id": "method", "short": "Practice questions", "title": "Practice open questions", "sub": "", "en": "<p>Answer in 10–15 lines, then compare with the suggested outline.<\/p>\n<details><summary>1. What are a manager's functions and skills? Why is emotional intelligence important?<\/summary>\nDefine the manager (Robbins and Coulter) → 4 functions (planning, organizing, leading, controlling; origin Fayol) → 4 skills (conceptual, interpersonal, technical, political; their weight depends on the hierarchical level) → Goleman's EI, 5 components, best predictor of leadership, can be learned → example: a remote manager who must show empathy.<\/details>\n<details><summary>2. How can a company attract, develop and retain a high-quality workforce?<\/summary>\nStorey's definition → attract (HR planning, job analysis, recruitment, employer branding, selection) → develop (socialization, orientation, training) → retain (career, balance, reward management per Armstrong, turnover) → adapting to Generations Y and Z and to remote work.<\/details>\n<details><summary>3. As a manager, how do you prevent and manage stress and burnout in your team?<\/summary>\nDefinitions (Cummings and Cooper; burnout) → 6 sources of stress (Cartwright and Cooper) → individual, manager and company actions → link with self-determination theory (autonomy, competence, relatedness) → recommendation.<\/details>\n<details><summary>4. Describe the conflict process and resolution techniques. Can conflict be positive?<\/summary>\nDefinition and types (task, relationship, process) → Robbins' 5 stages → 5 intentions → 6 techniques → functional vs dysfunctional conflict → project team example.<\/details>\n<details><summary>5. What is responsible management? How do you implement it?<\/summary>\nDefinitions (Laasch and Conaway; Maak and Pless) → Carroll, Freeman, Elkington → pillars of responsible leadership (Voegtlin) → 3 instruments → obstacles and solutions (Farri et al.) → example (HP, Patagonia, Innocent).<\/details>\n<details><summary>6. Will AI replace managers? What conditions for ethical AI in HR?<\/summary>\nDefinition (Rai et al.) → benefits at 3 levels → Bankins' 5 principles → limits (copiable, past data, hallucinations) → no, the human-centred manager remains key (Melkonian) → skills needed (Jarrahi et al.).<\/details>", "fr": "<p>Réponds en 10–15 lignes, puis compare au plan proposé.<\/p>\n<details><summary>1. Quelles sont les fonctions et compétences d'un manager ? Pourquoi l'intelligence émotionnelle est-elle importante ?<\/summary>\nDéfinir le manager (Robbins et Coulter) → 4 fonctions (planning, organizing, leading, controlling ; origine Fayol) → 4 compétences (conceptuelles, interpersonnelles, techniques, politiques ; leur poids selon le niveau hiérarchique) → IE de Goleman, 5 composantes, meilleur prédicteur du leadership, s'apprend → exemple : manager à distance qui doit faire preuve d'empathie.<\/details>\n<details><summary>2. Comment une entreprise peut-elle attirer, développer et retenir une main-d'œuvre de qualité ?<\/summary>\nDéfinition de Storey → attirer (planification RH, analyse de poste, recrutement, marque employeur, sélection) → développer (socialisation, orientation, formation) → retenir (carrière, équilibre, rémunération selon Armstrong, turnover) → adaptation aux générations Y et Z et au télétravail.<\/details>\n<details><summary>3. En tant que manager, comment prévenir et gérer le stress et le burn-out dans votre équipe ?<\/summary>\nDéfinitions (Cummings et Cooper ; burn-out) → 6 sources de stress (Cartwright et Cooper) → actions individuelles, du manager et de l'entreprise → lien avec la théorie de l'autodétermination (autonomie, compétence, appartenance) → recommandation.<\/details>\n<details><summary>4. Décrivez le processus du conflit et les techniques de résolution. Un conflit peut-il être positif ?<\/summary>\nDéfinition et types (tâche, relation, processus) → 5 étapes de Robbins → 5 intentions → 6 techniques → conflit fonctionnel vs dysfonctionnel → exemple d'équipe projet.<\/details>\n<details><summary>5. Qu'est-ce qu'un management responsable ? Comment le mettre en œuvre ?<\/summary>\nDéfinitions (Laasch et Conaway ; Maak et Pless) → Carroll, Freeman, Elkington → piliers du leadership responsable (Voegtlin) → 3 instruments → obstacles et solutions (Farri et al.) → exemple (HP, Patagonia, Innocent).<\/details>\n<details><summary>6. L'IA va-t-elle remplacer les managers ? Quelles conditions pour une IA éthique en RH ?<\/summary>\nDéfinition (Rai et al.) → bénéfices à 3 niveaux → 5 principes de Bankins → limites (copiable, données passées, hallucinations) → non, le manager centré sur l'humain reste clé (Melkonian) → compétences nécessaires (Jarrahi et al.).<\/details>"}], "cases": [{"kind": "ex", "title": "The manager's 7 actions", "sec": "Difficulties at work", "sid": "c4", "body": "1. A clear written policy with several reporting channels · 2. Communicate it and have it signed · 3. Train (at least yearly) · 4. Audit employment decisions · 5. Investigate quickly and seriously · 6. Discipline (from warning to dismissal) · 7. Follow up with the person who complained.", "fr": "1. Politique écrite claire avec plusieurs voies de signalement · 2. La diffuser et la faire signer · 3. Former (au moins chaque année) · 4. Auditer les décisions d'emploi · 5. Enquêter vite et sérieusement · 6. Sanctionner (avertissement à licenciement) · 7. Faire le suivi auprès de la personne qui s'est plainte."}, {"kind": "q", "title": "1. What are a manager's functions and skills? Why is emotional intelligence important?", "sec": "Practice questions", "sid": "method", "body": "Define the manager (Robbins and Coulter) → 4 functions (planning, organizing, leading, controlling; origin Fayol) → 4 skills (conceptual, interpersonal, technical, political; their weight depends on the hierarchical level) → Goleman's EI, 5 components, best predictor of leadership, can be learned → example: a remote manager who must show empathy.", "fr": "Définir le manager (Robbins et Coulter) → 4 fonctions (planning, organizing, leading, controlling ; origine Fayol) → 4 compétences (conceptuelles, interpersonnelles, techniques, politiques ; leur poids selon le niveau hiérarchique) → IE de Goleman, 5 composantes, meilleur prédicteur du leadership, s'apprend → exemple : manager à distance qui doit faire preuve d'empathie."}, {"kind": "q", "title": "2. How can a company attract, develop and retain a high-quality workforce?", "sec": "Practice questions", "sid": "method", "body": "Storey's definition → attract (HR planning, job analysis, recruitment, employer branding, selection) → develop (socialization, orientation, training) → retain (career, balance, reward management per Armstrong, turnover) → adapting to Generations Y and Z and to remote work.", "fr": "Définition de Storey → attirer (planification RH, analyse de poste, recrutement, marque employeur, sélection) → développer (socialisation, orientation, formation) → retenir (carrière, équilibre, rémunération selon Armstrong, turnover) → adaptation aux générations Y et Z et au télétravail."}, {"kind": "q", "title": "3. As a manager, how do you prevent and manage stress and burnout in your team?", "sec": "Practice questions", "sid": "method", "body": "Definitions (Cummings and Cooper; burnout) → 6 sources of stress (Cartwright and Cooper) → individual, manager and company actions → link with self-determination theory (autonomy, competence, relatedness) → recommendation.", "fr": "Définitions (Cummings et Cooper ; burn-out) → 6 sources de stress (Cartwright et Cooper) → actions individuelles, du manager et de l'entreprise → lien avec la théorie de l'autodétermination (autonomie, compétence, appartenance) → recommandation."}, {"kind": "q", "title": "4. Describe the conflict process and resolution techniques. Can conflict be positive?", "sec": "Practice questions", "sid": "method", "body": "Definition and types (task, relationship, process) → Robbins' 5 stages → 5 intentions → 6 techniques → functional vs dysfunctional conflict → project team example.", "fr": "Définition et types (tâche, relation, processus) → 5 étapes de Robbins → 5 intentions → 6 techniques → conflit fonctionnel vs dysfonctionnel → exemple d'équipe projet."}, {"kind": "q", "title": "5. What is responsible management? How do you implement it?", "sec": "Practice questions", "sid": "method", "body": "Definitions (Laasch and Conaway; Maak and Pless) → Carroll, Freeman, Elkington → pillars of responsible leadership (Voegtlin) → 3 instruments → obstacles and solutions (Farri et al.) → example (HP, Patagonia, Innocent).", "fr": "Définitions (Laasch et Conaway ; Maak et Pless) → Carroll, Freeman, Elkington → piliers du leadership responsable (Voegtlin) → 3 instruments → obstacles et solutions (Farri et al.) → exemple (HP, Patagonia, Innocent)."}, {"kind": "q", "title": "6. Will AI replace managers? What conditions for ethical AI in HR?", "sec": "Practice questions", "sid": "method", "body": "Definition (Rai et al.) → benefits at 3 levels → Bankins' 5 principles → limits (copiable, past data, hallucinations) → no, the human-centred manager remains key (Melkonian) → skills needed (Jarrahi et al.).", "fr": "Définition (Rai et al.) → bénéfices à 3 niveaux → 5 principes de Bankins → limites (copiable, données passées, hallucinations) → non, le manager centré sur l'humain reste clé (Melkonian) → compétences nécessaires (Jarrahi et al.)."}], "quiz": [{"q": "Doing things right (most output for least input) is:", "o": ["Effectiveness", "Efficiency", "Leadership", "Controlling"], "a": [1], "e": "Effectiveness = doing the right things; efficiency = doing things right.", "fr": "Efficacité = les bonnes choses ; efficience = bien les faire.", "src": "The manager's role"}, {"q": "Which is NOT one of the 4 management functions?", "o": ["Planning", "Organizing", "Recruiting", "Controlling"], "a": [2], "e": "Planning, organizing, leading, controlling.", "fr": "Planifier, organiser, diriger, contrôler.", "src": "The manager's role"}, {"q": "The 4th managerial skill, besides conceptual, interpersonal and technical:", "o": ["Political", "Financial", "Digital", "Linguistic"], "a": [0], "e": "Building a power base and networks.", "fr": "Se construire une base de pouvoir et un réseau.", "src": "The manager's role"}, {"q": "Who defined emotional intelligence as the best predictor of leadership?", "o": ["Gardner", "Goleman", "Fayol", "Storey"], "a": [1], "e": "Goleman (1995): 5 components.", "fr": "Goleman (1995) : 5 composantes.", "src": "The manager's role"}, {"q": "A manager promoted for technical skill, laissez-faire, high need for achievement:", "o": ["Bureaucrat", "Autocrat", "Reluctant manager", "Open manager"], "a": [2], "e": "Give them options with your argued preference.", "fr": "Lui proposer des options avec ta préférence.", "src": "The manager's role"}, {"q": "Carroll's CSR pyramid, from bottom to top:", "o": ["Legal, economic, ethical, philanthropic", "Economic, legal, ethical, philanthropic", "Ethical, legal, economic, philanthropic", "Philanthropic, ethical, legal, economic"], "a": [1], "e": "Economic responsibilities are the base.", "fr": "La base = responsabilités économiques.", "src": "Responsible management"}, {"q": "The triple bottom line (people, planet, profit) comes from:", "o": ["Freeman", "Elkington", "Carroll", "Waddock"], "a": [1], "e": "Elkington (1997).", "fr": "Elkington (1997).", "src": "Responsible management"}, {"q": "\"Competitive advantage through a committed and capable workforce\" is the HRM definition of:", "o": ["Armstrong", "Storey", "Robbins", "Einarsen"], "a": [1], "e": "Storey (2007).", "fr": "Storey (2007).", "src": "HRM"}, {"q": "Job description + job specification come from:", "o": ["Job analysis", "Employer branding", "Performance appraisal", "Reward management"], "a": [0], "e": "The basis of HR planning.", "fr": "La base de la planification RH.", "src": "HRM"}, {"q": "For Einarsen, bullying requires behaviour that is repeated over about:", "o": ["1 week", "1 month", "6 months", "2 years"], "a": [2], "e": "Regular (e.g. weekly) and over time (about 6 months).", "fr": "Régulier (ex. chaque semaine) et dans la durée (≈ 6 mois).", "src": "Difficulties at work"}, {"q": "Which is NOT one of Cartwright and Cooper's 6 sources of stress?", "o": ["Role in the organization", "Relationships at work", "Company stock price", "Factors outside work"], "a": [2], "e": "Intrinsic to the job, role, relationships, career, structure and climate, outside work.", "fr": "Poste, rôle, relations, carrière, structure et climat, hors travail.", "src": "Difficulties at work"}, {"q": "Self-determination theory: remote work mainly threatens the need for:", "o": ["Autonomy", "Competence", "Relatedness", "Pay"], "a": [2], "e": "Relatedness (belonging).", "fr": "L'appartenance.", "src": "Difficulties at work"}, {"q": "A conflict about how the work gets done is a:", "o": ["Task conflict", "Relationship conflict", "Process conflict", "Dysfunctional conflict"], "a": [2], "e": "Task = content and goals; process = how.", "fr": "Tâche = contenu ; processus = comment.", "src": "Conflict management"}, {"q": "Wanting to fully satisfy both parties' concerns is the intention of:", "o": ["Competing", "Collaborating", "Compromising", "Accommodating"], "a": [1], "e": "Collaborating = win-win.", "fr": "Collaborer = gagnant-gagnant.", "src": "Conflict management"}, {"q": "Bankins' ethical AI principle of being understandable and accountable:", "o": ["Beneficence", "Justice", "Autonomy", "Explicability"], "a": [3], "e": "The 5: beneficence, non-maleficence, autonomy, justice, explicability.", "fr": "Les 5 : bienfaisance, non-malfaisance, autonomie, justice, explicabilité.", "src": "AI at work"}]}, {"id": "economics", "name": "Global Economic Issues", "short": "Economics", "start": "2026-12-11T18:00:00+08:00", "when": "Ven. 11 déc. · 18:00–19:00", "fmt": "QCM de 30 questions · 1h · +1 / −0,25", "weight": "40 %", "rules": "Sans documents, sans brouillon, sans calculatrice", "hue": 185, "lead": "The 6 chapters of the course (climate, inflation, protectionism, sovereignty, competition, innovation): the mechanisms, authors, figures and examples that come up in an MCQ.", "prof": "M1 · Lingli XU / Emmanuel COMBE", "sections": [{"id": "exam", "short": "The final exam", "title": "The final exam: answering strategy", "sub": "Course syllabus", "en": "<div class=\"box key\"><span class=\"lbl\">Your calendar (exam notice)<\/span><b>Fri 11 December, 18:00–19:00<\/b> (Suzhou time). MCQ on TestWe, 1 hour. No documents, no scratch paper, no calculator. People in charge: Jérémy Lucky, Annabelle Caumel, Emmanuel Combe.<br>Room 271, row 5, seat 6. Arrive 15 minutes early with your student card and a charged battery.<\/div>\n<p>30 questions in 1 hour, i.e. 2 minutes per question. Correct answer +1, wrong −0.25, no answer 0.<\/p>\n<div class=\"box key\"><span class=\"lbl\">Should you guess?<\/span>\nWith 4 options, a random guess is worth on average 0.25 × 1 − 0.75 × 0.25 = <b>+0.06 point<\/b>: slightly positive. If you can eliminate just one wrong option, the expected value rises to <b>+0.17<\/b>. With 5 options, a pure guess is worth 0.<br>\n→ Answer as soon as you can eliminate at least one option.<\/div>\n<p>The MCQ mostly tests: <b>definitions<\/b> (externality, NAIRU, dumping, monopsony, GPT…), <b>mechanisms<\/b> (why a carbon tax cuts emissions, how the ECB curbs inflation), the <b>authors<\/b> and the key <b>figures<\/b> of the course. They are in bold on this sheet.<\/p>", "fr": "<div class=\"box key\"><span class=\"lbl\">Ton calendrier (convocation)<\/span><b>Ven. 11 décembre, 18 h–19 h<\/b> (heure de Suzhou). QCM sur TestWe, 1 h. Pas de documents, pas de brouillon, pas de calculatrice. Responsables : Jérémy Lucky, Annabelle Caumel, Emmanuel Combe.<br>Salle 271, rang 5, place 6. Arriver 15 min avant avec ta carte étudiante, batterie chargée.<\/div>\n<p>30 questions en 1 h, soit 2 minutes par question. Bonne réponse +1, mauvaise −0,25, sans réponse 0.<\/p>\n<div class=\"box key\"><span class=\"lbl\">Faut-il répondre au hasard ?<\/span>\nAvec 4 choix, une réponse au hasard rapporte en moyenne 0,25 × 1 − 0,75 × 0,25 = <b>+0,06 point<\/b> : légèrement positif. Si tu élimines une seule mauvaise réponse, l'espérance monte à <b>+0,17<\/b>. Avec 5 choix, le hasard pur rapporte 0.<br>\n→ Réponds dès que tu peux éliminer au moins une option.<\/div>\n<p>Le QCM teste surtout : les <b>définitions<\/b> (externalité, NAIRU, dumping, monopsone, GPT…), les <b>mécanismes<\/b> (pourquoi une taxe carbone réduit les émissions, comment la BCE freine l'inflation), les <b>auteurs<\/b> et les <b>chiffres<\/b> marquants du cours. Ils sont mis en gras dans cette fiche.<\/p>"}, {"id": "c1", "short": "Climate", "title": "1. Climate change: an economic perspective", "sub": "Sessions 1 and 2 · Nordhaus, Tirole, Gollier, Aghion", "en": "<h3>The diagnosis<\/h3>\n<ul>\n<li>CO₂: <b>280 → 410 ppm<\/b>; temperature +1 °C; climate sensitivity (doubling of CO₂) ≈ <b>2–3 °C<\/b>.<\/li>\n<li><b>Kaya identity<\/b>: CO₂ = GDP × (E/GDP) × (CO₂/E). Three levers: reduce activity, <b>energy intensity<\/b>, <b>carbon intensity<\/b>. Economists favour the last two.<\/li>\n<li>Effects: indirect (disasters, sea level rise, agriculture) and direct (labour productivity when it is too hot) → <b>North/South inequalities<\/b>.<\/li>\n<li>Remaining carbon budget <b>800 Gt<\/b>, emissions <b>40 Gt/year<\/b> → about <b>20 years<\/b>. Paris Agreement: +2 °C by 2100. <b>Fit for 55<\/b> (2021): −55% by 2030, neutrality by 2050, end of combustion engines in 2035, Social Climate Fund.<\/li>\n<li>AI improves efficiency but its data centers use a lot of electricity (IEA).<\/li>\n<\/ul>\n<h3>The \"usual\" approaches and their limits<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Approach<\/th><th>Idea<\/th><th>Limit<\/th><\/tr>\n<tr><td>Degrowth<\/td><td>Reduce activity<\/td><td>Social cost; <b>Bazot (2021)<\/b> simulation: <b>€572 per month per person<\/b> for neutrality in 2050; flight quotas (Shift Project)<\/td><\/tr>\n<tr><td>Green innovation<\/td><td>Renewables, EVs, hydrogen, SAF<\/td><td>Expensive technologies, <b>path dependency<\/b> (Aghion); <b>intermediate energy trap<\/b> (gas: substitution effect vs scale effect)<\/td><\/tr>\n<tr><td>Consumer preferences<\/td><td>Carbon score, voluntary offsetting<\/td><td>Attitude–behaviour gap, <b>greenwashing<\/b> (232 EU labels, half poorly verified → Green Claims Directive)<\/td><\/tr>\n<tr><td>Ban / mandate<\/td><td>Target reached with certainty<\/td><td>Does not minimize costs when firms differ (e.g. ReFuelEU aviation)<\/td><\/tr>\n<tr><td>Activism<\/td><td>Naming and shaming, \"Affaire du siècle\" (2021)<\/td><td>Low effectiveness<\/td><\/tr>\n<\/table><\/div>\n<p>Role of the state to escape path dependency: R&amp;D subsidies, carbon pricing, industrial policy (<b>IPCEI<\/b> hydrogen in the EU, <b>Inflation Reduction Act<\/b> in the US). Success story: the Nordic countries.<\/p>\n<h3>Putting a price on carbon<\/h3>\n<ul>\n<li><b>Tragedy of the commons<\/b> (Hardin) and <b>negative externality<\/b>: social cost &gt; private cost → overproduction. Positive externality (innovation) → underinvestment.<\/li>\n<li><b>Pigouvian tax<\/b> → polluter-pays principle. Goal: change behaviour, not raise revenue (Irish plastic bag tax, 2002). \"Right\" price: <b>€50 to €100 per tonne<\/b>.<\/li>\n<li>France: TGAP (1999), <b>climate-energy contribution<\/b> (2014: €7 → 2018: €44.60/t), frozen by the <b>yellow vests<\/b> (2018). Unpopular tax: seen as a revenue grab, regressive, exemptions, lack of transparency → energy cheques. Alternative: <b>carbon card<\/b> (tradable individual quotas).<\/li>\n<\/ul>\n<h3>Emissions trading (cap and trade)<\/h3>\n<div class=\"box ex\"><span class=\"lbl\">Course example<\/span>\nA and B each emit 100,000 t; target 190,000 t → 95,000 permits each. Abatement cost: A = €5/t, B = €15/t.<br>\nWithout trading: A cuts 5,000 t (€25,000) + B cuts 5,000 t (€75,000) = <b>€100,000<\/b>.<br>\nWith a permit price of €10: A cuts 10,000 t (€50,000) and sells 5,000 permits (+€50,000) → net cost 0; B buys 5,000 permits (€50,000).<br>\nTotal <b>€75,000 &lt; €100,000<\/b>: same target, cheaper. That is the advantage of the market.<\/div>\n<ul>\n<li>Success: SO₂ in the US (Clean Air Act, 1990). EU: <b>ETS<\/b> since 2003 (45% of emissions, 11,000 sites). Too many free permits → price &lt; €10 → 2018 reform with the <b>Market Stability Reserve<\/b> → higher price.<\/li>\n<li>Free permits to avoid <b>carbon leakage<\/b> (production moving where carbon has no price), estimated at <b>5 to 30%<\/b>. Aviation: end of free intra-EU permits in 2026; extra-EU flights under <b>CORSIA<\/b>.<\/li>\n<\/ul>\n<h3>International coordination<\/h3>\n<ul>\n<li>The climate is a <b>public good<\/b> → free riding → <b>prisoner's dilemma<\/b>: the Nash equilibrium is that nobody acts. Kyoto (1997) not ratified by all; COP21 (2015) with no verification or sanctions.<\/li>\n<li>Solutions: (1) a <b>single global carbon price<\/b> (Tirole, Weitzman) with compensation; (2) an equal allocation per person (<b>5 t/year<\/b> for a 38 Gt target) and a global market; (3) a <b>climate club<\/b> (Nordhaus) with a border tax.<\/li>\n<li>EU: <b>CBAM<\/b> (Carbon Border Adjustment Mechanism). Reporting from 2023, full application in <b>2026<\/b>; direct emissions (scope 1); 5 at-risk sectors (cement, aluminium, steel…). Challenges: measuring imported carbon, WTO compatibility, retaliation, higher prices, downstream leakage (steel is taxed but not the car).<\/li>\n<\/ul>", "fr": "<h3>Le diagnostic<\/h3>\n<ul>\n<li>CO₂ : <b>280 → 410 ppm<\/b> ; température +1 °C ; sensibilité climatique (doublement du CO₂) ≈ <b>2–3 °C<\/b>.<\/li>\n<li><b>Équation de Kaya<\/b> : CO₂ = PIB × (E/PIB) × (CO₂/E). Trois leviers : réduire l'activité, l'<b>intensité énergétique<\/b>, l'<b>intensité carbone<\/b>. Les économistes privilégient les deux derniers.<\/li>\n<li>Effets : indirects (catastrophes, montée des eaux, agriculture) et directs (productivité du travail quand il fait trop chaud) → <b>inégalités Nord/Sud<\/b>.<\/li>\n<li>Budget carbone restant <b>800 Gt<\/b>, émissions <b>40 Gt/an<\/b> → environ <b>20 ans<\/b>. Accord de Paris : +2 °C en 2100. <b>Fit for 55<\/b> (2021) : −55 % en 2030, neutralité en 2050, fin des moteurs thermiques en 2035, Fonds social pour le climat.<\/li>\n<li>L'IA améliore l'efficacité mais ses data centers consomment beaucoup d'électricité (AIE).<\/li>\n<\/ul>\n<h3>Les approches « habituelles » et leurs limites<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Approche<\/th><th>Idée<\/th><th>Limite<\/th><\/tr>\n<tr><td>Décroissance<\/td><td>Réduire l'activité<\/td><td>Coût social ; simulation de <b>Bazot (2021)<\/b> : <b>572 € par mois et par personne<\/b> pour la neutralité en 2050 ; quotas de vols (Shift Project)<\/td><\/tr>\n<tr><td>Innovation verte<\/td><td>Renouvelables, VE, hydrogène, SAF<\/td><td>Technologies chères, <b>dépendance au sentier<\/b> (path dependency, Aghion) ; <b>piège de l'énergie intermédiaire<\/b> (gaz : effet de substitution vs effet d'échelle)<\/td><\/tr>\n<tr><td>Préférences des consommateurs<\/td><td>Score carbone, compensation volontaire<\/td><td>Écart attitude–comportement, <b>greenwashing<\/b> (232 labels UE, la moitié mal vérifiés → Green Claims Directive)<\/td><\/tr>\n<tr><td>Interdiction / obligation<\/td><td>Objectif atteint avec certitude<\/td><td>Ne minimise pas les coûts si les firmes sont différentes (ex. ReFuelEU aviation)<\/td><\/tr>\n<tr><td>Activisme<\/td><td>Naming and shaming, « Affaire du siècle » (2021)<\/td><td>Efficacité faible<\/td><\/tr>\n<\/table><\/div>\n<p>Rôle de l'État pour sortir de la dépendance au sentier : subventions à la R&D, prix du carbone, politique industrielle (<b>IPCEI<\/b> hydrogène en UE, <b>Inflation Reduction Act<\/b> aux États-Unis). Exemple de réussite : les pays nordiques.<\/p>\n<h3>Donner un prix au carbone<\/h3>\n<ul>\n<li><b>Tragédie des communs<\/b> (Hardin) et <b>externalité négative<\/b> : coût social &gt; coût privé → surproduction. Externalité positive (innovation) → sous-investissement.<\/li>\n<li><b>Taxe pigouvienne<\/b> → principe pollueur-payeur. But : changer les comportements, pas lever des recettes (taxe irlandaise sur les sacs plastiques, 2002). Prix « juste » : <b>50 à 100 € la tonne<\/b>.<\/li>\n<li>France : TGAP (1999), <b>contribution climat-énergie<\/b> (2014 : 7 € → 2018 : 44,60 €/t), bloquée par les <b>gilets jaunes<\/b> (2018). Taxe impopulaire : perçue comme une taxe de rendement, anti-redistributive, exemptions, manque de transparence → chèques énergie. Alternative : <b>carte carbone<\/b> (quotas individuels échangeables).<\/li>\n<\/ul>\n<h3>Les marchés de quotas (cap and trade)<\/h3>\n<div class=\"box ex\"><span class=\"lbl\">Exemple du cours<\/span>\nA et B émettent chacun 100 000 t ; objectif 190 000 t → 95 000 quotas chacun. Coût de réduction : A = 5 €/t, B = 15 €/t.<br>\nSans échange : A réduit 5 000 t (25 000 €) + B réduit 5 000 t (75 000 €) = <b>100 000 €<\/b>.<br>\nAvec un prix du quota à 10 € : A réduit 10 000 t (50 000 €) et vend 5 000 quotas (+50 000 €) → coût net 0 ; B achète 5 000 quotas (50 000 €).<br>\nTotal <b>75 000 € &lt; 100 000 €<\/b> : même objectif, moins cher. C'est l'avantage du marché.<\/div>\n<ul>\n<li>Succès : SO₂ aux États-Unis (Clean Air Act, 1990). UE : <b>ETS<\/b> depuis 2003 (45 % des émissions, 11 000 sites). Trop de quotas gratuits → prix &lt; 10 € → réforme 2018 avec la <b>Market Stability Reserve<\/b> → prix plus élevé.<\/li>\n<li>Quotas gratuits pour éviter les <b>fuites de carbone<\/b> (production délocalisée là où le carbone n'a pas de prix), estimées entre <b>5 et 30 %<\/b>. Aviation : fin des quotas gratuits intra-UE en 2026 ; vols extra-UE sous <b>CORSIA<\/b>.<\/li>\n<\/ul>\n<h3>La coordination internationale<\/h3>\n<ul>\n<li>Le climat est un <b>bien public<\/b> → passager clandestin → <b>dilemme du prisonnier<\/b> : l'équilibre de Nash est que personne n'agit. Kyoto (1997) pas ratifié par tous ; COP21 (2015) sans vérification ni sanction.<\/li>\n<li>Solutions : (1) un <b>prix mondial unique<\/b> du carbone (Tirole, Weitzman) avec compensations ; (2) une allocation égale par personne (<b>5 t/an<\/b> pour un objectif de 38 Gt) et un marché mondial ; (3) un <b>club climat<\/b> (Nordhaus) avec une taxe aux frontières.<\/li>\n<li>UE : <b>MACF / CBAM<\/b> (Carbon Border Adjustment Mechanism). Reporting dès 2023, application pleine en <b>2026<\/b> ; émissions directes (scope 1) ; 5 secteurs à risque (ciment, aluminium, acier…). Défis : mesurer le carbone importé, compatibilité OMC, représailles, prix plus élevés, fuites en aval (on taxe l'acier mais pas la voiture).<\/li>\n<\/ul>"}, {"id": "c2", "short": "Inflation", "title": "2. Is inflation back?", "sub": "Session 3 · Goodhart, Kydland-Prescott, Barro-Gordon, Blanchard", "en": "<ul>\n<li><b>Inflation<\/b> = a lasting, general rise in prices, measured by the CPI (INSEE, 1,600 product groups, weighted by consumption). <b>Core inflation<\/b> = excluding energy and food.<\/li>\n<li>Deflation (falling prices), <b>disinflation<\/b> (slowing inflation), <b>hyperinflation<\/b> (50% threshold in the course, monthly according to Cagan's usual definition).<\/li>\n<\/ul>\n<h3>The 3 causes<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Cause<\/th><th>Mechanism<\/th><\/tr>\n<tr><td><b>Demand / cycle<\/b> (demand-pull)<\/td><td>Output gap closing, saturated capacity, low unemployment → wages ↑. <b>Phillips curve<\/b> (1958): decreasing, convex relationship between unemployment and inflation; <b>NAIRU<\/b> = the unemployment rate that does not accelerate inflation.<\/td><\/tr>\n<tr><td><b>Costs<\/b> (cost-push)<\/td><td>Commodity shock passed on to prices; <b>wage-price spiral<\/b>: prices ↑ → purchasing power ↓ → wage demands ↑ → costs ↑ → prices ↑.<\/td><\/tr>\n<tr><td><b>Monetary<\/b><\/td><td>Quantity theory: M × V = P × Y. Friedman: \"always and everywhere a monetary phenomenon\". Explains hyperinflations (Zimbabwe, Venezuela, Weimar) when the central bank monetizes the deficit.<\/td><\/tr>\n<\/table><\/div>\n<div class=\"f\">dP/P = dM/M − dY/Y   (V constant)<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Example<\/span>Money supply +7%, real GDP +2%, stable velocity → inflation ≈ 7 − 2 = <b>5%<\/b>.<\/div>\n<h3>30 years of low inflation: why?<\/h3>\n<p>The Phillips curve <b>flattened<\/b>. Four factors:<\/p>\n<ol>\n<li><b>Digital<\/b>: productivity gains, the \"Amazon effect\" (Cavallo), cheaper substitutes, the sharing economy.<\/li>\n<li><b>Labour market<\/b>: weaker unions, uberization, local monopsonies, immigration; downward wage rigidity in recessions (Daly and Hobijn, 2015).<\/li>\n<li><b>Globalization<\/b>: Uruguay Round (WTO, 1995), China joins the WTO (2001), cheap imports, threat of offshoring.<\/li>\n<li><b>Central bank credibility<\/b>: end of the \"inflation bias\" (<b>Barro and Gordon, 1983<\/b>); <b>time inconsistency<\/b> (<b>Kydland and Prescott<\/b>) → \"rules rather than discretion\"; independence, <b>Taylor rule<\/b>, anchored expectations.<\/li>\n<\/ol>\n<h3>The return of inflation (&gt; 8% in 2022)<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">View 1: a transitory shock<\/b>Post-Covid rebound, value chain bottlenecks, energy and food (war in Ukraine), strong M2 growth in 2021. Commodity prices have reversed since 2023, little wage indexation in the US.<\/div>\n<div class=\"card\"><b class=\"t\">View 2: structural inflation<\/b>(<b>Goodhart<\/b>) End of globalization (Doha stalled, rising Chinese wages, Trump II protectionism); <b>ageing<\/b> (fewer workers, IMF U-curve); climate transition.<\/div>\n<\/div>\n<p>The 3 climate inflations: <b>climateflation<\/b> (extreme events, poor harvests, insurance); <b>fossilflation<\/b> (carbon tax on fossil fuels; less inflationary if gradual and early, according to the Banque de France); <b>greenflation<\/b> (lithium, copper; 88% of lithium produced by 3 countries, inelastic supply).<\/p>\n<h3>Costs of inflation and monetary policy<\/h3>\n<ul>\n<li>Costs: <b>shoe-leather costs<\/b> (transaction costs), <b>menu costs<\/b> (changing price tags), volatility blurring the price signal, <b>self-fulfilling prophecy<\/b> (Merton). Winners: non-indexed borrowers; losers: lenders.<\/li>\n<li>ECB: 3 key rates: <b>MRO<\/b> (one-week refinancing), <b>DFR<\/b> (deposit facility), <b>MLF<\/b> (marginal lending). If inflation threatens, the ECB raises them → more expensive credit → less consumption and investment. Housing reacts first (housing starts ↓).<\/li>\n<li>Why not 0%? A little inflation lowers real wages without cutting nominal wages, eases debts, the CPI is overestimated (<b>Boskin<\/b>, 1996), no growth/inflation link below a threshold (<b>Barro<\/b>, 1995), and it avoids the deflationary spiral. Target: 2%; <b>Bernanke and Blanchard<\/b> (2023) suggest 3%.<\/li>\n<\/ul>", "fr": "<ul>\n<li><b>Inflation<\/b> = hausse durable et générale des prix, mesurée par l'IPC (INSEE, 1 600 groupes de produits, pondérés selon la consommation). <b>Inflation sous-jacente<\/b> (core) = hors énergie et alimentation.<\/li>\n<li>Déflation (baisse des prix), <b>désinflation<\/b> (ralentissement de l'inflation), <b>hyperinflation<\/b> (seuil de 50 % dans le cours, mensuel selon la définition usuelle de Cagan).<\/li>\n<\/ul>\n<h3>Les 3 causes<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Cause<\/th><th>Mécanisme<\/th><\/tr>\n<tr><td><b>Demande / cycle<\/b> (demand-pull)<\/td><td>Output gap qui se referme, capacités saturées, chômage bas → salaires ↑. <b>Courbe de Phillips<\/b> (1958) : relation décroissante et convexe entre chômage et inflation ; <b>NAIRU<\/b> = taux de chômage qui n'accélère pas l'inflation.<\/td><\/tr>\n<tr><td><b>Coûts<\/b> (cost-push)<\/td><td>Choc sur les matières premières répercuté sur les prix ; <b>boucle prix-salaires<\/b> : prix ↑ → pouvoir d'achat ↓ → revendications ↑ → coûts ↑ → prix ↑.<\/td><\/tr>\n<tr><td><b>Monétaire<\/b><\/td><td>Théorie quantitative : M × V = P × Y. Friedman : « toujours et partout un phénomène monétaire ». Explique les hyperinflations (Zimbabwe, Venezuela, Weimar) quand la banque centrale monétise le déficit.<\/td><\/tr>\n<\/table><\/div>\n<div class=\"f\">dP/P = dM/M − dY/Y   (V constant)<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple<\/span>Masse monétaire +7 %, PIB réel +2 %, vitesse stable → inflation ≈ 7 − 2 = <b>5 %<\/b>.<\/div>\n<h3>30 ans d'inflation basse : pourquoi ?<\/h3>\n<p>La courbe de Phillips s'est <b>aplatie<\/b>. Quatre facteurs :<\/p>\n<ol>\n<li><b>Numérique<\/b> : gains de productivité, « effet Amazon » (Cavallo), baisse du prix des substituts, économie du partage.<\/li>\n<li><b>Marché du travail<\/b> : syndicats affaiblis, ubérisation, monopsones locaux, immigration ; rigidité des salaires en récession (Daly et Hobijn, 2015).<\/li>\n<li><b>Mondialisation<\/b> : Uruguay Round (OMC, 1995), Chine à l'OMC (2001), importations bon marché, menace de délocalisation.<\/li>\n<li><b>Crédibilité des banques centrales<\/b> : fin du « biais inflationniste » (<b>Barro et Gordon, 1983<\/b>) ; <b>incohérence temporelle<\/b> (<b>Kydland et Prescott<\/b>) → « des règles plutôt que la discrétion » ; indépendance, <b>règle de Taylor<\/b>, anticipations ancrées.<\/li>\n<\/ol>\n<h3>Le retour de l'inflation (&gt; 8 % en 2022)<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Thèse 1 : choc transitoire<\/b>Rebond post-Covid, goulets dans les chaînes de valeur, énergie et alimentation (guerre en Ukraine), forte croissance de M2 en 2021. Retournement des matières premières depuis 2023, peu d'indexation des salaires aux États-Unis.<\/div>\n<div class=\"card\"><b class=\"t\">Thèse 2 : inflation structurelle<\/b>(<b>Goodhart<\/b>) Fin de la mondialisation (Doha bloqué, salaires chinois en hausse, protectionnisme de Trump II) ; <b>vieillissement<\/b> (moins de travailleurs, courbe en U du FMI) ; transition climatique.<\/div>\n<\/div>\n<p>Les 3 inflations climatiques : <b>climateflation<\/b> (événements extrêmes, mauvaises récoltes, assurances) ; <b>fossilflation<\/b> (taxe carbone sur les fossiles ; moins inflationniste si elle est progressive et précoce, selon la Banque de France) ; <b>greenflation<\/b> (lithium, cuivre ; 88 % du lithium produit par 3 pays, offre inélastique).<\/p>\n<h3>Coûts de l'inflation et politique monétaire<\/h3>\n<ul>\n<li>Coûts : <b>shoe-leather costs<\/b> (coûts de transaction), <b>menu costs<\/b> (changer les étiquettes), volatilité qui brouille le signal-prix, <b>prophétie autoréalisatrice<\/b> (Merton). Gagnants : emprunteurs non indexés ; perdants : prêteurs.<\/li>\n<li>BCE : 3 taux directeurs : <b>MRO<\/b> (refinancement à une semaine), <b>DFR<\/b> (facilité de dépôt), <b>MLF<\/b> (prêt marginal). Si l'inflation menace, la BCE les relève → crédit plus cher → moins de consommation et d'investissement. L'immobilier réagit en premier (mises en chantier ↓).<\/li>\n<li>Pourquoi pas 0 % ? Un peu d'inflation baisse les salaires réels sans baisser les salaires nominaux, allège les dettes, l'IPC est surestimé (<b>Boskin<\/b>, 1996), aucun lien croissance/inflation en dessous d'un seuil (<b>Barro<\/b>, 1995), et évite la spirale déflationniste. Cible : 2 % ; <b>Bernanke et Blanchard<\/b> (2023) proposent 3 %.<\/li>\n<\/ul>"}, {"id": "c3", "short": "Protectionism", "title": "3. The protectionist temptation", "sub": "Session 4 · Autor-Dorn-Hanson, Feenstra, Cavallo, Jaravel-Sager, Olson", "en": "<ul>\n<li><b>\"China shock\"<\/b> (Autor et al., 2013): gains for consumers, but lasting manufacturing job losses (over 10 years) in exposed areas.<\/li>\n<li>Warning signs: trade openness flat since 2008, Doha stalled, US/China trade war since 2017.<\/li>\n<li><b>\"Liberation Day\"<\/b> (April 2025): <b>\"reciprocal\" tariffs<\/b>, different by country and negotiated bilaterally, in breach of WTO rules. A shift from a rules-based multilateral system to a power-based bilateral one. Risk of a return to the 1930s (Smoot-Hawley).<\/li>\n<li>EU/China: anti-subsidy duties on Chinese EVs (October 2024) → Chinese anti-dumping duties on European <b>brandy<\/b> (July 2025), then minimum price commitments.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">How the \"reciprocal\" tariff is calculated<\/span>\nImports from A = $200B, exports to A = $100B → deficit = $100B. Deficit / imports = 50%, halved → <b>25%<\/b>.<br>\nOfficial formula: Δτ = (x − m) / (ε × φ × m), with ε = −4 (elasticity) and φ = 0.25 (pass-through). Since ε × φ = −1, it boils down to <b>deficit / imports<\/b>. The implicit assumption (every deficit comes from unfair practices) is debatable.<\/div>\n<h3>Justifications and criticisms<\/h3>\n<p>Justifications: protecting output and jobs, <b>infant industry<\/b>, national independence.<\/p>\n<ol>\n<li><b>Retaliation<\/b>: prisoner's dilemma, \"tit for tat\" (China taxing soybeans from US farm states).<\/li>\n<li><b>Tariff jumping<\/b> (<b>Mundell<\/b> theorem, 1957): getting around it via a third country (China → Mexico) or by investing in the protected country (Japanese carmakers in Europe in the 1980s; pharma as Trump wants).<\/li>\n<li><b>No domestic substitutes<\/b>: imports barely react (same logic as for the exchange rate).<\/li>\n<li><b>Absorption by exporters<\/b>: <b>Feenstra<\/b> (1989), 40% of the tariff on Japanese trucks absorbed; but in 2018–2022, Americans paid most of the tariffs (<b>Cavallo et al.<\/b>, 2021).<\/li>\n<li><b>Cost<\/b> to the protected country: transfer from consumers to producers + deadweight loss (two triangles), regressive effect, more expensive inputs downstream, less competition so less innovation.<\/li>\n<\/ol>\n<div class=\"box ex\"><span class=\"lbl\">Figures to remember<\/span>\n• Washing machines (Fed, 2019): prices +12%, <b>$1.5B<\/b> extra cost for 1,800 jobs saved → about <b>$815,000 per job per year<\/b> (≈ $67,900 per month).<br>\n• Fed (2020), 76 industries: direct effect +0.3%; via inputs −1.1%; via retaliation −0.7% → <b>net effect −1.5%<\/b> on employment.<br>\n• Conversely, the China shock created about <b>$400,000 of consumer surplus per job lost<\/b> (Jaravel and Sager, 2019).<\/div>\n<ul>\n<li><b>Olson's paradox<\/b>: few, organized producers (lobbying) vs many, dispersed consumers → protectionist bias (Pareto, 1909).<\/li>\n<li><b>HOS<\/b>: each country exports the good that uses its abundant factor intensively. <b>Stolper-Samuelson<\/b>: free trade raises the return of the abundant factor and lowers that of the scarce factor → internal inequality (low-skilled labour in Europe).<\/li>\n<li>Making trade acceptable: redistribute to the losers (training, mobility); <b>TAA<\/b> in the US (being phased out since 2022); <b>EGF<\/b> (European Globalisation Adjustment Fund) in the EU.<\/li>\n<\/ul>", "fr": "<ul>\n<li><b>« China shock »<\/b> (Autor et al., 2013) : gains pour les consommateurs, mais pertes d'emplois manufacturiers durables (plus de 10 ans) dans les zones exposées.<\/li>\n<li>Signes avant-coureurs : ouverture stagnante depuis 2008, Doha bloqué, guerre commerciale États-Unis/Chine depuis 2017.<\/li>\n<li><b>« Liberation Day »<\/b> (avril 2025) : <b>droits de douane « réciproques »<\/b>, différents par pays et négociés bilatéralement, en violation des règles de l'OMC. Passage d'un système multilatéral fondé sur des règles à un système bilatéral fondé sur le rapport de force. Risque d'un retour aux années 1930 (Smoot-Hawley).<\/li>\n<li>UE/Chine : droits anti-subventions sur les VE chinois (octobre 2024) → droits anti-dumping chinois sur le <b>brandy<\/b> européen (juillet 2025), puis engagements de prix minimum.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Le calcul du tarif « réciproque »<\/span>\nImportations depuis A = 200 Md$, exportations vers A = 100 Md$ → déficit = 100 Md$. Déficit / importations = 50 %, divisé par deux → <b>25 %<\/b>.<br>\nFormule officielle : Δτ = (x − m) / (ε × φ × m), avec ε = −4 (élasticité) et φ = 0,25 (pass-through). Comme ε × φ = −1, cela revient à <b>déficit / importations<\/b>. L'hypothèse implicite (tout déficit vient de pratiques déloyales) est contestable.<\/div>\n<h3>Justifications et critiques<\/h3>\n<p>Justifications : protéger la production et l'emploi, <b>industrie naissante<\/b> (infant industry), indépendance nationale.<\/p>\n<ol>\n<li><b>Représailles<\/b> : dilemme du prisonnier, « tit for tat » (Chine taxant le soja des États agricoles américains).<\/li>\n<li><b>Tariff jumping<\/b> (théorème de <b>Mundell<\/b>, 1957) : contourner par un pays tiers (Chine → Mexique) ou en investissant dans le pays protégé (Japonais en Europe dans les années 80 ; pharma voulu par Trump).<\/li>\n<li><b>Pas de substituts domestiques<\/b> : les importations réagissent peu (même logique que pour le taux de change).<\/li>\n<li><b>Absorption par les exportateurs<\/b> : <b>Feenstra<\/b> (1989), 40 % du tarif sur les camions japonais absorbé ; mais en 2018–2022, les Américains ont payé l'essentiel des tarifs (<b>Cavallo et al.<\/b>, 2021).<\/li>\n<li><b>Coût<\/b> pour le pays protégé : transfert des consommateurs vers les producteurs + perte sèche (deux triangles), effet anti-redistributif, intrants plus chers pour l'aval, moins de concurrence donc moins d'innovation.<\/li>\n<\/ol>\n<div class=\"box ex\"><span class=\"lbl\">Chiffres à retenir<\/span>\n• Machines à laver (Fed, 2019) : prix +12 %, <b>1,5 Md$<\/b> de surcoût pour 1 800 emplois sauvés → environ <b>815 000 $ par emploi et par an<\/b> (≈ 67 900 $ par mois).<br>\n• Fed (2020), 76 industries : effet direct +0,3 % ; via les intrants −1,1 % ; via les représailles −0,7 % → <b>effet net −1,5 %<\/b> sur l'emploi.<br>\n• Inversement, le China shock a créé environ <b>400 000 $ de surplus consommateur par emploi perdu<\/b> (Jaravel et Sager, 2019).<\/div>\n<ul>\n<li><b>Paradoxe d'Olson<\/b> : producteurs peu nombreux et organisés (lobbying) vs consommateurs nombreux et dispersés → biais protectionniste (Pareto, 1909).<\/li>\n<li><b>HOS<\/b> : chaque pays exporte le bien qui utilise intensivement son facteur abondant. <b>Stolper-Samuelson<\/b> : le libre-échange augmente la rémunération du facteur abondant et baisse celle du facteur rare → inégalités internes (travail peu qualifié en Europe).<\/li>\n<li>Rendre le commerce acceptable : redistribuer vers les perdants (formation, mobilité) ; <b>TAA<\/b> aux États-Unis (en extinction depuis 2022) ; <b>FEM<\/b> (European Globalisation Adjustment Fund) en UE.<\/li>\n<\/ul>"}, {"id": "c4", "short": "Economic sovereignty", "title": "4. Economic sovereignty", "sub": "Session 5 · Antràs, Jaravel-Méjean, Tirole, Aghion", "en": "<ul>\n<li>Covid revealed our dependence through <b>global value chains<\/b> (masks, chips, Suez Canal).<\/li>\n<li><b>Backward linkage<\/b> = foreign value added in my exports (Vietnam assembles Korean screens). <b>Forward linkage<\/b> = my value added used in others' exports (Korea). <b>Smile curve<\/b>: value lies upstream (R&amp;D, design) and downstream (marketing), not in assembly.<\/li>\n<li>Three views: radical (generalized protectionism), minimalist (a rich, attractive country), new: targeted <b>strategic autonomy<\/b>.<\/li>\n<\/ul>\n<h3>Defensive sovereignty: \"unfair\" competition<\/h3>\n<ul>\n<li><b>Dumping<\/b>: export price to the EU &lt; price on the home market. Measures possible under <b>3 conditions<\/b>: dumping + material injury + causal link. Criticism: anti-dumping mostly protects <b>inefficient firms<\/b> (Vandenbussche; Blonigen and Prusa).<\/li>\n<li><b>Subsidies<\/b>: narrow WTO definition (financial contribution + public + benefit + specific). New EU tools: <b>FSR<\/b> (foreign subsidies), <b>ACI<\/b> (anti-coercion), <b>IPI<\/b> (reciprocity in public procurement).<\/li>\n<li><b>FDI screening<\/b> of strategic assets: the <b>Kuka<\/b> shock (German robotics bought by Midea, €4.6B, 2016), the port of <b>Piraeus<\/b> (COSCO, 2016) → EU regulation <b>2019/452<\/b>. France: blocked the sale of Segault and Velan (nuclear valves) to Flowserve in 2023.<\/li>\n<\/ul>\n<h3>Offensive sovereignty: reshoring<\/h3>\n<ul>\n<li>Limited reshoring in France; helped by automation (<b>+1 robot per 1,000 employees = +3.5% reshoring<\/b>), 3D printing, AI.<\/li>\n<li>GVCs are \"sticky\" (<b>stickiness<\/b>, sunk costs): a temporary shock changes them little.<\/li>\n<li>Often cheaper alternatives: <b>nearshoring<\/b> (nearby country), <b>friendshoring<\/b> (allied countries), supplier <b>diversification<\/b>, strategic stocks.<\/li>\n<li>Strategic vulnerability = essentiality × supply concentration × difficulty of substitution. France: €850M, 5 sectors (health, agri-food, electronics, industrial inputs, 5G); modest results (paracetamol).<\/li>\n<\/ul>\n<h3>Catching-up policy<\/h3>\n<ul>\n<li>Basis: the <b>infant industry<\/b> argument. Successes: <b>Airbus<\/b> (1970 consortium, subsidies, public procurement), <b>Japan<\/b> (MITI, 1960s–70s).<\/li>\n<li>4 conditions: learning is possible (experience curve: cost −20% each time output doubles for an 80% curve); market failure; <b>temporary<\/b> support; measurable performance.<\/li>\n<li>Risks: staying \"infant\" forever, catching up on an <b>obsolete<\/b> technology (ACC and batteries vs LFP), <b>overcapacity<\/b> (chips, ASML 2024).<\/li>\n<li>Chips: <b>Chips Act<\/b>, €42B, target of a 20% market share by 2030 (unlikely); Intel's Magdeburg mega-fab <b>cancelled in 2025<\/b>; €1 invested in Taiwan ≈ €1.45 in the EU. Better to be <b>indispensable<\/b> on one link (<b>ASML<\/b> in lithography): mutual dependence.<\/li>\n<li>Breakthrough policies: the <b>DARPA/BARDA<\/b> model (clear mission, gradual selection of teams, advance purchases); <b>IPCEI<\/b> (upstream European projects with clawback); governance according to Tirole (independent experts, sunset clause, competitive neutrality).<\/li>\n<\/ul>", "fr": "<ul>\n<li>Le Covid a révélé notre dépendance via les <b>chaînes de valeur mondiales<\/b> (masques, puces, canal de Suez).<\/li>\n<li><b>Backward linkage<\/b> = valeur ajoutée étrangère dans mes exportations (le Vietnam assemble des écrans coréens). <b>Forward linkage<\/b> = ma valeur ajoutée utilisée dans les exportations des autres (la Corée). <b>Courbe du sourire<\/b> : la valeur est en amont (R&D, design) et en aval (marketing), pas dans l'assemblage.<\/li>\n<li>Trois visions : radicale (protectionnisme généralisé), minimaliste (un pays riche et attractif), nouvelle : <b>autonomie stratégique<\/b> ciblée.<\/li>\n<\/ul>\n<h3>Souveraineté défensive : la concurrence « déloyale »<\/h3>\n<ul>\n<li><b>Dumping<\/b> : prix à l'export vers l'UE &lt; prix sur le marché domestique. Mesures possibles si <b>3 conditions<\/b> : dumping + préjudice important + lien de causalité. Critique : l'anti-dumping protège surtout les <b>firmes inefficaces<\/b> (Vandenbussche ; Blonigen et Prusa).<\/li>\n<li><b>Subventions<\/b> : définition OMC restrictive (contribution financière + publique + avantage + spécifique). Nouveaux outils UE : <b>FSR<\/b> (subventions étrangères), <b>ACI<\/b> (anti-coercition), <b>IPI<\/b> (réciprocité des marchés publics).<\/li>\n<li><b>Filtrage des IDE<\/b> stratégiques : choc <b>Kuka<\/b> (robotique allemande rachetée par Midea, 4,6 Md€, 2016), port du <b>Pirée<\/b> (COSCO, 2016) → règlement UE <b>2019/452<\/b>. France : blocage de la vente de Segault et Velan (vannes nucléaires) à Flowserve en 2023.<\/li>\n<\/ul>\n<h3>Souveraineté offensive : relocaliser<\/h3>\n<ul>\n<li>Relocalisations limitées en France ; favorisées par l'automatisation (<b>+1 robot pour 1 000 salariés = +3,5 % de relocalisation<\/b>), l'impression 3D, l'IA.<\/li>\n<li>Les CVM sont « collantes » (<b>stickiness<\/b>, coûts irrécupérables) : un choc temporaire les change peu.<\/li>\n<li>Alternatives souvent moins chères : <b>nearshoring<\/b> (pays proche), <b>friendshoring<\/b> (pays alliés), <b>diversification<\/b> des fournisseurs, stocks stratégiques.<\/li>\n<li>Vulnérabilité stratégique = essentialité × concentration de l'offre × difficulté de substitution. France : 850 M€, 5 secteurs (santé, agroalimentaire, électronique, intrants industriels, 5G) ; résultats modestes (paracétamol).<\/li>\n<\/ul>\n<h3>Politique de rattrapage (catching-up)<\/h3>\n<ul>\n<li>Fondement : l'<b>industrie naissante<\/b>. Réussites : <b>Airbus<\/b> (consortium de 1970, subventions, commande publique), <b>Japon<\/b> (MITI, années 60–70).<\/li>\n<li>4 conditions : apprentissage possible (courbe d'expérience : coût −20 % à chaque doublement de la production pour une courbe à 80 %) ; défaillance de marché ; aide <b>temporaire<\/b> ; performance mesurable.<\/li>\n<li>Risques : rester éternellement « naissant », rattraper une technologie <b>obsolète<\/b> (ACC et les batteries face au LFP), <b>surcapacités<\/b> (puces, ASML 2024).<\/li>\n<li>Puces : <b>Chips Act<\/b>, 42 Md€, objectif 20 % de part de marché en 2030 (peu probable) ; méga-usine Intel de Magdeburg <b>annulée en 2025<\/b> ; 1 € d'investissement à Taïwan ≈ 1,45 € en UE. Mieux vaut être <b>indispensable<\/b> sur un maillon (<b>ASML<\/b> en lithographie) : la dépendance réciproque.<\/li>\n<li>Politiques de rupture : modèle <b>DARPA/BARDA<\/b> (mission claire, sélection progressive des équipes, pré-achats) ; <b>IPCEI<\/b> (projets européens amont avec clawback) ; gouvernance selon Tirole (experts indépendants, clause de fin, neutralité concurrentielle).<\/li>\n<\/ul>"}, {"id": "c5", "short": "Competition", "title": "5. Competition and concentration", "sub": "Session 6 · Philippon, Autor-Van Reenen, Aghion, Combe", "en": "<div class=\"f\">HHI = Σ s<sub>i<\/sub>²   (shares in %, from ~0 to 10,000)\nn equal firms: HHI = 10,000 / n\n&lt; 1,000 unconcentrated · 1,000–1,800 moderately · &gt; 1,800 highly concentrated<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Example<\/span>4 equal firms: HHI = 4 × 25² = <b>2,500<\/b> (= 10,000/4) → highly concentrated. Shares 50/30/20: 2,500 + 900 + 400 = <b>3,800<\/b>.<\/div>\n<h3>Good or bad concentration?<\/h3>\n<p>Strong rise in concentration in the <b>US<\/b> (not in Europe): <b>Autor and Van Reenen<\/b> (good concentration) vs <b>Philippon<\/b> (bad).<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">\"Good\" concentration<\/b><b>Superstar firms<\/b>: the winner takes almost all (economies of scale on intangibles, network effects). Or globalization squeezing margins (Walmart). Symptoms: leaders change often, falling prices, rising productivity and investment, high exit rate.<\/div>\n<div class=\"card\"><b class=\"t\">\"Bad\" concentration<\/b>Artificial barriers (lobbying, regulation), anticompetitive practices, <b>killer acquisitions<\/b>. Symptoms: stable market shares, prices rising with concentration, falling productivity and innovation. Philippon's conclusion for the US: <b>weakening competition<\/b>.<\/div>\n<\/div>\n<p><b>Monopsony<\/b> = a single buyer (or very few) facing many sellers → lower prices, in particular lower wages in local labour markets; no-poaching agreements (Krueger and Ashenfelter, 2018).<\/p>\n<h3>What competition brings<\/h3>\n<p>Lower prices (<b>Free Mobile<\/b> in 2012 → Sosh, RED, B&amp;You), market access (low-cost airlines), variety, quality, innovation, productivity (Petrobras after 1994), jobs, less regulatory capture.<\/p>\n<h3>Three levers<\/h3>\n<ol>\n<li><b>Reduce sector regulations<\/b>: occupational licensing (33% of US workers); OECD <b>PMR<\/b> indicator (France 1.57 vs average 1.38); pharmacies (France vs UK and Nordic countries). Obstacle: <b>Olson's paradox<\/b> (taxis vs ride-hailing). Method: gradual opening (notaries, Macron law), compensating the losers.<\/li>\n<li><b>Inform and ease switching<\/b>: search costs (comparison sites; <b>Israel 2015<\/b>, supermarket prices mandatorily online → less price dispersion); switching costs (number portability, bank switching 2015/2017); biases: status quo, myopia (printers and cartridges), <b>overconfidence<\/b> (gym membership: over $70/month for 4.3 visits when a pay-per-visit pass would cost $43).<\/li>\n<li><b>Open network industries<\/b>: separate the infrastructure (<b>natural monopoly<\/b>, regulated: <b>RPI − X<\/b> price cap, Ramsey-Boiteux, Averch-Johnson effect) from services (competition <b>in<\/b> the market or <b>for<\/b> the market through tenders). UK \"big bang\" in the 1980s vs gradual France (telephone 1998 … high-speed rail 2020: <b>Trenitalia<\/b> on Paris-Lyon since 2022).<\/li>\n<\/ol>\n<h3>Competition policy<\/h3>\n<ul>\n<li><b>Antitrust<\/b> (ex post, punitive): <b>cartels<\/b> (art. 101 TFEU) and <b>abuse of dominant position<\/b> (art. 102). US: Sherman Act 1890, Clayton Act 1914; EU: Treaty of Rome 1957.<\/li>\n<li><b>Exclusionary<\/b> abuse (most sanctioned: predatory pricing, margin squeeze, loyalty rebates, exclusivity, refusal to access an essential facility) vs <b>exploitative<\/b> abuse (excessive prices). Being dominant is not illegal (\"special responsibility\"); competition is protected, not competitors; effects-based approach; intent is not required.<\/li>\n<li><b>Merger control<\/b> (ex ante, preventive): mandatory, suspensive notification above thresholds; decisions: clearance, clearance with commitments (≈ 6%), prohibition (<b>31 out of over 8,600<\/b> in the EU).<\/li>\n<li>Criticisms in Europe (digital): too slow, fines not deterrent enough, acquisitions below thresholds → <b>DMA<\/b> (Digital Markets Act): <b>ex ante<\/b> regulation of <b>gatekeepers<\/b> (bans and obligations, up to structural remedies).<\/li>\n<\/ul>", "fr": "<div class=\"f\">HHI = Σ s<sub>i<\/sub>²   (parts en %, de ~0 à 10 000)\nn firmes égales : HHI = 10 000 / n\n&lt; 1 000 peu concentré · 1 000–1 800 moyennement · &gt; 1 800 très concentré<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple<\/span>4 firmes égales : HHI = 4 × 25² = <b>2 500<\/b> (= 10 000/4) → très concentré. Parts 50/30/20 : 2 500 + 900 + 400 = <b>3 800<\/b>.<\/div>\n<h3>Bonne ou mauvaise concentration ?<\/h3>\n<p>Forte hausse de la concentration aux <b>États-Unis<\/b> (pas en Europe) : <b>Autor et Van Reenen<\/b> (bonne concentration) vs <b>Philippon<\/b> (mauvaise).<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">« Bonne » concentration<\/b><b>Superstar firms<\/b> : le gagnant rafle presque tout (économies d'échelle sur l'immatériel, effets de réseau). Ou mondialisation qui écrase les marges (Walmart). Symptômes : leaders qui changent souvent, prix qui baissent, productivité et investissement en hausse, taux de sortie élevé.<\/div>\n<div class=\"card\"><b class=\"t\">« Mauvaise » concentration<\/b>Barrières artificielles (lobbying, régulation), pratiques anticoncurrentielles, <b>killer acquisitions<\/b>. Symptômes : parts de marché stables, prix qui montent avec la concentration, productivité et innovation en baisse. Conclusion de Philippon pour les États-Unis : <b>affaiblissement de la concurrence<\/b>.<\/div>\n<\/div>\n<p><b>Monopsone<\/b> = un seul acheteur (ou très peu) face à beaucoup de vendeurs → baisse du prix, notamment des salaires sur les marchés du travail locaux ; accords de non-débauchage (Krueger et Ashenfelter, 2018).<\/p>\n<h3>Ce que la concurrence apporte<\/h3>\n<p>Prix plus bas (<b>Free Mobile<\/b> en 2012 → Sosh, RED, B&You), accès au marché (low-cost aérien), diversité, qualité, innovation, productivité (Petrobras après 1994), emplois, moins de capture du régulateur.<\/p>\n<h3>Trois leviers<\/h3>\n<ol>\n<li><b>Réduire les réglementations sectorielles<\/b> : licences professionnelles (33 % des travailleurs américains) ; indicateur <b>PMR<\/b> de l'OCDE (France 1,57 vs moyenne 1,38) ; pharmacies (France vs Royaume-Uni et pays nordiques). Obstacle : <b>paradoxe d'Olson<\/b> (taxis vs VTC). Méthode : ouverture progressive (notaires, loi Macron), compensation des perdants.<\/li>\n<li><b>Informer et faciliter la mobilité<\/b> : coûts de recherche (comparateurs ; <b>Israël 2015<\/b>, prix des supermarchés obligatoirement en ligne → moins de dispersion des prix) ; coûts de changement (portabilité du numéro, mobilité bancaire 2015/2017) ; biais : statu quo, myopie (imprimantes et cartouches), <b>excès de confiance<\/b> (abonnement de salle de sport : plus de 70 $/mois pour 4,3 visites alors que le carnet revient à 43 $).<\/li>\n<li><b>Ouvrir les industries de réseau<\/b> : séparer l'infrastructure (<b>monopole naturel<\/b>, régulée : price cap <b>RPI − X<\/b>, Ramsey-Boiteux, effet Averch-Johnson) et les services (concurrence <b>sur<\/b> le marché ou <b>pour<\/b> le marché par appel d'offres). Royaume-Uni « big bang » des années 80 vs France progressive (téléphone 1998 … TGV 2020 : <b>Trenitalia<\/b> sur Paris-Lyon depuis 2022).<\/li>\n<\/ol>\n<h3>La politique de concurrence<\/h3>\n<ul>\n<li><b>Antitrust<\/b> (ex post, répressive) : <b>ententes<\/b> (art. 101 TFUE) et <b>abus de position dominante<\/b> (art. 102). États-Unis : Sherman Act 1890, Clayton Act 1914 ; UE : traité de Rome 1957.<\/li>\n<li>Abus d'<b>éviction<\/b> (le plus sanctionné : prix prédateurs, ciseau tarifaire, remises fidélisantes, exclusivités, refus d'accès à une infrastructure essentielle) vs abus d'<b>exploitation<\/b> (prix excessifs). Être dominant n'est pas illégal (« responsabilité particulière ») ; on protège la concurrence, pas les concurrents ; approche par les effets ; l'intention n'est pas requise.<\/li>\n<li><b>Contrôle des concentrations<\/b> (ex ante, préventif) : notification obligatoire et suspensive au-dessus de seuils ; décisions : autorisation, autorisation avec engagements (≈ 6 %), interdiction (<b>31 sur plus de 8 600<\/b> en UE).<\/li>\n<li>Critiques en Europe (numérique) : trop lent, amendes peu dissuasives, acquisitions sous les seuils → <b>DMA<\/b> (Digital Markets Act) : régulation <b>ex ante<\/b> des <b>gatekeepers<\/b> (interdictions et obligations, jusqu'à des mesures structurelles).<\/li>\n<\/ul>"}, {"id": "c6", "short": "Innovation", "title": "6. Innovation and creative destruction", "sub": "Session 7 · Schumpeter, Aghion-Howitt, Solow, David, Brynjolfsson", "en": "<ul>\n<li><b>Patent<\/b> = temporary exclusivity (<b>20 years<\/b> maximum) on a territory; 3 conditions: <b>novelty, inventive step (non-obviousness), industrial application<\/b>. <b>Triadic<\/b> patents (USPTO, EPO, JPO).<\/li>\n<li>France = an \"<b>intermediate<\/b>\" country; Europe in the <b>middle-technology trap<\/b> (Fuest et al., 2024): R&amp;D focused on incremental innovation (cars), weak presence in high tech, R&amp;D leaders that never change.<\/li>\n<li>Since the 19th century, the main driver of growth has been <b>total factor productivity (TFP)<\/b>, i.e. innovation. It comes in big waves.<\/li>\n<li><b>Creative destruction<\/b> (Schumpeter: \"add as many mail coaches as you please, you shall never get a railway thereby\"); formalized by <b>Aghion and Howitt (1992)<\/b>.<\/li>\n<li>Debate: <b>secular stagnation<\/b> (Gordon, Summers) vs a recovery thanks to AI, but with a lag (Brynjolfsson, Aghion).<\/li>\n<\/ul>\n<h3>Innovation is an ecosystem<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Ingredient<\/th><th>Key points<\/th><\/tr>\n<tr><td>R&amp;D<\/td><td>The EU spends less than the US, Japan or Korea; basic research is publicly funded because it is a <b>public good<\/b> (Arrow); academic freedom; in France, weak links between public research and companies.<\/td><\/tr>\n<tr><td>Inventors<\/td><td>\"<b>Lost Einsteins<\/b>\" (Bell, Chetty, Jaravel…): with equal maths scores, children from wealthy families patent far more → exposure to innovation matters.<\/td><\/tr>\n<tr><td>New firms<\/td><td>Leaders rarely innovate radically: <b>replacement effect<\/b> (Arrow, their innovation would cannibalize their profits) and path dependency → role of start-ups and firm turnover.<\/td><\/tr>\n<tr><td>Investors<\/td><td>Long horizon, high failure rate, intangible assets → <b>information asymmetry<\/b>: <b>adverse selection<\/b> (before the loan) and <b>moral hazard<\/b> (after) → bank debt does not fit → <b>venture capital<\/b> (VC) in successive rounds (pre-seed, seed, series A, B, C), with the \"<b>valley of death<\/b>\". In Europe: few large rounds (&gt; €30M), fragmented market, few IPOs (start-ups go to Nasdaq or get acquired).<\/td><\/tr>\n<tr><td>Clusters<\/td><td>Silicon Valley, Boston, Toulouse, Grenoble, Shenzhen. <b>Agglomeration economies<\/b> (Marshall): nearby suppliers, large labour market, knowledge spillovers.<\/td><\/tr>\n<\/table><\/div>\n<h3>Why diffusion takes time<\/h3>\n<ul>\n<li><b>Solow paradox<\/b> (1987): \"you can see the computer age everywhere but in the productivity statistics\". Diffusion follows an <b>S-curve<\/b> (Rogers).<\/li>\n<li><b>General purpose technology (GPT)<\/b>: steam, electricity, IT, AI. Features: <b>pervasive<\/b>, strong productivity impact, <b>gradual<\/b> adoption, improves over time.<\/li>\n<li>Brakes: need for complementary innovations sector by sector; <b>excess inertia<\/b> (installed base effect, coordination problem); the organization must change (<b>Paul David<\/b>, 1990: the dynamo and the computer); institutions (labour flexibility, training, competition); fear of unemployment.<\/li>\n<li>AI: +0.8 to 1.3 points of productivity per year from 2024 (historical comparison), rather <b>transitory<\/b> if you only count automation; <b>permanent<\/b> if AI also helps produce ideas.<\/li>\n<\/ul>\n<h3>Innovation and employment<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Displacement effect<\/b>Machines replace workers.<\/div>\n<div class=\"card\"><b class=\"t\">Productivity effect<\/b>Lower costs and prices, so more demand.<\/div>\n<div class=\"card\"><b class=\"t\">Reinstatement effect<\/b>New tasks and new jobs are created.<\/div>\n<\/div>\n<p>There has never been lasting technological unemployment (Luddites in the 19th century). The usual view: skill-biased change, <b>polarization<\/b> (routine tasks destroyed). What is new: <b>LLMs<\/b> also affect skilled, well-paid jobs (translators, accountants, journalists).<\/p>", "fr": "<ul>\n<li><b>Brevet<\/b> = exclusivité temporaire (<b>20 ans<\/b> maximum) sur un territoire ; 3 conditions : <b>nouveauté, inventivité (non-évidence), application industrielle<\/b>. Brevets <b>triadiques<\/b> (USPTO, OEB, JPO).<\/li>\n<li>France = pays « <b>intermédiaire<\/b> » ; Europe dans le <b>piège de la moyenne technologie<\/b> (Fuest et al., 2024) : R&D tournée vers l'incrémental (automobile), faible présence dans la high-tech, leaders de la R&D qui ne changent pas.<\/li>\n<li>Depuis le XIX<sup>e<\/sup> siècle, le premier facteur de croissance est la <b>productivité globale des facteurs (PGF)<\/b>, c'est-à-dire l'innovation. Elle arrive par grandes vagues.<\/li>\n<li><b>Destruction créatrice<\/b> (Schumpeter : « ajoutez autant de diligences que vous voulez, vous n'obtiendrez jamais un chemin de fer ») ; formalisée par <b>Aghion et Howitt (1992)<\/b>.<\/li>\n<li>Débat : <b>stagnation séculaire<\/b> (Gordon, Summers) vs reprise grâce à l'IA mais avec retard (Brynjolfsson, Aghion).<\/li>\n<\/ul>\n<h3>L'innovation est un écosystème<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Ingrédient<\/th><th>À retenir<\/th><\/tr>\n<tr><td>R&D<\/td><td>L'UE dépense moins que les États-Unis, le Japon ou la Corée ; recherche fondamentale financée par le public car c'est un <b>bien public<\/b> (Arrow) ; liberté académique ; en France, liens faibles entre recherche publique et entreprises.<\/td><\/tr>\n<tr><td>Inventeurs<\/td><td>« <b>Lost Einsteins<\/b> » (Bell, Chetty, Jaravel…) : à résultats égaux en maths, les enfants de familles aisées brevètent bien plus → l'exposition à l'innovation compte.<\/td><\/tr>\n<tr><td>Nouvelles firmes<\/td><td>Les leaders innovent peu en rupture : <b>effet de remplacement<\/b> (Arrow, leur innovation cannibaliserait leurs profits) et dépendance au sentier → rôle des start-ups et du renouvellement des firmes.<\/td><\/tr>\n<tr><td>Investisseurs<\/td><td>Horizon long, fort taux d'échec, actifs immatériels → <b>asymétrie d'information<\/b> : <b>sélection adverse<\/b> (avant le prêt) et <b>aléa moral<\/b> (après) → la dette bancaire ne convient pas → <b>capital-risque<\/b> (VC) par tours successifs (pre-seed, seed, séries A, B, C), avec la « <b>vallée de la mort<\/b> ». En Europe : peu de gros tours (&gt; 30 M€), marché fragmenté, peu d'IPO (les start-ups vont au Nasdaq ou se font racheter).<\/td><\/tr>\n<tr><td>Clusters<\/td><td>Silicon Valley, Boston, Toulouse, Grenoble, Shenzhen. <b>Économies d'agglomération<\/b> (Marshall) : fournisseurs proches, grand marché du travail, diffusion des connaissances.<\/td><\/tr>\n<\/table><\/div>\n<h3>Pourquoi la diffusion prend du temps<\/h3>\n<ul>\n<li><b>Paradoxe de Solow<\/b> (1987) : « on voit des ordinateurs partout sauf dans les statistiques de productivité ». Diffusion en <b>courbe en S<\/b> (Rogers).<\/li>\n<li><b>Technologie à usage général (GPT)<\/b> : vapeur, électricité, informatique, IA. Caractéristiques : <b>omniprésente<\/b>, fort impact sur la productivité, adoption <b>progressive<\/b>, s'améliore dans le temps.<\/li>\n<li>Freins : besoin d'innovations complémentaires secteur par secteur ; <b>excès d'inertie<\/b> (effet de base installée, problème de coordination) ; il faut transformer l'organisation (<b>Paul David<\/b>, 1990 : la dynamo et l'ordinateur) ; institutions (flexibilité du travail, formation, concurrence) ; peur du chômage.<\/li>\n<li>IA : +0,8 à 1,3 point de productivité par an à partir de 2024 (comparaison historique), plutôt <b>transitoire<\/b> si on ne considère que l'automatisation ; <b>permanent<\/b> si l'IA aide aussi à produire des idées.<\/li>\n<\/ul>\n<h3>Innovation et emploi<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Effet de déplacement<\/b>Les machines remplacent des travailleurs.<\/div>\n<div class=\"card\"><b class=\"t\">Effet de productivité<\/b>Baisse des coûts et des prix, donc plus de demande.<\/div>\n<div class=\"card\"><b class=\"t\">Effet de réintégration<\/b>Création de nouvelles tâches et de nouveaux métiers.<\/div>\n<\/div>\n<p>Il n'y a jamais eu de chômage technologique durable (luddites au XIX<sup>e<\/sup> siècle). Vision habituelle : biais en faveur des qualifiés, <b>polarisation<\/b> (tâches routinières détruites). Nouveauté : les <b>LLM<\/b> touchent aussi des métiers qualifiés et bien payés (traducteurs, comptables, journalistes).<\/p>"}, {"id": "method", "short": "Practice MCQ", "title": "Practice MCQ", "sub": "", "en": "<div class=\"q\"><div class=\"qt\">1. In the Kaya identity, replacing a coal plant with wind turbines reduces:<\/div><ol><li>GDP<\/li><li>energy intensity<\/li><li>carbon intensity<\/li><li>population<\/li><\/ol>\n<details><summary>Answer<\/summary>c. The same energy is produced with less CO₂.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. With an emissions trading market, emissions are cut first by:<\/div><ol><li>the most polluting firm<\/li><li>the firm with the lowest abatement cost<\/li><li>both equally<\/li><li>the state<\/li><\/ol>\n<details><summary>Answer<\/summary>b. That is what minimizes the total cost (example A at €5 and B at €15).<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. The flattening of the Phillips curve means that:<\/div><ol><li>unemployment no longer varies<\/li><li>a fall in unemployment causes little inflation<\/li><li>inflation is always monetary<\/li><li>the NAIRU has disappeared<\/li><\/ol>\n<details><summary>Answer<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. \"Tariff jumping\" means:<\/div><ol><li>a sudden rise in tariffs<\/li><li>getting around a tariff by producing in the protected country or via a third country<\/li><li>a partner's retaliation<\/li><li>the exporter absorbing the tariff<\/li><\/ol>\n<details><summary>Answer<\/summary>b. Mundell theorem (1957).<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. To take anti-dumping measures, you need:<\/div><ol><li>only an export price below the home price<\/li><li>dumping + injury + causal link<\/li><li>a public subsidy notified to the WTO<\/li><li>the exporter's consent<\/li><\/ol>\n<details><summary>Answer<\/summary>b. The 3 cumulative conditions.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">6. A market has 5 firms of equal size. Its HHI is:<\/div><ol><li>500<\/li><li>1,000<\/li><li>2,000<\/li><li>5,000<\/li><\/ol>\n<details><summary>Answer<\/summary>c. 10,000 / 5 = 2,000 (5 × 20²).<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">7. The DMA differs from classic competition law because it is:<\/div><ol><li>ex post<\/li><li>ex ante, targeted at gatekeepers<\/li><li>limited to mergers<\/li><li>national<\/li><\/ol>\n<details><summary>Answer<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">8. A leader rarely innovates radically because the innovation would replace its own profits. This is:<\/div><ol><li>Arrow's replacement effect<\/li><li>the Solow paradox<\/li><li>moral hazard<\/li><li>excess inertia<\/li><\/ol>\n<details><summary>Answer<\/summary>a.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">9. A bank raises its rates and good borrowers give up on credit. This is:<\/div><ol><li>moral hazard<\/li><li>adverse selection<\/li><li>a valley of death<\/li><li>an agglomeration effect<\/li><\/ol>\n<details><summary>Answer<\/summary>b. It happens before the loan; moral hazard happens after.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">10. According to Stolper-Samuelson, a rich country opening to trade with a labour-abundant country:<\/div><ol><li>raises all wages<\/li><li>lowers the pay of low-skilled labour in the rich country<\/li><li>has no effect on distribution<\/li><li>lowers the pay of skilled labour in the rich country<\/li><\/ol>\n<details><summary>Answer<\/summary>b. The scarce factor (low-skilled labour) loses.<\/details><\/div>", "fr": "<div class=\"q\"><div class=\"qt\">1. Dans l'équation de Kaya, remplacer une centrale à charbon par des éoliennes réduit :<\/div><ol><li>le PIB<\/li><li>l'intensité énergétique<\/li><li>l'intensité carbone<\/li><li>la population<\/li><\/ol>\n<details><summary>Réponse<\/summary>c. On produit la même énergie avec moins de CO₂.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. Avec un marché de quotas, la réduction des émissions est faite en priorité par :<\/div><ol><li>la firme la plus polluante<\/li><li>la firme qui réduit au plus bas coût<\/li><li>les deux à parts égales<\/li><li>l'État<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. C'est ce qui minimise le coût total (exemple A à 5 € et B à 15 €).<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. L'aplatissement de la courbe de Phillips signifie que :<\/div><ol><li>le chômage ne varie plus<\/li><li
