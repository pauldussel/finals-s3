\/tr>\n<tr><td>Maturité<\/td><td>Demande de remplacement, innovation <b>de procédé<\/b>, concurrence par les prix.<\/td><\/tr>\n<tr><td>Déclin<\/td><td>Substituts technologiquement supérieurs ; baisse des ventes et du ROA. On reste parfois à cause des barrières à la sortie.<\/td><\/tr>\n<\/table><\/div>\n<p>Limites des 5 forces : modèle statique (structure → comportement → performance) ; ignore les alliances, la coopétition et la « destruction créatrice » (Schumpeter, hypercompétition) où la stratégie <b>change<\/b> la structure.<\/p>"}, {"id": "c4", "short": "Car industry case", "title": "4. Car industry case: Tesla, Renault, BYD", "sub": "Session 4 · Automotive Industry case + Plenary Discussion", "en": "<div class=\"tw\"><table>\n<tr><th>Force (today)<\/th><th>Level<\/th><th>Why<\/th><\/tr>\n<tr><td>Rivalry<\/td><td><span class=\"pill hi\">High<\/span><\/td><td>Many players incl. Chinese (BYD, NIO), price war (BYD and Tesla 15–25% cheaper than Renault), high fixed costs, <b>massive overcapacity<\/b>, exit barriers, shrinking differentiation.<\/td><\/tr>\n<tr><td>Suppliers<\/td><td><span class=\"pill hi\">Medium-high<\/span><\/td><td>Batteries and chips concentrated (CATL, Panasonic); they control the technology; BYD shows a supplier can become a rival.<\/td><\/tr>\n<tr><td>New entrants<\/td><td><span class=\"pill md\">Medium<\/span><\/td><td>High capital and complexity (batteries, software), but credible tech entrants (Apple, Xiaomi).<\/td><\/tr>\n<tr><td>Buyers<\/td><td><span class=\"pill md\">Medium<\/span><\/td><td>Price-sensitive EV buyers, information online, low switching costs; loyalty in premium.<\/td><\/tr>\n<tr><td>Substitutes<\/td><td><span class=\"pill lo\">Low-medium<\/span><\/td><td>Micromobility, ride-hailing, public transport in cities; rather complementary.<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li>Life cycle: <b>internal combustion (ICE) mature, heading to decline<\/b>; <b>EVs in growth<\/b>, close to a \"dominant design\" (Tesla's software stack or BYD's cost architecture?).<\/li>\n<li>Drivers of change: batteries (BYD Blade), software-defined vehicle (OTA updates), chips, <b>vertical integration<\/b> (gigafactories), autonomous driving, trade policy (carbon border tax, BYD plant in Hungary).<\/li>\n<li>In 10 years: consolidation (fewer players), higher entry barriers, more power for batteries/chips/software (unless integrated like BYD), more buyer power, erosion of car ownership in cities.<\/li>\n<li>Tesla opened its patents (2014) to speed up EV adoption (bigger market, charging standard). Renault: \"Renaulution\", shifting from volume to value.<\/li>\n<\/ul>\n<h4>Forces by innovation phase<\/h4>\n<p>Fluid phase: weak rivalry, easy entry, strong substitutes. Dominant design: shakeout. Incremental phase: strong rivalry (commoditized product), hard entry. Technological discontinuity: new entrants can use the new technology to overtake the leaders.<\/p>", "fr": "<div class=\"tw\"><table>\n<tr><th>Force (aujourd'hui)<\/th><th>Niveau<\/th><th>Pourquoi<\/th><\/tr>\n<tr><td>Rivalité<\/td><td><span class=\"pill hi\">Élevée<\/span><\/td><td>Nombreux acteurs dont chinois (BYD, NIO), guerre des prix (BYD et Tesla 15–25 % moins chers que Renault), coûts fixes élevés, <b>surcapacité massive<\/b>, barrières à la sortie, différenciation en baisse.<\/td><\/tr>\n<tr><td>Fournisseurs<\/td><td><span class=\"pill hi\">Moyen-élevé<\/span><\/td><td>Batteries et puces concentrées (CATL, Panasonic) ; ils contrôlent la technologie ; BYD montre qu'un fournisseur peut devenir rival.<\/td><\/tr>\n<tr><td>Nouveaux entrants<\/td><td><span class=\"pill md\">Moyenne<\/span><\/td><td>Capital et complexité (batteries, logiciel) élevés, mais entrants tech (Apple, Xiaomi) crédibles.<\/td><\/tr>\n<tr><td>Clients<\/td><td><span class=\"pill md\">Moyen<\/span><\/td><td>Acheteurs de VE sensibles au prix, info en ligne, coûts de changement faibles ; fidélité dans le premium.<\/td><\/tr>\n<tr><td>Substituts<\/td><td><span class=\"pill lo\">Faible-moyen<\/span><\/td><td>Micromobilité, VTC, transports publics en ville ; plutôt complémentaires.<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li>Cycle de vie : <b>thermique (ICE) en maturité vers le déclin<\/b> ; <b>VE en croissance<\/b>, proche de son « design dominant » (pile logicielle Tesla ou architecture de coûts BYD ?).<\/li>\n<li>Moteurs de changement : batteries (Blade de BYD), véhicule défini par logiciel (mises à jour OTA), puces, <b>intégration verticale<\/b> (gigafactories), conduite autonome, politique commerciale (taxe carbone aux frontières, usine BYD en Hongrie).<\/li>\n<li>À 10 ans : consolidation (moins d'acteurs), barrières à l'entrée plus hautes, plus de pouvoir pour batteries/puces/logiciel (sauf intégration à la BYD), plus de pouvoir client, érosion de la possession en ville.<\/li>\n<li>Tesla a ouvert ses brevets (2014) pour accélérer l'adoption des VE (marché plus grand, standard de recharge). Renault : « Renaulution », passer du volume à la valeur.<\/li>\n<\/ul>\n<h4>Forces selon la phase d'innovation<\/h4>\n<p>Phase fluide : rivalité faible, entrée facile, substituts forts. Design dominant : shakeout. Phase incrémentale : rivalité forte (produit banalisé), entrée difficile. Discontinuité technologique : les nouveaux entrants peuvent utiliser la nouvelle technologie pour dépasser les leaders.<\/p>"}, {"id": "c5", "short": "Internal analysis (VRIO)", "title": "5. Internal analysis: resources and capabilities", "sub": "Session 5 · Grant ch. 5 and 7 (mostly 7)", "en": "<p><b>Resource-based view (RBV)<\/b>: when the environment is unstable, internal resources are a more stable basis for strategy. Resources and capabilities are the <b>primary source of profitability<\/b>.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Tangible<\/b>Financial (cash, borrowing capacity); physical (plants, land, materials).<\/div>\n<div class=\"card\"><b class=\"t\">Intangible<\/b>Technology (patents, know-how); reputation (brands, relationships); culture.<\/div>\n<div class=\"card\"><b class=\"t\">Human<\/b>Skills, collaboration, motivation.<\/div>\n<\/div>\n<p><b>Capabilities<\/b> = what the firm can do by combining its resources. Two ways to classify them: by <b>function<\/b> (Toyota: continuous improvement; Apple: design) or along <b>Porter's value chain<\/b> (primary activities: inbound logistics, operations, outbound logistics, marketing and sales, service; support activities: infrastructure, HR, technology, procurement).<\/p>\n<p>Approximate value of intangibles = <b>market capitalization − book value<\/b>.<\/p>\n<h3>VRIN / VRIO<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Criterion<\/th><th>Question<\/th><th>If not…<\/th><\/tr>\n<tr><td><b>V<\/b>aluable<\/td><td>Does it create value for the customer?<\/td><td>Disadvantage<\/td><\/tr>\n<tr><td><b>R<\/b>are<\/td><td>Do few competitors have it?<\/td><td>Competitive parity<\/td><\/tr>\n<tr><td><b>I<\/b>nimitable<\/td><td>Hard / costly to copy (history, path dependency, causal ambiguity)?<\/td><td>Temporary advantage<\/td><\/tr>\n<tr><td><b>N<\/b>on-substitutable / <b>O<\/b>rganization<\/td><td>No substitute / is the organization set up to exploit it?<\/td><td>Unexploited advantage<\/td><\/tr>\n<\/table><\/div>\n<p>Other criteria (Grant): relevance, scarcity, <b>durability<\/b>, transferability, replicability, <b>appropriability<\/b> (who captures the rent: the firm or the star employee?). <b>Time compression diseconomies<\/b>: $10M of R&amp;D in one year is not worth $5M + $5M over two years; time cannot be bought.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Amazon through VRIO<\/span>\nCustomer-centric culture and logistics platform: V, R, I, O → <b>sustained advantage<\/b>. AWS: economies of scale, sunk costs → sustained. Cash and financial power: useful but not rare (other giants) → <b>temporary<\/b>. Patents (1-Click, 1998): they expire → temporary to sustained.<\/div>\n<h3>Relative strength matrix<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">High importance + high strength<\/b>Key strengths → exploit and protect (target segments where they matter, replicate elsewhere, diversify: Fujifilm into cosmetics).<\/div>\n<div class=\"card\"><b class=\"t\">High importance + low strength<\/b>Key weaknesses → invest, <b>outsource<\/b> (Apple → Foxconn), ally, or target segments where they matter less (Harley-Davidson).<\/div>\n<div class=\"card\"><b class=\"t\">Low importance + high strength<\/b>Superfluous strengths → find an innovative use.<\/div>\n<div class=\"card\"><b class=\"t\">Low importance + low strength<\/b>Zone of irrelevance.<\/div>\n<\/div>\n<h3>Strategic fit<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Cost leadership<\/th><th>Differentiation<\/th><\/tr>\n<tr><td>Resources<\/td><td>Sustained investment, process engineering, products easy to manufacture, low-cost distribution<\/td><td>Strong marketing, product engineering, research, quality reputation, channel cooperation<\/td><\/tr>\n<tr><td>Organization<\/td><td>Tight cost control, frequent reports, clear structure, quantitative incentives<\/td><td>R&amp;D–marketing coordination, qualitative incentives, attracting creative people<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box exam\"><span class=\"lbl\">Typical exam point<\/span>Explain \"stuck in the middle\" by a <b>lack of fit<\/b>: the firm pays the costs of both routes without succeeding at either (Tyson: plants at 82% capacity and 2,000 products on the cost side; SG&amp;A at 7% for a price premium of only 3–5% on the brand side; managers paid on tonnage).<\/div>", "fr": "<p><b>Resource-based view (RBV)<\/b> : quand l'environnement est instable, les ressources internes sont une base plus stable pour la stratégie. Les ressources et compétences sont la <b>première source de rentabilité<\/b>.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Tangibles<\/b>Financières (cash, capacité d'emprunt) ; physiques (usines, terrains, matières).<\/div>\n<div class=\"card\"><b class=\"t\">Intangibles<\/b>Technologie (brevets, savoir-faire) ; réputation (marques, relations) ; culture.<\/div>\n<div class=\"card\"><b class=\"t\">Humaines<\/b>Compétences, collaboration, motivation.<\/div>\n<\/div>\n<p><b>Compétences<\/b> (capabilities) = ce que la firme sait faire en combinant ses ressources. Deux façons de les classer : par <b>fonction<\/b> (Toyota : amélioration continue ; Apple : design) ou par la <b>chaîne de valeur de Porter<\/b> (activités principales : logistique entrante, opérations, logistique sortante, marketing-ventes, service ; activités de soutien : infrastructure, RH, technologie, achats).<\/p>\n<p>Valeur approximative des intangibles = <b>capitalisation boursière − valeur comptable<\/b>.<\/p>\n<h3>VRIN / VRIO<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Critère<\/th><th>Question<\/th><th>Si non…<\/th><\/tr>\n<tr><td><b>V<\/b>aluable<\/td><td>Crée-t-elle de la valeur pour le client ?<\/td><td>Désavantage<\/td><\/tr>\n<tr><td><b>R<\/b>are<\/td><td>Peu de concurrents l'ont ?<\/td><td>Parité concurrentielle<\/td><\/tr>\n<tr><td><b>I<\/b>nimitable<\/td><td>Difficile/coûteuse à copier (histoire, path dependency, ambiguïté causale) ?<\/td><td>Avantage temporaire<\/td><\/tr>\n<tr><td><b>N<\/b>on-substituable / <b>O<\/b>rganization<\/td><td>Pas de substitut / l'organisation est-elle structurée pour l'exploiter ?<\/td><td>Avantage non exploité<\/td><\/tr>\n<\/table><\/div>\n<p>Autres critères (Grant) : pertinence, rareté, <b>durabilité<\/b>, transférabilité, réplicabilité, <b>appropriabilité<\/b> (qui capte la rente : la firme ou l'employé star ?). <b>Time compression diseconomies<\/b> : 10 M de R&D sur un an ne valent pas 5 M + 5 M sur deux ans, le temps ne se rachète pas.<\/p>\n<div class=\"box ex\"><span class=\"lbl\">Amazon passé au VRIO<\/span>\nCulture centrée client et plateforme logistique : V, R, I, O → <b>avantage durable<\/b>. AWS : économies d'échelle, coûts irrécupérables → durable. Cash et puissance financière : utile mais pas rare (autres géants) → <b>temporaire<\/b>. Brevets (1-Click, 1998) : expirent → temporaire à durable.<\/div>\n<h3>Matrice de force relative<\/h3>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Importance haute + force haute<\/b>Forces clés → exploiter, protéger (cibler les segments où elles comptent, répliquer ailleurs, diversifier : Fujifilm vers les cosmétiques).<\/div>\n<div class=\"card\"><b class=\"t\">Importance haute + force faible<\/b>Faiblesses clés → investir, <b>externaliser<\/b> (Apple → Foxconn), s'allier, ou viser des segments où elles comptent peu (Harley-Davidson).<\/div>\n<div class=\"card\"><b class=\"t\">Importance faible + force haute<\/b>Forces superflues → trouver un usage innovant.<\/div>\n<div class=\"card\"><b class=\"t\">Importance faible + force faible<\/b>Zone d'indifférence.<\/div>\n<\/div>\n<h3>Adéquation stratégique (strategic fit)<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Domination par les coûts<\/th><th>Différenciation<\/th><\/tr>\n<tr><td>Ressources<\/td><td>Investissement soutenu, ingénierie des procédés, produits faciles à fabriquer, distribution bon marché<\/td><td>Marketing fort, ingénierie produit, recherche, réputation de qualité, coopération des canaux<\/td><\/tr>\n<tr><td>Organisation<\/td><td>Contrôle strict des coûts, reportings fréquents, structure claire, incitations quantitatives<\/td><td>Coordination R&D–marketing, incitations qualitatives, attirer des créatifs<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box exam\"><span class=\"lbl\">Typique de l'examen<\/span>Expliquer un « stuck in the middle » par un <b>manque d'adéquation<\/b> : l'entreprise paie les coûts des deux routes sans réussir aucune (Tyson : usines à 82 % de capacité et 2 000 produits côté coûts ; SG&A 7 % pour une prime de prix de 3–5 % seulement côté marque ; managers payés au tonnage).<\/div>"}, {"id": "c6", "short": "Beyond Meat case", "title": "6. Beyond Meat case: why the advantage erodes", "sub": "Session 6 · Beyond Meat case", "en": "<ul>\n<li>Starting point: heavy R&amp;D (10–14% of sales vs &lt; 1% for meat companies), woven-protein technology, well-known brand (total awareness 23% at IPO → 59% in 2020), network of co-manufacturers, partnerships (McDonald's, KFC). IPO 2019: +163% on day one.<\/li>\n<li>2020: ROS −13%, AT 0.87, ROA −11% (JBS: ROA 22%).<\/li>\n<li>Decline since 2022: plant-based market down 22 months in a row, \"ultra-processed\" image, McPlant failure, <b>imitation<\/b> by Tyson, JBS, Cargill and by cheaper private labels (Walmart, Kroger).<\/li>\n<li>Eroding resources: cash from $733M (2021) → $116M, $1B convertible debt due 2027; R&amp;D 13.6% → 8%; headcount 1,100 → ~750; damaged culture; MorningStar Farms overtakes it in awareness. Impossible Foods is growing (+60%): so it is not only an external problem.<\/li>\n<\/ul>\n<div class=\"box key\"><span class=\"lbl\">Diagnosis<\/span><b>Poor fit<\/b>: a costly innovation model (differentiation) in a market that behaves like a commodity (direct comparison with the price of meat, a 2–3× premium that cannot hold). The resources (technology, brand) were neither rare nor inimitable enough. Beyond IV: a better product but more expensive, just when the market wants cheaper.<\/div>\n<p>Possible route: differentiation on a narrow segment (health/environment-minded consumers), but hard because rival products are very similar and the addressable market is small.<\/p>", "fr": "<ul>\n<li>Point de départ : forte R&D (10–14 % du CA vs &lt; 1 % pour les viandes), technologie de protéines tissées, marque connue (notoriété totale 23 % à l'IPO → 59 % en 2020), réseau de co-fabricants, partenariats (McDonald's, KFC). IPO 2019 : +163 % le premier jour.<\/li>\n<li>2020 : ROS −13 %, AT 0,87, ROA −11 % (JBS : ROA 22 %).<\/li>\n<li>Chute depuis 2022 : marché du plant-based en baisse 22 mois d'affilée, image « ultra-transformé », échec du McPlant, <b>imitation<\/b> par Tyson, JBS, Cargill et par les marques de distributeur moins chères (Walmart, Kroger).<\/li>\n<li>Ressources qui s'érodent : cash de 733 M$ (2021) → 116 M$, dette convertible de 1 Md$ échéance 2027 ; R&D 13,6 % → 8 % ; effectifs 1 100 → ~750 ; culture dégradée ; MorningStar Farms la dépasse en notoriété. Impossible Foods, elle, croît (+60 %) : ce n'est donc pas qu'un problème externe.<\/li>\n<\/ul>\n<div class=\"box key\"><span class=\"lbl\">Diagnostic<\/span><b>Mauvaise adéquation<\/b> : un modèle d'innovation coûteux (différenciation) sur un marché qui se comporte comme une commodité (comparaison directe avec le prix de la viande, prime de 2–3× intenable). Les ressources (technologie, marque) n'étaient ni assez rares ni assez inimitables. Beyond IV : meilleur produit mais plus cher, au moment où le marché demande moins cher.<\/div>\n<p>Piste : différenciation sur un segment étroit (consommateurs santé/environnement), mais difficile car les produits rivaux sont très proches, et le marché adressable est petit.<\/p>"}, {"id": "c7", "short": "Corporate strategy", "title": "7a. Corporate strategy and diversification", "sub": "Session 7 · Strategor ch. 7, 8, 10, 11", "en": "<p>A diversification creates value if the businesses are worth more together than apart: <b>1 + 1 &gt; 2<\/b>.<\/p>\n<h3>Porter's tests (+ governance)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Test<\/th><th>Question<\/th><\/tr>\n<tr><td>1. <b>Attractiveness<\/b><\/td><td>Is the target industry structurally attractive (5 forces), or can it become so? Growth alone is not enough.<\/td><\/tr>\n<tr><td>2. <b>Cost of entry<\/b><\/td><td>The entry price (acquisition premium) must not absorb all future profits.<\/td><\/tr>\n<tr><td>3. <b>Better-off<\/b><\/td><td>Does the new business gain an advantage from the group, or the reverse (synergy)?<\/td><\/tr>\n<tr><td>4. <b>Governance<\/b><\/td><td>Do you need to own the business to get the synergies, or is an alliance / JV enough? How do you manage and share the value?<\/td><\/tr>\n<\/table><\/div>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Good reasons<\/b>Sharing resources/activities (economies of scope); transferring capabilities; restructuring assets; reducing transaction costs.<\/div>\n<div class=\"card\"><b class=\"t\">Bad reasons<\/b>An attractive industry on its own; \"reducing risk\" (shareholders can diversify themselves, more cheaply); internal capital market; growth for its own sake (managers' goals). Conglomerate discount ≈ <b>20%<\/b>.<\/div>\n<\/div>\n<h3>Types of diversification<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Type<\/th><th>Definition<\/th><th>Logic<\/th><\/tr>\n<tr><td>Single business<\/td><td>&gt; 95% of sales in one business<\/td><td>Economies of scale<\/td><\/tr>\n<tr><td>Dominant business<\/td><td>70–95%<\/td><td>Economies of scale<\/td><\/tr>\n<tr><td>Related constrained / related linked<\/td><td>Businesses linked on all / some dimensions<\/td><td><b>Economies of scope<\/b><\/td><\/tr>\n<tr><td>Unrelated (conglomerate)<\/td><td>No link<\/td><td>Risk hedging, internal market<\/td><\/tr>\n<\/table><\/div>\n<div class=\"f\">Economies of scale: \"more of the same thing\"\nEconomies of scope: C(P1, P2) &lt; C(P1, 0) + C(0, P2)   \"more different but related things\"<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Distinction tested in the MCQ<\/span>\n<b>Sharing an activity<\/b> = two businesses use the same step of the value chain (same sales force, same logistics; P&amp;G diapers and paper towels). <b>Transferring a capability<\/b> = know-how moves from one business to another without sharing the activity (Virgin's marketing). <b>Vertical integration<\/b> = one business supplies the inputs of another downstream. Disney does the first two (characters reused in films, parks, merchandise).<\/div>\n<ul>\n<li>Growth (Ansoff): market development, product development, <b>horizontal integration<\/b> (buying a competitor, same step), <b>vertical integration<\/b> (becoming your own supplier or distributor).<\/li>\n<li>Examples: <b>Kodak<\/b> (invented the digital camera in 1975 but protected film; used Ofoto to get people to print; bought Sterling Drug and resold it at half price) vs <b>Fujifilm<\/b> (coating and collagen capabilities redeployed into healthcare and cosmetics); <b>Zodiac<\/b> (inflatable technology → boats, aerospace, airbags).<\/li>\n<li>International: Ghemawat's <b>AAA<\/b> triangle (Adaptation, Aggregation, Arbitrage, usually 2 out of 3).<\/li>\n<\/ul>\n<h3>BCG matrix<\/h3>\n<div class=\"f\">Relative market share = business's share / share of the largest competitor\n                         (if you are the leader: / share of no. 2) → threshold = 1\nVertical axis: market growth (threshold = average growth of the portfolio)<\/div>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Star<\/b>High share, high growth → invest.<\/div>\n<div class=\"card\"><b class=\"t\">Question mark<\/b>Low share, high growth → analyze: invest or exit.<\/div>\n<div class=\"card\"><b class=\"t\">Cash cow<\/b>High share, low growth → \"milk\" it, fund the others.<\/div>\n<div class=\"card\"><b class=\"t\">Dog<\/b>Low share, low growth → divest or restructure.<\/div>\n<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Example (Tyson, practice exam 2)<\/span>\nChicken: share 14.5 vs 12.0 for no. 2 → 1.21; growth 3.3% below the 3.7% average → <b>cash cow<\/b>. Prepared foods: 9.1/12 = 0.76; 6.5% → <b>question mark<\/b>. Beef (0.87) and pork (0.41) with low growth → <b>dogs<\/b>.<br>\nLimits to mention: relative share is a poor indicator when the advantage comes from the brand (prepared foods earn the largest profit); a snapshot in time (cattle cycle); ignores links between businesses; depends on how the market is defined.<\/div>\n<p>Other tools: <b>GE/McKinsey<\/b> (industry attractiveness × business unit competitive strength); Jack Welch: \"number 1 or 2 (top 3), otherwise fix, sell or close\". Divestitures refocus on the core and often improve margins.<\/p>", "fr": "<p>Une diversification crée de la valeur si les activités valent plus ensemble que séparément : <b>1 + 1 &gt; 2<\/b>.<\/p>\n<h3>Les tests de Porter (+ gouvernance)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Test<\/th><th>Question<\/th><\/tr>\n<tr><td>1. <b>Attractivité<\/b><\/td><td>L'industrie visée est-elle structurellement attractive (5 forces), ou peut-elle le devenir ? La croissance seule ne suffit pas.<\/td><\/tr>\n<tr><td>2. <b>Coût d'entrée<\/b><\/td><td>Le prix d'entrée (prime d'acquisition) ne doit pas absorber tous les profits futurs.<\/td><\/tr>\n<tr><td>3. <b>Better-off<\/b><\/td><td>La nouvelle activité gagne-t-elle un avantage grâce au groupe, ou l'inverse (synergie) ?<\/td><\/tr>\n<tr><td>4. <b>Gouvernance<\/b><\/td><td>Faut-il posséder l'activité pour obtenir les synergies, ou une alliance/JV suffit ? Comment gérer et partager la valeur ?<\/td><\/tr>\n<\/table><\/div>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Bonnes raisons<\/b>Partager des ressources/activités (économies d'envergure) ; transférer des compétences ; restructurer des actifs ; réduire les coûts de transaction.<\/div>\n<div class=\"card\"><b class=\"t\">Mauvaises raisons<\/b>Industrie attractive seule ; « réduire le risque » (l'actionnaire peut diversifier lui-même, moins cher) ; marché interne des capitaux ; la croissance pour elle-même (objectifs des dirigeants). Décote de conglomérat ≈ <b>20 %<\/b>.<\/div>\n<\/div>\n<h3>Types de diversification<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Type<\/th><th>Définition<\/th><th>Logique<\/th><\/tr>\n<tr><td>Mono-activité<\/td><td>&gt; 95 % des ventes dans une activité<\/td><td>Économies d'échelle<\/td><\/tr>\n<tr><td>Activité dominante<\/td><td>70–95 %<\/td><td>Économies d'échelle<\/td><\/tr>\n<tr><td>Liée contrainte / liée en chaîne<\/td><td>Activités liées sur toutes / certaines dimensions<\/td><td><b>Économies d'envergure<\/b> (scope)<\/td><\/tr>\n<tr><td>Non liée (conglomérat)<\/td><td>Aucun lien<\/td><td>Couverture du risque, marché interne<\/td><\/tr>\n<\/table><\/div>\n<div class=\"f\">Économies d'échelle : « plus de la même chose »\nÉconomies d'envergure : C(P1, P2) &lt; C(P1, 0) + C(0, P2)   « plus de choses différentes mais liées »<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Distinction testée au QCM<\/span>\n<b>Partager une activité<\/b> = deux activités utilisent la même étape de la chaîne de valeur (même force de vente, même logistique ; P&G couches et essuie-tout). <b>Transférer une compétence<\/b> = un savoir-faire passe d'une activité à l'autre sans partager l'activité (marketing de Virgin). <b>Intégration verticale<\/b> = une activité fournit les inputs d'une autre en aval. Disney fait les deux premières (personnages déclinés en films, parcs, produits).<\/div>\n<ul>\n<li>Croissance (Ansoff) : développement de marché, de produit, <b>intégration horizontale<\/b> (racheter un concurrent, même étape), <b>verticale<\/b> (devenir son fournisseur ou distributeur).<\/li>\n<li>Exemples : <b>Kodak<\/b> (a inventé l'appareil numérique en 1975 mais protégé le film ; Ofoto utilisé pour faire imprimer ; achat de Sterling Drug revendu moitié prix) vs <b>Fujifilm<\/b> (compétences en revêtements et collagène redéployées vers la santé et les cosmétiques) ; <b>Zodiac<\/b> (technologie gonflable → bateaux, aéronautique, airbags).<\/li>\n<li>International : triangle <b>AAA<\/b> de Ghemawat (Adaptation, Agrégation, Arbitrage, en général 2 sur 3).<\/li>\n<\/ul>\n<h3>Matrice BCG<\/h3>\n<div class=\"f\">Part de marché relative = part de l'activité / part du plus grand concurrent\n                        (si on est leader : / part du n°2) → seuil = 1\nAxe vertical : croissance du marché (seuil = croissance moyenne du portefeuille)<\/div>\n<div class=\"grid2\">\n<div class=\"card\"><b class=\"t\">Star<\/b>Part forte, croissance forte → investir.<\/div>\n<div class=\"card\"><b class=\"t\">Question mark<\/b>Part faible, croissance forte → analyser : investir ou sortir.<\/div>\n<div class=\"card\"><b class=\"t\">Cash cow<\/b>Part forte, croissance faible → « traire », financer les autres.<\/div>\n<div class=\"card\"><b class=\"t\">Dog<\/b>Part faible, croissance faible → céder ou restructurer.<\/div>\n<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple (Tyson, practice exam 2)<\/span>\nPoulet : part 14,5 vs 12,0 pour le n°2 → 1,21 ; croissance 3,3 % sous la moyenne 3,7 % → <b>cash cow<\/b>. Plats préparés : 9,1/12 = 0,76 ; 6,5 % → <b>question mark<\/b>. Bœuf (0,87) et porc (0,41) à faible croissance → <b>dogs<\/b>.<br>\nLimites à citer : la part relative est un mauvais indicateur quand l'avantage vient de la marque (les plats préparés font le plus gros résultat) ; photo à un instant (cycle du bétail) ; ignore les liens entre activités ; dépend de la définition du marché.<\/div>\n<p>Autres outils : <b>GE/McKinsey<\/b> (attractivité de l'industrie × avantage concurrentiel de l'unité) ; Jack Welch : « top 3, sinon améliorer, vendre ou fermer ». Les cessions recentrent sur le cœur et améliorent souvent la marge.<\/p>"}, {"id": "c7b", "short": "Business strategy", "title": "7b. Business strategy: generic strategies", "sub": "Session 7 · Grant ch. 7", "en": "<div class=\"tw\"><table>\n<tr><th>Strategy<\/th><th>Principle<\/th><th>Levers / conditions<\/th><\/tr>\n<tr><td><b>Cost leadership<\/b><\/td><td>Be the cheapest producer, with equal quality (parity) or close quality (proximity)<\/td><td>Cheaper inputs, economies of scale, product/process design, experience curve. Useful if the product cannot be enriched and customers are price-sensitive.<\/td><\/tr>\n<tr><td><b>Differentiation<\/b><\/td><td>Be unique on a valued dimension (B↑) to earn a price premium (P↑)<\/td><td>Tangible (performance, design, services) or intangible (image, status). Useful if scale is already exploited and customers pay for more.<\/td><\/tr>\n<tr><td><b>Focus<\/b><\/td><td>Target a narrow segment, through cost or differentiation<\/td><td>Distinct needs, distinct value chain, viable segment (Iceland Foods; ARM).<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Stuck in the middle<\/b>: a risk to manage, not a fate. You can combine (<b>hybrid<\/b> strategy) through separate units, an innovation that lowers costs and raises quality, or when rivals are also in the middle. E.g. Southwest (low cost + punctuality and friendliness), Amazon (cost in retail, differentiation with AWS).<\/li>\n<li>Dangerous drifts: a low-cost player adding \"extras\" customers do not value; a differentiator cutting what makes it different.<\/li>\n<li>The ultimate advantage in times of change: <b>anticipation<\/b> and <b>agility<\/b>.<\/li>\n<\/ul>", "fr": "<div class=\"tw\"><table>\n<tr><th>Stratégie<\/th><th>Principe<\/th><th>Leviers / conditions<\/th><\/tr>\n<tr><td><b>Domination par les coûts<\/b><\/td><td>Être le moins cher à produire, à qualité égale (parité) ou proche (proximité)<\/td><td>Intrants moins chers, économies d'échelle, conception produit/procédé, courbe d'expérience. Utile si le produit ne peut pas être enrichi et si les clients sont sensibles au prix.<\/td><\/tr>\n<tr><td><b>Différenciation<\/b><\/td><td>Être unique sur une dimension valorisée (B↑) pour obtenir une prime de prix (P↑)<\/td><td>Tangible (performance, design, services) ou intangible (image, statut). Utile si l'échelle est déjà exploitée et si les clients paient pour plus.<\/td><\/tr>\n<tr><td><b>Focalisation<\/b><\/td><td>Cibler un segment étroit, par les coûts ou par la différenciation<\/td><td>Besoins distincts, chaîne de valeur distincte, segment viable (Iceland Foods ; ARM).<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Stuck in the middle<\/b> : risque à gérer, pas une fatalité. On peut combiner (stratégie <b>hybride<\/b>) via des unités séparées, une innovation qui baisse les coûts et augmente la qualité, ou si les rivaux sont aussi au milieu. Ex. Southwest (bas coût + ponctualité et sympathie), Amazon (coûts en retail, différenciation avec AWS).<\/li>\n<li>Glissements dangereux : un low-cost qui ajoute des « extras » non valorisés ; un différencié qui coupe dans ce qui fait sa différence.<\/li>\n<li>Avantage ultime face au changement : <b>anticipation<\/b> et <b>agilité<\/b>.<\/li>\n<\/ul>"}, {"id": "c8", "short": "Amazon case", "title": "8. Amazon case: corporate strategy", "sub": "Session 8 · Amazon case", "en": "<ul>\n<li>Businesses: retail (largest revenue), <b>AWS<\/b> (small revenue but most of the operating income: the <b>star<\/b> that funds the bets), advertising (+26%, high margin), Prime (loyalty), devices.<\/li>\n<li>Bezos's \"flywheel\": low prices → more customers → more sellers → more selection → better experience → growth → lower costs.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">AWS through the 3 tests<\/span>\n<b>Attractiveness<\/b>: fast-growing cloud market. <b>Cost of entry<\/b>: low, because AWS reused existing data centers and know-how. <b>Better-off<\/b>: AWS optimizes retail (recommendations, logistics) and retail served as the first customer. Operational links (shared infrastructure) and corporate links (technical know-how transferred).<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Whole Foods (2017)<\/span>\nFor: entry into physical grocery, customer data, fresh-food logistics, pick-up points for Prime. Against: <b>culture clash<\/b> (Amazon's automation and price cuts vs Whole Foods' team culture), Prime pickers crowding the stores, Amazon managers imposed, executive departures. A good illustration of the <b>governance test<\/b>. Prime Video: questionable marginal benefit for a Prime customer who mostly wants fast delivery.<\/div>\n<p>Next bets: advertising (synergy with retail and data, but risk of saturating customers) and healthcare (One Medical: shared logistics, but very different know-how).<\/p>", "fr": "<ul>\n<li>Activités : retail (plus gros CA), <b>AWS<\/b> (petit CA mais l'essentiel du résultat : la <b>star<\/b> qui finance les paris), publicité (+26 %, forte marge), Prime (fidélisation), appareils.<\/li>\n<li>Le « flywheel » de Bezos : prix bas → plus de clients → plus de vendeurs → plus de choix → meilleure expérience → croissance → coûts plus bas.<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">AWS passé aux 3 tests<\/span>\n<b>Attractivité<\/b> : cloud en forte croissance. <b>Coût d'entrée<\/b> : faible, car AWS réutilise les data centers et le savoir-faire existants. <b>Better-off<\/b> : AWS optimise le retail (recommandations, logistique) et le retail a servi de premier client. Liens opérationnels (infrastructures partagées) et corporate (savoir-faire technique transféré).<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Whole Foods (2017)<\/span>\nPour : entrée dans l'épicerie physique, données clients, logistique du frais, points de retrait pour Prime. Contre : <b>choc culturel<\/b> (automatisation et baisses de prix d'Amazon vs culture d'équipe de Whole Foods), préparateurs Prime qui encombrent les magasins, cadres Amazon imposés, départs de dirigeants. Bonne illustration du <b>test de gouvernance<\/b>. Prime Video : bénéfice marginal discutable pour un client Prime qui veut surtout la livraison rapide.<\/div>\n<p>Prochains paris : publicité (synergie avec le retail et les données, mais risque de saturer les clients) et santé (One Medical : logistique partagée, mais savoir-faire très différent).<\/p>"}, {"id": "method", "short": "Method and practice MCQ", "title": "Method for the open question + practice MCQ", "sub": "", "en": "<div class=\"box key\"><span class=\"lbl\">A structure that scores points<\/span>\n<ol>\n<li><b>Calculate first<\/b> (ROS, AT, ROA, relative share…) and position the firms: who follows the cost route, who differentiation, who is in the middle?<\/li>\n<li><b>Assess<\/b> each force or resource (strong/weak, rising/falling) with figures from the case as evidence.<\/li>\n<li><b>Pick<\/b> the 2 most critical elements and say how they reinforce each other.<\/li>\n<li><b>Link<\/b> to the life cycle, strategic fit or the diversification tests.<\/li>\n<li><b>Recommend<\/b> a single route, derived from the analysis, naming the trade-off (risk, fixed cost).<\/li>\n<\/ol><\/div>\n<div class=\"q\"><div class=\"qt\">1. A streaming platform's AT doubles in 5 years. This mainly suggests:<\/div><ol><li>stronger differentiation<\/li><li>economies of scale on a fixed asset base<\/li><li>lower barriers to entry<\/li><\/ol>\n<details><summary>Answer<\/summary>b. AT is an efficiency ratio: more sales per dollar of assets.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. Broadband, for streaming, is:<\/div><ol><li>a substitute<\/li><li>a competitor<\/li><li>a complement<\/li><\/ol>\n<details><summary>Answer<\/summary>c. It increases the value of streaming when used together.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. A CFO justifies an unrelated diversification to \"reduce shareholders' risk\". This is:<\/div><ol><li>a good reason, it is the better-off test<\/li><li>a bad reason, shareholders can diversify themselves<\/li><li>the cost-of-entry test<\/li><\/ol>\n<details><summary>Answer<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. A business has a relative share of 0.6 in a market growing at +8% (average 4%). It is a:<\/div><ol><li>star<\/li><li>question mark<\/li><li>dog<\/li><li>cash cow<\/li><\/ol>\n<details><summary>Answer<\/summary>b. Relative share &lt; 1 and growth above the average.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. A resource that is valuable and rare but easy to copy gives:<\/div><ol><li>a sustained advantage<\/li><li>a temporary advantage<\/li><li>competitive parity<\/li><\/ol>\n<details><summary>Answer<\/summary>b. Inimitability is missing.<\/details><\/div>", "fr": "<div class=\"box key\"><span class=\"lbl\">Structure qui rapporte des points<\/span>\n<ol>\n<li><b>Calcule d'abord<\/b> (ROS, AT, ROA, part relative…) et place les firmes : qui suit la route coûts, qui la différenciation, qui est au milieu ?<\/li>\n<li><b>Évalue<\/b> chaque force ou ressource (forte/faible, en hausse/en baisse) avec une preuve chiffrée du cas.<\/li>\n<li><b>Choisis<\/b> les 2 éléments les plus critiques et dis comment ils se renforcent.<\/li>\n<li><b>Relie<\/b> au cycle de vie, à l'adéquation stratégique ou aux tests de diversification.<\/li>\n<li><b>Recommande<\/b> une seule voie, déduite de l'analyse, en nommant la contrepartie (risque, coût fixe).<\/li>\n<\/ol><\/div>\n<div class=\"q\"><div class=\"qt\">1. L'AT d'une plateforme de streaming double en 5 ans. Cela suggère surtout :<\/div><ol><li>une différenciation plus forte<\/li><li>des économies d'échelle sur une base d'actifs fixe<\/li><li>une baisse des barrières à l'entrée<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. L'AT est un ratio d'efficacité : plus de ventes par euro d'actif.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">2. Le haut débit pour le streaming est :<\/div><ol><li>un substitut<\/li><li>un concurrent<\/li><li>un complément<\/li><\/ol>\n<details><summary>Réponse<\/summary>c. Il augmente la valeur du streaming quand on les utilise ensemble.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">3. Un DAF justifie une diversification non liée pour « réduire le risque des actionnaires ». C'est :<\/div><ol><li>une bonne raison, c'est le test de better-off<\/li><li>une mauvaise raison, les actionnaires peuvent diversifier eux-mêmes<\/li><li>le test de coût d'entrée<\/li><\/ol>\n<details><summary>Réponse<\/summary>b.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">4. Une activité a une part relative de 0,6 dans un marché à +8 % (moyenne 4 %). C'est un :<\/div><ol><li>star<\/li><li>question mark<\/li><li>dog<\/li><li>cash cow<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Part relative &lt; 1 et croissance au-dessus de la moyenne.<\/details><\/div>\n<div class=\"q\"><div class=\"qt\">5. Une ressource valorisée et rare mais facile à copier procure :<\/div><ol><li>un avantage durable<\/li><li>un avantage temporaire<\/li><li>une parité concurrentielle<\/li><\/ol>\n<details><summary>Réponse<\/summary>b. Il manque l'inimitabilité.<\/details><\/div>"}], "cases": [{"kind": "p", "sec": "Practice case", "sid": "", "title": "Practice: positioning three firms", "body": "<div class=\"tw\"><table><tr><th>Firm<\/th><th class=\"num\">Sales<\/th><th class=\"num\">Net income<\/th><th class=\"num\">Assets<\/th><\/tr><tr><td>A<\/td><td class=\"num\">50<\/td><td class=\"num\">2<\/td><td class=\"num\">20<\/td><\/tr><tr><td>B<\/td><td class=\"num\">12<\/td><td class=\"num\">2.4<\/td><td class=\"num\">20<\/td><\/tr><tr><td>C<\/td><td class=\"num\">20<\/td><td class=\"num\">1<\/td><td class=\"num\">20<\/td><\/tr><\/table><\/div><ol><li>Compute ROS, AT and ROA for each firm.<\/li><li>Which generic strategy does each follow?<\/li><li>What could C do?<\/li><\/ol>", "answer": "<p><b>1.<\/b> A: ROS 4%, AT 2.5, ROA 10%. B: ROS 20%, AT 0.6, ROA 12%. C: ROS 5%, AT 1.0, ROA 5%.<\/p><p><b>2.<\/b> A = cost leadership (low margin, high turnover). B = differentiation (high margin, low turnover). C = stuck in the middle.<\/p><p><b>3.<\/b> Reach ROA 10%: either ROS 10% at AT 1.0 (differentiate, raise prices) or AT 2.0 at ROS 5% (sales 40 on the same assets, or assets cut to 10). Pick the route that fits C's resources and explain the trade-off.<\/p>", "fr": "<p>A : coûts (ROS 4 %, AT 2,5, ROA 10 %). B : différenciation (ROS 20 %, AT 0,6, ROA 12 %). C : coincé au milieu (ROA 5 %). C doit choisir une voie selon ses ressources.<\/p>"}, {"kind": "ex", "title": "Example", "sec": "What is strategy", "sid": "c1", "body": "A subscription is worth B = €15 to the customer, costs C = €6 to produce, sells at P = €10. Value created €9 = consumer surplus €5 + firm's rent €4. If studios raise the cost of content to C = €9, value captured falls to €1 while the customer is just as happy: that is Netflix's problem.", "fr": "Un abonnement vaut B = 15 € pour le client, coûte C = 6 € à produire, est vendu P = 10 €. Valeur créée 9 € = surplus client 5 € + rente de l'entreprise 4 €. Si les studios augmentent le coût du contenu à C = 9 €, la valeur captée tombe à 1 € alors que le client est toujours aussi satisfait : c'est le problème de Netflix."}, {"kind": "ex", "title": "Example (Tyson-style)", "sec": "What is strategy", "sid": "c1", "body": "<div class=\"tw\"><table>\n<tr><th>Firm<\/th><th class=\"num\">Sales<\/th><th class=\"num\">Income<\/th><th class=\"num\">Assets<\/th><th class=\"num\">ROS<\/th><th class=\"num\">AT<\/th><th class=\"num\">ROA<\/th><\/tr>\n<tr><td>X (cost)<\/td><td class=\"num\">20<\/td><td class=\"num\">1.0<\/td><td class=\"num\">10<\/td><td class=\"num\">5%<\/td><td class=\"num\">2.0<\/td><td class=\"num\">10%<\/td><\/tr>\n<tr><td>Y (differentiation)<\/td><td class=\"num\">8<\/td><td class=\"num\">1.2<\/td><td class=\"num\">10<\/td><td class=\"num\">15%<\/td><td class=\"num\">0.8<\/td><td class=\"num\">12%<\/td><\/tr>\n<tr><td>Z (middle)<\/td><td class=\"num\">10<\/td><td class=\"num\">0.6<\/td><td class=\"num\">10<\/td><td class=\"num\">6%<\/td><td class=\"num\">1.0<\/td><td class=\"num\">6%<\/td><\/tr>\n<\/table><\/div>\nFor Z to reach a 12% ROA: either ROS = 12% / 1.0 = <b>12%<\/b> with constant AT, or AT = 12% / 6% = <b>2.0<\/b> with constant ROS (assets fall from 10 to 5 at constant sales). Pick the route that builds on Z's <b>resources<\/b> and justify it.", "fr": "<div class=\"tw\"><table>\n<tr><th>Firme<\/th><th class=\"num\">Ventes<\/th><th class=\"num\">Résultat<\/th><th class=\"num\">Actifs<\/th><th class=\"num\">ROS<\/th><th class=\"num\">AT<\/th><th class=\"num\">ROA<\/th><\/tr>\n<tr><td>X (coûts)<\/td><td class=\"num\">20<\/td><td class=\"num\">1,0<\/td><td class=\"num\">10<\/td><td class=\"num\">5 %<\/td><td class=\"num\">2,0<\/td><td class=\"num\">10 %<\/td><\/tr>\n<tr><td>Y (différenciation)<\/td><td class=\"num\">8<\/td><td class=\"num\">1,2<\/td><td class=\"num\">10<\/td><td class=\"num\">15 %<\/td><td class=\"num\">0,8<\/td><td class=\"num\">12 %<\/td><\/tr>\n<tr><td>Z (milieu)<\/td><td class=\"num\">10<\/td><td class=\"num\">0,6<\/td><td class=\"num\">10<\/td><td class=\"num\">6 %<\/td><td class=\"num\">1,0<\/td><td class=\"num\">6 %<\/td><\/tr>\n<\/table><\/div>\nPour que Z atteigne 12 % de ROA : soit ROS = 12 % / 1,0 = <b>12 %<\/b> à AT constant, soit AT = 12 % / 6 % = <b>2,0<\/b> à ROS constant (les actifs passent de 10 à 5 à ventes constantes). Choisis la voie qui s'appuie sur les <b>ressources<\/b> de Z et justifie-la."}, {"kind": "ex", "title": "Example", "sec": "Industry analysis", "sid": "c3", "body": "Market shares 40%, 30%, 20%, 10% → CR4 = 100%; HHI = 1,600 + 900 + 400 + 100 = <b>3,000<\/b> (highly concentrated). A rising CR4 = consolidation, typical of the <b>shakeout<\/b> phase; other things equal, fewer price wars between leaders.", "fr": "Parts de marché 40 %, 30 %, 20 %, 10 % → CR4 = 100 % ; HHI = 1 600 + 900 + 400 + 100 = <b>3 000<\/b> (très concentré). Un CR4 qui monte = consolidation, typique de la phase de <b>shakeout<\/b> ; à autres choses égales, moins de guerre des prix entre leaders."}, {"kind": "ex", "title": "Amazon through VRIO", "sec": "Internal analysis (VRIO)", "sid": "c5", "body": "Customer-centric culture and logistics platform: V, R, I, O → <b>sustained advantage<\/b>. AWS: economies of scale, sunk costs → sustained. Cash and financial power: useful but not rare (other giants) → <b>temporary<\/b>. Patents (1-Click, 1998): they expire → temporary to sustained.", "fr": "Culture centrée client et plateforme logistique : V, R, I, O → <b>avantage durable<\/b>. AWS : économies d'échelle, coûts irrécupérables → durable. Cash et puissance financière : utile mais pas rare (autres géants) → <b>temporaire<\/b>. Brevets (1-Click, 1998) : expirent → temporaire à durable."}, {"kind": "ex", "title": "Example (Tyson, practice exam 2)", "sec": "Corporate strategy", "sid": "c7", "body": "Chicken: share 14.5 vs 12.0 for no. 2 → 1.21; growth 3.3% below the 3.7% average → <b>cash cow<\/b>. Prepared foods: 9.1/12 = 0.76; 6.5% → <b>question mark<\/b>. Beef (0.87) and pork (0.41) with low growth → <b>dogs<\/b>.<br>\nLimits to mention: relative share is a poor indicator when the advantage comes from the brand (prepared foods earn the largest profit); a snapshot in time (cattle cycle); ignores links between businesses; depends on how the market is defined.", "fr": "Poulet : part 14,5 vs 12,0 pour le n°2 → 1,21 ; croissance 3,3 % sous la moyenne 3,7 % → <b>cash cow<\/b>. Plats préparés : 9,1/12 = 0,76 ; 6,5 % → <b>question mark<\/b>. Bœuf (0,87) et porc (0,41) à faible croissance → <b>dogs<\/b>.<br>\nLimites à citer : la part relative est un mauvais indicateur quand l'avantage vient de la marque (les plats préparés font le plus gros résultat) ; photo à un instant (cycle du bétail) ; ignore les liens entre activités ; dépend de la définition du marché."}, {"kind": "ex", "title": "AWS through the 3 tests", "sec": "Amazon case", "sid": "c8", "body": "<b>Attractiveness<\/b>: fast-growing cloud market. <b>Cost of entry<\/b>: low, because AWS reused existing data centers and know-how. <b>Better-off<\/b>: AWS optimizes retail (recommendations, logistics) and retail served as the first customer. Operational links (shared infrastructure) and corporate links (technical know-how transferred).", "fr": "<b>Attractivité<\/b> : cloud en forte croissance. <b>Coût d'entrée<\/b> : faible, car AWS réutilise les data centers et le savoir-faire existants. <b>Better-off<\/b> : AWS optimise le retail (recommandations, logistique) et le retail a servi de premier client. Liens opérationnels (infrastructures partagées) et corporate (savoir-faire technique transféré)."}], "quiz": [{"q": "A streaming platform's AT doubles in 5 years. This mainly suggests:", "o": ["stronger differentiation", "economies of scale on a fixed asset base", "lower barriers to entry"], "a": [1], "e": "AT is an efficiency ratio: more sales per dollar of assets.", "fr": "L'AT est un ratio d'efficacité : plus de ventes par euro d'actif.", "src": "Method and practice MCQ"}, {"q": "Broadband, for streaming, is:", "o": ["a substitute", "a competitor", "a complement"], "a": [2], "e": "It increases the value of streaming when used together.", "fr": "Il augmente la valeur du streaming quand on les utilise ensemble.", "src": "Method and practice MCQ"}, {"q": "A CFO justifies an unrelated diversification to \"reduce shareholders' risk\". This is:", "o": ["a good reason, it is the better-off test", "a bad reason, shareholders can diversify themselves", "the cost-of-entry test"], "a": [1], "e": "", "fr": "", "src": "Method and practice MCQ"}, {"q": "A business has a relative share of 0.6 in a market growing at +8% (average 4%). It is a:", "o": ["star", "question mark", "dog", "cash cow"], "a": [1], "e": "Relative share &lt; 1 and growth above the average.", "fr": "Part relative &lt; 1 et croissance au-dessus de la moyenne.", "src": "Method and practice MCQ"}, {"q": "A resource that is valuable and rare but easy to copy gives:", "o": ["a sustained advantage", "a temporary advantage", "competitive parity"], "a": [1], "e": "Inimitability is missing.", "fr": "Il manque l'inimitabilité.", "src": "Method and practice MCQ"}, {"q": "B = willingness to pay, P = price, C = cost. Value captured by the firm is:", "o": ["B − C", "B − P", "P − C", "B + P − C"], "a": [2], "e": "P − C is the firm's rent; B − P is the consumer surplus; B − C the total value created.", "fr": "P − C = rente de l'entreprise ; B − P = surplus client ; B − C = valeur créée.", "src": "What is strategy"}, {"q": "Firm Z: sales 10, net income 0.6, assets 10. Its ROA is:", "o": ["6%", "10%", "0.6%", "60%"], "a": [0], "e": "ROS 6% × AT 1.0 = 6%.", "fr": "ROS 6 % × AT 1,0 = 6 %.", "src": "What is strategy"}, {"q": "A high ROS with a low AT is typical of:", "o": ["Cost leadership", "Differentiation", "Stuck in the middle", "Focus on cost"], "a": [1], "e": "Hermès, Apple: high margins, heavy assets relative to sales.", "fr": "Hermès, Apple : marges élevées, rotation faible.", "src": "What is strategy"}, {"q": "Market shares 40, 30, 20, 10. The HHI is:", "o": ["100", "1,000", "3,000", "10,000"], "a": [2], "e": "1,600 + 900 + 400 + 100 = 3,000: highly concentrated.", "fr": "1 600 + 900 + 400 + 100 = 3 000 : très concentré.", "src": "Industry analysis"}, {"q": "For Netflix, YouTube is:", "o": ["A competitor", "A substitute", "A complement", "A supplier"], "a": [1], "e": "Different product, same need (entertainment). Disney+ is a competitor.", "fr": "Autre produit, même besoin. Disney+ est un concurrent.", "src": "Industry analysis"}, {"q": "Overcapacity, high fixed costs and slow growth make which force stronger?", "o": ["Buyer power", "Rivalry", "Threat of substitutes", "Supplier power"], "a": [1], "e": "Classic drivers of intense rivalry.", "fr": "Facteurs classiques d'une rivalité forte.", "src": "Industry analysis"}, {"q": "In the shakeout stage, competition shifts mainly to:", "o": ["Product innovation", "Costs", "Advertising", "Patents"], "a": [1], "e": "The dominant design sets the rules; many firms exit.", "fr": "Le design dominant fixe les règles, beaucoup de firmes sortent.", "src": "Industry analysis"}, {"q": "A resource that is valuable, rare and inimitable but the firm is not organized to use it gives:", "o": ["Sustained advantage", "Unexploited advantage", "Competitive parity", "Disadvantage"], "a": [1], "e": "The O of VRIO is missing.", "fr": "Il manque le O de VRIO.", "src": "Internal analysis (VRIO)"}, {"q": "Approximate value of a firm's intangibles:", "o": ["Sales − costs", "Market capitalization − book value", "Total assets", "Net income × P/E"], "a": [1], "e": "The market prices what the balance sheet does not show.", "fr": "Le marché valorise ce que le bilan ne montre pas.", "src": "Internal analysis (VRIO)"}, {"q": "P&G uses the same sales force for diapers and paper towels. This is:", "o": ["Transferring a capability", "Sharing an activity", "Vertical integration", "Unrelated diversification"], "a": [1], "e": "Same step of the value chain used by two businesses.", "fr": "Même étape de la chaîne de valeur partagée.", "src": "Corporate strategy"}, {"q": "Porter's test asking whether the entry price absorbs all future profits:", "o": ["Attractiveness", "Cost of entry", "Better-off", "Governance"], "a": [1], "e": "The acquisition premium must not eat the gains.", "fr": "La prime d'acquisition ne doit pas absorber les gains.", "src": "Corporate strategy"}, {"q": "Chicken: share 14.5 vs 12.0 for no. 2, growth 3.3% vs 3.7% average. BCG category?", "o": ["Star", "Question mark", "Cash cow", "Dog"], "a": [2], "e": "Relative share 1.21 > 1, growth below average.", "fr": "Part relative 1,21 > 1, croissance sous la moyenne.", "src": "Corporate strategy"}, {"q": "Whole Foods' culture clash with Amazon best illustrates which test?", "o": ["Attractiveness", "Cost of entry", "Better-off", "Governance"], "a": [3], "e": "How to manage and share the value after the deal.", "fr": "Comment gérer et partager la valeur après l'achat.", "src": "Amazon case"}]}, {"id": "finance", "name": "Corporate Finance", "short": "Finance", "start": "2026-12-09T15:30:00+08:00", "when": "Mer. 9 déc. · 15:30–17:30", "fmt": "Questions ouvertes sur une étude de cas · 2h", "weight": "60 %", "rules": "Calculatrice TI BA II Plus ou HP 12c, brouillon autorisé", "hue": 38, "lead": "Updated 25 November (professor's announcement of 19 November). The 9 sessions on one page: what to know, the formulas, a worked example for each concept, and the method for the final case study.", "prof": "M1 · Wanjiao JIA", "sections": [{"id": "exam", "short": "The final exam", "title": "The final exam: what is confirmed", "sub": "K2 announcement of 19 November + \"Final Exam Information\" file + past exams", "en": "<div class=\"box key\"><span class=\"lbl\">Your calendar (exam notice)<\/span><b>Wed 9 December, 15:30–17:30<\/b> (Suzhou time). On TestWe, 2 hours. No documents, <b>scratch paper allowed<\/b>. <b>Calculator: bring your own<\/b> (programmable allowed; the TestWe one will be disabled). Only the <b>TI BA II Plus<\/b> and the <b>HP 12c<\/b> are accepted. Person in charge: Bertrand Groslambert.<br>Room 271, row 5, seat 6. Arrive 15 minutes early with your student card and a charged battery.<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Difference with K2<\/span>Your calendar says \"MCQ + open questions\", but on 19 November the professor announced there would be <b>no MCQ<\/b>. I go with the professor's announcement, more recent and more precise: prepare mainly for the case study.<\/div>\n<div class=\"box exam\"><span class=\"lbl\">What changed on 19 November<\/span>\n<ul>\n<li>Wednesday <b>9 December, 15:30–17:30<\/b>, on <b>TestWe<\/b>.<\/li>\n<li><b>Open questions only<\/b> on a case study. <b>No MCQ.<\/b><\/li>\n<li>In the spirit of the cases done in class. The professor lists: <b>Ginza<\/b> (session 4), <b>Nordex<\/b> (tutorial 4), <b>Microsoft<\/b> (sessions 5 and 9), <b>Solaria<\/b> (tutorial 5), <b>Kanterbrew<\/b> (tutorial 9). They are summarized in the \"Cases to redo\" section below.<\/li>\n<li>Also redo the <b>past exams<\/b> on K2 (folder <code>Final/Annales<\/code>).<\/li>\n<li><b>2 bonus questions<\/b> worth 1 point each on the documentary <b><i>Inside Job<\/i><\/b> (Charles Ferguson, 2010, free on YouTube).<\/li>\n<li>Weighting: the more favourable of the two is kept (normal, or one that gives more weight to the final).<\/li>\n<\/ul><\/div>\n<p>Since 2018, the final case study has <b>always followed the same pattern<\/b>: a company considers a 3-year project and you must say whether to invest. The questions go like this:<\/p>\n<div class=\"tw\"><table>\n<tr><th>#<\/th><th>Question type<\/th><th>Session<\/th><th class=\"num\">Points (2022)<\/th><\/tr>\n<tr><td>1<\/td><td>Investment cash flow in year 0<\/td><td>4<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td>2<\/td><td>Operating cash flows in year 1 and year 4<\/td><td>4<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td>3<\/td><td>Divestment cash flow in year 3<\/td><td>4<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td>4<\/td><td>Market value of debt V<sub>D<\/sub> and cost of debt k<sub>D<\/sub><\/td><td>6, 9<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td>5<\/td><td>Market value of equity V<sub>E<\/sub> and cost of equity k<sub>E<\/sub><\/td><td>8<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td>6<\/td><td>WACC<\/td><td>9<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td>7<\/td><td>Project NPV at the WACC: invest or not?<\/td><td>2, 9<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td>8<\/td><td>Company P/E vs industry P/E<\/td><td>5<\/td><td class=\"num\">2<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box key\"><span class=\"lbl\">Grading<\/span>Reasoning (formula) and calculation are graded <b>separately<\/b>, and reasoning is worth more. Always write the formula before the numbers.<\/div>\n<h3>The official list of what comes up (\"Final Exam Information\" file)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Session<\/th><th>What to know<\/th><\/tr>\n<tr><td>1. Governance<\/td><td>The 3 forms of business; shareholder primacy vs stakeholders / CSR; benefit corporation and \"entreprise à mission\"; role of the CFO; <b>agency problems<\/b> between the board and management; balance sheet, income statement, cash flow statement (<b>especially the indirect method<\/b>)<\/td><\/tr>\n<tr><td>2. NPV<\/td><td>Compounding and discounting; future value, present value, NPV; annuity and perpetuity; NPV rule<\/td><\/tr>\n<tr><td>3. IRR<\/td><td>Definition and rule; limits of the IRR and solutions; investment vs financing cash flows; nominal, proportional, effective rate; payback<\/td><\/tr>\n<tr><td>4. Incremental cash flows<\/td><td>Working capital (NWC); <b>tax shield<\/b>; opportunity cost and sunk cost; why financing is ignored; cash flows before and after tax; NPV of incremental cash flows<\/td><\/tr>\n<tr><td>5. Stocks<\/td><td>DCF (enterprise value − value of debt); DDM; income vs growth stock, PVGO = NPV<sub>1<\/sub> / (r − g); P/E; EBIT multiple; P/B<\/td><\/tr>\n<tr><td>6. Bonds<\/td><td>Vocabulary (face value, par, redemption, maturity, issue price, coupon); at par, above, below; YTM; price; <b>rate over the same period as the coupon<\/b>; default risk, rating, YTM and spread<\/td><\/tr>\n<tr><td>7. Risk<\/td><td>Risk always exists; it acts through cash flows and through the rate; ex ante vs ex post; specific vs market risk<\/td><\/tr>\n<tr><td>8. CAPM<\/td><td>Diversified portfolio assumption; beta; risk premium; CAPM; SML and its two types of shift; portfolio β = weighted average; <b>Cov(R<sub>J<\/sub>,R<sub>M<\/sub>) = Corr × σ<sub>J<\/sub> × σ<sub>M<\/sub><\/b><\/td><\/tr>\n<tr><td>9. WACC<\/td><td>The WACC is the rate used to value an investment or a company; link with the incremental cash flows of session 4<\/td><\/tr>\n<\/table><\/div>\n<details><summary>Notions from the list not to forget<\/summary>\n<b>Agency problem<\/b>: managers (agents) may act in their own interest rather than in the shareholders' (principals') interest: pay, empire building, short-termism. The board of directors is there to monitor them.<br>\n<b>Depreciation tax shield<\/b> = depreciation × tax rate. E.g. 800,000 of depreciation at 30% = 240,000 less tax. That is why depreciation is added back after computing tax.<br>\n<b>Beta from correlation<\/b>: β = Cov / Var(R<sub>M<\/sub>) = Corr × σ<sub>J<\/sub> / σ<sub>M<\/sub>. E.g. correlation 0.6, σ<sub>J<\/sub> = 30%, σ<sub>M<\/sub> = 20% → β = 0.6 × 30 / 20 = <b>0.9<\/b>.<\/details>\n<details><summary><i>Inside Job<\/i> in brief (for the 2 bonus points)<\/summary>\nDocumentary by Charles Ferguson (2010, Oscar for best documentary) on the 2008 financial crisis. Main threads: financial deregulation in the US since the 1980s; subprime loans securitized into CDOs; CDS (AIG); rating agencies giving AAA ratings to toxic products; banks betting against the products they sold; the collapse of Lehman Brothers (September 2008); executive pay; conflicts of interest of academic economists; the fact that almost no executive was prosecuted. Watch it before the exam: the bonus questions are about it.<\/details>", "fr": "<div class=\"box key\"><span class=\"lbl\">Ton calendrier (convocation)<\/span><b>Mer. 9 décembre, 15 h 30–17 h 30<\/b> (heure de Suzhou). Sur TestWe, 2 h. Pas de documents, <b>brouillon autorisé<\/b>. <b>Calculatrice : apporte la tienne<\/b> (programmable autorisée ; celle de TestWe sera désactivée). Seules la <b>TI BA II Plus<\/b> et la <b>HP 12c<\/b> sont acceptées. Responsable : Bertrand Groslambert.<br>Salle 271, rang 5, place 6. Arriver 15 min avant avec ta carte étudiante, batterie chargée.<\/div>\n<div class=\"box trap\"><span class=\"lbl\">Différence avec K2<\/span>Ton calendrier indique « QCM + questions ouvertes », mais la prof a annoncé le 19 novembre que ce ne serait <b>pas un QCM<\/b>. Je garde l'annonce de la prof, plus récente et plus précise ; prépare-toi surtout à l'étude de cas.<\/div>\n\n<div class=\"box exam\"><span class=\"lbl\">Ce qui a changé le 19 novembre<\/span>\n<ul>\n<li>Mercredi <b>9 décembre, 15 h 30–17 h 30<\/b>, sur <b>TestWe<\/b>.<\/li>\n<li><b>Que des questions ouvertes<\/b> sur une étude de cas. <b>Pas de QCM.<\/b><\/li>\n<li>Dans l'esprit des cas faits en cours. La prof cite : <b>Ginza<\/b> (cours 4), <b>Nordex<\/b> (TD 4), <b>Microsoft<\/b> (cours 5 et 9), <b>Solaria<\/b> (TD 5), <b>Kanterbrew<\/b> (TD 9). Ils sont résumés dans la section « Les cas à refaire » plus bas.<\/li>\n<li>Refaire aussi les <b>annales<\/b> sur K2 (dossier <code>Final/Annales<\/code>).<\/li>\n<li><b>2 questions bonus<\/b> d'1 point chacune sur le documentaire <b><i>Inside Job<\/i><\/b> (Charles Ferguson, 2010, gratuit sur YouTube).<\/li>\n<li>Pondération : la plus favorable des deux est retenue (normale, ou une qui donne plus de poids au final).<\/li>\n<\/ul><\/div>\n<p>Depuis 2018, l'étude de cas du final suit <b>toujours le même schéma<\/b> : une entreprise envisage un projet sur 3 ans et tu dois dire s'il faut investir. Les questions s'enchaînent comme ça :<\/p>\n<div class=\"tw\"><table>\n<tr><th>#<\/th><th>Question type<\/th><th>Cours<\/th><th class=\"num\">Points (2022)<\/th><\/tr>\n<tr><td>1<\/td><td>Flux d'investissement en année 0<\/td><td>4<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td>2<\/td><td>Flux d'exploitation année 1 et année 4<\/td><td>4<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td>3<\/td><td>Flux de désinvestissement en année 3<\/td><td>4<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td>4<\/td><td>Valeur de marché de la dette V<sub>D<\/sub> et coût de la dette k<sub>D<\/sub><\/td><td>6, 9<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td>5<\/td><td>Valeur de marché des fonds propres V<sub>E<\/sub> et coût des fonds propres k<sub>E<\/sub><\/td><td>8<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td>6<\/td><td>WACC<\/td><td>9<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td>7<\/td><td>VAN du projet au WACC : investir ou non ?<\/td><td>2, 9<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td>8<\/td><td>PER de l'entreprise vs PER du secteur<\/td><td>5<\/td><td class=\"num\">2<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box key\"><span class=\"lbl\">Barème<\/span>Le raisonnement (formule) et le calcul sont notés <b>séparément<\/b>, et le raisonnement vaut plus. Écris toujours la formule avant les chiffres.<\/div>\n<h3>La liste officielle de ce qui tombe (fichier « Final Exam Information »)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Séance<\/th><th>À savoir<\/th><\/tr>\n<tr><td>1. Gouvernance<\/td><td>Les 3 formes d'entreprise ; primauté de l'actionnaire vs parties prenantes / RSE ; benefit corporation et entreprise à mission ; rôle du CFO ; <b>problèmes d'agence<\/b> entre conseil et direction ; bilan, compte de résultat, tableau des flux (<b>surtout la méthode indirecte<\/b>)<\/td><\/tr>\n<tr><td>2. VAN<\/td><td>Capitalisation et actualisation ; valeur future, valeur actuelle, VAN ; annuité et perpétuité ; règle de la VAN<\/td><\/tr>\n<tr><td>3. TRI<\/td><td>Définition et règle ; limites du TRI et solutions ; flux d'investissement vs de financement ; taux nominal, proportionnel, effectif ; payback<\/td><\/tr>\n<tr><td>4. Flux incrémentaux<\/td><td>BFR ; <b>économie d'impôt<\/b> (tax shield) ; coût d'opportunité et coût irrécupérable ; pourquoi on ignore le financement ; flux avant et après impôt ; VAN des flux incrémentaux<\/td><\/tr>\n<tr><td>5. Actions<\/td><td>DCF (valeur de l'entreprise − valeur de la dette) ; DDM ; income vs growth stock, PVGO = VAN<sub>1<\/sub> / (r − g) ; PER ; multiple d'EBIT ; PBR<\/td><\/tr>\n<tr><td>6. Obligations<\/td><td>Vocabulaire (nominal, pair, remboursement, maturité, prix d'émission, coupon) ; au pair, au-dessus, en dessous ; YTM ; prix ; <b>taux sur la même période que le coupon<\/b> ; risque de défaut, note, YTM et spread<\/td><\/tr>\n<tr><td>7. Risque<\/td><td>Le risque existe toujours ; il agit via les flux et via le taux ; ex ante vs ex post ; risque spécifique vs de marché<\/td><\/tr>\n<tr><td>8. CAPM<\/td><td>Hypothèse de portefeuille diversifié ; bêta ; prime de risque ; CAPM ; SML et ses deux types de déplacement ; β d'un portefeuille = moyenne pondérée ; <b>Cov(R<sub>J<\/sub>,R<sub>M<\/sub>) = Corr × σ<sub>J<\/sub> × σ<sub>M<\/sub><\/b><\/td><\/tr>\n<tr><td>9. WACC<\/td><td>Le WACC est le taux pour valoriser un investissement ou une entreprise ; lien avec les flux incrémentaux de la séance 4<\/td><\/tr>\n<\/table><\/div>\n<details><summary>Deux notions de la liste à ne pas oublier<\/summary>\n<b>Problème d'agence<\/b> : les dirigeants (agents) peuvent agir dans leur intérêt plutôt que dans celui des actionnaires (principaux) : rémunération, empire building, court-termisme. Le conseil d'administration est là pour les contrôler.<br>\n<b>Économie d'impôt de l'amortissement<\/b> (tax shield) = amortissement × taux d'impôt. Ex. : 800 000 d'amortissement à 30 % = 240 000 d'impôt en moins. C'est pour ça qu'on rajoute l'amortissement après avoir calculé l'impôt.<br>\n<b>Bêta à partir de la corrélation<\/b> : β = Cov / Var(R<sub>M<\/sub>) = Corr × σ<sub>J<\/sub> / σ<sub>M<\/sub>. Ex. : corrélation 0,6, σ<sub>J<\/sub> = 30 %, σ<sub>M<\/sub> = 20 % → β = 0,6 × 30 / 20 = <b>0,9<\/b>.<\/details>\n<details><summary><i>Inside Job<\/i> en bref (pour les 2 points bonus)<\/summary>\nDocumentaire de Charles Ferguson (2010, Oscar du meilleur documentaire) sur la crise financière de 2008. Fils conducteurs : la dérégulation financière aux États-Unis depuis les années 80 ; les subprimes titrisés en CDO ; les CDS (AIG) ; les agences de notation qui notaient AAA des produits toxiques ; les banques qui pariaient contre les produits qu'elles vendaient ; la faillite de Lehman Brothers (septembre 2008) ; les rémunérations des dirigeants ; les conflits d'intérêts des économistes universitaires ; le fait que presque aucun dirigeant n'a été poursuivi. Regarde-le avant l'examen : les questions bonus portent dessus.<\/details>"}, {"id": "cases", "short": "Cases to redo", "title": "The cases listed by the professor", "sub": "Ginza, Nordex, Microsoft, Solaria, Kanterbrew: files in <code>Final/Cours<\/code>", "en": "<p>The professor advises redoing them while understanding <b>the financial reasoning<\/b>, not just the calculations.<\/p>\n<h3>Nordex (tutorial 4): fixing a flawed report<\/h3>\n<p>Consultants say a wind-turbine project is worth $48.75M because it raises net income by $4.875M a year for 10 years. Three mistakes:<\/p>\n<ol>\n<li>They reason in <b>accounting income<\/b>, not cash flows: add back depreciation ($25M / 10 = $2.5M) and subtract the $25M investment.<\/li>\n<li>They forget <b>working capital<\/b>: $10M in year 0, recovered in year 10.<\/li>\n<li>They charge $1M of overheads that exist <b>anyway<\/b>: not incremental. Add it back after tax: 1M × (1 − 35%) = $0.65M.<\/li>\n<\/ol>\n<p>The $1M consultants' report: sunk cost, ignore it.<\/p>\n<div class=\"f\">Year 0: −25,000 − 10,000 = −35,000\nYears 1 to 9: 4,875 + 650 + 2,500 = 8,025\nYear 10: 8,025 + 10,000 (NWC recovered) = 18,025\nNPV at 14% = −35 + 8.025 × [1 − 1.14⁻⁹] / 0.14 + 18.025 / 1.14¹⁰ = <b>+$9.56M<\/b><\/div>\n<h3>Ginza (session 4): cash flows, NPV, IRR, payback<\/h3>\n<p>Investment €100,000, declining-balance depreciation, sales rising from €100,000 to €180,000, margin 30%, NWC = 72 days of sales, tax 45%, resale €10,000 (taxable capital gain), rate 10%. Cash flows: −120,000; 30,500; 26,600; 25,580; 27,260; 76,060. <b>Payback<\/b> ≈ 4 years 1 month; <b>discounted payback<\/b> ≈ 4 years 8 months. Key points: NWC financed at the start of the year, no debt so EBIT(1 − T) = net income.<\/p>\n<h3>Kanterbrew (tutorial 9): the full final-style case<\/h3>\n<div class=\"f\">Q1  Land −5M (opportunity cost) + plant −10M = −15M\nQ2  Operating cash flows with NWC: −0.24M; 2.35; 3.22; 4.14; 3.67; then +3.42M (NWC recovered in year 6)\nQ3  Resale in year 5: land 3M + plant 6M; tax: −0.6M on the land (capital loss), +0.3M on the plant\n    → net 9.3M\nQ4  k<sub>D<\/sub> = 5.5%; V<sub>D<\/sub> = 0.8M coupons and 20M repaid in 5 years, discounted → 18.7M\nQ5  β = 1.2; k<sub>E<\/sub> = 8.4%; V<sub>E<\/sub> = 80M\nQ6  WACC = 7.5%\nQ7  NPV = <b>+3.73M<\/b> → invest<\/div>\n<h3>Microsoft (sessions 5 and 9): valuing a company with FCFF<\/h3>\n<ol>\n<li>Project sales over 10 years ($198,270M, +11%/year).<\/li>\n<li>NOPAT = sales × operating margin (42.1%) × (1 − tax).<\/li>\n<li>FCFF = NOPAT + depreciation − capex − ΔNWC (as % of sales: 7.3%, 12%, 1.2%).<\/li>\n<li>Discount at the WACC (8.9%). Terminal value after year 10 = NOPAT<sub>10<\/sub> / WACC (perpetuity with no growth).<\/li>\n<li>Enterprise value = discounted FCFF + discounted terminal value + short-term assets.<\/li>\n<li>Equity value = enterprise value − debt − short-term liabilities. Divided by 7,464M shares → <b>≈ $252<\/b>, vs a share price of $247: the stock looks fairly valued, even slightly undervalued.<\/li>\n<\/ol>\n<h3>Solaria (tutorial 5): relative valuation<\/h3>\n<p>Compute EPS, growth, P/E, market cap, P/B, shareholder return and liquidity. Reading: Solaria's P/E ≈ industry P/E (≈ 26) but lower expected earnings growth (−20% vs +12%) and higher P/B (2.7 vs 2.02) → the stock looks <b>expensive<\/b>. But given sales growth (35% vs 10%) and EBITDA growth (25% vs 18%), it looks <b>fairly valued, even cheaper<\/b>. Conclusion of the answer key: do not judge on a single multiple, and also compare risk. Liquidity: free float ≈ 48%.<\/p>", "fr": "<p>La prof conseille de les refaire en comprenant <b>le raisonnement financier<\/b>, pas juste les calculs.<\/p>\n<h3>Nordex (TD 4) : corriger un mauvais rapport<\/h3>\n<p>Des consultants disent qu'un projet d'éoliennes vaut 48,75 M$ parce qu'il augmente le résultat de 4,875 M$ par an sur 10 ans. Trois erreurs :<\/p>\n<ol>\n<li>Ils raisonnent en <b>résultat comptable<\/b>, pas en flux de trésorerie : il faut rajouter l'amortissement (25 M$ / 10 = 2,5 M$) et retirer l'investissement de 25 M$.<\/li>\n<li>Ils oublient le <b>BFR<\/b> : 10 M$ en année 0, récupérés en année 10.<\/li>\n<li>Ils comptent 1 M$ de frais généraux qui existent <b>de toute façon<\/b> : pas incrémental. On le rajoute après impôt : 1 M × (1 − 35 %) = 0,65 M$.<\/li>\n<\/ol>\n<p>Les 1 M$ du rapport de consultants : coût irrécupérable, on l'ignore.<\/p>\n<div class=\"f\">Année 0 : −25 000 − 10 000 = −35 000\nAnnées 1 à 9 : 4 875 + 650 + 2 500 = 8 025\nAnnée 10 : 8 025 + 10 000 (BFR récupéré) = 18 025\nVAN à 14 % = −35 + 8,025 × [1 − 1,14⁻⁹] / 0,14 + 18,025 / 1,14¹⁰ = <b>+9,56 M$<\/b><\/div>\n<h3>Ginza (cours 4) : flux, VAN, TRI, payback<\/h3>\n<p>Investissement 100 000 €, amortissement dégressif, hausse des ventes de 100 000 à 180 000 €, marge 30 %, BFR = 72 jours de ventes, impôt 45 %, revente 10 000 € (plus-value taxée), taux 10 %. Flux : −120 000 ; 30 500 ; 26 600 ; 25 580 ; 27 260 ; 76 060. <b>Payback<\/b> ≈ 4 ans 1 mois ; <b>payback actualisé<\/b> ≈ 4 ans 8 mois. Points clés : BFR financé en début d'année, pas de dette donc EBIT(1 − T) = résultat net.<\/p>\n<h3>Kanterbrew (TD 9) : le cas complet type final<\/h3>\n<div class=\"f\">Q1  Terrain −5 M (coût d'opportunité) + usine −10 M = −15 M\nQ2  Flux d'exploitation avec BFR : −0,24 M ; 2,35 ; 3,22 ; 4,14 ; 3,67 ; puis +3,42 M (BFR récupéré en année 6)\nQ3  Revente année 5 : terrain 3 M + usine 6 M ; impôt : −0,6 M sur le terrain (moins-value), +0,3 M sur l'usine\n    → net 9,3 M\nQ4  k<sub>D<\/sub> = 5,5 % ; V<sub>D<\/sub> = coupons 0,8 M et 20 M remboursés en 5 ans, actualisés → 18,7 M\nQ5  β = 1,2 ; k<sub>E<\/sub> = 8,4 % ; V<sub>E<\/sub> = 80 M\nQ6  WACC = 7,5 %\nQ7  VAN = <b>+3,73 M<\/b> → investir<\/div>\n<h3>Microsoft (cours 5 et 9) : valoriser une entreprise par les FCFF<\/h3>\n<ol>\n<li>Projeter les ventes sur 10 ans (198 270 M$, +11 %/an).<\/li>\n<li>NOPAT = ventes × marge opérationnelle (42,1 %) × (1 − impôt).<\/li>\n<li>FCFF = NOPAT + amortissement − investissement − ΔBFR (en % des ventes : 7,3 %, 12 %, 1,2 %).<\/li>\n<li>Actualiser au WACC (8,9 %). Valeur résiduelle après l'année 10 = NOPAT<sub>10<\/sub> / WACC (perpétuité sans croissance).<\/li>\n<li>Valeur de l'entreprise = FCFF actualisés + valeur résiduelle actualisée + actifs à court terme.<\/li>\n<li>Valeur des fonds propres = valeur de l'entreprise − dette − passifs à court terme. Divisée par 7 464 M d'actions → <b>≈ 252 $<\/b>, contre un cours de 247 $ : l'action paraît correctement valorisée, voire un peu sous-évaluée.<\/li>\n<\/ol>\n<h3>Solaria (TD 5) : valorisation relative<\/h3>\n<p>Calculer BPA, croissance, PER, capitalisation, PBR, rentabilité pour l'actionnaire et liquidité. Lecture : PER de Solaria ≈ PER du secteur (≈ 26) mais croissance attendue des bénéfices plus faible (−20 % vs +12 %) et PBR plus élevé (2,7 vs 2,02) → l'action paraît <b>chère<\/b>. Mais avec la croissance des ventes (35 % vs 10 %) et de l'EBITDA (25 % vs 18 %), elle paraît <b>correctement valorisée, voire moins chère<\/b>. Conclusion du corrigé : ne pas juger sur un seul multiple, et comparer aussi le risque. Liquidité : flottant ≈ 48 %.<\/p>"}, {"id": "c1", "short": "Financial statements", "title": "1. Governance and financial statements", "sub": "Session 1 · Vernimmen ch. 2–5, 43", "en": "<h3>Forms of business and governance<\/h3>\n<ul>\n<li><b>Sole proprietorship<\/b>: easy to set up, but <b>unlimited liability<\/b>. <b>Corporation<\/b>: legal entity separate from its owners, limited liability.<\/li>\n<li>Shareholders elect the <b>board of directors<\/b>, which alone can declare a dividend, issue securities and approve large investments. The board appoints the CEO.<\/li>\n<li>Debate: <b>shareholder primacy<\/b> (since the 1980s) vs <b>stakeholders<\/b> (Business Roundtable 2019, benefit corporation, \"entreprise à mission\"). The course takes the shareholder's point of view.<\/li>\n<li>The CFO maximizes value through 3 decisions: <b>investment, financing, dividend<\/b>. Treasurer (financing, cash, investments) vs Controller (accounting, budgets, internal audit).<\/li>\n<\/ul>\n<h3>The three financial statements<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Balance sheet<\/b>A snapshot at a date. Assets = Equity + Liabilities. What the company owns and how it is financed.<\/div>\n<div class=\"card\"><b class=\"t\">Income statement<\/b>A film over a period. Revenue when <i>earned<\/i>, expenses when <i>incurred<\/i> (not when paid).<\/div>\n<div class=\"card\"><b class=\"t\">Cash flow statement<\/b>The real cash inflows and outflows: operating, investing, financing.<\/div>\n<\/div>\n<div class=\"f\">  Sales\n− Cost of goods sold (COGS)         = Gross profit\n− Operating expenses (incl. depreciation)\n= Operating income (EBIT)\n− Interest  ± exceptional items     = Earnings before tax (EBT)\n− Tax                               = Net income<\/div>\n<div class=\"box key\"><span class=\"lbl\">Remember<\/span><b>Depreciation<\/b> is a <b>non-cash<\/b> expense: it reduces income (so tax) but no cash goes out. It is added back in cash flows.<\/div>\n<h4>Operating cash flow, indirect method<\/h4>\n<p>Net income + depreciation − increase in receivables − increase in inventory + increase in payables (and vice versa).<\/p>\n<div class=\"box trap\"><span class=\"lbl\">Memory aid<\/span>An <b>asset that increases uses cash<\/b>; a <b>liability that increases provides cash<\/b>.<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Course example: Mysmallbusiness (croissants)<\/span>\nNeeds: table 50 + cash register 100 + freezer 150 + microwave 150 = 450 of fixed assets; inventory 50; cash 50. Total = <b>550<\/b>. Financing: 300 contributed (equity) + 250 borrowed from parents over 5 years (debt). Assets 550 = Liabilities and equity 550.<br>\nTesla 2019: operating +2,405; investing −1,436; financing +1,529; FX +8 → change in cash <b>+$2,506M<\/b>.<\/div>", "fr": "<h3>Formes d'entreprise et gouvernance<\/h3>\n<ul>\n<li><b>Entreprise individuelle<\/b> (sole proprietorship) : facile à créer, mais <b>responsabilité illimitée<\/b>. <b>Société<\/b> (corporation) : personne morale distincte des propriétaires, responsabilité limitée.<\/li>\n<li>Les actionnaires élisent le <b>conseil d'administration<\/b> (Board), qui seul peut déclarer un dividende, émettre des titres et engager de gros investissements. Le Board nomme le CEO.<\/li>\n<li>Débat : <b>primauté de l'actionnaire<\/b> (depuis les années 80) vs <b>parties prenantes<\/b> (Business Roundtable 2019, benefit corporation, entreprise à mission). Le cours adopte le point de vue de l'actionnaire.<\/li>\n<li>Le CFO maximise la valeur via 3 décisions : <b>investissement, financement, dividende<\/b>. Treasurer (financement, trésorerie, investissements) vs Controller (comptabilité, budgets, audit interne).<\/li>\n<\/ul>\n<h3>Les trois états financiers<\/h3>\n<div class=\"grid3\">\n<div class=\"card\"><b class=\"t\">Bilan (balance sheet)<\/b>Photo à une date. Actif = Capitaux propres + Dettes. Ce que l'entreprise possède et comment c'est financé.<\/div>\n<div class=\"card\"><b class=\"t\">Compte de résultat (income statement)<\/b>Film sur une période. Revenus quand ils sont <i>gagnés<\/i>, charges quand elles sont <i>engagées<\/i> (pas quand elles sont payées).<\/div>\n<div class=\"card\"><b class=\"t\">Tableau des flux (cash flow statement)<\/b>Les vraies entrées/sorties de cash : exploitation, investissement, financement.<\/div>\n<\/div>\n<div class=\"f\">  Ventes (Sales)\n− Coût des ventes (COGS)          = Marge brute (Gross profit)\n− Charges d'exploitation (dont amortissement / depreciation)\n= Résultat d'exploitation (EBIT, Operating income)\n− Intérêts  ± exceptionnel        = Résultat avant impôt (EBT)\n− Impôt                           = Résultat net (Net income)<\/div>\n<div class=\"box key\"><span class=\"lbl\">À retenir<\/span>L'<b>amortissement<\/b> (depreciation) est une charge <b>non décaissée<\/b> : il réduit le résultat (donc l'impôt) mais aucun cash ne sort. On le rajoute dans les flux de trésorerie.<\/div>\n<h4>Flux d'exploitation, méthode indirecte<\/h4>\n<p>Résultat net + amortissement − hausse des créances clients − hausse des stocks + hausse des dettes fournisseurs (et inversement).<\/p>\n<div class=\"box trap\"><span class=\"lbl\">Moyen mnémotechnique<\/span>Un <b>actif qui augmente consomme du cash<\/b> ; un <b>passif qui augmente fournit du cash<\/b>.<\/div>\n<div class=\"box ex\"><span class=\"lbl\">Exemple du cours : Mysmallbusiness (croissants)<\/span>\nBesoins : table 50 + caisse 100 + congélateur 150 + micro-ondes 150 = 450 d'actifs immobilisés ; stock 50 ; caisse 50. Total = <b>550<\/b>. Financement : 300 d'apports (equity) + 250 empruntés aux parents sur 5 ans (dette). Actif 550 = Passif 550.<br>\nTesla 2019 : exploitation +2 405 ; investissement −1 436 ; financement +1 529 ; change +8 → variation de trésorerie <b>+2 506<\/b> M$.<\/div>"}, {"id": "c2", "short": "Time value, NPV", "title": "2. Time value of money and NPV", "sub": "Session 2 · Vernimmen ch. 16", "en": "<div class=\"f\">Compounding (future value):      V<sub>n<\/sub> = V<sub>0<\/sub> × (1 + r)<sup>n<\/sup>\nDiscounting (present value):     V<sub>0<\/sub> = V<sub>n<\/sub> / (1 + r)<sup>n<\/sup>\nPresent value:                   PV  = Σ F<sub>t<\/sub> / (1 + r)<sup>t<\/sup>\nNPV:                             NPV = −I<sub>0<\/sub> + Σ F<sub>t<\/sub> / (1 + r)<sup>t<\/sup>\nConstant annuity (N years):      PV  = F × [1 − (1 + r)<sup>−N<\/sup>] / r\nPerpetuity:                      PV  = F / r\nGrowing perpetuity (r > g):      PV  = F<sub>1<\/sub> / (r − g) = F<sub>0<\/sub>(1 + g) / (r − g)<\/div>\n<ul>\n<li><b>Rule<\/b>: NPV &gt; 0 → invest; NPV &lt; 0 → reject. The discount rate reflects the project's <b>risk<\/b>.<\/li>\n<li>3 readings of NPV: the value created; the maximum extra amount you would agree to pay; the gap between present value and market price. In an efficient market, NPV = 0.<\/li>\n<li>The higher the rate, the lower the NPV (decreasing relationship).<\/li>\n<\/ul>\n<div class=\"box ex\"><span class=\"lbl\">Example<\/span>€10,000 invested for 3 years at 10% → 10,000 × 1.1³ = <b>€13,310<\/b> (interest 1,000, 1,100, 1,210).<br>\nProject: −1,000 today, then 400, 500, 300; rate 8%.<br>\nPV = 400/1.08 + 500/1.08² + 300/1.08³ = 370.37 + 428.67 + 238.15 = 1,037.19 → <b>NPV = +37.19<\/b> → invest.<\/div>\n<details><summary>Your turn: loan payment<\/summary>\nLoan of €20,000 over 5 years at 5%, constant annual payments: F = 20,000 × 0.05 / (1 − 1.05<sup>−5<\/sup>) = <b>€4,619.50 per year<\/b>.<\/details>\n<div class=\"box trap\"><span class=\"lbl\">Traps<\/span>\n<ul><li>Growing perpetuity: the numerator is the <b>year 1<\/b> cash flow. If you are given today's cash flow, multiply by (1 + g).<\/li>\n<li>You do not get an annual return by dividing the total gain by the number of years (3,310 / 3 / 10,000 = 11% is wrong; the true rate is 10%).<\/li><\/ul><\/div>", "fr": "<div class=\"f\">Capitalisation (future value) :   V<sub>n<\/sub> = V<sub>0<\/sub> × (1 + r)<sup>n<\/sup>\nActualisation (present value) :   V<sub>0<\/sub> = V<sub>n<\/su
